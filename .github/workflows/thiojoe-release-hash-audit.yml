name: Temporary ThioJoe Release Hash Audit

on:
  push:
    branches:
      - add-thiojoe-three-manifests

permissions:
  contents: read

jobs:
  calculate:
    runs-on: windows-latest
    steps:
      - name: Download release assets and calculate SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @(
            [PSCustomObject]@{
              Name = 'RainmeterWebhookMonitor.exe'
              Url = 'https://github.com/ThioJoe/Rainmeter-Webhook-Monitor/releases/download/v1.1.1/RainmeterWebhookMonitor.exe'
            },
            [PSCustomObject]@{
              Name = 'Test-Architecture-Speed-x64.exe'
              Url = 'https://github.com/ThioJoe/Test-Architecture-Speed/releases/download/v1.0.0/Test-Architecture-Speed-x64.exe'
            },
            [PSCustomObject]@{
              Name = 'Test-Architecture-Speed-x86.exe'
              Url = 'https://github.com/ThioJoe/Test-Architecture-Speed/releases/download/v1.0.0/Test-Architecture-Speed-x86.exe'
            },
            [PSCustomObject]@{
              Name = 'Results-Comparer.exe'
              Url = 'https://github.com/ThioJoe/Test-Architecture-Speed/releases/download/v1.0.0/Results-Comparer.exe'
            },
            [PSCustomObject]@{
              Name = 'TestInputMonitoring_1.0.0.exe'
              Url = 'https://github.com/ThioJoe/Windows-Input-Monitoring-Tests/releases/download/v1.0.0/TestInputMonitoring_1.0.0.exe'
            }
          )

          $outputDir = Join-Path $env:RUNNER_TEMP 'thiojoe-release-hashes'
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
          $summary = @(
            '## ThioJoe release asset SHA-256',
            '',
            '| Asset | Size (bytes) | SHA-256 |',
            '| --- | ---: | --- |'
          )

          foreach ($asset in $assets) {
            $file = Join-Path $outputDir $asset.Name
            Write-Host "Downloading $($asset.Name)"
            Invoke-WebRequest -Uri $asset.Url -OutFile $file -MaximumRedirection 10 -TimeoutSec 600 -ErrorAction Stop
            $item = Get-Item -LiteralPath $file
            $sha256 = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "THIOJOE_SHA256|$($asset.Name)|$sha256|$($item.Length)"
            $summary += "| $($asset.Name) | $($item.Length) | $sha256 |"
          }

          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
