name: Update and verify KVRT

on:
  # Runs at 04:23 UTC every two months, starting in January.
  schedule:
    - cron: '23 4 1 */2 *'
  workflow_dispatch:
  # Allows testing this workflow on the open manifest-fix branch before merge.
  push:
    branches:
      - fix/checkver-errors-20261028
    paths:
      - '.github/workflows/kvrt-update.yml'
      - 'bucket/kvrt.json'

permissions:
  contents: write

concurrency:
  group: kvrt-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Download, verify, and refresh KVRT manifest
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download and verify official KVRT build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'bucket/kvrt.json'
          $exePath = Join-Path $env:RUNNER_TEMP 'KVRT.exe'
          $xmlPath = Join-Path $env:RUNNER_TEMP 'kvrt.xml'
          $cookieJar = Join-Path $env:RUNNER_TEMP 'kvrt.cookies'
          $xmlUrl = 'https://devbuilds.s.kaspersky-labs.com/devbuilds/KVRT/latest/full/kvrt.xml'
          $exeUrl = 'https://devbuilds.s.kaspersky-labs.com/devbuilds/KVRT/latest/full/KVRT.exe'
          $userAgent = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          $diagnostics = [System.Collections.Generic.List[string]]::new()

          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "KVRT manifest was not found: $manifestPath"
          }

          function Invoke-KvrtCurl {
            param(
              [Parameter(Mandatory)][string]$Url,
              [Parameter(Mandatory)][string]$OutputPath,
              [int]$TimeoutSeconds = 60,
              [switch]$Retry
            )
            Remove-Item -LiteralPath $OutputPath -Force -ErrorAction SilentlyContinue
            $curlArgs = @('--fail','--silent','--show-error','--location','--max-time',"$TimeoutSeconds",
              '--user-agent',$userAgent,'--referer','https://me.kaspersky.com/downloads/free-virus-removal-tool','--cookie-jar',$cookieJar,'--output',$OutputPath,'--write-out','%{http_code}')
            if ($Retry) { $curlArgs += @('--retry','2','--retry-delay','2') }
            if (Test-Path -LiteralPath $cookieJar) { $curlArgs += @('--cookie',$cookieJar) }
            $curlArgs += $Url
            $status = & curl.exe @curlArgs 2>$null
            $exitCode = $LASTEXITCODE
            [PSCustomObject]@{
              Status = ([string]$status).Trim()
              ExitCode = $exitCode
              Exists = (Test-Path -LiteralPath $OutputPath -PathType Leaf)
            }
          }

          function Get-KvrtMetadata {
            param(
              [Parameter(Mandatory)][string]$SourceUrl,
              [int]$TimeoutSeconds = 60,
              [switch]$OfficialSource
            )
            $response = Invoke-KvrtCurl -Url $SourceUrl -OutputPath $xmlPath -TimeoutSeconds $TimeoutSeconds
            if ($response.ExitCode -ne 0 -or -not $response.Exists) {
              $diagnostics.Add(('{0}: HTTP {1}, curl exit {2}' -f $SourceUrl,$response.Status,$response.ExitCode))
              return $null
            }
            $body = [System.IO.File]::ReadAllText($xmlPath)
            $versionMatch = [regex]::Match($body,'(?i)version\s*=\s*"(?<version>\d+(?:\.\d+){3})"')
            $stampMatch = [regex]::Match($body,'(?i)databases_timestamp\s*=\s*"(?<stamp>\d{12})"')
            if (-not $versionMatch.Success -or -not $stampMatch.Success) {
              $diagnostics.Add(('{0}: response did not contain expected KVRT metadata fields' -f $SourceUrl))
              return $null
            }
            [PSCustomObject]@{
              Version = $versionMatch.Groups['version'].Value
              Stamp = $stampMatch.Groups['stamp'].Value
              Source = $SourceUrl
            }
          }

          $exeUrls = @(
            $exeUrl,
            $exeUrl.Replace('devbuilds.s.kaspersky-labs.com','devbuilds.kaspersky-labs.com')
          ) | Select-Object -Unique
          $download = $null
          $downloadErrors = [System.Collections.Generic.List[string]]::new()
          foreach ($candidateUrl in $exeUrls) {
            Write-Host "Downloading KVRT.exe from $candidateUrl ..."
            $candidateDownload = Invoke-KvrtCurl -Url $candidateUrl -OutputPath $exePath -TimeoutSeconds 600 -Retry
            if ($candidateDownload.ExitCode -eq 0 -and $candidateDownload.Exists) {
              $download = $candidateDownload
              $exeUrl = $candidateUrl
              break
            }
            $downloadErrors.Add(('{0}: HTTP {1}, curl exit {2}' -f $candidateUrl,$candidateDownload.Status,$candidateDownload.ExitCode))
          }
          if (-not $download) {
            throw ('Could not download KVRT.exe from either official Kaspersky hostname. No manifest changes were made. Attempts: ' + ($downloadErrors -join ' | '))
          }

          
          $exeFile = Get-Item -LiteralPath $exePath
          if ($exeFile.Length -lt 25000000) {
            throw "Downloaded KVRT.exe is unexpectedly small ($($exeFile.Length) bytes)."
          }
          $stream = [System.IO.File]::OpenRead($exePath)
          try {
            $magic = [byte[]]::new(2)
            $bytesRead = $stream.Read($magic,0,2)
          } finally {
            $stream.Dispose()
          }
          if ($bytesRead -ne 2 -or $magic[0] -ne 0x4D -or $magic[1] -ne 0x5A) {
            throw 'Downloaded file is not a valid Windows executable (MZ header check failed).'
          }

          $signature = Get-AuthenticodeSignature -FilePath $exePath
          if ($signature.Status -ne 'Valid') {
            throw "KVRT.exe Authenticode signature is not valid (status: $($signature.Status)). Refusing to update."
          }
          if ($null -eq $signature.SignerCertificate -or $signature.SignerCertificate.Subject -notmatch '(?i)Kaspersky') {
            throw 'KVRT.exe signer is not Kaspersky. Refusing to update.'
          }
          $sha256 = (Get-FileHash -LiteralPath $exePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $fileVersionText = [string]$exeFile.VersionInfo.ProductVersion
          if ([string]::IsNullOrWhiteSpace($fileVersionText)) {
            $fileVersionText = [string]$exeFile.VersionInfo.FileVersion
          }
          $fileVersionMatch = [regex]::Match($fileVersionText,'(?<version>\d+(?:\.\d+){3})')
          if (-not $fileVersionMatch.Success) {
            throw "Could not read a four-part version from KVRT.exe: '$fileVersionText'."
          }
          $embeddedVersion = $fileVersionMatch.Groups['version'].Value
          Write-Host "Downloaded size: $($exeFile.Length) bytes"
          Write-Host "Signer: $($signature.SignerCertificate.Subject)"
          Write-Host "Executable version: $embeddedVersion"
          Write-Host "SHA-256: $sha256"

          $xmlUrls = @(
            $xmlUrl,
            $xmlUrl.Replace('devbuilds.s.kaspersky-labs.com','devbuilds.kaspersky-labs.com')
          ) | Select-Object -Unique
          $metadata = $null
          foreach ($candidateXmlUrl in $xmlUrls) {
            $metadata = Get-KvrtMetadata -SourceUrl $candidateXmlUrl -TimeoutSeconds 45
            if ($metadata) { break }
          }
          foreach ($candidateXmlUrl in $xmlUrls) {
            if ($metadata) { break }
            for ($attempt = 1; $attempt -le 2 -and -not $metadata; $attempt++) {
              Write-Host "Trying Internet Archive save endpoint for $candidateXmlUrl ($attempt/2)..."
              $metadata = Get-KvrtMetadata -SourceUrl ('https://web.archive.org/save/' + $candidateXmlUrl) -TimeoutSeconds 90
              if (-not $metadata -and $attempt -lt 2) { Start-Sleep -Seconds 5 }
            }
            if (-not $metadata) {
              $metadata = Get-KvrtMetadata -SourceUrl ('https://web.archive.org/web/2id_/' + $candidateXmlUrl) -TimeoutSeconds 90
            }
          }
          if (-not $metadata) {
            throw ('Could not verify current KVRT metadata from official Kaspersky hosts or Internet Archive. No manifest changes were made. Attempts: ' + ($diagnostics -join ' | '))
          }
          if ($embeddedVersion -ne $metadata.Version) {
            throw "Downloaded executable version '$embeddedVersion' does not match metadata version '$($metadata.Version)'. Manifest was not changed."
          }

          $newVersion = '{0}.{1}' -f $metadata.Version,$metadata.Stamp
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json -AsHashtable
          $oldVersion = [string]$manifest.version
          $manifest.version = $newVersion

          $notes = [System.Collections.Generic.List[string]]::new()
          if ($null -ne $manifest.notes) {
            if ($manifest.notes -is [string]) {
              $notes.Add([string]$manifest.notes)
            } else {
              foreach ($note in @($manifest.notes)) {
                if (-not [string]::IsNullOrWhiteSpace([string]$note)) { $notes.Add([string]$note) }
              }
            }
          }
          $keptNotes = @($notes | Where-Object { $_ -notmatch '^Last verified by KVRT updater:' })
          $verifiedAt = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')
          $keptNotes += "Last verified by KVRT updater: $verifiedAt UTC; product/database version $newVersion; SHA-256 $sha256 (audit record only: official /latest/ URL is mutable, so this hash is not pinned as Scoop's install hash)."
          $manifest.notes = @($keptNotes)

          $json = $manifest | ConvertTo-Json -Depth 100
          [System.IO.File]::WriteAllText($manifestPath,$json + [Environment]::NewLine,[System.Text.UTF8Encoding]::new($false))
          Write-Host "Manifest version: $oldVersion -> $newVersion"

          @(
            '## KVRT verification'
            ''
            '| Item | Verified value |'
            '|---|---|'
            "| Product + database version | $newVersion |"
            "| Executable version resource | $embeddedVersion |"
            "| Downloaded official file SHA-256 | $sha256 |"
            "| File size | $($exeFile.Length) bytes |"
            "| Authenticode status | $($signature.Status) |"
            "| Signer | $($signature.SignerCertificate.Subject) |"
            "| Metadata source | $($metadata.Source) |"
            ''
            'The SHA-256 is saved in manifest notes as an audit record only. It is not pinned as the Scoop hash because the official /latest/ URL may change before the next scheduled run, breaking installs.'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Commit manifest update if changed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- bucket/kvrt.json
          git diff --cached --quiet
          $diffExitCode = $LASTEXITCODE
          if ($diffExitCode -eq 0) {
            Write-Host 'KVRT manifest is already up to date; no commit is needed.'
            exit 0
          }
          if ($diffExitCode -ne 1) { throw 'Could not inspect the staged KVRT manifest.' }
          git commit -m 'kvrt: verify latest build and refresh manifest'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit the KVRT manifest update.' }
          git push origin "HEAD:refs/heads/$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw "Could not push the KVRT manifest update to branch $env:GITHUB_REF_NAME." }
