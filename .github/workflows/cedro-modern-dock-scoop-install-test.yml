name: Cedro Modern Dock Scoop MSI Extraction Test

on:
  push:
    branches:
      - master
    paths:
      - "bucket/cedro-modern-dock.json"
      - ".github/workflows/cedro-modern-dock-scoop-install-test.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
    paths:
      - "bucket/cedro-modern-dock.json"
      - ".github/workflows/cedro-modern-dock-scoop-install-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Scoop install and persistence test (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Scoop and add a local test bucket
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $env:SCOOP = Join-Path $env:RUNNER_TEMP 'scoop-cedro-modern-dock'
          $env:SCOOP_CACHE = Join-Path $env:RUNNER_TEMP 'scoop-cedro-modern-dock-cache'
          "SCOOP=$env:SCOOP" >> $env:GITHUB_ENV
          "SCOOP_CACHE=$env:SCOOP_CACHE" >> $env:GITHUB_ENV
          (Join-Path $env:SCOOP 'shims') >> $env:GITHUB_PATH

          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri 'https://get.scoop.sh' | Invoke-Expression
          $env:PATH = (Join-Path $env:SCOOP 'shims') + ';' + $env:PATH

          $localBucket = Join-Path $env:RUNNER_TEMP 'kirobucket-cedro-modern-dock-test'
          $manifestDir = Join-Path $localBucket 'bucket'
          New-Item -ItemType Directory -Path $manifestDir -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'bucket\cedro-modern-dock.json') -Destination $manifestDir

          Push-Location $localBucket
          try {
            git init --initial-branch=master
            git config user.name 'GitHub Actions'
            git config user.email 'actions@github.com'
            git add bucket/cedro-modern-dock.json
            git commit -m 'Seed local Cedro Modern Dock test bucket'
          }
          finally {
            Pop-Location
          }

          $bucketUrl = 'file:///' + $localBucket.Replace([char]92, '/')
          scoop bucket add kirobucket $bucketUrl

      - name: Check version and install through Scoop
        run: |
          $ErrorActionPreference = 'Stop'
          scoop checkver cedro-modern-dock
          scoop install cedro-modern-dock

          if ($LASTEXITCODE -ne 0) {
            throw "Scoop install failed with exit code $LASTEXITCODE."
          }

      - name: Verify MSI payload, shortcut, and AppData persistence
        run: |
          $ErrorActionPreference = 'Stop'
          $appRoot = Join-Path $env:SCOOP 'apps\cedro-modern-dock\current'
          $requiredFiles = @(
            'CedroModernDock.exe',
            'libSkiaSharp.dll',
            'libHarfBuzzSharp.dll',
            'av_libglesv2.dll'
          )

          foreach ($relativePath in $requiredFiles) {
            $path = Join-Path $appRoot $relativePath
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required MSI payload file is missing from the Scoop app root: $relativePath"
            }
            Write-Host "PASS: $relativePath"
          }

          $startMenu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          $shortcut = Get-ChildItem -LiteralPath $startMenu -Filter 'Cedro Modern Dock.lnk' -File -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($null -eq $shortcut) {
            throw 'Scoop did not create the Cedro Modern Dock Start Menu shortcut.'
          }
          Write-Host "PASS: Start Menu shortcut: $($shortcut.FullName)"

          $appDataPath = Join-Path $env:APPDATA 'CedroModernDock'
          $persistDataPath = Join-Path $env:SCOOP 'persist\cedro-modern-dock\data'
          if (-not (Test-Path -LiteralPath $appDataPath -PathType Container)) {
            throw "Cedro Modern Dock AppData directory is missing: $appDataPath"
          }
          $appDataItem = Get-Item -LiteralPath $appDataPath -Force
          if ($appDataItem.LinkType -ne 'Junction') {
            throw "AppData is not redirected through a junction (LinkType=$($appDataItem.LinkType))."
          }
          if ([IO.Path]::GetFullPath([string]$appDataItem.Target) -ine [IO.Path]::GetFullPath($persistDataPath)) {
            throw "AppData junction points to the wrong target: $($appDataItem.Target)"
          }

          $marker = Join-Path $persistDataPath 'kirobucket-persist-test.txt'
          Set-Content -LiteralPath $marker -Value 'persisted' -Encoding utf8

          $uninstallEntries = @(Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like '*Cedro Modern Dock*' })
          if ($uninstallEntries.Count -gt 0) {
            throw 'The MSI installer registered the application in Add/Remove Programs; Scoop must extract the payload instead.'
          }
          if (Test-Path -LiteralPath 'HKCU:\Software\CedroModernDock') {
            throw 'The MSI installer registry component was executed; Scoop must extract the MSI payload only.'
          }

          Write-Host 'PASS: MSI payload extracted, launch files present, AppData redirected, and MSI installation actions not executed.'

      - name: Uninstall and verify persistent data remains
        run: |
          $ErrorActionPreference = 'Stop'
          scoop uninstall cedro-modern-dock

          if ($LASTEXITCODE -ne 0) {
            throw "Scoop uninstall failed with exit code $LASTEXITCODE."
          }

          $persistedMarker = Join-Path $env:SCOOP 'persist\cedro-modern-dock\data\kirobucket-persist-test.txt'
          if (-not (Test-Path -LiteralPath $persistedMarker -PathType Leaf)) {
            throw 'Scoop uninstall removed Cedro Modern Dock persistent user data.'
          }

          $appDataPath = Join-Path $env:APPDATA 'CedroModernDock'
          if (-not (Test-Path -LiteralPath $appDataPath -PathType Container)) {
            throw 'The AppData junction to persistent user data was unexpectedly removed.'
          }

          Write-Host 'PASS: Scoop uninstall preserves Cedro Modern Dock data.'
