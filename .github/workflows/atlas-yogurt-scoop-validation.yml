name: Atlas and Yogurt Scoop validation

on:
  pull_request:
    branches: [master]
    paths:
      - "bucket/atlas-filemanager.json"
      - "bucket/yogurt.json"
      - ".github/workflows/atlas-yogurt-scoop-validation.yml"
  push:
    branches: [master]
    paths:
      - "bucket/atlas-filemanager.json"
      - "bucket/yogurt.json"
      - ".github/workflows/atlas-yogurt-scoop-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoop-install:
    name: Check versions, install, verify extraction, and uninstall
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Scoop and create an isolated local bucket
        id: setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $env:SCOOP = Join-Path $env:RUNNER_TEMP 'scoop-atlas-yogurt-validation'
          "SCOOP=$env:SCOOP" >> $env:GITHUB_ENV
          (Join-Path $env:SCOOP 'shims') >> $env:GITHUB_PATH
          (Join-Path $env:SCOOP 'apps\scoop\current\bin') >> $env:GITHUB_PATH

          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri 'https://get.scoop.sh' | Invoke-Expression
          $env:PATH = (Join-Path $env:SCOOP 'shims') + ';' + (Join-Path $env:SCOOP 'apps\scoop\current\bin') + ';' + $env:PATH

          $localBucket = Join-Path $env:RUNNER_TEMP 'kirobucket-atlas-yogurt-validation'
          $manifestDir = Join-Path $localBucket 'bucket'
          New-Item -ItemType Directory -Path $manifestDir -Force | Out-Null
          foreach ($name in @('atlas-filemanager', 'yogurt')) {
            $source = Join-Path $env:GITHUB_WORKSPACE "bucket\$name.json"
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Required manifest is missing: $source"
            }
            Copy-Item -LiteralPath $source -Destination $manifestDir
          }

          git -C $localBucket init --initial-branch=master
          if ($LASTEXITCODE -ne 0) { throw 'Could not initialize local test bucket.' }
          git -C $localBucket config user.name 'GitHub Actions'
          git -C $localBucket config user.email 'actions@github.com'
          git -C $localBucket add bucket
          git -C $localBucket commit -m 'Prepare isolated Scoop validation bucket'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit local test manifests.' }

          $bucketUrl = 'file:///' + $localBucket.Replace('\', '/')
          scoop bucket add kirobucket-validation $bucketUrl
          if ($LASTEXITCODE -ne 0) { throw 'Could not register the local validation bucket.' }

      - name: Validate both upstream version checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('atlas-filemanager', 'yogurt')) {
            Write-Host "Checking upstream version for $name"
            scoop checkver $name
            if ($LASTEXITCODE -ne 0) {
              throw "Scoop checkver failed for $name (exit code $LASTEXITCODE)."
            }
          }

      - name: Install using Scoop extraction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('atlas-filemanager', 'yogurt')) {
            Write-Host "Installing $name"
            scoop install $name
            if ($LASTEXITCODE -ne 0) {
              throw "Scoop install failed for $name (exit code $LASTEXITCODE)."
            }
          }

      - name: Verify extracted application files and Start Menu shortcuts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $programs = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          $shell = New-Object -ComObject WScript.Shell

          $checks = @(
            @{
              Name = 'Atlas File Manager'
              App = 'atlas-filemanager'
              Executable = 'atlas.exe'
              Shortcut = 'Atlas File Manager.lnk'
            },
            @{
              Name = 'Yogurt'
              App = 'yogurt'
              Executable = 'Yogurt.exe'
              Shortcut = 'Yogurt.lnk'
            }
          )

          foreach ($check in $checks) {
            $appDir = Join-Path $env:SCOOP "apps\$($check.App)\current"
            $exe = Join-Path $appDir $check.Executable
            if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
              throw "$($check.Name) executable was not extracted into Scoop: $exe"
            }
            Write-Host "PASS: executable extracted inside Scoop: $exe"

            $shortcut = Get-ChildItem -LiteralPath $programs -Filter $check.Shortcut -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($null -eq $shortcut) {
              throw "$($check.Name) Start Menu shortcut was not created: $($check.Shortcut)"
            }

            $target = $shell.CreateShortcut($shortcut.FullName).TargetPath
            if ([IO.Path]::GetFullPath($target) -ine [IO.Path]::GetFullPath($exe)) {
              throw "$($check.Name) shortcut points to '$target', not '$exe'."
            }
            Write-Host "PASS: shortcut resolves to $target"
          }

          $asar = Join-Path $env:SCOOP 'apps\yogurt\current\resources\app.asar'
          if (-not (Test-Path -LiteralPath $asar -PathType Leaf)) {
            throw 'Yogurt resources/app.asar was not extracted from its nested 7z payload.'
          }
          Write-Host 'PASS: Yogurt nested application payload is present.'

      - name: Uninstall both apps and verify Scoop app directories are removed
        if: always() && steps.setup.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('atlas-filemanager', 'yogurt')) {
            scoop uninstall $name
            if ($LASTEXITCODE -ne 0) {
              throw "Scoop uninstall failed for $name (exit code $LASTEXITCODE)."
            }
            $appDir = Join-Path $env:SCOOP "apps\$name"
            if (Test-Path -LiteralPath $appDir) {
              throw "$name application files remain after Scoop uninstall: $appDir"
            }
            Write-Host "PASS: $name was uninstalled cleanly."
          }
