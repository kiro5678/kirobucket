name: TinyWall ShirazAdam Archive Inspection

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/tinywall-shirazadam-archive-inspection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect TinyWall release ZIP archives
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Download, verify, and inspect all release archives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $root = Join-Path $env:RUNNER_TEMP 'tinywall-shirazadam-inspection'
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          $targets = @(
            [pscustomobject]@{
              Architecture = 'x64'
              Url = 'https://github.com/ShirazAdam/TinyWall/releases/download/4.0.0/ModernTinyWall-4.0.0-win-x64.zip'
              ExpectedSha256 = 'bcb02f7397f50bfc99185fd020b64a331e0bb9168d2317c378a3427cd33093b0'
              ExpectedMachine = 0x8664
            },
            [pscustomobject]@{
              Architecture = 'x86'
              Url = 'https://github.com/ShirazAdam/TinyWall/releases/download/4.0.0/ModernTinyWall-4.0.0-win-x86.zip'
              ExpectedSha256 = 'd4a7e6a5e4f38fcb250b4ce5ee5a3c4b11fe6d3353eaa299274a91cbb6303e33'
              ExpectedMachine = 0x014c
            },
            [pscustomobject]@{
              Architecture = 'ARM64'
              Url = 'https://github.com/ShirazAdam/TinyWall/releases/download/4.0.0/ModernTinyWall-4.0.0-win-arm64.zip'
              ExpectedSha256 = '315a2abf868564944c4a1708f4ded495de2ffe6eb0a67e982866e5f454e00a4b'
              ExpectedMachine = 0xaa64
            }
          )

          function Get-PeMachine {
            param([Parameter(Mandatory)][string]$Path)

            $stream = [System.IO.File]::OpenRead($Path)
            try {
              $reader = [System.IO.BinaryReader]::new($stream)
              try {
                if ($stream.Length -lt 64) { return 'NotPE' }
                $stream.Position = 0
                if ($reader.ReadUInt16() -ne 0x5A4D) { return 'NotPE' }
                $stream.Position = 0x3c
                $peOffset = $reader.ReadInt32()
                if ($peOffset -lt 0 -or $peOffset -gt ($stream.Length - 6)) { return 'InvalidPE' }
                $stream.Position = $peOffset
                if ($reader.ReadUInt32() -ne 0x00004550) { return 'InvalidPE' }
                return ('0x{0:X4}' -f $reader.ReadUInt16())
              } finally {
                $reader.Dispose()
              }
            } finally {
              $stream.Dispose()
            }
          }

          $allInventory = [System.Collections.Generic.List[object]]::new()
          $results = [System.Collections.Generic.List[object]]::new()
          $summary = [System.Collections.Generic.List[string]]::new()
          $summary.Add('# TinyWall ShirazAdam 4.0.0 archive inspection')
          $summary.Add('')
          $summary.Add('The workflow downloads and extracts the official ZIP assets only. It does not launch the application, install the firewall service, or change Windows Firewall settings.')
          $summary.Add('')

          foreach ($target in $targets) {
            $name = "ModernTinyWall-4.0.0-win-$($target.Architecture)"
            $zipPath = Join-Path $root "$name.zip"
            $extractPath = Join-Path $root $name
            New-Item -ItemType Directory -Path $extractPath -Force | Out-Null

            Write-Host "=== $($target.Architecture) ==="
            Invoke-WebRequest -Uri $target.Url -OutFile $zipPath -TimeoutSec 600
            $actualHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $hashMatches = $actualHash -eq $target.ExpectedSha256
            Write-Host "SHA-256: $actualHash"
            if (-not $hashMatches) {
              throw "$($target.Architecture) archive SHA-256 mismatch. Expected $($target.ExpectedSha256), got $actualHash."
            }

            $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
            try {
              $entryReport = @($archive.Entries | ForEach-Object {
                [pscustomobject]@{
                  Path = $_.FullName
                  Length = $_.Length
                  CompressedLength = $_.CompressedLength
                }
              })
              $entryReport | Export-Csv -LiteralPath (Join-Path $root "$($target.Architecture)-zip-entries.csv") -NoTypeInformation -Encoding utf8
              Write-Host "ZIP entries: $($entryReport.Count)"
            } finally {
              $archive.Dispose()
            }

            Expand-Archive -LiteralPath $zipPath -DestinationPath $extractPath -Force
            $files = @(Get-ChildItem -LiteralPath $extractPath -File -Recurse -Force)
            Write-Host "Extracted files: $($files.Count)"

            foreach ($file in $files) {
              $relative = [System.IO.Path]::GetRelativePath($extractPath, $file.FullName).Replace('', '/')
              $peMachine = ''
              $fileDescription = ''
              $productName = ''
              $productVersion = ''
              if ($file.Extension -in @('.exe', '.dll', '.sys')) {
                $peMachine = Get-PeMachine -Path $file.FullName
                $versionInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($file.FullName)
                $fileDescription = $versionInfo.FileDescription
                $productName = $versionInfo.ProductName
                $productVersion = $versionInfo.ProductVersion
              }

              $row = [pscustomobject]@{
                ArchitectureArchive = $target.Architecture
                RelativePath = $relative
                SizeBytes = $file.Length
                Extension = $file.Extension
                PEMachine = $peMachine
                ProductName = $productName
                FileDescription = $fileDescription
                ProductVersion = $productVersion
                SHA256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
              $allInventory.Add($row)
              if ($file.Extension -in @('.exe', '.dll', '.sys')) {
                Write-Host ("{0} | {1} bytes | {2} | {3}" -f $relative, $file.Length, $peMachine, $productVersion)
              }
            }

            $mainPath = Join-Path $extractPath 'ModernTinyWall.exe'
            $mainExeExistsAtRoot = Test-Path -LiteralPath $mainPath -PathType Leaf
            $mainExeMatches = @($files | Where-Object { $_.Name -ieq 'ModernTinyWall.exe' })
            $mainExeMachine = if ($mainExeExistsAtRoot) { Get-PeMachine -Path $mainPath } else { '' }
            $expectedMachineText = '0x{0:X4}' -f $target.ExpectedMachine
            $mainExeArchitectureMatches = $mainExeMachine -eq $expectedMachineText

            $serviceCandidates = @($files | Where-Object {
              $_.Name -match '^(TinyWall|TinyWallService|ModernTinyWall\.Service)\.exe$'
            } | ForEach-Object {
              [System.IO.Path]::GetRelativePath($extractPath, $_.FullName).Replace('', '/')
            })

            $result = [pscustomobject]@{
              Architecture = $target.Architecture
              DownloadUrl = $target.Url
              DownloadSha256 = $actualHash
              HashMatchesManifest = $hashMatches
              ZipEntryCount = $entryReport.Count
              ExtractedFileCount = $files.Count
              ModernTinyWallExeCount = $mainExeMatches.Count
              ModernTinyWallExeAtArchiveRoot = $mainExeExistsAtRoot
              MainExePEMachine = $mainExeMachine
              ExpectedPEMachine = $expectedMachineText
              MainExeArchitectureMatches = $mainExeArchitectureMatches
              ServiceExecutableCandidates = ($serviceCandidates -join '; ')
            }
            $results.Add($result)

            $summary.Add("## $($target.Architecture)")
            $summary.Add("- ZIP SHA-256: PASS ($actualHash)")
            $summary.Add("- ZIP entries: $($entryReport.Count)")
            $summary.Add("- Extracted files: $($files.Count)")
            $summary.Add("- ModernTinyWall.exe found: $($mainExeMatches.Count)")
            $summary.Add("- ModernTinyWall.exe at archive root: $mainExeExistsAtRoot")
            $summary.Add("- Main executable PE machine: $mainExeMachine (expected $expectedMachineText)")
            $summary.Add("- Service executable candidates: $(if ($serviceCandidates.Count) { $serviceCandidates -join ', ' } else { 'none found by filename' })")
            $summary.Add('')
            if (-not $mainExeExistsAtRoot) {
              throw "$($target.Architecture): ModernTinyWall.exe is not at the archive root; the declared Scoop shortcut path is not valid."
            }
            if ($mainExeMatches.Count -ne 1) {
              throw "$($target.Architecture): expected exactly one ModernTinyWall.exe; found $($mainExeMatches.Count)."
            }
            if (-not $mainExeArchitectureMatches) {
              throw "$($target.Architecture): main executable architecture mismatch. Actual $mainExeMachine, expected $expectedMachineText."
            }
          }

          $allInventory | Export-Csv -LiteralPath (Join-Path $root 'all-files-inventory.csv') -NoTypeInformation -Encoding utf8
          $results | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $root 'inspection-report.json') -Encoding utf8
          $summary | Set-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          Write-Host 'All archive downloads, hashes, main executable paths, and PE architectures passed.'

      - name: Upload archive inspection report and inventories
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tinywall-shirazadam-4.0.0-archive-inspection
          path: |
            ${{ runner.temp }}/tinywall-shirazadam-inspection/
          if-no-files-found: warn
          retention-days: 14
