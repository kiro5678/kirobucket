name: Kernel and WinIsland Scoop Inno Setup Extraction Test

on:
  push:
    branches:
      - master
    paths:
      - 'bucket/kernel-mindzy007.json'
      - 'bucket/winisland-rheme18.json'
      - '.github/workflows/kernel-winisland-innosetup-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extraction-test:
    name: Install both manifests with Scoop and verify extracted payloads
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bootstrap isolated Scoop and create a local test bucket
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $testRoot = Join-Path $env:RUNNER_TEMP 'kernel-winisland-scoop-test'
          $env:SCOOP = Join-Path $testRoot 'scoop'
          $env:SCOOP_CACHE = Join-Path $testRoot 'cache'
          $localBucket = Join-Path $testRoot 'kirobucket-local'
          $manifestDirectory = Join-Path $localBucket 'bucket'
          New-Item -ItemType Directory -Path $manifestDirectory, $env:SCOOP_CACHE -Force | Out-Null

          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'bucket\kernel-mindzy007.json') -Destination $manifestDirectory
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'bucket\winisland-rheme18.json') -Destination $manifestDirectory

          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri 'https://get.scoop.sh' | Invoke-Expression
          $env:PATH = (Join-Path $env:SCOOP 'shims') + ';' + $env:PATH

          $scoopShim = Join-Path $env:SCOOP 'shims\scoop.ps1'
          if (-not (Test-Path -LiteralPath $scoopShim -PathType Leaf)) {
            throw "Scoop bootstrap did not create $scoopShim"
          }
          scoop --version
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SCOOP=$env:SCOOP" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SCOOP_CACHE=$env:SCOOP_CACHE" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $env:SCOOP 'shims') -Encoding utf8

          Push-Location $localBucket
          try {
            git init --initial-branch=master
            git config user.name 'GitHub Actions'
            git config user.email 'actions@github.com'
            git add bucket/kernel-mindzy007.json bucket/winisland-rheme18.json
            git commit -m 'Seed temporary test bucket'
            if ($LASTEXITCODE -ne 0) { throw 'Could not initialize the temporary test bucket.' }
          }
          finally {
            Pop-Location
          }

          $bucketUrl = 'file:///' + $localBucket.Replace([char]92, '/')
          scoop bucket add kirobucket $bucketUrl
          if ($LASTEXITCODE -ne 0) { throw 'Scoop could not add the temporary local bucket.' }
          scoop bucket list

      - name: Install Kernel and WinIsland using Scoop Inno Setup extraction
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          scoop install kernel-mindzy007 winisland-rheme18
          if ($LASTEXITCODE -ne 0) { throw "Scoop install failed with exit code $LASTEXITCODE." }

          $targets = @(
            @{
              Name = 'kernel-mindzy007'
              Version = '26.11.19.1'
              Executable = 'Kernel.exe'
              Shortcut = 'Kernel.lnk'
            },
            @{
              Name = 'winisland-rheme18'
              Version = '0.9.15'
              Executable = 'WinIsland.exe'
              Shortcut = 'WinIsland (rheme18).lnk'
            }
          )

          $startMenu = [Environment]::GetFolderPath([Environment+SpecialFolder]::StartMenu)
          foreach ($target in $targets) {
            $appRoot = Join-Path $env:SCOOP ("apps\$($target.Name)")
            $versionDir = Join-Path $appRoot $target.Version
            $currentLink = Join-Path $appRoot 'current'
            $exePath = Join-Path $versionDir $target.Executable

            if (-not (Test-Path -LiteralPath $versionDir -PathType Container)) {
              throw "$($target.Name): Scoop did not create version directory $versionDir"
            }
            if (-not (Test-Path -LiteralPath $currentLink -PathType Container)) {
              throw "$($target.Name): Scoop did not create current link $currentLink"
            }
            if (-not (Test-Path -LiteralPath $exePath -PathType Leaf)) {
              throw "$($target.Name): expected executable was not extracted: $exePath"
            }
            if ((Get-Item -LiteralPath $exePath).Length -lt 100000) {
              throw "$($target.Name): extracted executable is unexpectedly small."
            }

            $shortcut = Join-Path $startMenu ("Programs\Scoop Apps\$($target.Shortcut)")
            if (-not (Test-Path -LiteralPath $shortcut -PathType Leaf)) {
              throw "$($target.Name): expected Scoop shortcut was not created: $shortcut"
            }

            $currentExe = Join-Path $currentLink $target.Executable
            if (-not (Test-Path -LiteralPath $currentExe -PathType Leaf)) {
              throw "$($target.Name): executable is not reachable through current."
            }

            Write-Host ''
            Write-Host "PASS: $($target.Name) $($target.Version)"
            Write-Host "Version directory: $versionDir"
            Write-Host "Executable: $exePath"
            Write-Host "Executable size: $((Get-Item -LiteralPath $exePath).Length) bytes"
            Write-Host "Shortcut: $shortcut"
          }

          Write-Host ''
          Write-Host 'Both Inno Setup payloads were extracted by Scoop. The upstream installers were not executed.'
