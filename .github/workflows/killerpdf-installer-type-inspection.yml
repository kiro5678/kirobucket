name: KillerPDF Installer Type Inspection

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/killerpdf-installer-type-inspection.yml'
      - 'bucket/killerpdf.json'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/killerpdf-installer-type-inspection.yml'
      - 'bucket/killerpdf.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: killerpdf-installer-type-inspection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    name: Inspect setup (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Ensure .NET 10 Desktop Runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimeRoot = Join-Path $env:ProgramFiles 'dotnet\shared\Microsoft.WindowsDesktop.App'
          $runtime = Get-ChildItem -LiteralPath $runtimeRoot -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^10\.' } | Select-Object -First 1
          if ($null -eq $runtime) {
            $winget = Get-Command winget.exe -ErrorAction Stop
            & $winget.Source install --id Microsoft.DotNet.DesktopRuntime.10 --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
            if ($LASTEXITCODE -notin @(0, 3010)) { throw ".NET 10 Desktop Runtime installation failed: $LASTEXITCODE" }
          }
          $runtime = Get-ChildItem -LiteralPath $runtimeRoot -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^10\.' } | Select-Object -First 1
          if ($null -eq $runtime) { throw '.NET 10 Desktop Runtime x64 is missing.' }
          Write-Host "RUNTIME: $($runtime.FullName)"

      - name: Inspect executable and embedded payload
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $workRoot = Join-Path $env:RUNNER_TEMP 'killerpdf-installer-type-inspection'
          New-Item -ItemType Directory -Path $workRoot -Force | Out-Null
          $setupPath = Join-Path $workRoot 'KillerPDF.exe'
          Invoke-WebRequest -Uri 'https://github.com/SteveTheKiller/KillerPDF/releases/download/v1.9.4/KillerPDF.exe' -OutFile $setupPath

          $expectedHash = '6941cb34005615a42d6a654334e28477ff525c7baaadec7dbae54d61890eeb56'
          $actualHash = (Get-FileHash -LiteralPath $setupPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "SHA256 mismatch: $actualHash" }
          Write-Host "SHA256: PASS ($actualHash)"

          $signature = Get-AuthenticodeSignature -LiteralPath $setupPath
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "Invalid Authenticode signature: $($signature.Status) $($signature.StatusMessage)"
          }
          Write-Host "SIGNATURE: $($signature.Status); $($signature.SignerCertificate.Subject)"

          $assemblyName = [System.Reflection.AssemblyName]::GetAssemblyName($setupPath)
          $assembly = [System.Reflection.Assembly]::Load([System.IO.File]::ReadAllBytes($setupPath))
          $resource = $assembly.GetManifestResourceStream('KillerLauncher.payload.zip')
          if ($null -eq $resource) { throw 'Embedded KillerLauncher.payload.zip resource is missing.' }
          try {
            Add-Type -AssemblyName System.IO.Compression
            $archive = [System.IO.Compression.ZipArchive]::new($resource, [System.IO.Compression.ZipArchiveMode]::Read, $true)
            try {
              $names = @($archive.Entries | ForEach-Object { $_.FullName })
              foreach ($required in @('KillerPDF.App.exe', 'payload.manifest', 'KillerPdf.Engine.dll')) {
                if ($required -notin $names) { throw "Embedded ZIP is missing $required." }
              }
              Write-Host "EMBEDDED ZIP: PASS ($($names.Count) files)"
              Write-Host "EXECUTABLE ASSEMBLY: $($assemblyName.Name) $($assemblyName.Version)"
              Write-Host 'CLASSIFICATION: custom managed .NET installer launcher with an embedded ZIP application payload.'
            }
            finally { $archive.Dispose() }
          }
          finally { $resource.Dispose() }

      - name: Execute installer in isolated destination and inspect extraction
        run: |
          $ErrorActionPreference = 'Stop'
          $workRoot = Join-Path $env:RUNNER_TEMP 'killerpdf-installer-type-inspection'
          $setupPath = Join-Path $workRoot 'KillerPDF.exe'
          $testRoot = Join-Path $workRoot 'isolated-install'
          $defaultPaths = @{
            Portable = Join-Path $env:LOCALAPPDATA 'KillerPDF\Portable'
            UserInstall = Join-Path $env:LOCALAPPDATA 'Programs\KillerPDF'
            MachineInstall = Join-Path $env:ProgramFiles 'KillerPDF'
          }
          $before = @{}
          foreach ($key in $defaultPaths.Keys) { $before[$key] = Test-Path -LiteralPath $defaultPaths[$key] }

          $oldTestRoot = [Environment]::GetEnvironmentVariable('KILLERPDF_TEST_INSTALL_ROOT', 'Process')
          $oldSkipRegistration = [Environment]::GetEnvironmentVariable('KILLERPDF_SKIP_REGISTRATION', 'Process')
          try {
            $env:KILLERPDF_TEST_INSTALL_ROOT = $testRoot
            $env:KILLERPDF_SKIP_REGISTRATION = '1'
            $process = Start-Process -FilePath $setupPath -ArgumentList @('/install-user') -PassThru -Wait -WindowStyle Hidden
            Write-Host "INSTALLER EXIT CODE: $($process.ExitCode)"
            if ($process.ExitCode -ne 0) { throw "Installer returned $($process.ExitCode)." }
          }
          finally {
            if ($null -eq $oldTestRoot) { Remove-Item Env:KILLERPDF_TEST_INSTALL_ROOT -ErrorAction SilentlyContinue } else { $env:KILLERPDF_TEST_INSTALL_ROOT = $oldTestRoot }
            if ($null -eq $oldSkipRegistration) { Remove-Item Env:KILLERPDF_SKIP_REGISTRATION -ErrorAction SilentlyContinue } else { $env:KILLERPDF_SKIP_REGISTRATION = $oldSkipRegistration }
          }

          foreach ($required in @('KillerPDF.App.exe', 'payload.manifest')) {
            if (-not (Test-Path -LiteralPath (Join-Path $testRoot $required) -PathType Leaf)) { throw "Missing installed file: $required" }
          }
          if (Test-Path -LiteralPath (Join-Path $testRoot 'KillerPDF.exe')) { throw 'Setup EXE was copied into the application payload.' }

          $checked = 0
          foreach ($line in Get-Content -LiteralPath (Join-Path $testRoot 'payload.manifest')) {
            if ([string]::IsNullOrWhiteSpace($line) -or $line.StartsWith('#')) { continue }
            $fields = $line -split ([string][char]9), 3
            if ($fields.Count -ne 3 -or $fields[0] -notmatch '^[0-9a-fA-F]{64}$' -or $fields[1] -notmatch '^[0-9]+$') { throw 'Invalid payload.manifest row.' }
            $relative = $fields[2].Replace('/', '\')
            if ([System.IO.Path]::IsPathRooted($relative) -or ($relative -split '\\' | Where-Object { $_ -in @('', '.', '..') })) { throw "Unsafe relative path: $relative" }
            $file = Join-Path $testRoot $relative
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing payload file: $relative" }
            $info = Get-Item -LiteralPath $file
            if ($info.Length -ne [long]$fields[1]) { throw "File size mismatch: $relative" }
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $fields[0]) { throw "File hash mismatch: $relative" }
            $checked++
          }
          if ($checked -eq 0) { throw 'No payload entries were verified.' }
          Write-Host "INSTALLED PAYLOAD: PASS ($checked files and hashes)"

          foreach ($key in $defaultPaths.Keys) {
            $after = Test-Path -LiteralPath $defaultPaths[$key]
            if ($after -ne $before[$key]) { throw "Unexpected change to default installation path: $key" }
          }
          $staging = @(Get-ChildItem -LiteralPath $workRoot -Directory -Filter 'isolated-install.staging-*' -ErrorAction SilentlyContinue)
          $previous = @(Get-ChildItem -LiteralPath $workRoot -Directory -Filter 'isolated-install.previous-*' -ErrorAction SilentlyContinue)
          if ($staging.Count -gt 0 -or $previous.Count -gt 0) { throw 'Installer left staging/backup folders behind.' }

          Write-Host "EXTRACTION DESTINATION: $testRoot"
          Write-Host 'DEFAULT APPDATA / PROGRAM FILES PATHS: unchanged'
          Write-Host 'RESULT: installer extracts the embedded payload into the explicit installation target; it does not use the portable runtime cache.'

      - name: Remove isolated test files
        if: always()
        run: |
          $workRoot = Join-Path $env:RUNNER_TEMP 'killerpdf-installer-type-inspection'
          if (Test-Path -LiteralPath $workRoot) { Remove-Item -LiteralPath $workRoot -Recurse -Force -ErrorAction SilentlyContinue }
