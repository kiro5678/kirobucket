name: Nova Island Installer Method Validation

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/nova-island-silent-install-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate NSIS extraction, silent install, and uninstall
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Test both installation methods and NSIS uninstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $root = Join-Path $env:RUNNER_TEMP 'nova-island-method-test'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $reportPath = Join-Path $root 'nova-island-method-report.txt'
          $report = [System.Collections.Generic.List[string]]::new()

          function Add-Report {
            param([string]$Text)
            $report.Add($Text)
            Write-Host $Text
          }

          function Get-Paths {
            param([string]$Directory)
            if (-not (Test-Path -LiteralPath $Directory -PathType Container)) { return @() }
            return @(
              Get-ChildItem -LiteralPath $Directory -File -Recurse -Force -ErrorAction SilentlyContinue |
                ForEach-Object { $_.FullName }
            )
          }

          function Get-NovaUninstallEntries {
            $roots = @(
              'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
              'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
              'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
            )
            $entries = [System.Collections.Generic.List[string]]::new()
            foreach ($registryRoot in $roots) {
              if (Test-Path -LiteralPath $registryRoot) {
                foreach ($key in Get-ChildItem -LiteralPath $registryRoot -ErrorAction SilentlyContinue) {
                  $properties = Get-ItemProperty -LiteralPath $key.PSPath -ErrorAction SilentlyContinue
                  if ($properties.DisplayName -match '(?i)Nova Island') {
                    $entries.Add("$registryRoot\$($key.PSChildName) [$($properties.DisplayName)]")
                  }
                }
              }
            }
            return @($entries)
          }

          function Get-RelativeInventory {
            param([string]$Directory)
            return @(
              Get-ChildItem -LiteralPath $Directory -File -Recurse -Force -ErrorAction SilentlyContinue |
                Sort-Object FullName |
                ForEach-Object {
                  $relative = [System.IO.Path]::GetRelativePath($Directory, $_.FullName)
                  "$relative [$($_.Length) bytes]"
                }
            )
          }

          try {
            $url = 'https://github.com/NOVA-TECH-KIT/nova-island/releases/download/v1.8.2/Nova-Island-Setup-1.8.2.exe'
            $expectedHash = 'e685721a69189f3eb0c339175f040affde65471660ec98743a8e40c34a3ac9c0'
            $setup = Join-Path $root 'Nova-Island-Setup-1.8.2.exe'

            Add-Report 'Nova Island 1.8.2 installer validation'
            Add-Report "Download URL: $url"
            Invoke-WebRequest -Uri $url -OutFile $setup -MaximumRedirection 10 -TimeoutSec 600 -ErrorAction Stop
            $actualHash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
            Add-Report "Downloaded size: $((Get-Item -LiteralPath $setup).Length) bytes"
            Add-Report "SHA-256: $actualHash"
            if ($actualHash -ne $expectedHash) {
              throw "SHA-256 mismatch. Expected $expectedHash; got $actualHash."
            }

            $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
            if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
              $sevenZip = (Get-Command '7z.exe' -ErrorAction Stop).Source
            }

            $listing = & $sevenZip l -slt $setup 2>&1
            $listExit = $LASTEXITCODE
            $listing | Set-Content -LiteralPath (Join-Path $root 'nsis-listing.txt') -Encoding utf8
            Add-Report "7-Zip listing exit code: $listExit"
            if ($listExit -ne 0) { throw '7-Zip could not inspect the installer.' }
            $isNsis = [bool](($listing -join "`n") -match '(?im)^Type = Nsis\s*$')
            Add-Report "Detected NSIS package: $isNsis"
            if (-not $isNsis) { throw 'The installer was not identified as an NSIS package.' }

            # Test the archive extraction path independently.
            Add-Report ''
            Add-Report '=== Test A: Scoop #/dl.7z extraction ==='
            $extractDir = Join-Path $root 'direct-extraction'
            New-Item -ItemType Directory -Path $extractDir -Force | Out-Null
            $extractOutput = & $sevenZip x $setup "-o$extractDir" -y -bd 2>&1
            $extractExit = $LASTEXITCODE
            $extractOutput | Set-Content -LiteralPath (Join-Path $root 'direct-extraction.log') -Encoding utf8
            Add-Report "Direct extraction exit code: $extractExit"
            $directExe = Join-Path $extractDir 'Nova Island.exe'
            if ($extractExit -ne 0 -or -not (Test-Path -LiteralPath $directExe -PathType Leaf)) {
              throw 'Direct NSIS extraction did not produce Nova Island.exe.'
            }
            Add-Report 'PASS: direct extraction produced Nova Island.exe.'
            $innerArchives = @(Get-ChildItem -LiteralPath $extractDir -File -Recurse -Force | Where-Object { $_.Name -ieq 'app-64.7z' })
            Add-Report "Nested app-64.7z count: $($innerArchives.Count)"

            # Record the clean runner state before the silent installation.
            $startMenu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
            $desktop = [Environment]::GetFolderPath('Desktop')
            $startMenuBefore = @(Get-Paths -Directory $startMenu)
            $desktopBefore = @(Get-Paths -Directory $desktop)
            $uninstallBefore = @(Get-NovaUninstallEntries)

            # Always run the silent installer, even when direct extraction passed.
            Add-Report ''
            Add-Report '=== Test B: NSIS silent install using /S /D=$dir ==='
            $installDir = Join-Path $root 'Nova Island Scoop Test\apps\nova-island\1.8.2'
            New-Item -ItemType Directory -Path $installDir -Force | Out-Null
            $arguments = @('/S', "/D=$installDir")
            Add-Report "Command: Nova-Island-Setup-1.8.2.exe /S /D=$installDir"
            $process = Start-Process -FilePath $setup -ArgumentList $arguments -PassThru
            try {
              Wait-Process -Id $process.Id -Timeout 600 -ErrorAction Stop
            } catch {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw 'Silent installation did not finish within 10 minutes.'
            }
            $process.Refresh()
            Add-Report "Silent installer exit code: $($process.ExitCode)"
            if ($process.ExitCode -ne 0) { throw 'NSIS silent installer returned a non-zero exit code.' }

            $installedExe = Join-Path $installDir 'Nova Island.exe'
            $uninstaller = Join-Path $installDir 'Uninstall Nova Island.exe'
            if (-not (Test-Path -LiteralPath $installedExe -PathType Leaf)) {
              throw 'Silent installer did not place Nova Island.exe in the requested Scoop target directory.'
            }
            if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
              throw 'Silent installer did not place its uninstaller inside the Scoop target directory.'
            }
            Add-Report 'PASS: the application executable and NSIS uninstaller are both inside the requested target directory.'
            Add-Report 'Files created in install directory:'
            foreach ($item in Get-RelativeInventory -Directory $installDir) { Add-Report "  $item" }

            $startMenuAfter = @(Get-Paths -Directory $startMenu)
            $desktopAfter = @(Get-Paths -Directory $desktop)
            $uninstallAfter = @(Get-NovaUninstallEntries)
            $newStartMenu = @($startMenuAfter | Where-Object { $_ -notin $startMenuBefore })
            $newDesktop = @($desktopAfter | Where-Object { $_ -notin $desktopBefore })
            $newRegistry = @($uninstallAfter | Where-Object { $_ -notin $uninstallBefore })
            Add-Report "New Start Menu files: $($newStartMenu.Count)"
            foreach ($path in $newStartMenu) { Add-Report "  $path" }
            Add-Report "New Desktop files: $($newDesktop.Count)"
            foreach ($path in $newDesktop) { Add-Report "  $path" }
            Add-Report "New Nova Island uninstall registry entries: $($newRegistry.Count)"
            foreach ($entry in $newRegistry) { Add-Report "  $entry" }

            # Exercise the generated uninstaller exactly as Scoop's uninstaller configuration would.
            Add-Report ''
            Add-Report '=== Test C: NSIS silent uninstall ==='
            $uninstallArgs = @('/S', "_?=$installDir")
            Add-Report "Command: Uninstall Nova Island.exe /S _?=$installDir"
            $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList $uninstallArgs -PassThru
            try {
              Wait-Process -Id $uninstallProcess.Id -Timeout 600 -ErrorAction Stop
            } catch {
              Stop-Process -Id $uninstallProcess.Id -Force -ErrorAction SilentlyContinue
              throw 'Silent uninstallation did not finish within 10 minutes.'
            }
            $uninstallProcess.Refresh()
            Add-Report "Silent uninstaller exit code: $($uninstallProcess.ExitCode)"
            Start-Sleep -Seconds 2
            if (Test-Path -LiteralPath $installedExe -PathType Leaf) {
              throw 'The silent uninstaller left Nova Island.exe in the target directory.'
            }
            Add-Report 'PASS: the generated uninstaller removed Nova Island.exe from the target directory.'

            $startMenuFinal = @(Get-Paths -Directory $startMenu)
            $desktopFinal = @(Get-Paths -Directory $desktop)
            $uninstallFinal = @(Get-NovaUninstallEntries)
            $leftStartMenu = @($startMenuFinal | Where-Object { $_ -notin $startMenuBefore })
            $leftDesktop = @($desktopFinal | Where-Object { $_ -notin $desktopBefore })
            $leftRegistry = @($uninstallFinal | Where-Object { $_ -notin $uninstallBefore })
            Add-Report "Start Menu files remaining after uninstall: $($leftStartMenu.Count)"
            foreach ($path in $leftStartMenu) { Add-Report "  $path" }
            Add-Report "Desktop files remaining after uninstall: $($leftDesktop.Count)"
            foreach ($path in $leftDesktop) { Add-Report "  $path" }
            Add-Report "Nova Island uninstall registry entries remaining: $($leftRegistry.Count)"
            foreach ($entry in $leftRegistry) { Add-Report "  $entry" }

            $externalPrograms = @()
            $programsDir = Join-Path $env:LOCALAPPDATA 'Programs'
            if (Test-Path -LiteralPath $programsDir -PathType Container) {
              $externalPrograms = @(Get-ChildItem -LiteralPath $programsDir -Directory -Force | Where-Object { $_.Name -match '(?i)Nova Island|Nova' })
            }
            Add-Report "Nova-named folders under LOCALAPPDATA\Programs: $($externalPrograms.Count)"
            foreach ($folder in $externalPrograms) { Add-Report "  $($folder.FullName)" }

            @(
              '## Nova Island 1.8.2 installation method validation'
              ''
              '- **Result:** PASS'
              '- **NSIS package identification:** PASS'
              '- **Scoop-style direct extraction:** PASS'
              '- **NSIS silent install to a path containing spaces:** PASS'
              '- **Generated silent uninstaller:** PASS'
              '- **Application launch:** Not tested'
              ''
              'See the artifact report for Start Menu, Desktop, and uninstall-registry side effects.'
            ) | Set-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          } catch {
            Add-Report "FAIL: $($_.Exception.Message)"
            @(
              '## Nova Island 1.8.2 installation method validation'
              ''
              '- **Result:** FAILED'
              "- **Reason:** $($_.Exception.Message)"
            ) | Set-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            throw
          } finally {
            $report | Set-Content -LiteralPath $reportPath -Encoding utf8
          }

      - name: Verify actual Scoop install and uninstall lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $root = Join-Path $env:RUNNER_TEMP 'nova-island-method-test'
          $testRoot = Join-Path $root 'real-scoop-lifecycle'
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
          $report = [System.Collections.Generic.List[string]]::new()
          $reportPath = Join-Path $testRoot 'scoop-lifecycle-report.txt'

          function Add-Report {
            param([string]$Text)
            $report.Add($Text)
            Write-Host $Text
          }

          function Get-FilePaths {
            param([string]$Directory)
            if (-not (Test-Path -LiteralPath $Directory -PathType Container)) { return @() }
            return @(
              Get-ChildItem -LiteralPath $Directory -File -Recurse -Force -ErrorAction SilentlyContinue |
                ForEach-Object { $_.FullName }
            )
          }

          function Get-NovaRegistryEntries {
            $roots = @(
              'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
              'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
              'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
            )
            $found = [System.Collections.Generic.List[string]]::new()
            foreach ($registryRoot in $roots) {
              if (Test-Path -LiteralPath $registryRoot) {
                foreach ($key in Get-ChildItem -LiteralPath $registryRoot -ErrorAction SilentlyContinue) {
                  $properties = Get-ItemProperty -LiteralPath $key.PSPath -ErrorAction SilentlyContinue
                  if ($properties.DisplayName -match '(?i)Nova Island') {
                    $found.Add("$registryRoot\$($key.PSChildName)")
                  }
                }
              }
            }
            return @($found)
          }

          try {
            $setup = Join-Path $root 'Nova-Island-Setup-1.8.2.exe'
            if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) {
              throw "The previously verified installer is missing: $setup"
            }

            $scoopRoot = Join-Path $testRoot 'Scoop Root With Spaces'
            $scoopCache = Join-Path $testRoot 'Scoop Cache'
            $scoopGlobal = Join-Path $testRoot 'Scoop Global'
            $env:SCOOP = $scoopRoot
            $env:SCOOP_CACHE = $scoopCache
            $env:SCOOP_GLOBAL = $scoopGlobal

            $manifestPath = Join-Path $testRoot 'nova-island.json'
            $manifestText = @'
          {
            "version": "1.8.2",
            "description": "Windows Dynamic Island overlay with media controls, notifications, downloads, prayer times, and desktop widgets.",
            "homepage": "https://github.com/NOVA-TECH-KIT/nova-island",
            "license": {
              "identifier": "GPL-3.0-only",
              "url": "https://github.com/NOVA-TECH-KIT/nova-island/blob/main/LICENSE"
            },
            "url": "https://github.com/NOVA-TECH-KIT/nova-island/releases/download/v1.8.2/Nova-Island-Setup-1.8.2.exe",
            "hash": "e685721a69189f3eb0c339175f040affde65471660ec98743a8e40c34a3ac9c0",
            "installer": {
              "args": [
                "/S",
                "/D=$dir"
              ]
            },
            "uninstaller": {
              "file": "Uninstall Nova Island.exe",
              "args": [
                "/S",
                "_?=$dir"
              ]
            },
            "post_install": [
              "$settingsDir = Join-Path $env:APPDATA 'dynamic-nova'",
              "New-Item -ItemType Directory -Path $settingsDir -Force | Out-Null",
              "$featuresPath = Join-Path $settingsDir 'features.json'",
              "$features = [ordered]@{}",
              "if (Test-Path -LiteralPath $featuresPath -PathType Leaf) {",
              "    $existing = Get-Content -LiteralPath $featuresPath -Raw | ConvertFrom-Json -ErrorAction Stop",
              "    if ($null -ne $existing) { foreach ($property in $existing.PSObject.Properties) { $features[$property.Name] = $property.Value } }",
              "}",
              "$features['autoUpdate'] = $false",
              "[System.IO.File]::WriteAllText($featuresPath, ($features | ConvertTo-Json -Depth 100), [System.Text.UTF8Encoding]::new($false))"
            ],
            "bin": [
              [
                "Nova Island.exe",
                "nova-island"
              ]
            ],
            "shortcuts": [
              [
                "Nova Island.exe",
                "Nova Island"
              ]
            ]
          }
          '@
            Set-Content -LiteralPath $manifestPath -Value $manifestText -Encoding utf8
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json -ErrorAction Stop
            if ($manifest.installer.args[1] -ne '/D=$dir' -or $manifest.uninstaller.args[1] -ne '_?=$dir') {
              throw 'The test manifest installer or uninstaller arguments do not match the required Scoop substitutions.'
            }
            Add-Report 'Test manifest uses the official NSIS installer URL without #/dl.7z.'
            Add-Report 'installer.args = /S /D=$dir'
            Add-Report 'uninstaller.file = Uninstall Nova Island.exe'
            Add-Report 'uninstaller.args = /S _?=$dir'

            $bootstrap = Join-Path $testRoot 'scoop-install.ps1'
            Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/ScoopInstaller/Install/master/install.ps1' -OutFile $bootstrap -TimeoutSec 120 -ErrorAction Stop
            $pwsh = (Get-Command pwsh -ErrorAction Stop).Source
            Add-Report 'Bootstrapping a private Scoop installation under the temporary test root.'
            & $pwsh -NoProfile -ExecutionPolicy Bypass -File $bootstrap -ScoopDir $scoopRoot -ScoopGlobalDir $scoopGlobal -ScoopCacheDir $scoopCache
            if ($LASTEXITCODE -ne 0) { throw "Scoop bootstrap failed with exit code $LASTEXITCODE." }

            $scoopCli = Join-Path $scoopRoot 'apps\scoop\current\bin\scoop.ps1'
            if (-not (Test-Path -LiteralPath $scoopCli -PathType Leaf)) {
              throw "Scoop CLI was not found after bootstrap: $scoopCli"
            }
            Add-Report "Scoop CLI: $scoopCli"
            $scoopVersion = & $scoopCli --version 2>&1
            Add-Report "Scoop version output: $($scoopVersion -join ' ')"

            $startMenu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
            $desktop = [Environment]::GetFolderPath('Desktop')
            $startBefore = @(Get-FilePaths -Directory $startMenu)
            $desktopBefore = @(Get-FilePaths -Directory $desktop)
            $registryBefore = @(Get-NovaRegistryEntries)

            Add-Report ''
            Add-Report '=== Test D: actual Scoop install from the local manifest ==='
            $installOutput = & $scoopCli install $manifestPath 2>&1
            $installExit = $LASTEXITCODE
            $installOutput | Set-Content -LiteralPath (Join-Path $testRoot 'scoop-install.log') -Encoding utf8
            Add-Report "scoop install exit code: $installExit"
            if ($installExit -ne 0) {
              $installOutput | ForEach-Object { Add-Report "$_" }
              throw 'Scoop install failed with the local NSIS installer manifest.'
            }

            $appVersionDir = Join-Path $scoopRoot 'apps\nova-island\1.8.2'
            $appCurrentDir = Join-Path $scoopRoot 'apps\nova-island\current'
            $installedExe = Join-Path $appVersionDir 'Nova Island.exe'
            $uninstaller = Join-Path $appVersionDir 'Uninstall Nova Island.exe'
            if (-not (Test-Path -LiteralPath $installedExe -PathType Leaf)) {
              throw 'Scoop install did not leave Nova Island.exe in apps\nova-island\1.8.2.'
            }
            if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
              throw 'Scoop install did not leave the configured uninstaller inside the version directory.'
            }
            if (Test-Path -LiteralPath (Join-Path $appVersionDir 'Nova-Island-Setup-1.8.2.exe')) {
              throw 'Scoop did not remove the downloaded installer after successful installation.'
            }
            if (-not (Test-Path -LiteralPath $appCurrentDir)) {
              throw 'Scoop did not create the current version junction.'
            }
            $shimFiles = @(Get-ChildItem -LiteralPath (Join-Path $scoopRoot 'shims') -File -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'nova-island*' })
            if ($shimFiles.Count -eq 0) { throw 'Scoop did not create the nova-island command shim.' }
            Add-Report 'PASS: Scoop installed the app into its version directory, created current and generated the command shim.'
            Add-Report "Application file size: $((Get-Item -LiteralPath $installedExe).Length) bytes"
            Add-Report "Uninstaller file size: $((Get-Item -LiteralPath $uninstaller).Length) bytes"
            Add-Report "Shim files: $($shimFiles.Name -join ', ')"

            $settingsPath = Join-Path $env:APPDATA 'dynamic-nova\features.json'
            if (-not (Test-Path -LiteralPath $settingsPath -PathType Leaf)) {
              throw 'The manifest post_install hook did not create dynamic-nova\features.json.'
            }
            $settings = Get-Content -LiteralPath $settingsPath -Raw | ConvertFrom-Json -ErrorAction Stop
            if ($settings.autoUpdate -ne $false) {
              throw 'The manifest post_install hook did not disable Nova Island auto-update.'
            }
            Add-Report 'PASS: post_install preserved the settings JSON and disabled autoUpdate.'

            $startAfter = @(Get-FilePaths -Directory $startMenu)
            $desktopAfter = @(Get-FilePaths -Directory $desktop)
            $registryAfter = @(Get-NovaRegistryEntries)
            $newStart = @($startAfter | Where-Object { $_ -notin $startBefore })
            $newDesktop = @($desktopAfter | Where-Object { $_ -notin $desktopBefore })
            $newRegistry = @($registryAfter | Where-Object { $_ -notin $registryBefore })
            Add-Report "New Start Menu entries after Scoop install: $($newStart.Count)"
            foreach ($entry in $newStart) { Add-Report "  $entry" }
            Add-Report "New Desktop entries after Scoop install: $($newDesktop.Count)"
            foreach ($entry in $newDesktop) { Add-Report "  $entry" }
            Add-Report "New Nova Island uninstall registry entries: $($newRegistry.Count)"
            foreach ($entry in $newRegistry) { Add-Report "  $entry" }

            Add-Report ''
            Add-Report '=== Test E: actual Scoop uninstall ==='
            $uninstallOutput = & $scoopCli uninstall nova-island 2>&1
            $uninstallExit = $LASTEXITCODE
            $uninstallOutput | Set-Content -LiteralPath (Join-Path $testRoot 'scoop-uninstall.log') -Encoding utf8
            Add-Report "scoop uninstall exit code: $uninstallExit"
            if ($uninstallExit -ne 0) {
              $uninstallOutput | ForEach-Object { Add-Report "$_" }
              throw 'Scoop uninstall failed with the configured NSIS uninstaller.'
            }

            Start-Sleep -Seconds 2
            if (Test-Path -LiteralPath $appVersionDir) { throw 'Scoop uninstall left the application version directory behind.' }
            if (Test-Path -LiteralPath $appCurrentDir) { throw 'Scoop uninstall left the current junction behind.' }
            $remainingShims = @(Get-ChildItem -LiteralPath (Join-Path $scoopRoot 'shims') -File -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'nova-island*' })
            if ($remainingShims.Count -gt 0) { throw "Scoop uninstall left command shim files: $($remainingShims.Name -join ', ')" }

            $startFinal = @(Get-FilePaths -Directory $startMenu)
            $desktopFinal = @(Get-FilePaths -Directory $desktop)
            $registryFinal = @(Get-NovaRegistryEntries)
            $leftStart = @($startFinal | Where-Object { $_ -notin $startBefore })
            $leftDesktop = @($desktopFinal | Where-Object { $_ -notin $desktopBefore })
            $leftRegistry = @($registryFinal | Where-Object { $_ -notin $registryBefore })
            Add-Report "Start Menu entries remaining after Scoop uninstall: $($leftStart.Count)"
            foreach ($entry in $leftStart) { Add-Report "  $entry" }
            Add-Report "Desktop entries remaining after Scoop uninstall: $($leftDesktop.Count)"
            foreach ($entry in $leftDesktop) { Add-Report "  $entry" }
            Add-Report "Nova Island uninstall registry entries remaining: $($leftRegistry.Count)"
            foreach ($entry in $leftRegistry) { Add-Report "  $entry" }
            if ($leftStart.Count -gt 0 -or $leftDesktop.Count -gt 0 -or $leftRegistry.Count -gt 0) {
              throw 'Scoop uninstall left Nova Island shortcuts or uninstall registry entries behind.'
            }

            Add-Report 'PASS: real Scoop install and uninstall lifecycle completed with no leftover shortcuts or uninstall registry entries.'
            @(
              '## Actual Scoop lifecycle validation'
              ''
              '- **Result:** PASS'
              '- **Local manifest install:** PASS'
              '- **NSIS silent installer args and $dir substitution:** PASS'
              '- **Scoop shims and current junction:** PASS'
              '- **Post-install updater setting:** PASS'
              '- **Scoop uninstall via configured NSIS uninstaller:** PASS'
              '- **Shortcut and uninstall-registry cleanup:** PASS'
              '- **Application launch:** Not tested'
            ) | Set-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          } catch {
            Add-Report "FAIL: $($_.Exception.Message)"
            @(
              '## Actual Scoop lifecycle validation'
              ''
              '- **Result:** FAILED'
              "- **Reason:** $($_.Exception.Message)"
            ) | Set-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            throw
          } finally {
            $report | Set-Content -LiteralPath $reportPath -Encoding utf8
          }

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nova-island-method-validation
          path: ${{ runner.temp }}/nova-island-method-test/
          if-no-files-found: warn
          retention-days: 14
