name: Nova Island Silent Installation Test

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/nova-island-silent-install-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Scoop extraction and NSIS silent install
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Download, extract, and test silent installation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $root = Join-Path $env:RUNNER_TEMP 'nova-island-silent-test'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $reportPath = Join-Path $root 'nova-island-test-report.txt'
          $report = [System.Collections.Generic.List[string]]::new()

          function Add-Report {
            param([string]$Text)
            $report.Add($Text)
            Write-Host $Text
          }

          function Get-MissingApplicationFiles {
            param([string]$Directory)
            $required = @(
              'Nova Island.exe',
              'resources/app.asar',
              'resources/app.asar.unpacked/helper/nova-helper.exe'
            )
            $missing = [System.Collections.Generic.List[string]]::new()
            foreach ($relative in $required) {
              $candidate = Join-Path $Directory ($relative.Replace('/', '\'))
              if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
                $missing.Add($relative)
              }
            }
            return @($missing)
          }

          try {
            $url = 'https://github.com/NOVA-TECH-KIT/nova-island/releases/download/v1.8.2/Nova-Island-Setup-1.8.2.exe'
            $expectedHash = 'e685721a69189f3eb0c339175f040affde65471660ec98743a8e40c34a3ac9c0'
            $setup = Join-Path $root 'dl.7z'

            Add-Report 'Nova Island 1.8.2 installer test'
            Add-Report "Download URL: $url"
            Invoke-WebRequest -Uri $url -OutFile $setup -MaximumRedirection 10 -TimeoutSec 600 -ErrorAction Stop

            $item = Get-Item -LiteralPath $setup
            $actualHash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
            Add-Report "Downloaded size: $($item.Length) bytes"
            Add-Report "SHA-256: $actualHash"
            if ($actualHash -ne $expectedHash) {
              throw "SHA-256 mismatch. Expected $expectedHash; got $actualHash."
            }

            $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
            if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
              $command = Get-Command '7z.exe' -ErrorAction Stop
              $sevenZip = $command.Source
            }

            $outerDir = Join-Path $root 'scoop-dl7z-extraction'
            New-Item -ItemType Directory -Path $outerDir -Force | Out-Null

            Add-Report ''
            Add-Report '=== Stage 1: Scoop-style #/dl.7z extraction ==='
            $listing = & $sevenZip l -slt $setup 2>&1
            $listExit = $LASTEXITCODE
            $listing | Set-Content -LiteralPath (Join-Path $root 'outer-7zip-listing.txt') -Encoding utf8
            Add-Report "7-Zip list exit code: $listExit"

            $extractOutput = & $sevenZip x $setup "-o$outerDir" -y -bd 2>&1
            $extractExit = $LASTEXITCODE
            $extractOutput | Set-Content -LiteralPath (Join-Path $root 'outer-7zip-extraction.log') -Encoding utf8
            Add-Report "7-Zip extraction exit code: $extractExit"

            $payloads = @(
              Get-ChildItem -LiteralPath $outerDir -File -Recurse -Force -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -ieq 'app-64.7z' }
            )
            if ($payloads.Count -gt 0) {
              Add-Report "Found app-64.7z: $($payloads[0].FullName)"
              $payloadOutput = & $sevenZip x $payloads[0].FullName "-o$outerDir" -y -bd 2>&1
              $payloadExit = $LASTEXITCODE
              $payloadOutput | Set-Content -LiteralPath (Join-Path $root 'app-64-extraction.log') -Encoding utf8
              Add-Report "app-64.7z extraction exit code: $payloadExit"
              if ($payloadExit -ne 0) {
                throw 'The inner app-64.7z archive exists but could not be extracted.'
              }
            } else {
              Add-Report 'app-64.7z was not present in the outer NSIS extraction.'
            }

            $directMissing = @(Get-MissingApplicationFiles -Directory $outerDir)
            if ($listExit -eq 0 -and $extractExit -eq 0 -and $directMissing.Count -eq 0) {
              Add-Report 'PASS: the Scoop-style extraction contains the complete application payload.'
              $selectedMethod = 'direct 7-Zip extraction'
              $finalDir = $outerDir
            } else {
              Add-Report "Direct extraction is incomplete. Missing: $($directMissing -join ', ')"
              Add-Report ''
              Add-Report '=== Stage 2: NSIS silent install into a Scoop-style target directory ==='

              $installDir = Join-Path $root 'scoop-target'
              New-Item -ItemType Directory -Path $installDir -Force | Out-Null

              # NSIS requires /D= as the final argument and without quotes.
              $arguments = @('/S', "/D=$installDir")
              Add-Report "Command: dl.7z /S /D=$installDir"
              $process = Start-Process -FilePath $setup -ArgumentList $arguments -PassThru
              try {
                Wait-Process -Id $process.Id -Timeout 600 -ErrorAction Stop
              } catch {
                Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                throw 'NSIS silent installation did not finish within 10 minutes.'
              }
              $process.Refresh()
              Add-Report "Silent installer exit code: $($process.ExitCode)"

              Start-Sleep -Seconds 3
              $silentMissing = @(Get-MissingApplicationFiles -Directory $installDir)
              if ($process.ExitCode -eq 0 -and $silentMissing.Count -eq 0) {
                Add-Report 'PASS: silent installation placed the complete application payload in the requested target directory.'
                $selectedMethod = 'NSIS silent install into Scoop target directory'
                $finalDir = $installDir
              } else {
                Add-Report "Silent installation is incomplete. Missing from target directory: $($silentMissing -join ', ')"
                $programsDir = Join-Path $env:LOCALAPPDATA 'Programs'
                if (Test-Path -LiteralPath $programsDir -PathType Container) {
                  Add-Report 'Possible per-user install locations:'
                  Get-ChildItem -LiteralPath $programsDir -Directory -Force -ErrorAction SilentlyContinue |
                    Where-Object { $_.Name -match '(?i)nova' } |
                    ForEach-Object { Add-Report "  $($_.FullName)" }
                }
                throw 'Neither direct extraction nor NSIS silent installation produced the complete application payload in the target directory.'
              }

              Get-Process -Name 'Nova Island' -ErrorAction SilentlyContinue |
                Stop-Process -Force -ErrorAction SilentlyContinue
            }

            Add-Report ''
            Add-Report "Selected method: $selectedMethod"
            Add-Report 'Final application files:'
            Get-ChildItem -LiteralPath $finalDir -File -Recurse -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -in @('Nova Island.exe', 'app.asar', 'nova-helper.exe') } |
              ForEach-Object {
                $relative = [System.IO.Path]::GetRelativePath($finalDir, $_.FullName)
                Add-Report "  $relative [$($_.Length) bytes]"
              }

            @(
              '## Nova Island 1.8.2 installation test'
              ''
              '- **Result:** PASS'
              "- **Selected method:** $selectedMethod"
              "- **Installer SHA-256:** $actualHash"
              ''
              'The installed application was not launched for this test.'
            ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          } catch {
            Add-Report "FAIL: $($_.Exception.Message)"
            @(
              '## Nova Island 1.8.2 installation test'
              ''
              '- **Result:** FAILED'
              "- **Reason:** $($_.Exception.Message)"
            ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            throw
          } finally {
            $report | Set-Content -LiteralPath $reportPath -Encoding utf8
          }

      - name: Upload installation test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nova-island-silent-install-test
          path: ${{ runner.temp }}/nova-island-silent-test/
          if-no-files-found: warn
          retention-days: 14
