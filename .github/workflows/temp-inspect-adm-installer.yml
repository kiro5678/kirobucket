name: TEMP - Inspect ADM Installer

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/temp-inspect-adm-installer.yml
  workflow_dispatch:
    inputs:
      version:
        description: "ASM Download Manager release version (without v)"
        required: true
        default: "1.0.9"
        type: string

permissions:
  contents: read

jobs:
  inspect:
    name: Static installer identification and extraction
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Inspect the release installer without executing it
        shell: pwsh
        env:
          TARGET_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $version = ([string]$env:TARGET_VERSION).Trim().TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($version)) {
              $version = '1.0.9'
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Invalid version: $version"
          }

          $work = Join-Path $env:RUNNER_TEMP 'adm-installer-inspection'
          New-Item -ItemType Directory -Path $work -Force | Out-Null

          $report = [System.Collections.Generic.List[string]]::new()
          function Add-Report([string]$Line) {
              $report.Add($Line)
              Write-Host $Line
          }

          $headers = @{
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
              'User-Agent' = 'kirobucket-adm-installer-inspector'
          }

          Add-Report "ADM installer inspection"
          Add-Report "Requested version: $version"
          Add-Report "Inspection mode: static only; Setup.exe is never launched."
          Add-Report ""

          $releaseUri = "https://api.github.com/repos/Engineer-Ahmed-Said-Official/ADM/releases/tags/v$version"
          $release = Invoke-RestMethod -Uri $releaseUri -Headers $headers
          $asset = @($release.assets | Where-Object { $_.name -eq 'ASMDownload-Setup.exe' } | Select-Object -First 1)
          if ($asset.Count -eq 0) {
              throw "ASMDownload-Setup.exe was not found in release v$version."
          }
          $asset = $asset[0]

          $installer = Join-Path $work 'ASMDownload-Setup.exe'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $installer -Headers @{ 'User-Agent' = 'kirobucket-adm-installer-inspector' }

          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = ([string]$asset.digest -replace '^sha256:', '').ToLowerInvariant()
          Add-Report "Release tag: $($release.tag_name)"
          Add-Report "Release published: $($release.published_at)"
          Add-Report "Asset URL: $($asset.browser_download_url)"
          Add-Report "Asset size: $($asset.size) bytes"
          Add-Report "Publisher digest: $($asset.digest)"
          Add-Report "Downloaded SHA-256: $actualHash"
          if ($expectedHash) {
              if ($actualHash -ne $expectedHash) {
                  throw "Downloaded installer SHA-256 does not match the GitHub release asset digest."
              }
              Add-Report "Digest verification: PASS"
          } else {
              Add-Report "Digest verification: NOT AVAILABLE in release metadata"
          }

          $signature = Get-AuthenticodeSignature -FilePath $installer
          Add-Report "Authenticode status: $($signature.Status)"
          if ($signature.SignerCertificate) {
              Add-Report "Signer: $($signature.SignerCertificate.Subject)"
          } else {
              Add-Report "Signer: no Authenticode signer certificate"
          }
          Add-Report ""

          # Detect It Easy identifies the PE installer/compiler/packer without running the file.
          Add-Report "=== Detect It Easy ==="
          $dieRelease = Invoke-RestMethod -Uri 'https://api.github.com/repos/horsicq/DIE-engine/releases/latest' -Headers $headers
          $dieAsset = @($dieRelease.assets | Where-Object { $_.name -match '^die_win64_portable_.*_x64\.zip$' } | Select-Object -First 1)
          if ($dieAsset.Count -eq 0) {
              throw "The official Detect It Easy Windows x64 portable ZIP was not found."
          }
          $dieAsset = $dieAsset[0]
          $dieZip = Join-Path $work $dieAsset.name
          Invoke-WebRequest -Uri $dieAsset.browser_download_url -OutFile $dieZip -Headers @{ 'User-Agent' = 'kirobucket-adm-installer-inspector' }
          if ($dieAsset.digest) {
              $dieHash = (Get-FileHash -LiteralPath $dieZip -Algorithm SHA256).Hash.ToLowerInvariant()
              $dieExpected = ([string]$dieAsset.digest -replace '^sha256:', '').ToLowerInvariant()
              if ($dieHash -ne $dieExpected) { throw "Detect It Easy archive hash mismatch." }
          }

          $dieDir = Join-Path $work 'die'
          Expand-Archive -LiteralPath $dieZip -DestinationPath $dieDir -Force
          $diec = Get-ChildItem -LiteralPath $dieDir -Filter 'diec.exe' -File -Recurse | Select-Object -First 1
          if (-not $diec) {
              throw "diec.exe was not found inside the official Detect It Easy archive."
          }

          Push-Location $diec.DirectoryName
          try {
              $dieOutput = & $diec.FullName $installer 2>&1
              $dieExit = $LASTEXITCODE
          } finally {
              Pop-Location
          }
          Add-Report "Detect It Easy version: $($dieRelease.tag_name)"
          Add-Report "diec exit code: $dieExit"
          foreach ($line in $dieOutput) { Add-Report ([string]$line) }
          Add-Report ""

          # Try a dedicated Inno Setup extractor. This reads/extracts payload files only.
          $extractionDir = Join-Path $work 'extracted'
          $extractionSucceeded = $false
          Add-Report "=== Scoop-compatible Inno Setup extraction (innounp) ==="
          $extractionDir = Join-Path $work 'extracted'
          $extractionSucceeded = $false
          try {
              # This is the exact helper URL and SHA-256 pinned by ScoopInstaller/Main bucket/innounp.json.
              # Use the immutable source commit that published v2.71.2, not the mutable branch URL.
              $innounpUrl = 'https://raw.githubusercontent.com/jrathlev/InnoUnpacker-Windows-GUI/032d64c782efc6b36766d8f9c3b1b2f042144a58/innounp-2/bin/innounp-2.zip'
              $innounpExpectedHash = '10fce27b6344b7674d5625cc34afca1c88c12183d957c6d93e401097fa2556cd'
              $innounpZip = Join-Path $work 'innounp-2.71.2.zip'
              Invoke-WebRequest -Uri $innounpUrl -OutFile $innounpZip -Headers @{ 'User-Agent' = 'kirobucket-adm-installer-inspector' }
              $innounpHash = (Get-FileHash -LiteralPath $innounpZip -Algorithm SHA256).Hash.ToLowerInvariant()
              Add-Report "Scoop innounp helper SHA-256: $innounpHash"
              if ($innounpHash -ne $innounpExpectedHash) {
                  throw "Scoop-pinned innounp helper SHA-256 mismatch."
              }

              $innounpDir = Join-Path $work 'innounp'
              Expand-Archive -LiteralPath $innounpZip -DestinationPath $innounpDir -Force
              $innounp = Get-ChildItem -LiteralPath $innounpDir -Filter 'innounp.exe' -File -Recurse | Select-Object -First 1
              if (-not $innounp) {
                  throw "innounp.exe was not found in the Scoop helper archive."
              }

              Add-Report "Scoop helper: innounp 2.71.2"
              Add-Report "=== Inno Setup installer information ==="
              $info = & $innounp.FullName $installer 2>&1
              $infoExit = $LASTEXITCODE
              Add-Report "innounp information exit code: $infoExit"
              foreach ($line in $info) { Add-Report ([string]$line) }

              Add-Report "=== Inno Setup payload listing ==="
              $listing = & $innounp.FullName -v $installer 2>&1
              $listExit = $LASTEXITCODE
              Add-Report "innounp list exit code: $listExit"
              foreach ($line in $listing) { Add-Report ([string]$line) }

              if ($listExit -eq 0) {
                  New-Item -ItemType Directory -Path $extractionDir -Force | Out-Null
                  Add-Report "=== Extracting {app} payload (same method used by Scoop) ==="
                  $extractOutput = & $innounp.FullName -x "-d$extractionDir" $installer -y '-c{app}' 2>&1
                  $extractExit = $LASTEXITCODE
                  Add-Report "innounp extraction exit code: $extractExit"
                  foreach ($line in $extractOutput) { Add-Report ([string]$line) }
                  if ($extractExit -eq 0) { $extractionSucceeded = $true }
              }
          } catch {
              Add-Report "Scoop-compatible innounp attempt failed: $($_.Exception.Message)"
          }
          # If Inno extraction is not applicable, use 7-Zip as a non-executing archive reader.
          if (-not $extractionSucceeded) {
              Add-Report ""
              Add-Report "=== 7-Zip archive inspection fallback ==="
              $sevenZip = Get-Command '7z.exe' -ErrorAction SilentlyContinue
              if (-not $sevenZip -and (Test-Path 'C:\Program Files\7-Zip\7z.exe')) {
                  $sevenZipPath = 'C:\Program Files\7-Zip\7z.exe'
              } elseif ($sevenZip) {
                  $sevenZipPath = $sevenZip.Source
              } else {
                  choco install 7zip --yes --no-progress
                  $sevenZipPath = 'C:\Program Files\7-Zip\7z.exe'
              }

              if (Test-Path $sevenZipPath) {
                  $sevenList = & $sevenZipPath l -slt $installer 2>&1
                  $sevenListExit = $LASTEXITCODE
                  Add-Report "7-Zip list exit code: $sevenListExit"
                  foreach ($line in $sevenList) { Add-Report ([string]$line) }

                  if ($sevenListExit -eq 0) {
                      New-Item -ItemType Directory -Path $extractionDir -Force | Out-Null
                      $sevenExtract = & $sevenZipPath x -y "-o$extractionDir" $installer 2>&1
                      $sevenExtractExit = $LASTEXITCODE
                      Add-Report "7-Zip extraction exit code: $sevenExtractExit"
                      foreach ($line in $sevenExtract) { Add-Report ([string]$line) }
                      if ($sevenExtractExit -eq 0) { $extractionSucceeded = $true }
                  }
              } else {
                  Add-Report "7-Zip executable was not available."
              }
          }

          Add-Report ""
          Add-Report "=== Extracted executable and library inventory ==="
          if ($extractionSucceeded -and (Test-Path -LiteralPath $extractionDir)) {
              $files = @(Get-ChildItem -LiteralPath $extractionDir -File -Recurse)
              Add-Report "Extracted file count: $($files.Count)"
              $interesting = @($files | Where-Object {
                  $_.Extension -in @('.exe', '.dll', '.msi', '.sys', '.json', '.ini', '.config') -or $_.Name -match '^(unins|uninstall)'
              } | Sort-Object FullName)
              foreach ($file in ($interesting | Select-Object -First 250)) {
                  $relative = $file.FullName.Substring($extractionDir.Length).TrimStart('\')
                  Add-Report ("{0} | {1} bytes" -f $relative, $file.Length)
              }
              if ($interesting.Count -gt 250) { Add-Report "Output truncated after 250 relevant files." }
          } else {
              Add-Report "No payload extraction succeeded. Keep the installer classified as Review."
          }

          # Extract the complete installer payload separately so the reconstructed Inno script can be inspected.
          if ($extractionSucceeded -and $innounp) {
              Add-Report ""
              Add-Report "=== Full installer payload extraction for setup-script inspection ==="
              try {
                  $fullExtractionDir = Join-Path $work 'full-installer-contents'
                  New-Item -ItemType Directory -Path $fullExtractionDir -Force | Out-Null
                  $fullExtractOutput = & $innounp.FullName -x "-d$fullExtractionDir" $installer -y 2>&1
                  $fullExtractExit = $LASTEXITCODE
                  Add-Report "Full innounp extraction exit code: $fullExtractExit"
                  foreach ($line in $fullExtractOutput) { Add-Report ([string]$line) }

                  if ($fullExtractExit -eq 0) {
                      $scriptFiles = @(Get-ChildItem -LiteralPath $fullExtractionDir -Filter '*.iss' -File -Recurse)
                      if ($scriptFiles.Count -eq 0) {
                          $scriptFiles = @(Get-ChildItem -LiteralPath $work -Filter '*.iss' -File -Recurse)
                      }

                      if ($scriptFiles.Count -gt 0) {
                          foreach ($scriptFile in $scriptFiles) {
                              Add-Report "=== Reconstructed Inno Setup script: $($scriptFile.FullName) ==="
                              $scriptLines = Get-Content -LiteralPath $scriptFile.FullName
                              Add-Report "Script line count: $($scriptLines.Count)"
                              $wantedSections = @('Setup', 'Tasks', 'Files', 'Icons', 'Registry', 'Run', 'UninstallRun', 'Code')
                              foreach ($section in $wantedSections) {
                                  $sectionStart = -1
                                  for ($i = 0; $i -lt $scriptLines.Count; $i++) {
                                      if ($scriptLines[$i] -match ('^\\[' + [regex]::Escape($section) + '\\]$')) {
                                          $sectionStart = $i
                                          break
                                      }
                                  }
                                  if ($sectionStart -lt 0) { continue }

                                  $sectionEnd = $scriptLines.Count
                                  for ($i = $sectionStart + 1; $i -lt $scriptLines.Count; $i++) {
                                      if ($scriptLines[$i] -match '^\\[[^\\]]+\\]$') {
                                          $sectionEnd = $i
                                          break
                                      }
                                  }
                                  Add-Report "[$section]"
                                  for ($i = $sectionStart + 1; $i -lt $sectionEnd; $i++) {
                                      $line = [string]$scriptLines[$i]
                                      $keep = switch ($section) {
                                          'Setup' { $line -match '^\\s*(AppId|AppName|AppVersion|DefaultDirName|DefaultGroupName|PrivilegesRequired|ArchitecturesInstallIn64BitMode|WizardStyle|UninstallDisplayIcon|DisableProgramGroupPage|ChangesAssociations|CreateUninstallRegKey|Uninstallable)\\s*=' }
                                          'Tasks' { $line -match '^\\s*(Name|Description|GroupDescription|Flags)\\s*:' }
                                          'Files' { $line -match '^\\s*(Source|DestDir|DestName|Flags|Permissions|Tasks)\\s*:' }
                                          'Icons' { $line -match '^\\s*(Name|Filename|Parameters|WorkingDir|Tasks|IconFilename)\\s*:' }
                                          'Registry' { $line -match '^\\s*(Root|Subkey|ValueType|ValueName|ValueData|Flags)\\s*:' }
                                          'Run' { $line -match '^\\s*(Filename|Parameters|Description|Flags|StatusMsg|RunOnceId)\\s*:' }
                                          'UninstallRun' { $line -match '^\\s*(Filename|Parameters|Description|Flags|RunOnceId)\\s*:' }
                                          'Code' { $line -match '(?i)\\b(RegWrite|RegDelete|RegQuery|Exec|ShellExec|CreateShellLink|CreateDir|DeleteFile|DeleteDir|CurStepChanged|InitializeSetup|DeinitializeSetup|Register|Unregister|CreateInputOptionPage|CreateOutputMsgPage)\\b|^\\s*procedure\\s+|^\\s*function\\s+' }
                                      }
                                      if ($keep) { Add-Report $line.TrimEnd() }
                                  }
                              }
                          }
                      } else {
                          Add-Report "No reconstructed .iss script file was found after full extraction."
                      }
                  } else {
                      Add-Report "Full installer extraction failed; the already successful {app} extraction remains valid."
                  }
              } catch {
                  Add-Report "Full installer/script inspection failed: $($_.Exception.Message)"
              }
          }
          $reportPath = Join-Path $work 'adm-installer-report.txt'
          $report | Set-Content -LiteralPath $reportPath -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '## ADM installer inspection'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'The setup executable was never launched.'
          Get-Content -LiteralPath $reportPath | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY