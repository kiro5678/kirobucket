name: Termilly and WacOS manifest test

on:
  push:
    branches:
      - add-termilly-wacos-manifests-20261120

permissions:
  contents: read

jobs:
  test:
    name: Scoop install, extraction, shortcuts and checkver
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Scoop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
            Invoke-RestMethod -Uri 'https://get.scoop.sh' | Invoke-Expression
          }
          $scoopRoot = Join-Path $env:USERPROFILE 'scoop'
          if (-not (Test-Path -LiteralPath (Join-Path $scoopRoot 'shims\scoop.ps1'))) {
            throw "Scoop bootstrap completed but its shim was not found under $scoopRoot."
          }
          "SCOOP=$scoopRoot" >> $env:GITHUB_ENV
          (Join-Path $scoopRoot 'shims') >> $env:GITHUB_PATH
          $env:SCOOP = $scoopRoot
          $env:PATH = (Join-Path $scoopRoot 'shims') + ';' + $env:PATH
          scoop --version

      - name: Create isolated local test bucket
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $localBucket = Join-Path $env:RUNNER_TEMP 'termilly-wacos-test-bucket'
          $manifestDir = Join-Path $localBucket 'bucket'
          New-Item -ItemType Directory -Path $manifestDir -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'bucket\termilly.json') -Destination $manifestDir
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'bucket\wacos.json') -Destination $manifestDir

          git init --initial-branch=master $localBucket
          git -C $localBucket config user.name 'GitHub Actions'
          git -C $localBucket config user.email 'actions@github.com'
          git -C $localBucket add bucket
          git -C $localBucket commit -m 'Seed isolated manifest test bucket'

          $bucketUrl = 'file:///' + $localBucket.Replace('\', '/')
          scoop bucket add kirobucket $bucketUrl
          "MANIFEST_DIR=$manifestDir" >> $env:GITHUB_ENV

      - name: Validate checkver and official hash sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checkver = Join-Path $env:SCOOP 'apps\scoop\current\bin\checkver.ps1'
          if (-not (Test-Path -LiteralPath $checkver -PathType Leaf)) {
            throw "Scoop checkver.ps1 was not found: $checkver"
          }

          foreach ($name in @('termilly', 'wacos')) {
            Write-Host "Running checkver and forced autoupdate hash test for $name"
            & $checkver $name $env:MANIFEST_DIR -ForceUpdate -ThrowError
            if ($LASTEXITCODE -ne 0) { throw "checkver failed for $name." }
          }

      - name: Install both manifests with Scoop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          scoop install termilly
          if ($LASTEXITCODE -ne 0) { throw 'Scoop install failed for Termilly.' }
          scoop install wacos
          if ($LASTEXITCODE -ne 0) { throw 'Scoop install failed for WacOS.' }

      - name: Verify extraction, persistence and Start Menu shortcuts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $apps = Join-Path $env:SCOOP 'apps'
          $termilly = Join-Path $apps 'termilly\current'
          $wacos = Join-Path $apps 'wacos\current'

          foreach ($path in @(
            (Join-Path $termilly 'Termilly.exe'),
            (Join-Path $termilly 'agent\termilly.exe'),
            (Join-Path $termilly 'bin\termilly.cmd'),
            (Join-Path $wacos 'bin\WacOSShell.exe')
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required extracted file is missing: $path"
            }
            Write-Host "PASS: $path"
          }

          if (Get-ChildItem -LiteralPath $termilly -Filter 'TermillySetup*.exe' -File -Recurse -ErrorAction SilentlyContinue) {
            throw 'The Termilly setup executable was left inside the Scoop app directory.'
          }
          if (Test-Path -LiteralPath (Join-Path $termilly '.termilly-payload.zip')) {
            throw 'The temporary Termilly payload ZIP was not removed.'
          }

          $persistData = Join-Path $env:SCOOP 'persist\termilly\data'
          New-Item -ItemType Directory -Path $persistData -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $persistData 'manifest-test.txt') -Value 'persisted'
          if (-not (Test-Path -LiteralPath (Join-Path $termilly 'data\manifest-test.txt') -PathType Leaf)) {
            throw 'Termilly cannot access its persisted data directory.'
          }

          $startMenu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          foreach ($shortcutName in @('Termilly.lnk', 'WacOS.lnk')) {
            $shortcut = Get-ChildItem -LiteralPath $startMenu -Filter $shortcutName -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($null -eq $shortcut) { throw "Start Menu shortcut is missing: $shortcutName" }
            Write-Host "PASS: $($shortcut.FullName)"
          }

          if (Get-Process -Name 'WacOSShell' -ErrorAction SilentlyContinue) {
            throw 'WacOS should not be launched during this non-interactive extraction test.'
          }

      - name: Uninstall both test apps
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          scoop uninstall wacos
          if ($LASTEXITCODE -ne 0) { throw 'Scoop uninstall failed for WacOS.' }
          scoop uninstall termilly
          if ($LASTEXITCODE -ne 0) { throw 'Scoop uninstall failed for Termilly.' }
          if (-not (Test-Path -LiteralPath (Join-Path $env:SCOOP 'persist\termilly\data\manifest-test.txt') -PathType Leaf)) {
            throw 'Termilly persisted data was not retained after uninstall.'
          }
          Write-Host 'PASS: both manifests installed and uninstalled; Termilly persistent data was retained.'
