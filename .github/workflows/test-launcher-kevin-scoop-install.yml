name: Launcher Scoop Install Test

on:
  push:
    branches:
      - master
    paths:
      - "bucket/launcher-kevin.json"
      - ".github/workflows/test-launcher-kevin-scoop-install.yml"
  pull_request:
    branches:
      - master
    paths:
      - "bucket/launcher-kevin.json"
      - ".github/workflows/test-launcher-kevin-scoop-install.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Scoop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          }
          $scoopRoot = if ($env:SCOOP) { $env:SCOOP } else { Join-Path $env:USERPROFILE 'scoop' }
          $env:SCOOP = $scoopRoot
          $env:Path = (Join-Path $scoopRoot 'shims') + ';' + $env:Path
          (Join-Path $scoopRoot 'shims') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          scoop --version

      - name: Validate Launcher version with official Scoop checkver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scoopRoot = if ($env:SCOOP) { $env:SCOOP } else { Join-Path $env:USERPROFILE 'scoop' }
          $checkver = Join-Path $scoopRoot 'apps\scoop\current\bin\checkver.ps1'
          $bucketPath = Join-Path $env:GITHUB_WORKSPACE 'bucket'
          if (-not (Test-Path -LiteralPath $checkver -PathType Leaf)) {
            throw "Official Scoop checkver script was not found: $checkver"
          }
          & $checkver -App 'launcher-kevin' -Dir $bucketPath -ThrowError
          if (-not $?) { throw 'Official Scoop checkver reported an unsuccessful result.' }

      - name: Install Launcher - Kevin Loggenberg and verify persisted user data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'bucket\launcher-kevin.json'
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Launcher - Kevin Loggenberg manifest was not found: $manifestPath"
          }

          scoop install $manifestPath
          if ($LASTEXITCODE -ne 0) { throw "Scoop install failed with exit code $LASTEXITCODE." }

          $prefix = (& scoop prefix launcher-kevin | Select-Object -Last 1).Trim()
          if (-not (Test-Path -LiteralPath (Join-Path $prefix 'LauncherCompanion.exe') -PathType Leaf)) {
            throw 'The self-contained LauncherCompanion.exe was not installed.'
          }
          $launcher = Join-Path $prefix 'Launcher-portable.cmd'
          if (-not (Test-Path -LiteralPath $launcher -PathType Leaf)) {
            throw 'The portable command launcher was not created.'
          }

          $launcherText = Get-Content -LiteralPath $launcher -Raw
          foreach ($expected in @(
            'DOTNET_BUNDLE_EXTRACT_BASE_DIR=%~dp0data\dotnet',
            'LauncherCompanion.exe'
          )) {
            if ($launcherText -notmatch [regex]::Escape($expected)) {
              throw "Portable launcher is missing expected setting: $expected"
            }
          }

          $scoopRoot = if ($env:SCOOP) { $env:SCOOP } else { Join-Path $env:USERPROFILE 'scoop' }
          $persistData = Join-Path $scoopRoot 'persist\launcher-kevin\data\LauncherCompanion'
          if (-not (Test-Path -LiteralPath $persistData -PathType Container)) {
            throw "Scoop did not create the persisted LauncherCompanion data directory: $persistData"
          }

          $appData = Join-Path $env:LOCALAPPDATA 'LauncherCompanion'
          $appDataItem = Get-Item -LiteralPath $appData -Force -ErrorAction Stop
          if (($appDataItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0) {
            throw "LauncherCompanion LocalAppData path is not a junction: $appData"
          }
          $actualTarget = [string]$appDataItem.Target
          if ([string]::IsNullOrWhiteSpace($actualTarget) -or [IO.Path]::GetFullPath($actualTarget) -ine [IO.Path]::GetFullPath($persistData)) {
            throw "LocalAppData junction target does not match Scoop persist. Actual: $actualTarget; expected: $persistData"
          }

          $shim = Get-Command launcher-kevin -ErrorAction Stop
          Write-Host "Scoop prefix: $prefix"
          Write-Host "Scoop shim: $($shim.Source)"
          Write-Host "Persistent data: $persistData"

          $shortcutRoot = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          $shortcuts = @(Get-ChildItem -LiteralPath $shortcutRoot -Filter 'Launcher - Kevin Loggenberg.lnk' -File -Recurse -ErrorAction SilentlyContinue)
          if ($shortcuts.Count -eq 0) { throw 'The Launcher - Kevin Loggenberg Start Menu shortcut was not created.' }
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut($shortcuts[0].FullName)
          if (-not (Test-Path -LiteralPath $shortcut.TargetPath -PathType Leaf)) {
            throw "The Launcher - Kevin Loggenberg shortcut target is missing: $($shortcut.TargetPath)"
          }
          if ($shortcut.TargetPath -notlike '*.cmd') {
            throw "The shortcut must invoke the portable launcher: $($shortcut.TargetPath)"
          }

          $fileVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Join-Path $prefix 'LauncherCompanion.exe'))
          if ($fileVersion.FileVersion -ne '1.2.0.0') {
            throw "Unexpected Launcher file version: $($fileVersion.FileVersion)"
          }

          $marker = Join-Path $appData 'kirobucket-persist-regression-test.txt'
          Set-Content -LiteralPath $marker -Value 'persisted' -Encoding ASCII

          scoop uninstall launcher-kevin
          if ($LASTEXITCODE -ne 0) { throw "Scoop uninstall failed with exit code $LASTEXITCODE." }
          if (Test-Path -LiteralPath $appData) {
            throw "Scoop uninstall left the external LocalAppData junction behind: $appData"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $persistData 'kirobucket-persist-regression-test.txt') -PathType Leaf)) {
            throw 'Scoop uninstall did not preserve the test file in the persistent data directory.'
          }

          @(
            '## Launcher - Kevin Loggenberg Scoop install test'
            ''
            '- Scoop installed the official self-contained x64 executable and verified its SHA-256.'
            '- The application executable was not launched.'
            '- The CMD launcher sets only .NET bundle extraction to data\dotnet.'
            '- The actual %LOCALAPPDATA%\LauncherCompanion folder resolves through a junction to Scoop persist.'
            '- The launcher shim and Start Menu shortcut were created and verified.'
            '- The Start Menu shortcut targets the CMD launcher.'
            '- A marker written through the LocalAppData junction survived Scoop uninstall in persist.'
            '- Scoop uninstall removed the external junction while retaining persistent data.'
            '- Upstream file version 1.2.0.0 was verified.'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Cleanup if install test stopped early
        if: always()
        shell: pwsh
        run: |
          if (Get-Command scoop -ErrorAction SilentlyContinue) {
            $scoopRoot = if ($env:SCOOP) { $env:SCOOP } else { Join-Path $env:USERPROFILE 'scoop' }
            $current = Join-Path $scoopRoot 'apps\launcher-kevin\current'
            if (Test-Path -LiteralPath $current) {
              scoop uninstall launcher-kevin
              if ($LASTEXITCODE -ne 0) { Write-Warning "Scoop cleanup returned exit code $LASTEXITCODE." }
            }
          }
