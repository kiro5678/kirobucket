name: Inspect Whisperstream and BlabbyAI Installers

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/inspect-dictation-installers.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Download and statically inspect official Windows installers
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and download official installers
        id: download
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $root = Join-Path $env:RUNNER_TEMP "dictation-installer-inspection"
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          function Get-PageLinks {
            param([string]$PageUrl, [string]$Html)
            $items = [System.Collections.Generic.List[object]]::new()
            foreach ($match in [regex]::Matches($Html, '(?is)<(?<tag>a|button)\b(?<attrs>[^>]*)>(?<body>.*?)</\k<tag>>')) {
              $attrs = $match.Groups["attrs"].Value
              $hrefMatch = [regex]::Match($attrs, '(?is)\b(?:href|data-href|data-url|data-download-url|data-installer-url)\s*=\s*["''](?<href>[^"'']+)["'']')
              if (-not $hrefMatch.Success) { continue }
              $href = [System.Net.WebUtility]::HtmlDecode($hrefMatch.Groups["href"].Value.Trim())
              if ([string]::IsNullOrWhiteSpace($href) -or $href.StartsWith("#")) { continue }
              try { $absolute = [System.Uri]::new([System.Uri]$PageUrl, $href).AbsoluteUri } catch { continue }
              $label = [regex]::Replace($match.Groups["body"].Value, '<[^>]+>', ' ')
              $label = [System.Net.WebUtility]::HtmlDecode(($label -replace '\s+', ' ').Trim())
              $items.Add([PSCustomObject]@{ Url = $absolute; Label = $label; Tag = $match.Groups["tag"].Value })
            }
            return @($items)
          }
          function Save-Installer {
            param([string]$Name, [string]$Url, [string]$Destination, [string]$ExpectedSha256)
            $uri = [System.Uri]::new($Url)
            if ($uri.Scheme -ne "https" -or $uri.UserInfo) { throw "$($Name): only credential-free HTTPS URLs are accepted." }
            Write-Host "$Name download URL: $Url"
            Invoke-WebRequest -Uri $uri.AbsoluteUri -OutFile $Destination -MaximumRedirection 10 -TimeoutSec 900 -ErrorAction Stop
            $item = Get-Item -LiteralPath $Destination
            if ($item.Length -lt 1MB -or $item.Length -gt 1.5GB) {
              throw "$($Name): unexpected download size ($($item.Length) bytes)."
            }
            $stream = [System.IO.File]::OpenRead($Destination)
            try { $header = [byte[]]::new(2); $read = $stream.Read($header, 0, 2) } finally { $stream.Dispose() }
            if ($read -ne 2 -or $header[0] -ne 0x4D -or $header[1] -ne 0x5A) {
              throw "$($Name): response is not a Windows PE executable (MZ header missing)."
            }
            $sha = (Get-FileHash -LiteralPath $Destination -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($ExpectedSha256 -and $sha -ine $ExpectedSha256.ToLowerInvariant()) {
              throw "$($Name): SHA-256 mismatch. Expected $ExpectedSha256, got $sha."
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $Destination
            $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($Destination)
            $signer = if ($signature.SignerCertificate) { $signature.SignerCertificate.Subject } else { "(no signer certificate)" }
            [PSCustomObject]@{
              Name = $Name
              Url = $Url
              File = $Destination
              FileName = $item.Name
              SizeBytes = $item.Length
              SHA256 = $sha
              ExpectedSHA256 = $ExpectedSha256
              AuthenticodeStatus = [string]$signature.Status
              Signer = $signer
              ProductName = [string]$version.ProductName
              FileDescription = [string]$version.FileDescription
              FileVersion = [string]$version.FileVersion
            }
          }

          # Whisperstream: resolve the Windows download from its official site.
          $whisperPage = "https://whisperstream.io/download"
          try {
            $page = Invoke-WebRequest -Uri $whisperPage -MaximumRedirection 10 -TimeoutSec 90 -ErrorAction Stop
            $whisperHtml = [string]$page.Content
          } catch {
            $whisperPage = "https://whisperstream.io/"
            $page = Invoke-WebRequest -Uri $whisperPage -MaximumRedirection 10 -TimeoutSec 90 -ErrorAction Stop
            $whisperHtml = [string]$page.Content
          }
          Set-Content -LiteralPath (Join-Path $root "whisperstream-download-page.html") -Value $whisperHtml -Encoding utf8
          $links = @(Get-PageLinks -PageUrl $whisperPage -Html $whisperHtml)
          $links | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $root "whisperstream-page-links.json") -Encoding utf8
          $links | ForEach-Object { Write-Host "Whisperstream page link: tag=$($_.Tag); text=$($_.Label); url=$($_.Url)" }
          $pageUri = [System.Uri]$whisperPage
          $candidates = @($links | Where-Object {
            ($_.Label -match '(?i)windows' -or $_.Url -match '(?i)windows|win') -and
            ([System.Uri]$_.Url).AbsolutePath -ne $pageUri.AbsolutePath -and
            $_.Url -notmatch '(?i)\.(dmg|pkg)(\?|$)'
          })
          if (-not $candidates.Count) {
            $rawUrls = [regex]::Matches($whisperHtml, '(?i)https?://[^""''\s<>]+') |
              ForEach-Object { $_.Value.TrimEnd(')', ']', ',', ';') } |
              Where-Object { $_ -match '(?i)whisper|download|\.exe' } |
              Sort-Object -Unique
            $rawUrls | Set-Content -LiteralPath (Join-Path $root "whisperstream-raw-url-candidates.txt") -Encoding utf8
            $scriptCandidates = [regex]::Matches($whisperHtml, '(?is)(?:downloadUrl|installerUrl|windowsDownload|windowsInstaller|href)\s*[:=]\s*["''](?<url>[^"'']+)["'']') |
              ForEach-Object { [System.Net.WebUtility]::HtmlDecode($_.Groups["url"].Value) } |
              Where-Object { $_ -match '(?i)whisper|download|\.exe|windows' } |
              Sort-Object -Unique
            $scriptCandidates | Set-Content -LiteralPath (Join-Path $root "whisperstream-script-url-candidates.txt") -Encoding utf8
            foreach ($candidate in $scriptCandidates) {
              try {
                $absolute = [System.Uri]::new([System.Uri]$whisperPage, $candidate).AbsoluteUri
                if (([System.Uri]$absolute).AbsolutePath -ne $pageUri.AbsolutePath -and $absolute -match '(?i)windows|win|\.exe|download') {
                  $candidates += [PSCustomObject]@{ Url = $absolute; Label = "Embedded download URL"; Tag = "script" }
                }
              } catch {}
            }
          }
          if (-not $candidates.Count) {
            throw "Could not resolve a Windows installer URL. HTML, page links, and candidate URLs were saved as artifacts."
          }
          $whisperCandidate = $candidates |
            Sort-Object @{Expression = { if ($_.Url -match '(?i)\.exe(\?|$)') { 0 } elseif ($_.Label -match '(?i)windows') { 1 } else { 2 } }} |
            Select-Object -First 1
          Write-Host "Whisperstream candidate: $($whisperCandidate.Label) -> $($whisperCandidate.Url)"
          $whisperPath = Join-Path $root "Whisperstream-Windows-Setup.exe"
          $whisper = Save-Installer -Name "Whisperstream" -Url $whisperCandidate.Url -Destination $whisperPath -ExpectedSha256 ""

          # BlabbyAI: latest Windows installer from the release repository linked by the official website.
          $headers = @{
            Accept = "application/vnd.github+json"
            "User-Agent" = "KiroBucket-Dictation-Installer-Inspection"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          if ($env:GITHUB_TOKEN) { $headers.Authorization = "Bearer $env:GITHUB_TOKEN" }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/sumbatx15/blabby-updater/releases/latest" -Headers $headers -TimeoutSec 60 -ErrorAction Stop
          $asset = $release.assets | Where-Object { $_.name -match '^blabby-[\d.]+-setup\.exe$' } | Select-Object -First 1
          if (-not $asset) { throw "Latest BlabbyAI release $($release.tag_name) has no matching Windows setup executable." }
          $expected = ""
          if ($asset.digest -match '^sha256:(?<value>[0-9a-fA-F]{64})$') { $expected = $Matches.value }
          $blabbyPath = Join-Path $root $asset.name
          $blabby = Save-Installer -Name "BlabbyAI $($release.tag_name)" -Url $asset.browser_download_url -Destination $blabbyPath -ExpectedSha256 $expected

          foreach ($assetName in @("builder-effective-config.yaml", "latest.yml")) {
            $metadataAsset = $release.assets | Where-Object { $_.name -eq $assetName } | Select-Object -First 1
            if ($metadataAsset) {
              try {
                Invoke-WebRequest -Uri $metadataAsset.browser_download_url -OutFile (Join-Path $root "blabby-$assetName") -TimeoutSec 60 -ErrorAction Stop
              } catch { Write-Warning "Could not download optional Blabby metadata $($assetName): $($_.Exception.Message)" }
            }
          }

          $inventory = @($whisper, $blabby)
          $inventory | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $root "installer-inventory.json") -Encoding utf8
          foreach ($item in $inventory) {
            Write-Host "$($item.Name): $($item.FileName), $($item.SizeBytes) bytes, SHA256 $($item.SHA256)"
            Write-Host "Authenticode: $($item.AuthenticodeStatus); signer: $($item.Signer); file version: $($item.FileVersion)"
          }
          @(
            "## Downloaded official Windows installers"
            ""
            "| Program | File | Bytes | SHA-256 | Authenticode | Signer |"
            "|---|---|---:|---|---|---|"
            foreach ($item in $inventory) {
              "| $($item.Name) | $($item.FileName) | $($item.SizeBytes) | $($item.SHA256) | $($item.AuthenticodeStatus) | $($item.Signer -replace '\|','/') |"
            }
            ""
            "BlabbyAI release: $($release.tag_name) ($($release.published_at))"
            "The installers were downloaded but not executed."
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

          "whisperstream_path=$whisperPath" >> $env:GITHUB_OUTPUT
          "blabby_path=$blabbyPath" >> $env:GITHUB_OUTPUT

      - name: Download Detect It Easy
        id: die
        if: always()
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $headers = @{
            Accept = "application/vnd.github+json"
            "User-Agent" = "KiroBucket-Detect-It-Easy"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          if ($env:GITHUB_TOKEN) { $headers.Authorization = "Bearer $env:GITHUB_TOKEN" }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/horsicq/DIE-engine/releases/latest" -Headers $headers -TimeoutSec 60 -ErrorAction Stop
          $asset = $release.assets | Where-Object { $_.name -match '^die_win64_portable_[\d.]+_x64\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "No Windows x64 portable Detect It Easy release asset was found." }

          $root = Join-Path $env:RUNNER_TEMP "dictation-installer-inspection"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $zip = Join-Path $root $asset.name
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip -TimeoutSec 300 -ErrorAction Stop
          if ($asset.digest -match '^sha256:(?<expected>[0-9a-fA-F]{64})$') {
            $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
            if ($actual -ine $Matches.expected) { throw "Detect It Easy archive SHA-256 mismatch." }
          }
          $toolDir = Join-Path $root "die-tool"
          Expand-Archive -LiteralPath $zip -DestinationPath $toolDir -Force
          $diec = Get-ChildItem -LiteralPath $toolDir -Filter "diec.exe" -Recurse -File | Select-Object -First 1
          if (-not $diec) { throw "diec.exe was not found after extracting the portable archive." }
          "diec_path=$($diec.FullName)" >> $env:GITHUB_OUTPUT
          "die_release=$($release.tag_name)" >> $env:GITHUB_OUTPUT

      - name: Statically identify installers and test archive extraction
        if: steps.download.outcome == 'success' && steps.die.outcome == 'success'
        shell: pwsh
        env:
          WHISPERSTREAM_PATH: ${ steps.download.outputs.whisperstream_path }}
          BLABBY_PATH: ${ steps.download.outputs.blabby_path }}
          DIEC_PATH: ${ steps.die.outputs.diec_path }}
          DIE_RELEASE: ${ steps.die.outputs.die_release }}
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "dictation-installer-inspection"
          $sevenZip = Get-Command 7z.exe -ErrorAction SilentlyContinue
          if (-not $sevenZip) {
            $candidate = Join-Path $env:ProgramFiles "7-Zip\7z.exe"
            if (Test-Path -LiteralPath $candidate) { $sevenZip = [PSCustomObject]@{ Source = $candidate } }
          }
          $targets = @(
            [PSCustomObject]@{ Name = "Whisperstream"; Path = $env:WHISPERSTREAM_PATH },
            [PSCustomObject]@{ Name = "BlabbyAI"; Path = $env:BLABBY_PATH }
          )
          $results = [System.Collections.Generic.List[object]]::new()

          foreach ($target in $targets) {
            $path = $target.Path
            if ([string]::IsNullOrWhiteSpace($path) -or !(Test-Path -LiteralPath $path -PathType Leaf)) {
              Write-Warning "$($target.Name): download step did not produce a file."
              continue
            }
            $report = [System.Collections.Generic.List[string]]::new()
            $report.Add("Installer inspection: $($target.Name)")
            $report.Add("File: $(Split-Path -Leaf $path)")
            $report.Add("Size: $((Get-Item -LiteralPath $path).Length) bytes")
            $report.Add("SHA-256: $((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash)")
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            $report.Add("Authenticode: $($signature.Status)")
            if ($signature.SignerCertificate) { $report.Add("Signer: $($signature.SignerCertificate.Subject)") }
            $report.Add("Detect It Easy release: $env:DIE_RELEASE")
            $report.Add("")

            $scan = @(& $env:DIEC_PATH -d -u -b -a $path 2>&1 | ForEach-Object { "$_" })
            $scanExit = $LASTEXITCODE
            $report.Add("Detect It Easy output:")
            $report.AddRange([string[]]$scan)
            $report.Add("DIE exit code: $scanExit")

            $sevenZipResult = "7-Zip was not available on this runner."
            $extractDir = Join-Path $root ("extracted-" + ($target.Name -replace '[^A-Za-z0-9_-]', '-'))
            if ($sevenZip) {
              $list = @(& $sevenZip.Source l -slt -- $path 2>&1 | ForEach-Object { "$_" })
              $listExit = $LASTEXITCODE
              $listPath = Join-Path $root ("7zip-list-" + ($target.Name -replace '[^A-Za-z0-9_-]', '-') + ".txt")
              $list | Set-Content -LiteralPath $listPath -Encoding utf8
              if ($listExit -eq 0) {
                New-Item -ItemType Directory -Path $extractDir -Force | Out-Null
                $null = & $sevenZip.Source x -y "-o$extractDir" -bd -- $path 2>&1
                $extractExit = $LASTEXITCODE
                $fileCount = @(Get-ChildItem -LiteralPath $extractDir -File -Recurse -Force -ErrorAction SilentlyContinue).Count
                $sevenZipResult = "Listing succeeded; extraction exit code $extractExit; extracted files: $fileCount."
                $report.Add("7-Zip listing: $listPath")
                $report.Add("7-Zip extraction: $sevenZipResult")
                foreach ($f in (Get-ChildItem -LiteralPath $extractDir -File -Recurse -Force | Select-Object -First 80)) {
                  $report.Add(" - $($f.FullName.Substring($extractDir.Length).TrimStart('\')) [$($f.Length) bytes]")
                }
              } else {
                $sevenZipResult = "7-Zip could not list installer (exit code $listExit)."
                $report.Add($sevenZipResult)
              }
            } else { $report.Add($sevenZipResult) }

            $report.Add("")
            $report.Add("Embedded installer switches (string heuristic only; not proof they are supported):")
            $bytes = [System.IO.File]::ReadAllBytes($path)
            $text = [System.Text.Encoding]::ASCII.GetString($bytes) + [Environment]::NewLine + [System.Text.Encoding]::Unicode.GetString($bytes)
            $switches = [regex]::Matches($text, '(?i)(?:/S\b|/D=|/silent\b|/quiet\b|/verysilent\b|--silent\b|--dir\b|--targetdir\b|/allusers\b|/currentuser\b|/help\b|--help\b)') |
              ForEach-Object { $_.Value.ToLowerInvariant() } | Sort-Object -Unique
            if ($switches.Count) { foreach ($switch in $switches) { $report.Add(" - $switch") } }
            else { $report.Add(" - No common installer switches found in the scanned strings.") }
            $report.Add("")
            $report.Add("Safety: installer executable was not launched. 7-Zip only listed/extracted package data.")
            $reportPath = Join-Path $root ("$($target.Name -replace '[^A-Za-z0-9_-]', '-').txt")
            $report | Set-Content -LiteralPath $reportPath -Encoding utf8
            $report | ForEach-Object { Write-Output $_ }
            $results.Add([PSCustomObject]@{
              Name = $target.Name
              DetectItEasyExitCode = $scanExit
              DetectItEasy = $scan -join [Environment]::NewLine
              SevenZip = $sevenZipResult
              SwitchStrings = @($switches)
              Report = $reportPath
            })
          }

          $results | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $root "inspection-results.json") -Encoding utf8
          @(
            ""
            "## Static installer identification and extraction"
            ""
            "Detect It Easy release: $env:DIE_RELEASE"
            "No installer was executed."
            ""
            "| Program | Detect It Easy exit | 7-Zip result |"
            "|---|---:|---|"
            foreach ($r in $results) { "| $($r.Name) | $($r.DetectItEasyExitCode) | $($r.SevenZip) |" }
            ""
            "Full reports, archive listings, and extracted files are in the workflow artifact."
            "Switch strings are heuristic evidence only, not confirmation of silent installation support."
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload inspection evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dictation-installer-inspection
          path: ${{ runner.temp }}/dictation-installer-inspection/
          if-no-files-found: warn
          retention-days: 14
