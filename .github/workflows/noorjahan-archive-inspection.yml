name: Inspect Noorjahan release ZIP archives

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/noorjahan-archive-inspection.yml"

permissions:
  contents: read

jobs:
  inspect:
    name: Download, verify, and inspect Noorjahan ZIP files
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download, verify, list, and extract official ZIP assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $targets = @(
            [pscustomobject]@{
              Name = 'Noorjahan-Setup.zip'
              Url = 'https://github.com/chiefhamim/noorjahan-qbittorrent/releases/download/v1.3.1/Noorjahan-Setup.zip'
              ExpectedSha256 = '85f8efece44f4804c2eab19bdaf5ac2943cbc6831757198b5025541fa5d77ae4'
            },
            [pscustomobject]@{
              Name = 'Noorjahan-WebUI.zip'
              Url = 'https://github.com/chiefhamim/noorjahan-qbittorrent/releases/download/v1.3.1/Noorjahan-WebUI.zip'
              ExpectedSha256 = '8c5e3ce81f2a2c2530ac4c4e897757c0898de720e8c52db678b390bb25286d4a'
            }
          )
          $root = Join-Path $env:RUNNER_TEMP 'noorjahan-archive-inspection'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $allEntries = [System.Collections.Generic.List[object]]::new()
          $allFiles = [System.Collections.Generic.List[object]]::new()
          $results = [System.Collections.Generic.List[object]]::new()
          $summary = [System.Collections.Generic.List[string]]::new()
          $summary.Add('# Noorjahan v1.3.1 ZIP inspection')
          $summary.Add('')
          $summary.Add('Downloads, verifies, lists, and extracts official ZIP archives only. It does not execute installers, scripts, or qBittorrent.')
          $summary.Add('')
          foreach ($target in $targets) {
            Write-Host "=== $($target.Name) ==="
            $zipPath = Join-Path $root $target.Name
            $extractPath = Join-Path $root ([IO.Path]::GetFileNameWithoutExtension($target.Name))
            New-Item -ItemType Directory -Path $extractPath -Force | Out-Null
            Invoke-WebRequest -Uri $target.Url -OutFile $zipPath -MaximumRedirection 10 -TimeoutSec 600
            $actualHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $target.ExpectedSha256) {
              throw "$($target.Name) SHA-256 mismatch. Expected $($target.ExpectedSha256); got $actualHash."
            }
            Write-Host "SHA-256 verified: $actualHash"
            $archive = [IO.Compression.ZipFile]::OpenRead($zipPath)
            try {
              $entries = @($archive.Entries | ForEach-Object {
                [pscustomobject]@{
                  Archive = $target.Name
                  Path = $_.FullName
                  Length = $_.Length
                  CompressedLength = $_.CompressedLength
                  IsDirectory = [string]::IsNullOrEmpty($_.Name)
                }
              })
            } finally { $archive.Dispose() }
            foreach ($entry in $entries) { $allEntries.Add($entry) }
            $entries | Export-Csv -LiteralPath (Join-Path $root "$($target.Name).entries.csv") -NoTypeInformation -Encoding utf8
            Expand-Archive -LiteralPath $zipPath -DestinationPath $extractPath -Force
            $files = @(Get-ChildItem -LiteralPath $extractPath -File -Recurse -Force)
            foreach ($file in $files) {
              $relative = [IO.Path]::GetRelativePath($extractPath, $file.FullName).Replace([char]92, [char]47)
              $item = [pscustomobject]@{
                Archive = $target.Name
                Path = $relative
                SizeBytes = $file.Length
                SHA256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
              $allFiles.Add($item)
              Write-Host ("{0} | {1} bytes" -f $relative, $file.Length)
            }
            $results.Add([pscustomobject]@{
              Archive = $target.Name
              DownloadSha256 = $actualHash
              HashMatches = $true
              ZipEntryCount = $entries.Count
              ExtractedFileCount = $files.Count
              ExtractDirectory = $extractPath
            })
            $summary.Add("## $($target.Name)")
            $summary.Add("- SHA-256: PASS ($actualHash)")
            $summary.Add("- ZIP entries: $($entries.Count)")
            $summary.Add("- Extracted files: $($files.Count)")
            $summary.Add('')
            foreach ($entry in $entries) {
              $summary.Add("- $($entry.Path) — $($entry.Length) bytes")
            }
            $summary.Add('')
          }
          $setupFiles = @($allFiles | Where-Object { $_.Archive -eq 'Noorjahan-Setup.zip' })
          $setupBasenames = @($setupFiles | ForEach-Object { [IO.Path]::GetFileName($_.Path) })
          $expectedSetupFiles = @(
            'install.ps1',
            'Install Noorjahan.cmd',
            'Inter.ttf',
            'Inter-Italic.ttf',
            'Noorjahan Light.qbtheme',
            'Noorjahan Dark.qbtheme',
            'Noorjahan Light Compact.qbtheme',
            'Noorjahan Dark Compact.qbtheme'
          )
          $summary.Add('## Setup ZIP payload checks')
          foreach ($name in $expectedSetupFiles) {
            $found = $setupBasenames -contains $name
            $status = if ($found) { 'FOUND' } else { 'NOT FOUND' }
            $summary.Add("- $($name): **$status**")
            Write-Host "$($name): $status"
          }
          $summary.Add('')
          $webuiFiles = @($allFiles | Where-Object { $_.Archive -eq 'Noorjahan-WebUI.zip' })
          $hasPublic = @($webuiFiles | Where-Object { $_.Path -match '(^|/)public/' }).Count -gt 0
          $hasPrivate = @($webuiFiles | Where-Object { $_.Path -match '(^|/)private/' }).Count -gt 0
          $summary.Add('## Web UI ZIP checks')
          $summary.Add("- Contains public/: $hasPublic")
          $summary.Add("- Contains private/: $hasPrivate")
          $summary.Add('')
          $allEntries | Export-Csv -LiteralPath (Join-Path $root 'all-zip-entries.csv') -NoTypeInformation -Encoding utf8
          $allFiles | Export-Csv -LiteralPath (Join-Path $root 'all-extracted-files.csv') -NoTypeInformation -Encoding utf8
          $results | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $root 'inspection-report.json') -Encoding utf8
          $summary | Set-Content -LiteralPath (Join-Path $root 'inspection-summary.md') -Encoding utf8
          $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          $missing = @($expectedSetupFiles | Where-Object { $setupBasenames -notcontains $_ })
          if ($missing.Count -gt 0) {
            throw "Setup ZIP is missing expected payload files: $($missing -join ', ')"
          }
          Write-Host 'Both ZIP files passed checksum verification and expected Setup ZIP payload files were found.'

      - name: Upload inspection report and extracted file inventories
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: noorjahan-v1.3.1-zip-inspection
          path: ${{ runner.temp }}/noorjahan-archive-inspection/
          if-no-files-found: warn
          retention-days: 14
