name: Inspect AivoRelay and Oriel packages

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
    paths:
      - "bucket/aivorelay.json"
      - "bucket/oriel-notch.json"
      - ".github/workflows/aivorelay-oriel-package-inspection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Verify and inspect official Windows packages
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Locate 7-Zip
        id: sevenzip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
            $command = Get-Command '7z.exe' -ErrorAction SilentlyContinue
            if ($command) { $sevenZip = $command.Source }
          }
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
            throw '7-Zip is not available on the Windows runner.'
          }
          "path=$sevenZip" >> $env:GITHUB_OUTPUT
          Write-Host "7-Zip: $sevenZip"

      - name: Verify and extract AivoRelay portable archive
        shell: pwsh
        env:
          SEVEN_ZIP: ${{ steps.sevenzip.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'bucket/aivorelay.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json -ErrorAction Stop
          $version = [string]$manifest.version
          $url = [string]$manifest.url
          $expectedHash = [string]$manifest.hash
          $extractDir = [string]$manifest.extract_dir
          if ($version -ne '1.0.55') { throw "Unexpected AivoRelay version: $version" }
          if ($url -notmatch '/aivorelay_[0-9.]+_x64_portable[.]zip$') {
            throw "Unexpected AivoRelay portable URL: $url"
          }
          if ($expectedHash -notmatch '^[0-9a-fA-F]{64}$') { throw 'AivoRelay hash is not SHA-256.' }
          if ($extractDir -ne "AivoRelay_$($version)_x64_portable") {
            throw "Unexpected extract_dir: $extractDir"
          }

          $root = Join-Path $env:RUNNER_TEMP 'aivorelay-portable-inspection'
          $archive = Join-Path $root ([System.IO.Path]::GetFileName(([uri]$url).AbsolutePath))
          $extract = Join-Path $root 'extracted'
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRedirection 10 -TimeoutSec 900
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash.ToLowerInvariant()) {
            throw "AivoRelay SHA-256 mismatch. Expected $expectedHash; received $actualHash."
          }
          $output = @(& $env:SEVEN_ZIP x $archive "-o$extract" -y -bd 2>&1 | ForEach-Object { "$_" })
          $exitCode = $LASTEXITCODE
          $output | Set-Content -LiteralPath (Join-Path $root '7zip-extraction.log') -Encoding utf8
          if ($exitCode -ne 0) { throw "7-Zip extraction failed with exit code $exitCode." }

          $appDirectory = Join-Path $extract $extractDir
          $appExe = Join-Path $appDirectory 'AivoRelay.exe'
          if (-not (Test-Path -LiteralPath $appExe -PathType Leaf)) {
            $allExecutables = @(Get-ChildItem -LiteralPath $extract -Filter '*.exe' -File -Recurse -Force |
              ForEach-Object { [System.IO.Path]::GetRelativePath($extract, $_.FullName) })
            throw "Manifest target not found: $extractDir/AivoRelay.exe. Found EXEs: $($allExecutables -join '; ')"
          }
          $fileInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($appExe)
          $report = @(
            "AivoRelay $version portable ZIP inspection",
            "SHA-256 verified: $actualHash",
            "Archive size: $((Get-Item -LiteralPath $archive).Length) bytes",
            "Extract directory: $extractDir",
            "Executable: $extractDir/AivoRelay.exe",
            "Product: $($fileInfo.ProductName)",
            "File description: $($fileInfo.FileDescription)",
            "Executable size: $((Get-Item -LiteralPath $appExe).Length) bytes",
            'Result: PASS — ZIP extracted and the manifest executable path exists.',
            'No application executable was run.'
          )
          $report | Set-Content -LiteralPath (Join-Path $root 'inspection-report.txt') -Encoding utf8
          $report | ForEach-Object { Write-Host $_ }
          $report | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Identify and attempt to extract Oriel Setup
        shell: pwsh
        env:
          SEVEN_ZIP: ${{ steps.sevenzip.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $version = '1.1.1'
          $url = "https://github.com/Niix-x/Oriel-Releases/releases/download/v$version/OrielSetup-$version.exe"
          $expectedHash = '808ec378fcc90c8ae90ace3628596d8819ae728796a1229ff0cf5505ceb8d954'
          $root = Join-Path $env:RUNNER_TEMP 'oriel-package-inspection'
          $setup = Join-Path $root "OrielSetup-$version.exe"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $setup -MaximumRedirection 10 -TimeoutSec 600
          $actualHash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Oriel Setup SHA-256 mismatch. Expected $expectedHash; received $actualHash."
          }

          $dieUrl = 'https://github.com/horsicq/DIE-engine/releases/download/4.0.0/die_win64_4.0.0.zip'
          $dieHash = '522a649e795123ab89bb7962ff8fc9b5615ce253a08175467318aa06761c0f8'
          $dieZip = Join-Path $root 'die_win64_4.0.0.zip'
          $dieRoot = Join-Path $root 'die'
          Invoke-WebRequest -Uri $dieUrl -OutFile $dieZip -MaximumRedirection 10 -TimeoutSec 600
          $dieActualHash = (Get-FileHash -LiteralPath $dieZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($dieActualHash -ne $dieHash) { throw "Detect It Easy checksum mismatch: $dieActualHash" }
          Expand-Archive -LiteralPath $dieZip -DestinationPath $dieRoot -Force
          $diec = Get-ChildItem -LiteralPath $dieRoot -Filter 'diec.exe' -File -Recurse | Select-Object -First 1
          if (-not $diec) { throw 'diec.exe was not found in the verified Detect It Easy archive.' }

          $scan = @(& $diec.FullName -d -u -b -a $setup 2>&1 | ForEach-Object { "$_" })
          $scanExitCode = $LASTEXITCODE
          if ($scan.Count -eq 0 -or $scanExitCode -ne 0) {
            throw "Detect It Easy scan failed with exit code $scanExitCode."
          }
          $scan | Set-Content -LiteralPath (Join-Path $root 'detect-it-easy.txt') -Encoding utf8
          $scanText = $scan -join [Environment]::NewLine
          $engine = if ($scanText -match '(?i)Inno Setup') {
            'Inno Setup'
          } elseif ($scanText -match '(?i)Nullsoft|NSIS') {
            'NSIS'
          } elseif ($scanText -match '(?i)WiX|WixBundle') {
            'WiX Burn'
          } else {
            'Other/undetermined — review Detect It Easy report'
          }

          $extract = Join-Path $root 'extracted'
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          $method = '7-Zip'
          $extractExitCode = -1
          if ($engine -eq 'Inno Setup') {
            $helperUrl = 'https://raw.githubusercontent.com/jrathlev/InnoUnpacker-Windows-GUI/032d64c782efc6b36766d8f9c3b1b2f042144a58/innounp-2/bin/innounp-2.zip'
            $helperHash = '10fce27b6344b7674d5625cc34afca1c88c12183d957c6d93e401097fa2556cd'
            $helperZip = Join-Path $root 'innounp-2.zip'
            $helperRoot = Join-Path $root 'innounp-helper'
            Invoke-WebRequest -Uri $helperUrl -OutFile $helperZip -MaximumRedirection 5 -TimeoutSec 300
            $helperActualHash = (Get-FileHash -LiteralPath $helperZip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($helperActualHash -ne $helperHash) { throw "innounp helper checksum mismatch: $helperActualHash" }
            Expand-Archive -LiteralPath $helperZip -DestinationPath $helperRoot -Force
            $innounp = Get-ChildItem -LiteralPath $helperRoot -Filter 'innounp.exe' -File -Recurse | Select-Object -First 1
            if (-not $innounp) { throw 'Verified helper ZIP does not contain innounp.exe.' }
            $method = 'innounp (Inno Setup)'
            $extractOutput = @(& $innounp.FullName '-x' "-d$extract" $setup '-y' '-c{app}' 2>&1 | ForEach-Object { "$_" })
            $extractExitCode = $LASTEXITCODE
          } else {
            $listing = @(& $env:SEVEN_ZIP l -slt $setup 2>&1 | ForEach-Object { "$_" })
            $listExitCode = $LASTEXITCODE
            $listing | Set-Content -LiteralPath (Join-Path $root '7zip-listing.txt') -Encoding utf8
            $extractOutput = @(& $env:SEVEN_ZIP x $setup "-o$extract" -y -bd 2>&1 | ForEach-Object { "$_" })
            $extractExitCode = $LASTEXITCODE
          }
          $extractOutput | Set-Content -LiteralPath (Join-Path $root 'extraction.log') -Encoding utf8
          $payloadFiles = @(Get-ChildItem -LiteralPath $extract -File -Recurse -Force)
          $executables = @($payloadFiles | Where-Object { $_.Extension -ieq '.exe' } | ForEach-Object {
            [PSCustomObject]@{
              Path = [System.IO.Path]::GetRelativePath($extract, $_.FullName).Replace([char]92, [char]47)
              Size = $_.Length
              Product = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($_.FullName).ProductName
              Description = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($_.FullName).FileDescription
            }
          })
          $report = @(
            "Oriel $version installer inspection",
            "Setup SHA-256 verified: $actualHash",
            "Installer family: $engine",
            "Extraction method: $method",
            "Extraction exit code: $extractExitCode",
            "Extracted files: $($payloadFiles.Count)",
            '',
            'Detect It Easy result:',
            $scan,
            '',
            'Extracted executables:',
            ($executables | Format-Table -AutoSize | Out-String),
            '',
            'The setup and extracted application executables were not run.'
          )
          $report | Set-Content -LiteralPath (Join-Path $root 'inspection-report.txt') -Encoding utf8
          $report | ForEach-Object { Write-Host $_ }
          $report | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload inspection reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aivorelay-oriel-package-inspection
          path: |
            ${{ runner.temp }}/aivorelay-portable-inspection/
            ${{ runner.temp }}/oriel-package-inspection/
          if-no-files-found: warn
          retention-days: 14
