name: Inspect MuMuPlayer NXMAIN Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Download and verify exact NXMAIN installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $url = "https://github.com/LOVECHEN/mumu-release/releases/download/win-global-offline-6.8.5/MuMu-setup-nxmain-V1.8.5.5748-overseas-1013104356.exe"
          $expected = "dd5be7411c9a3ccf78ddaaaea89b295260ceb527713ae66b82d2a82f730919c9"
          $installer = Join-Path $env:RUNNER_TEMP "MuMu-setup-nxmain-V1.8.5.5748-overseas-1013104356.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "Installer path: $installer"
          Write-Output "File size: $((Get-Item -LiteralPath $installer).Length) bytes"
          Write-Output "SHA256: $actual"
          if ($actual -ne $expected) { throw "SHA256 mismatch. Expected $expected, got $actual" }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          Write-Output "Authenticode status: $($signature.Status)"
          Write-Output "Signer: $($signature.SignerCertificate.Subject)"
          $versionInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($installer)
          Write-Output "Product: $($versionInfo.ProductName)"
          Write-Output "File description: $($versionInfo.FileDescription)"
          Write-Output "File version: $($versionInfo.FileVersion)"
          @(
            "## MuMuPlayer NXMAIN installer metadata"
            ""
            "- **Size:** $((Get-Item -LiteralPath $installer).Length) bytes"
            "- **SHA-256:** $actual"
            "- **Authenticode:** $($signature.Status)"
            "- **Signer:** $($signature.SignerCertificate.Subject)"
            "- **Product name:** $($versionInfo.ProductName)"
            "- **Description:** $($versionInfo.FileDescription)"
            "- **File version:** $($versionInfo.FileVersion)"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Identify packer and installer framework with Detect It Easy
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "MuMu-setup-nxmain-V1.8.5.5748-overseas-1013104356.exe"
          $apiUrl = "https://api.github.com/repos/horsicq/DIE-engine/releases/latest"
          $headers = @{
            Accept = "application/vnd.github+json"
            "User-Agent" = "kirobucket-installer-inspection"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_TOKEN)) {
            $headers.Authorization = "Bearer $env:GITHUB_TOKEN"
          }

          $release = $null
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            try {
              $release = Invoke-RestMethod -Uri $apiUrl -Headers $headers -TimeoutSec 45 -ErrorAction Stop
              break
            } catch {
              $statusCode = $null
              if ($_.Exception.Response -and $_.Exception.Response.StatusCode) {
                $statusCode = [int]$_.Exception.Response.StatusCode
              }
              Write-Warning "Detect It Easy release API attempt $attempt failed (HTTP $statusCode): $($_.Exception.Message)"
              if ($attempt -eq 4) { throw }
              Start-Sleep -Seconds ([Math]::Min(2 * $attempt, 8))
            }
          }
          if (-not $release) { throw "GitHub did not return the latest Detect It Easy release." }

          $asset = $release.assets |
            Where-Object { $_.name -match '^die_win64_portable_[\d.]+_x64\.zip$' } |
            Select-Object -First 1
          if (-not $asset) { throw "Could not find the Windows x64 portable Detect It Easy asset in release $($release.tag_name)." }

          $zip = Join-Path $env:RUNNER_TEMP $asset.name
          $toolDir = Join-Path $env:RUNNER_TEMP "detect-it-easy"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip -MaximumRedirection 10 -TimeoutSec 240 -ErrorAction Stop
          $archive = Get-Item -LiteralPath $zip
          if ($archive.Length -lt 100000) { throw "Detect It Easy archive is unexpectedly small ($($archive.Length) bytes)." }

          $stream = [System.IO.File]::OpenRead($zip)
          try {
            $signature = [byte[]]::new(2)
            $bytesRead = $stream.Read($signature, 0, 2)
          } finally {
            $stream.Dispose()
          }
          if ($bytesRead -ne 2 -or $signature[0] -ne 0x50 -or $signature[1] -ne 0x4B) {
            throw "The Detect It Easy download does not have a ZIP header."
          }

          if ($asset.digest -match '^sha256:(?<expected>[0-9a-fA-F]{64})$') {
            $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
            if ($actual -ine $Matches.expected) {
              throw "Detect It Easy archive SHA-256 mismatch. Expected $($Matches.expected), got $actual."
            }
            Write-Output "Detect It Easy archive SHA-256 verified: $actual"
          }

          Expand-Archive -LiteralPath $zip -DestinationPath $toolDir -Force
          $diec = Get-ChildItem -LiteralPath $toolDir -Filter "diec.exe" -Recurse | Select-Object -First 1
          if (-not $diec) { throw "diec.exe was not found in the portable archive." }
          Write-Output "Detect It Easy release: $($release.tag_name)"
          Write-Output "Running static scan against the verified MuMuPlayer installer (the installer will not be executed)."
          $scanOutput = @(& $diec.FullName $installer 2>&1 | ForEach-Object { "$_" })
          $scanOutput | ForEach-Object { Write-Output $_ }
          if ($scanOutput.Count -eq 0) { throw "Detect It Easy returned no output." }
          @(
            ""
            "## Detect It Easy static identification"
            ""
            "- Detect It Easy release: $($release.tag_name)"
            ""
            $scanOutput
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
