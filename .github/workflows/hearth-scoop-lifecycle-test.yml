name: Hearth Scoop Lifecycle Test

on:
  push:
    branches:
      - add-hearth-scoop-manifest-2026-11-23
    paths:
      - "bucket/hearth.json"
      - ".github/workflows/hearth-scoop-lifecycle-test.yml"
  pull_request:
    branches:
      - master
    paths:
      - "bucket/hearth.json"
      - ".github/workflows/hearth-scoop-lifecycle-test.yml"

permissions:
  contents: read

jobs:
  lifecycle:
    name: Install, persist, update, and uninstall Hearth
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Scoop in an isolated directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $env:SCOOP = Join-Path $env:RUNNER_TEMP 'scoop-hearth-test'
          "SCOOP=$env:SCOOP" >> $env:GITHUB_ENV
          (Join-Path $env:SCOOP 'shims') >> $env:GITHUB_PATH
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri 'https://get.scoop.sh' | Invoke-Expression
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            throw 'Scoop bootstrap failed.'
          }
          scoop --version

      - name: Register a local bucket containing the candidate manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $localBucket = Join-Path $env:RUNNER_TEMP 'hearth-local-bucket'
          $manifestDir = Join-Path $localBucket 'bucket'
          New-Item -ItemType Directory -Path $manifestDir -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'bucket\hearth.json') -Destination $manifestDir

          Push-Location $localBucket
          try {
            git init --initial-branch=master
            if ($LASTEXITCODE -ne 0) { throw 'Could not initialize the local test bucket.' }
            git config user.name 'GitHub Actions'
            git config user.email 'actions@github.com'
            git add bucket
            git commit -m 'Seed Hearth test manifest'
            if ($LASTEXITCODE -ne 0) { throw 'Could not commit the test manifest.' }
          }
          finally {
            Pop-Location
          }

          $bucketUrl = 'file:///' + $localBucket.Replace('\', '/')
          scoop bucket add hearth-test $bucketUrl
          if ($LASTEXITCODE -ne 0) { throw 'Could not register the local test bucket.' }

      - name: Validate manifest version and autoupdate templates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checkver = Join-Path $env:SCOOP 'apps\scoop\current\bin\checkver.ps1'
          $manifestDir = Join-Path $env:RUNNER_TEMP 'hearth-local-bucket\bucket'
          if (-not (Test-Path -LiteralPath $checkver -PathType Leaf)) {
            throw "Scoop checkver.ps1 was not found: $checkver"
          }
          & $checkver hearth $manifestDir -ForceUpdate -ThrowError
          Write-Host 'PASS: Scoop checkver and forced autoupdate validation.'

      - name: Install Hearth with Scoop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          scoop install hearth
          if ($LASTEXITCODE -ne 0) {
            throw "Scoop install failed for Hearth (exit code $LASTEXITCODE)."
          }

      - name: Verify the portable payload and persisted data link
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Join-Path $env:SCOOP 'apps\hearth\current'
          $exe = Join-Path $app 'Hearth.exe'
          $portableMarker = Join-Path $app 'portable.dat'
          $appData = Join-Path $app 'data'
          $persistData = Join-Path $env:SCOOP 'persist\hearth\data'

          foreach ($path in @($exe, $portableMarker)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required portable file is missing: $path"
            }
          }
          if (-not (Test-Path -LiteralPath $appData -PathType Container)) {
            throw "Scoop did not create the app data link: $appData"
          }
          if (-not (Test-Path -LiteralPath $persistData -PathType Container)) {
            throw "Scoop did not create the persisted data directory: $persistData"
          }

          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Scoop Apps\Hearth.lnk'
          if (-not (Test-Path -LiteralPath $shortcut -PathType Leaf)) {
            throw "Scoop Start Menu shortcut is missing: $shortcut"
          }

          $marker = Join-Path $persistData 'kirobucket-persist-test.txt'
          Set-Content -LiteralPath $marker -Value 'hearth-persist-ok' -Encoding utf8
          if ((Get-Content -LiteralPath (Join-Path $appData 'kirobucket-persist-test.txt') -Raw).Trim() -ne 'hearth-persist-ok') {
            throw 'The application data link cannot access the persisted marker.'
          }
          Write-Host 'PASS: Portable files, Start Menu shortcut, and persisted data link.'

      - name: Uninstall Hearth and verify data is retained
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          scoop uninstall hearth
          if ($LASTEXITCODE -ne 0) {
            throw "Scoop uninstall failed for Hearth (exit code $LASTEXITCODE)."
          }

          $app = Join-Path $env:SCOOP 'apps\hearth\current'
          $persistData = Join-Path $env:SCOOP 'persist\hearth\data'
          $marker = Join-Path $persistData 'kirobucket-persist-test.txt'
          if (Test-Path -LiteralPath $app) {
            throw "Hearth app directory remains after uninstall: $app"
          }
          if (-not (Test-Path -LiteralPath $marker -PathType Leaf)) {
            throw 'Hearth persisted data was removed during uninstall.'
          }
          Write-Host 'PASS: Uninstall removed the app while retaining persisted data.'

      - name: Reinstall Hearth and verify persisted data is reconnected
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          scoop install hearth
          if ($LASTEXITCODE -ne 0) {
            throw "Scoop reinstall failed for Hearth (exit code $LASTEXITCODE)."
          }

          $app = Join-Path $env:SCOOP 'apps\hearth\current'
          $marker = Join-Path $app 'data\kirobucket-persist-test.txt'
          if (-not (Test-Path -LiteralPath (Join-Path $app 'Hearth.exe') -PathType Leaf)) {
            throw 'Hearth.exe is missing after reinstall.'
          }
          if (-not (Test-Path -LiteralPath $marker -PathType Leaf)) {
            throw 'The persisted data marker was not reconnected after reinstall.'
          }
          Write-Host 'PASS: Reinstall restored the app and reconnected existing user data.'

      - name: Final uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          scoop uninstall hearth
          if ($LASTEXITCODE -ne 0) {
            throw "Final Scoop uninstall failed (exit code $LASTEXITCODE)."
          }
          $persistData = Join-Path $env:SCOOP 'persist\hearth\data'
          if (-not (Test-Path -LiteralPath (Join-Path $persistData 'kirobucket-persist-test.txt') -PathType Leaf)) {
            throw 'Persisted data was not retained after the final uninstall.'
          }
          Write-Host 'PASS: Final uninstall retained Hearth user data.'
