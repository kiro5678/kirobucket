name: Temporary Vovsoft shortcut repair

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/apply-vovsoft-shortcuts.yml'

permissions:
  contents: write

jobs:
  repair:
    name: Add verified Vovsoft Start Menu shortcuts
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply paths verified from the archive inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exeMapJson = @'
