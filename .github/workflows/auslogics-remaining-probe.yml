name: Auslogics Remaining Products Probe

on:
  pull_request:
    paths:
      - ".github/workflows/auslogics-remaining-probe.yml"

permissions:
  contents: read

jobs:
  extract:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Extract verified installers without running them
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'auslogics-remaining-probe'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $report = Join-Path $env:GITHUB_WORKSPACE 'auslogics-remaining-report.md'
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add('# Auslogics remaining-products extraction report')
          $lines.Add('')
          $lines.Add('No application installer was executed. Each package was downloaded, SHA-256 hashed, Authenticode-checked, and unpacked to an isolated temporary directory with Inno Unpacker.')
          $lines.Add('')

          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip)) { $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source }
          $innounpZip = Join-Path $root 'innounp-2.zip'
          $innounpRoot = Join-Path $root 'innounp-helper'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/jrathlev/InnoUnpacker-Windows-GUI/032d64c782efc6b36766d8f9c3b1b2f042144a58/innounp-2/bin/innounp-2.zip' -OutFile $innounpZip -MaximumRedirection 10 -TimeoutSec 120
          $innounpHash = (Get-FileHash -LiteralPath $innounpZip -Algorithm SHA256).Hash
          if ($innounpHash -ine '10fce27b6344b7674d5625cc34afca1c88c12183d957c6d93e401097fa2556cd') { throw "innounp helper SHA-256 mismatch: $innounpHash" }
          New-Item -ItemType Directory -Force -Path $innounpRoot | Out-Null
          & $sevenZip x $innounpZip "-o$innounpRoot" '-y' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract innounp helper.' }
          $innounp = Get-ChildItem -LiteralPath $innounpRoot -Filter innounp.exe -File -Recurse | Select-Object -First 1
          if (-not $innounp) { throw 'innounp.exe was not found in the verified helper archive.' }

          $apps = @(
            [pscustomobject]@{ Name='BoostSpeed'; Slug='boost-speed'; File='auslogics-boost-speed-setup.exe'; Page='https://www.auslogics.com/en/software/boost-speed/'; Url='https://downloads.auslogics.com/en/boost-speed/auslogics-boost-speed-setup.exe' },
            [pscustomobject]@{ Name='Driver Updater'; Slug='driver-updater'; File='auslogics-driver-updater-setup.exe'; Page='https://www.auslogics.com/en/software/driver-updater/'; Url='https://downloads.auslogics.com/en/driver-updater/auslogics-driver-updater-setup.exe' },
            [pscustomobject]@{ Name='ChillMate'; Slug='chillmate'; File='auslogics-chillmate-setup.exe'; Page='https://www.auslogics.com/en/software/chillmate/'; Url='https://downloads.auslogics.com/en/chillmate/auslogics-chillmate-setup.exe' },
            [pscustomobject]@{ Name='Duplicate File Finder'; Slug='duplicate-file-finder'; File='auslogics-duplicate-file-finder-setup.exe'; Page='https://www.auslogics.com/en/software/duplicate-file-finder/'; Url='https://downloads.auslogics.com/en/duplicate-file-finder/auslogics-duplicate-file-finder-setup.exe' },
            [pscustomobject]@{ Name='Disk Defrag Ultimate'; Slug='disk-defrag-ultimate'; File='auslogics-disk-defrag-ultimate-setup.exe'; Page='https://www.auslogics.com/en/software/disk-defrag-ultimate/'; Url='https://downloads.auslogics.com/en/disk-defrag-ultimate/auslogics-disk-defrag-ultimate-setup.exe' },
            [pscustomobject]@{ Name='Anti-Malware'; Slug='anti-malware'; File='auslogics-anti-malware-setup.exe'; Page='https://www.auslogics.com/en/software/anti-malware/'; Url='https://downloads.auslogics.com/en/anti-malware/auslogics-anti-malware-setup.exe' },
            [pscustomobject]@{ Name='File Recovery'; Slug='file-recovery'; File='auslogics-file-recovery-setup.exe'; Page='https://www.auslogics.com/en/software/file-recovery/'; Url='https://downloads.auslogics.com/en/file-recovery/auslogics-file-recovery-setup.exe' },
            [pscustomobject]@{ Name='Video Grabber'; Slug='video-grabber'; File='auslogics-video-grabber-setup.exe'; Page='https://www.auslogics.com/en/software/video-grabber/'; Url='https://downloads.auslogics.com/en/video-grabber/auslogics-video-grabber-setup.exe' },
            [pscustomobject]@{ Name='Windows Slimmer'; Slug='windows-slimmer'; File='auslogics-windows-slimmer-setup.exe'; Page='https://www.auslogics.com/en/software/windows-slimmer/'; Url='https://downloads.auslogics.com/en/windows-slimmer/auslogics-windows-slimmer-setup.exe' },
            [pscustomobject]@{ Name='System Information'; Slug='system-information'; File='auslogics-system-information-setup.exe'; Page='https://www.auslogics.com/en/software/system-information/'; Url='https://downloads.auslogics.com/en/system-information/auslogics-system-information-setup.exe' },
            [pscustomobject]@{ Name='Registry Defrag'; Slug='registry-defrag'; File='auslogics-registry-defrag-setup.exe'; Page='https://www.auslogics.com/en/software/registry-defrag/'; Url='https://downloads.auslogics.com/en/registry-defrag/auslogics-registry-defrag-setup.exe' },
            [pscustomobject]@{ Name='BitReplica'; Slug='bitreplica'; File='auslogics-bitreplica-setup.exe'; Page='https://www.bitreplica.com/'; Url='https://www.bitreplica.com/download/auslogics-bitreplica-setup.exe' }
          )

          foreach ($app in $apps) {
            $lines.Add("## $($app.Name)")
            $lines.Add("- Official product page: $($app.Page)")
            $lines.Add("- Installer URL: $($app.Url)")
            $installer = Join-Path $root $app.File
            try {
              Invoke-WebRequest -Uri $app.Url -OutFile $installer -MaximumRedirection 10 -TimeoutSec 180
              $fileInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($installer)
              $signature = Get-AuthenticodeSignature -LiteralPath $installer
              $sha = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
              $lines.Add("- Download: success")
              $lines.Add("- Installer size: $((Get-Item -LiteralPath $installer).Length) bytes")
              $lines.Add("- Installer SHA-256: $sha")
              $lines.Add("- Installer product: $($fileInfo.ProductName)")
              $lines.Add("- Installer file version: $($fileInfo.ProductVersion)")
              $lines.Add("- Authenticode status: $($signature.Status)")
              $lines.Add("- Signer: $($signature.SignerCertificate.Subject)")
              if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(?i)Auslogics') {
                $lines.Add('- Extraction skipped because the Authenticode signer was not valid and Auslogics-signed.')
              } else {
                $dest = Join-Path $root ($app.Slug + '-payload')
                New-Item -ItemType Directory -Force -Path $dest | Out-Null
                $output = & $innounp.FullName '-x' "-d$dest" $installer '-y' '-c{app}' 2>&1
                $exitCode = $LASTEXITCODE
                $lines.Add("- Inno extraction exit code: $exitCode")
                if ($exitCode -eq 0) {
                  $files = @(Get-ChildItem -LiteralPath $dest -File -Recurse)
                  $lines.Add("- Extracted app files: $($files.Count)")
                  foreach ($exe in @($files | Where-Object Extension -eq '.exe' | Sort-Object FullName)) {
                    $vi = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe.FullName)
                    $relative = $exe.FullName.Substring($dest.Length).TrimStart('\','/')
                    $lines.Add("- EXE: $relative | $($exe.Length) bytes | Product=$($vi.ProductName) | Description=$($vi.FileDescription) | Original=$($vi.OriginalFilename) | Version=$($vi.ProductVersion)")
                  }
                  if (@($files | Where-Object Extension -eq '.exe').Count -eq 0) { $lines.Add('- No EXE files were found in the extracted app payload.') }
                } else {
                  $lines.Add('- Inno extraction failed; final output lines:')
                  foreach ($line in @($output | Select-Object -Last 8)) { $lines.Add("- $line") }
                }
              }
            } catch {
              $lines.Add("- ERROR: $($_.Exception.Message)")
            }
            $lines.Add('')
          }

          Set-Content -LiteralPath $report -Value $lines -Encoding utf8
          Get-Content -LiteralPath $report

      - name: Upload report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: auslogics-remaining-report
          path: auslogics-remaining-report.md
          if-no-files-found: warn
          retention-days: 3
