name: Requested Apps Round 2 Inspection

on:
  push:
    branches:
      - manifest-round2-inspection-2026-11-22
    paths:
      - ".github/workflows/requested-apps-round2-inspection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Inspect Agent Theater official tag archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $root = Join-Path $env:RUNNER_TEMP 'round2-inspection\agent-theater'
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          $url = 'https://github.com/tarqmamdouh/agent-theater/archive/refs/tags/v0.3.0.zip'
          $archive = Join-Path $root 'agent-theater-v0.3.0.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive -TimeoutSec 900
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Agent Theater source archive SHA256: $hash"

          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) { $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source }
          & $sevenZip t $archive
          if ($LASTEXITCODE -ne 0) { throw 'Agent Theater source archive integrity test failed.' }
          $extract = Join-Path $root 'extracted'
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          & $sevenZip x -y "-o$extract" $archive
          if ($LASTEXITCODE -ne 0) { throw 'Agent Theater source archive extraction failed.' }
          $packageFiles = @(Get-ChildItem -LiteralPath $extract -File -Recurse -Force)
          $pkg = @(Get-ChildItem -LiteralPath $extract -File -Recurse -Filter 'package.json' | Where-Object { $_.Directory.Name -eq 'agent-theater-0.3.0' })
          if ($pkg.Count -ne 1) { throw "Expected one Agent Theater package.json in the tagged source archive; found $($pkg.Count)." }
          $package = Get-Content -LiteralPath $pkg[0].FullName -Raw | ConvertFrom-Json
          $cli = Join-Path $pkg[0].DirectoryName 'cli\agent-theater.mjs'
          $license = Join-Path $pkg[0].DirectoryName 'LICENSE.md'
          if ($package.version -ne '0.3.0') { throw "Agent Theater tag/package version mismatch: $($package.version)." }
          if (-not (Test-Path -LiteralPath $cli -PathType Leaf)) { throw 'Agent Theater CLI entrypoint missing.' }
          if (-not (Test-Path -LiteralPath $license -PathType Leaf)) { throw 'Agent Theater LICENSE.md missing.' }
          if ($package.dependencies -and $package.dependencies.PSObject.Properties.Count -gt 0) {
            throw 'Agent Theater has runtime dependencies; a source archive-only manifest would be incomplete.'
          }
          node --check $cli
          if ($LASTEXITCODE -ne 0) { throw 'Agent Theater CLI syntax check failed.' }
          Write-Host "Agent Theater version: $($package.version)"
          Write-Host "Agent Theater Node requirement: $($package.engines.node)"
          Write-Host "Agent Theater CLI: cli/agent-theater.mjs"
          Write-Host "Agent Theater extracted files: $($packageFiles.Count)"
          @(
            '## Agent Theater v0.3.0'
            "- SHA-256: $hash"
            "- Node requirement: $($package.engines.node)"
            "- CLI: cli/agent-theater.mjs"
            "- Dependencies: $(@($package.dependencies.PSObject.Properties).Count)"
            "- Files extracted: $($packageFiles.Count)"
            ''
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Inspect CopySpeech Windows MSI and setup EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $root = Join-Path $env:RUNNER_TEMP 'round2-inspection\copyspeech'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) { $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source }

          $targets = @(
            @{
              Name = 'MSI'
              File = 'CopySpeech_0.3.2_x64_en-US.msi'
              Url = 'https://github.com/ilyaizen/CopySpeech/releases/download/v0.3.2/CopySpeech_0.3.2_x64_en-US.msi'
              Sha256 = 'a6bc4e571867886cded2b50ab1b4fccda87910422501a8b4ed6afa1f806ad728'
            },
            @{
              Name = 'SetupEXE'
              File = 'CopySpeech_0.3.2_x64-setup.exe'
              Url = 'https://github.com/ilyaizen/CopySpeech/releases/download/v0.3.2/CopySpeech_0.3.2_x64-setup.exe'
              Sha256 = 'acd166709e4ed1b0e40072a350523e204aa44bca826dc3fcb73990fa43e325dc'
            }
          )

          foreach ($target in $targets) {
            $folder = Join-Path $root $target.Name
            New-Item -ItemType Directory -Path $folder -Force | Out-Null
            $download = Join-Path $folder $target.File
            Invoke-WebRequest -Uri $target.Url -OutFile $download -TimeoutSec 900
            $hash = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $target.Sha256) { throw "$($target.Name) SHA256 mismatch: $hash" }
            Write-Host "PASS: CopySpeech $($target.Name) SHA256 $hash"
            & $sevenZip l -slt $download
            if ($LASTEXITCODE -ne 0) { throw "7-Zip could not inspect CopySpeech $($target.Name)." }
            & $sevenZip t $download
            if ($LASTEXITCODE -ne 0) { throw "CopySpeech $($target.Name) archive integrity test failed." }
            $extract = Join-Path $folder 'extracted'
            New-Item -ItemType Directory -Path $extract -Force | Out-Null
            & $sevenZip x -y "-o$extract" $download
            if ($LASTEXITCODE -ne 0) { throw "CopySpeech $($target.Name) extraction failed." }

            $nested = @(Get-ChildItem -LiteralPath $extract -File -Recurse -Force | Where-Object { $_.Extension -ieq '.cab' -or $_.Name -ieq 'app-64.7z' })
            $nestedIndex = 0
            foreach ($archive in $nested) {
              $nestedOutput = Join-Path $folder "nested-$nestedIndex"
              New-Item -ItemType Directory -Path $nestedOutput -Force | Out-Null
              & $sevenZip t $archive.FullName
              if ($LASTEXITCODE -ne 0) { throw "CopySpeech nested archive test failed: $($archive.Name)" }
              & $sevenZip x -y "-o$nestedOutput" $archive.FullName
              if ($LASTEXITCODE -ne 0) { throw "CopySpeech nested archive extraction failed: $($archive.Name)" }
              $nestedIndex++
            }

            $files = @(Get-ChildItem -LiteralPath $folder -File -Recurse -Force | Where-Object { $_.FullName -notmatch '\\\\(extracted|nested-\\d+)\\\\' -or $_.DirectoryName -match '\\\\nested-\\d+(\\\\|$)' })
            $exe = @(Get-ChildItem -LiteralPath $folder -File -Recurse -Force | Where-Object { $_.Name -ieq 'CopySpeech.exe' })
            $summary = "CopySpeech $($target.Name): $($files.Count) extracted files; nested archives: $nestedIndex; CopySpeech.exe matches: $($exe.Count)"
            Write-Host $summary
            foreach ($item in $exe) {
              Write-Host ('CopySpeech executable path: ' + [IO.Path]::GetRelativePath($folder, $item.FullName))
            }
            if ($target.Name -eq 'MSI') {
              $adminRoot = Join-Path $folder 'admin-install'
              New-Item -ItemType Directory -Path $adminRoot -Force | Out-Null
              $argumentLine = '/a "' + $download + '" /qn TARGETDIR="' + $adminRoot + '"'
              $process = Start-Process -FilePath (Join-Path $env:SystemRoot 'System32\msiexec.exe') -ArgumentList $argumentLine -Wait -PassThru
              if ($process.ExitCode -notin @(0,3010)) {
                throw "CopySpeech administrative MSI extraction failed with exit code $($process.ExitCode)."
              }
              $adminFiles = @(Get-ChildItem -LiteralPath $adminRoot -File -Recurse -Force)
              $adminExe = @($adminFiles | Where-Object { $_.Name -ieq 'CopySpeech.exe' })
              Write-Host "CopySpeech MSI administrative extraction: $($adminFiles.Count) files; CopySpeech.exe matches: $($adminExe.Count)"
              foreach ($item in $adminExe) {
                Write-Host ('CopySpeech MSI application path: ' + [IO.Path]::GetRelativePath($adminRoot, $item.FullName))
              }
              if ($adminExe.Count -eq 0) {
                throw 'CopySpeech MSI /a administrative extraction did not yield CopySpeech.exe.'
              }
              $summary += "; administrative MSI extraction files: $($adminFiles.Count)"
              $summary += "; CopySpeech.exe: $([IO.Path]::GetRelativePath($adminRoot, $adminExe[0].FullName))"
              $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            }
            if ($target.Name -eq 'SetupEXE' -and $nestedIndex -eq 0) {
              Write-Host 'No nested app-64.7z/CAB was detected in the setup EXE; review its installer layout before packaging.'
            }
          }

      - name: Inspect and extract Veyra NVIDIA and AMD portable ZIPs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $root = Join-Path $env:RUNNER_TEMP 'round2-inspection\veyra'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) { $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source }

          $targets = @(
            @{
              Name = 'NVIDIA'
              File = 'Veyra-2.2.0-NVIDIA-win64-portable.zip'
              Url = 'https://github.com/Likely7/Veyra-NRVideo/releases/download/v2.2.0/Veyra-2.2.0-NVIDIA-win64-portable.zip'
              Sha256 = 'fd1235483a6e36b2520966ec161104478cd93186e97af3b0d78d2dfa7b129932'
            },
            @{
              Name = 'AMD'
              File = 'Veyra-2.2.0-AMD-win64-portable.zip'
              Url = 'https://github.com/Likely7/Veyra-NRVideo/releases/download/v2.2.0/Veyra-2.2.0-AMD-win64-portable.zip'
              Sha256 = 'b383cd4fbc94a6b84e32f36bc8c2758b4c03216c2bd0a2560e3112ba520d6905'
            }
          )

          $summaries = [System.Collections.Generic.List[string]]::new()
          foreach ($target in $targets) {
            $folder = Join-Path $root $target.Name
            New-Item -ItemType Directory -Path $folder -Force | Out-Null
            $download = Join-Path $folder $target.File
            Invoke-WebRequest -Uri $target.Url -OutFile $download -TimeoutSec 3600
            $hash = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $target.Sha256) { throw "Veyra $($target.Name) SHA256 mismatch: $hash" }
            Write-Host "PASS: Veyra $($target.Name) SHA256 $hash"

            & $sevenZip t $download
            if ($LASTEXITCODE -ne 0) { throw "Veyra $($target.Name) ZIP integrity test failed." }
            $listing = & $sevenZip l -slt $download 2>&1
            if ($LASTEXITCODE -ne 0) { throw "Veyra $($target.Name) ZIP listing failed." }
            $listing | Set-Content -LiteralPath (Join-Path $folder 'archive-listing.txt')

            $extract = Join-Path $folder 'extracted'
            New-Item -ItemType Directory -Path $extract -Force | Out-Null
            & $sevenZip x -y "-o$extract" $download
            if ($LASTEXITCODE -ne 0) { throw "Veyra $($target.Name) full extraction failed." }
            $files = @(Get-ChildItem -LiteralPath $extract -File -Recurse -Force)
            $main = @($files | Where-Object { $_.Name -ieq 'Veyra.exe' })
            if ($main.Count -ne 1) {
              $main = @($files | Where-Object { $_.Name -ieq 'veyra_qml_ui.exe' })
            }
            if ($main.Count -ne 1) { throw "Veyra $($target.Name) extracted archive must contain one recognized main executable; found $($main.Count)." }
            $runtime = @(Get-ChildItem -LiteralPath $extract -Directory -Recurse -Force | Where-Object { $_.Name -ieq 'runtime_local' })
            if ($runtime.Count -eq 0) { throw "Veyra $($target.Name) runtime_local data directory missing." }
            $appRoot = $main[0].DirectoryName
            foreach ($relativeData in @('runtime_local\user-data-2.0.0','runtime_local\luts')) {
              $dataPath = Join-Path $appRoot $relativeData
              if (-not (Test-Path -LiteralPath $dataPath -PathType Container)) {
                throw "Veyra $($target.Name) expected persistent data folder missing: $relativeData"
              }
              Write-Host "Veyra $($target.Name) persistence folder: $relativeData"
            }
            $relativeMain = [IO.Path]::GetRelativePath($extract, $main[0].FullName).Replace([char]92,[char]47)
            $summaries.Add("## Veyra $($target.Name)")
            $summaries.Add("- SHA-256: $hash")
            $summaries.Add("- Extracted files: $($files.Count)")
            $summaries.Add("- Main executable: $relativeMain")
            $summaries.Add("- runtime_local directories: $($runtime.Count)")
            $summaries.Add('')
            Write-Host "PASS: Veyra $($target.Name) extracted $($files.Count) files; main=$relativeMain; runtime_local=$($runtime.Count)"
          }
          $summaries | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
