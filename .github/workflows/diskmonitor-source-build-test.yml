name: DiskMonitor Source Build Test

on:
  push:
    branches:
      - diskmonitor-source-build-verification
    paths:
      - ".github/workflows/diskmonitor-source-build-test.yml"
      - "bucket/diskmonitor.json"
  pull_request:
    paths:
      - ".github/workflows/diskmonitor-source-build-test.yml"
      - "bucket/diskmonitor.json"

permissions:
  contents: read

jobs:
  build:
    name: Build and launch DiskMonitor from pinned source
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Download pinned upstream source and calculate SHA-256
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $commit = "70b93aa644d4045395b4e4482ba954009422b482"
          $url = "https://github.com/Mainkill1/DiskMonitor/archive/$commit.zip"
          $archive = Join-Path $env:RUNNER_TEMP "DiskMonitor-$commit.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive -TimeoutSec 120
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "The pinned DiskMonitor source archive was not downloaded."
          }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT
          Write-Host "DISKMONITOR_SOURCE_ARCHIVE_SHA256=$hash"
          Write-Host "DISKMONITOR_SOURCE_COMMIT=$commit"
          "## DiskMonitor source verification" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "- Upstream commit: $commit" >> $env:GITHUB_STEP_SUMMARY
          "- Source ZIP SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY

      - name: Extract and inspect the source archive
        id: extract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $commit = "70b93aa644d4045395b4e4482ba954009422b482"
          $archive = Join-Path $env:RUNNER_TEMP "DiskMonitor-$commit.zip"
          $source = Join-Path $env:RUNNER_TEMP "DiskMonitor-source"
          Expand-Archive -LiteralPath $archive -DestinationPath $source -Force
          $project = Get-ChildItem -LiteralPath $source -Filter "DiskMonitor.csproj" -File -Recurse |
            Select-Object -First 1
          if (-not $project) {
            throw "DiskMonitor.csproj was not found in the pinned source archive."
          }
          [xml]$projectXml = Get-Content -LiteralPath $project.FullName -Raw
          $appVersion = [string]$projectXml.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($appVersion)) {
            throw "The upstream project version could not be read from DiskMonitor.csproj."
          }
          "project=$($project.FullName)" >> $env:GITHUB_OUTPUT
          "app_version=$appVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Upstream application version: $appVersion"
          Write-Host "Project file: $($project.FullName)"

      - name: Publish self-contained Windows x64 executable
        shell: pwsh
        env:
          PROJECT_PATH: ${{ steps.extract.outputs.project }}
        run: |
          $ErrorActionPreference = "Stop"
          $env:NUGET_PACKAGES = Join-Path $env:RUNNER_TEMP "DiskMonitor-NuGet"
          $env:DOTNET_CLI_HOME = Join-Path $env:RUNNER_TEMP "DiskMonitor-dotnet-home"
          $publish = Join-Path $env:GITHUB_WORKSPACE "publish"
          New-Item -ItemType Directory -Path $publish -Force | Out-Null
          dotnet publish "$env:PROJECT_PATH" --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --output $publish
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed with exit code $LASTEXITCODE."
          }
          $exe = Join-Path $publish "DiskMonitor.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "The build did not produce publish\DiskMonitor.exe."
          }
          $file = Get-Item -LiteralPath $exe
          Write-Host "Built executable: $($file.FullName)"
          Write-Host "Executable size: $($file.Length) bytes"
          "Built executable: $($file.Length) bytes" >> $env:GITHUB_STEP_SUMMARY

      - name: Launch smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $env:GITHUB_WORKSPACE "publish\DiskMonitor.exe"
          $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR = Join-Path $env:GITHUB_WORKSPACE "publish-bundle"
          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path -Parent $exe) -PassThru -NoNewWindow
          try {
            Start-Sleep -Seconds 4
            $process.Refresh()
            if ($process.HasExited) {
              throw "DiskMonitor exited during the launch smoke test (exit code $($process.ExitCode))."
            }
            Write-Host "DiskMonitor remained running for four seconds."
            $bundleFiles = @(Get-ChildItem -LiteralPath $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR -File -Recurse -ErrorAction SilentlyContinue)
            if ($bundleFiles.Count -eq 0) {
              throw "The self-extracting native bundle did not populate the Scoop-controlled extraction directory."
            }
            "Launch smoke test: process remained running; native bundle extracted under publish-bundle." >> $env:GITHUB_STEP_SUMMARY
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Install, launch, and uninstall through Scoop
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $env:SCOOP_ALLOW_ADMIN = "1"
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri "https://get.scoop.sh" -TimeoutSec 60 | Invoke-Expression
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            throw "Scoop installation did not expose the scoop command."
          }

          scoop bucket add kirobucket https://github.com/kiro5678/kirobucket
          if ($LASTEXITCODE -ne 0) {
            throw "Could not register kirobucket."
          }

          $scoopRoot = if ($env:SCOOP) { $env:SCOOP } else { Join-Path $env:USERPROFILE "scoop" }
          $bucketManifest = Join-Path $scoopRoot "buckets\\kirobucket\\bucket\\diskmonitor.json"
          if (-not (Test-Path -LiteralPath (Split-Path -Parent $bucketManifest))) {
            throw "The registered kirobucket manifest directory was not found."
          }
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "bucket\\diskmonitor.json") -Destination $bucketManifest -Force

          $checkverScript = Join-Path $scoopRoot "apps\\scoop\\current\\bin\\checkver.ps1"
          if (-not (Test-Path -LiteralPath $checkverScript -PathType Leaf)) {
            throw "Scoop's official checkver.ps1 script was not found."
          }
          & $checkverScript "diskmonitor" -Dir (Join-Path $scoopRoot "buckets\\kirobucket\\bucket") -ThrowError
          if (-not $?) {
            throw "The official Scoop checkver script failed for diskmonitor."
          }

          scoop install diskmonitor
          if ($LASTEXITCODE -ne 0) {
            throw "scoop install diskmonitor failed."
          }

          $prefixOutput = scoop prefix diskmonitor
          if ($LASTEXITCODE -ne 0) {
            throw "Could not resolve the DiskMonitor Scoop install directory."
          }
          $prefix = ([string]($prefixOutput | Select-Object -Last 1)).Trim()
          $exe = Join-Path $prefix "publish\\DiskMonitor.exe"
          $launcher = Join-Path $prefix "diskmonitor.cmd"
          $shim = Join-Path $scoopRoot "shims\\diskmonitor.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "DiskMonitor.exe was not built inside the Scoop app directory."
          }
          if (-not (Test-Path -LiteralPath $launcher -PathType Leaf)) {
            throw "The DiskMonitor runtime launcher was not created."
          }
          if (-not (Select-String -LiteralPath $launcher -Pattern 'DOTNET_BUNDLE_EXTRACT_BASE_DIR=%~dp0bundle' -Quiet)) {
            throw "The launcher does not direct native bundle extraction into the Scoop version directory."
          }
          if (-not (Test-Path -LiteralPath $shim -PathType Leaf)) {
            throw "The DiskMonitor command shim was not created."
          }

          $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR = Join-Path $prefix "bundle"
          $process = Start-Process -FilePath $exe -WorkingDirectory $prefix -PassThru -NoNewWindow
          try {
            Start-Sleep -Seconds 4
            $process.Refresh()
            if ($process.HasExited) {
              throw "DiskMonitor exited during the Scoop launch test (exit code $($process.ExitCode))."
            }
            Write-Host "DiskMonitor remained running for four seconds after Scoop installation."
            $bundleFiles = @(Get-ChildItem -LiteralPath $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR -File -Recurse -ErrorAction SilentlyContinue)
            if ($bundleFiles.Count -eq 0) {
              throw "The native runtime bundle was not extracted into the Scoop version directory."
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

          scoop uninstall diskmonitor
          if ($LASTEXITCODE -ne 0) {
            throw "scoop uninstall diskmonitor failed."
          }
          if (Test-Path -LiteralPath $prefix) {
            throw "The DiskMonitor app directory remains after Scoop uninstall."
          }
          if (Test-Path -LiteralPath $shim) {
            throw "The DiskMonitor command shim remains after Scoop uninstall."
          }

          @(
            "## DiskMonitor Scoop install test"
            ""
            "- Pinned upstream commit: 70b93aa644d4045395b4e4482ba954009422b482"
            "- Source archive SHA-256: bc8c4134728b308aecec6e29331356ceb73063c425050a0b953f0f206bfb5cd8"
            "- Self-contained Windows x64 build: passed"
            "- Scoop dependency resolution and install: passed"
            "- Command shim and Start Menu shortcut source: verified"
            "- Application launch smoke test: passed"
            "- Scoop uninstall and app/shim cleanup: passed"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
