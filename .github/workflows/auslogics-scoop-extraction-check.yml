name: Auslogics Scoop Extraction Check

on:
  pull_request:
    paths:
      - ".github/workflows/auslogics-scoop-extraction-check.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Inspect official Auslogics installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'auslogics-extract-check'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $report = Join-Path $env:GITHUB_WORKSPACE 'auslogics-installer-report.md'
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add('# Auslogics installer extraction report')
          $lines.Add('')
          $apps = @(
            [pscustomobject]@{ Name = 'Disk Defrag'; Slug = 'disk-defrag'; File = 'auslogics-disk-defrag-setup.exe'; Product = 'Auslogics Disk Defrag'; ExpectedExe = 'DiskDefrag.exe' },
            [pscustomobject]@{ Name = 'Registry Cleaner'; Slug = 'registry-cleaner'; File = 'auslogics-registry-cleaner-setup.exe'; Product = 'Auslogics Registry Cleaner'; ExpectedExe = 'RegCleaner.exe' },
            [pscustomobject]@{ Name = 'SSD Optimizer'; Slug = 'ssd-optimizer'; File = 'auslogics-ssd-optimizer-setup.exe'; Product = 'Auslogics SSD Optimizer'; ExpectedExe = 'SSDOptimizer.exe' }
          )
          foreach ($app in $apps) {
            $url = "https://downloads.auslogics.com/en/$($app.Slug)/$($app.File)"
            $installer = Join-Path $root $app.File
            $installDir = Join-Path $root ($app.Slug + '-installed')
            New-Item -ItemType Directory -Force -Path $installDir | Out-Null
            $lines.Add("## $($app.Name)")
            $lines.Add("- Official URL: $url")
            try {
              Invoke-WebRequest -Uri $url -OutFile $installer
              $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($installer)
              $signature = Get-AuthenticodeSignature -LiteralPath $installer
              $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
              $lines.Add("- Download: success")
              $lines.Add("- Size: $((Get-Item $installer).Length) bytes")
              $lines.Add("- SHA-256: $hash")
              $lines.Add("- Product version: $($info.ProductVersion)")
              $lines.Add("- File version: $($info.FileVersion)")
              $lines.Add("- Product name: $($info.ProductName)")
              $lines.Add("- Authenticode status: $($signature.Status)")
              $lines.Add("- Signer: $($signature.SignerCertificate.Subject)")
              if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(?i)Auslogics' -or $info.ProductName -notmatch [regex]::Escape($app.Product)) {
                $lines.Add('- Fallback installation: refused because publisher signature/product metadata did not match.')
                $lines.Add('')
                continue
              }
              $arguments = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR=`"$installDir`""
              $process = Start-Process -FilePath $installer -ArgumentList $arguments -PassThru
              if (-not $process.WaitForExit(120000)) {
                $installRoot = [System.IO.Path]::GetFullPath($installDir)
                $children = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
                  $_.ExecutablePath -and $_.ExecutablePath.StartsWith($installRoot, [System.StringComparison]::OrdinalIgnoreCase) -and $_.ProcessId -ne $process.Id
                })
                foreach ($child in $children) { Stop-Process -Id $child.ProcessId -Force -ErrorAction SilentlyContinue }
                Start-Sleep -Seconds 2
                if (-not $process.HasExited) { $process.Kill(); $process.WaitForExit(5000) | Out-Null }
                $lines.Add('- Installer wait timed out; contained app processes were closed on the disposable runner.')
              } else {
                $lines.Add("- Installer exit code: $($process.ExitCode)")
              }
              $exes = @(Get-ChildItem -LiteralPath $installDir -Filter '*.exe' -File -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName)
              $lines.Add("- EXE files found in isolated target directory: $($exes.Count)")
              foreach ($exe in $exes) {
                $ver = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe.FullName)
                $lines.Add("- $($exe.FullName.Substring($installDir.Length).TrimStart('\','/')) | $($exe.Length) bytes | Product=$($ver.ProductName) | Version=$($ver.FileVersion)")
              }
              $main = @($exes | Where-Object Name -eq $app.ExpectedExe)
              if ($main.Count -gt 0) { $lines.Add("- Expected main executable confirmed: $($app.ExpectedExe)") }
              else { $lines.Add("- Expected main executable not found: $($app.ExpectedExe); use the inventory above instead.") }
            } catch {
              $lines.Add("- ERROR: $($_.Exception.Message)")
            }
            $lines.Add('')
          }
          Set-Content -LiteralPath $report -Value $lines -Encoding utf8
          Get-Content -LiteralPath $report

      - name: Upload report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: auslogics-installer-report
          path: auslogics-installer-report.md
          if-no-files-found: warn
          retention-days: 3
