name: TinyWall MSI Extraction Test

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/tinywall-msi-extraction-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Download, inspect, and extract TinyWall MSI
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download official packages and extract MSI payloads
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $root = Join-Path $env:RUNNER_TEMP 'tinywall-msi-inspection'
          $sourceRoot = Join-Path $root 'upstream-installation-source'
          New-Item -ItemType Directory -Path $root, $sourceRoot -Force | Out-Null

          $report = [System.Collections.Generic.List[string]]::new()
          $results = [System.Collections.Generic.List[object]]::new()

          function Add-Report {
            param([string]$Text)
            $report.Add($Text)
            Write-Host $Text
          }

          function Get-PeArchitecture {
            param([string]$Path)
            try {
              $stream = [System.IO.File]::OpenRead($Path)
              $reader = [System.IO.BinaryReader]::new($stream)
              $stream.Position = 0x3c
              $peOffset = $reader.ReadInt32()
              $stream.Position = $peOffset + 4
              $machine = $reader.ReadUInt16()
              $reader.Dispose()
              $stream.Dispose()
              switch ($machine) {
                0x014c { 'x86' }
                0x8664 { 'x64' }
                0xaa64 { 'ARM64' }
                default { 'Unknown (0x{0:X4})' -f $machine }
              }
            } catch {
              'Unknown: ' + $_.Exception.Message
            }
          }

          function Get-Inventory {
            param(
              [string]$Directory,
              [string]$Label
            )
            if (-not (Test-Path -LiteralPath $Directory -PathType Container)) {
              Add-Report "$Label : directory not found."
              return @()
            }
            $files = @(Get-ChildItem -LiteralPath $Directory -File -Recurse -Force)
            Add-Report "$Label : file count = $($files.Count)"
            $inventory = foreach ($file in $files) {
              $relative = [System.IO.Path]::GetRelativePath($Directory, $file.FullName).Replace('\', '/')
              $architecture = ''
              if ($file.Extension -ieq '.exe' -or $file.Extension -ieq '.dll') {
                $architecture = Get-PeArchitecture -Path $file.FullName
              }
              [PSCustomObject]@{
                Path = $relative
                Size = $file.Length
                Architecture = $architecture
                SHA256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
              if ($file.Name -ieq 'TinyWall.exe') {
                Add-Report "TinyWall executable: $relative ($($file.Length) bytes; $architecture)"
              }
            }
            $inventoryPath = Join-Path $root (($Label -replace '[^A-Za-z0-9_-]', '-') + '-inventory.csv')
            $inventory | Export-Csv -LiteralPath $inventoryPath -NoTypeInformation -Encoding utf8
            foreach ($file in $files | Where-Object { $_.Extension -ieq '.exe' -or $_.Extension -ieq '.dll' } | Sort-Object FullName) {
              $relative = [System.IO.Path]::GetRelativePath($Directory, $file.FullName).Replace('\', '/')
              Add-Report "  $relative [$($file.Length) bytes]"
            }
            return @($inventory)
          }

          $sourceFiles = [ordered]@{
            'MsiSetup/Product.wxs' = 'https://raw.githubusercontent.com/pylorak/TinyWall/master/MsiSetup/Product.wxs'
            'TinyWall/Program.cs' = 'https://raw.githubusercontent.com/pylorak/TinyWall/master/TinyWall/Program.cs'
            'TinyWall/TinyWallDoctor.cs' = 'https://raw.githubusercontent.com/pylorak/TinyWall/master/TinyWall/TinyWallDoctor.cs'
            'TinyWall/Installer/TinyWallServiceInstaller.cs' = 'https://raw.githubusercontent.com/pylorak/TinyWall/master/TinyWall/Installer/TinyWallServiceInstaller.cs'
          }

          Add-Report '=== Upstream installation-source inspection ==='
          foreach ($item in $sourceFiles.GetEnumerator()) {
            $destination = Join-Path $sourceRoot $item.Key
            New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
            Invoke-WebRequest -Uri $item.Value -OutFile $destination -TimeoutSec 120
            Add-Report "Fetched upstream source: $($item.Key)"
            $matches = Select-String -LiteralPath $destination -Pattern 'InstallCustom|InstallCustomRollback|UninstallCustom|StartController|ExeCommand|InstallScope|EnsureServiceInstalledAndRunning|ManagedInstallerClass|ServiceAccount\.LocalSystem|ServiceStartMode\.Automatic|RegisterTaskDefinition|SetStartupMode|DeleteWfpObjects' |
              ForEach-Object { "$($item.Key):$($_.LineNumber): $($_.Line.Trim())" }
            foreach ($match in $matches) { Add-Report $match }
          }

          $targets = @(
            @{
              Name = 'TinyWall x86-x64'
              Url = 'https://tinywall.pados.hu/ccount/click.php?id=5'
              Architecture = 'x86/x64 download page asset'
            },
            @{
              Name = 'TinyWall ARM64'
              Url = 'https://tinywall.pados.hu/ccount/click.php?id=6'
              Architecture = 'ARM64 download page asset'
            }
          )

          foreach ($target in $targets) {
            Add-Report ''
            Add-Report '============================================================'
            Add-Report $target.Name
            Add-Report '============================================================'

            $slug = $target.Name -replace '[^A-Za-z0-9_-]', '-'
            $appRoot = Join-Path $root $slug
            $msiPath = Join-Path $appRoot 'TinyWall.msi'
            $adminOut = Join-Path $appRoot 'msiexec-admin-extracted'
            $lessOut = Join-Path $appRoot 'lessmsi-extracted'
            $msiLog = Join-Path $appRoot 'msiexec-admin-extraction.log'
            New-Item -ItemType Directory -Path $appRoot, $adminOut, $lessOut -Force | Out-Null

            $itemResult = [ordered]@{
              Name = $target.Name
              Source = $target.Url
              Download = 'not-tested'
              SHA256 = ''
              Size = 0
              SignatureStatus = ''
              AdministrativeExtraction = 'not-tested'
              AdministrativeMainExe = ''
              LessMsiExtraction = 'not-tested'
              LessMsiMainExe = ''
            }

            try {
              Invoke-WebRequest -Uri $target.Url -OutFile $msiPath -MaximumRedirection 10 -TimeoutSec 600
              if (-not (Test-Path -LiteralPath $msiPath -PathType Leaf)) {
                throw 'The official download endpoint did not create an MSI file.'
              }

              $signature = Get-AuthenticodeSignature -FilePath $msiPath
              $actualHash = (Get-FileHash -LiteralPath $msiPath -Algorithm SHA256).Hash.ToLowerInvariant()
              $size = (Get-Item -LiteralPath $msiPath).Length
              $itemResult.Download = 'success'
              $itemResult.SHA256 = $actualHash
              $itemResult.Size = $size
              $itemResult.SignatureStatus = [string]$signature.Status
              Add-Report "Downloaded MSI: $($target.Name)"
              Add-Report "Bytes: $size"
              Add-Report "SHA-256: $actualHash"
              Add-Report "Authenticode status: $($signature.Status)"
              if ($signature.SignerCertificate) {
                Add-Report "Signer: $($signature.SignerCertificate.Subject)"
              }

              $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
              if (-not (Test-Path -LiteralPath $sevenZip)) {
                $sevenZipCommand = Get-Command '7z.exe' -ErrorAction SilentlyContinue
                if ($sevenZipCommand) { $sevenZip = $sevenZipCommand.Source }
              }
              if (Test-Path -LiteralPath $sevenZip) {
                $listing = & $sevenZip l -slt $msiPath 2>&1
                $listingExit = $LASTEXITCODE
                $listing | Set-Content -LiteralPath (Join-Path $appRoot '7zip-msi-listing.txt') -Encoding utf8
                Add-Report "7-Zip MSI listing exit code: $listingExit"
              }

              Add-Report 'Running the same administrative-image extraction used by Scoop by default (msiexec /a); no MSI installation or custom action is executed.'
              $quotedMsiPath = '"' + $msiPath + '"'
              $quotedTargetDir = 'TARGETDIR="' + $adminOut + '"'
              $quotedLogPath = '"' + $msiLog + '"'
              $process = Start-Process -FilePath (Join-Path $env:SystemRoot 'System32\msiexec.exe') -ArgumentList @(
                '/a',
                $quotedMsiPath,
                '/qn',
                $quotedTargetDir,
                '/l*v',
                $quotedLogPath
              ) -Wait -PassThru
              Add-Report "msiexec /a exit code: $($process.ExitCode)"
              $adminInventory = @(Get-Inventory -Directory $adminOut -Label "$slug-admin")
              $adminMain = @($adminInventory | Where-Object { $_.Path -match '(^|/)TinyWall\.exe$' })
              if ($process.ExitCode -eq 0 -and $adminMain.Count -gt 0) {
                $itemResult.AdministrativeExtraction = 'success'
                $itemResult.AdministrativeMainExe = ($adminMain | ForEach-Object { $_.Path }) -join '; '
              } else {
                $itemResult.AdministrativeExtraction = "failed or no TinyWall.exe found (exit $($process.ExitCode))"
              }

              Add-Report 'Running independent LessMSI extraction for comparison.'
              $lessmsiZip = Join-Path $root 'lessmsi-v2.12.9.zip'
              $lessmsiHashExpected = '5b4e187e74b184ad3a63ccf06c3d17dae2b8c4b6c298a996dbd51a9f6db29d21'
              if (-not (Test-Path -LiteralPath $lessmsiZip)) {
                Invoke-WebRequest -Uri 'https://github.com/activescott/lessmsi/releases/download/v2.12.9/lessmsi-v2.12.9.zip' -OutFile $lessmsiZip -TimeoutSec 300
                $lessmsiHashActual = (Get-FileHash -LiteralPath $lessmsiZip -Algorithm SHA256).Hash.ToLowerInvariant()
                if ($lessmsiHashActual -ne $lessmsiHashExpected) {
                  throw "LessMSI helper SHA-256 mismatch. Expected $lessmsiHashExpected, got $lessmsiHashActual."
                }
              }
              $lessmsiHome = Join-Path $root 'lessmsi-helper'
              if (-not (Test-Path -LiteralPath $lessmsiHome)) {
                New-Item -ItemType Directory -Path $lessmsiHome -Force | Out-Null
                if (-not (Test-Path -LiteralPath $sevenZip)) {
                  throw '7-Zip is required to extract the verified LessMSI helper archive.'
                }
                & $sevenZip x $lessmsiZip "-o$lessmsiHome" -y -bd | Out-Null
                if ($LASTEXITCODE -ne 0) { throw 'Could not extract the verified LessMSI helper archive.' }
              }
              $lessmsiExe = Get-ChildItem -LiteralPath $lessmsiHome -Filter 'lessmsi.exe' -File -Recurse | Select-Object -First 1
              if ($null -eq $lessmsiExe) { throw 'The verified helper archive did not contain lessmsi.exe.' }
              & $lessmsiExe.FullName x $msiPath $lessOut
              $lessExit = $LASTEXITCODE
              Add-Report "LessMSI exit code: $lessExit"
              $lessInventory = @(Get-Inventory -Directory $lessOut -Label "$slug-lessmsi")
              $lessMain = @($lessInventory | Where-Object { $_.Path -match '(^|/)TinyWall\.exe$' })
              if ($lessExit -eq 0 -and $lessMain.Count -gt 0) {
                $itemResult.LessMsiExtraction = 'success'
                $itemResult.LessMsiMainExe = ($lessMain | ForEach-Object { $_.Path }) -join '; '
              } else {
                $itemResult.LessMsiExtraction = "failed or no TinyWall.exe found (exit $lessExit)"
              }
              Add-Report "Administrative extraction result: $($itemResult.AdministrativeExtraction)"
              Add-Report "LessMSI extraction result: $($itemResult.LessMsiExtraction)"
            } catch {
              Add-Report "ERROR for $($target.Name): $($_.Exception.Message)"
              if ($itemResult.Download -eq 'not-tested') {
                $itemResult.Download = "failed: $($_.Exception.Message)"
              }
            }

            $results.Add([PSCustomObject]$itemResult)
          }

          Add-Report ''
          Add-Report '==================== FINAL SUMMARY ===================='
          foreach ($item in $results) {
            Add-Report "$($item.Name): Download=$($item.Download); SHA256=$($item.SHA256); MSI admin=$($item.AdministrativeExtraction); LessMSI=$($item.LessMsiExtraction)"
          }
          Add-Report '========================================================'

          $results | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $root 'results.json') -Encoding utf8
          $report | Set-Content -LiteralPath (Join-Path $root 'extraction-report.txt') -Encoding utf8
          @(
            '## TinyWall MSI inspection'
            ''
            '| Package | Download | SHA-256 | msiexec /a | LessMSI |'
            '|---|---|---|---|---|'
            foreach ($item in $results) {
              "| $($item.Name) | $($item.Download) | $($item.SHA256) | $($item.AdministrativeExtraction) | $($item.LessMsiExtraction) |"
            }
            ''
            'The artifact retains the official MSI files, extracted payloads, extraction logs, PE architecture/file hashes, and the upstream installer source files.'
            'No MSI installation, TinyWall execution, Windows service creation, scheduled-task registration, or firewall-rule change was performed.'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

          if (@($results | Where-Object {
            $_.AdministrativeExtraction -eq 'success' -or $_.LessMsiExtraction -eq 'success'
          }).Count -eq 0) {
            throw 'Neither MSI extraction method exposed TinyWall.exe. Inspect the retained logs and artifact.'
          }

      - name: Upload MSI files, extracted payloads, and inspection logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tinywall-msi-extraction
          path: ${{ runner.temp }}/tinywall-msi-inspection/
          if-no-files-found: warn
          retention-days: 14
