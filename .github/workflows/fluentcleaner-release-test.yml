name: FluentCleaner Release and Scoop Test

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/fluentcleaner-release-test.yml'
      - 'bucket/fluentcleaner.json'
      - 'bucket/fluentcleaner-classic.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Modern and Classic manifests
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release assets and application versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $headers = @{
            'User-Agent' = 'kirobucket-fluentcleaner-release-test'
            'Accept' = 'application/vnd.github+json'
            'Authorization' = "Bearer $env:GITHUB_TOKEN"
          }

          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/builtbybel/FluentCleaner/releases/latest' -Headers $headers -TimeoutSec 60
          $releaseTag = [string]$release.tag_name
          if ([string]::IsNullOrWhiteSpace($releaseTag)) { throw 'Latest release has no tag_name.' }

          $modernPath = Join-Path $env:GITHUB_WORKSPACE 'bucket\fluentcleaner.json'
          $classicPath = Join-Path $env:GITHUB_WORKSPACE 'bucket\fluentcleaner-classic.json'
          $modern = Get-Content -LiteralPath $modernPath -Raw | ConvertFrom-Json
          $classic = Get-Content -LiteralPath $classicPath -Raw | ConvertFrom-Json

          $modernVersionMatch = [regex]::Match([string]$release.body, [string]$modern.checkver.regex)
          if (-not $modernVersionMatch.Success) {
            throw 'Could not extract Modern application version from the official release notes.'
          }
          $publishedModernVersion = $modernVersionMatch.Groups['version'].Value
          if ([string]::IsNullOrWhiteSpace($publishedModernVersion)) {
            throw 'Modern version capture is empty.'
          }

          $classicVersionMatch = [regex]::Match([string]$release.body, [string]$classic.checkver.regex)
          if (-not $classicVersionMatch.Success) {
            throw 'Could not extract Classic application version from the official release notes.'
          }
          $publishedClassicVersion = $classicVersionMatch.Groups['version'].Value
          if ([string]::IsNullOrWhiteSpace($publishedClassicVersion)) {
            throw 'Classic version capture is empty.'
          }

          Write-Host "RELEASE_TAG=$releaseTag"
          Write-Host "MODERN_APPLICATION_VERSION=$publishedModernVersion"
          Write-Host "CLASSIC_APPLICATION_VERSION=$publishedClassicVersion"

          if ([string]$modern.version -ne $publishedModernVersion) {
            throw "Modern manifest version $($modern.version) does not match published Modern version $publishedModernVersion."
          }
          if ([string]$classic.version -ne $publishedClassicVersion) {
            throw "Classic manifest version $($classic.version) does not match published Classic version $publishedClassicVersion."
          }
          if ([string]$modern.checkver.jsonpath -ne '$.body' -or [string]$classic.checkver.jsonpath -ne '$.body') {
            throw 'Both checkver configurations must read the official release body.'
          }

          $tests = @(
            @{
              Name = 'Modern'
              Asset = 'FluentCleaner-win-x64.zip'
              Executable = 'FCleaner.exe'
              Url = [string]$modern.architecture.'64bit'.url
              Hash = [string]$modern.architecture.'64bit'.hash
              ManifestVersion = [string]$modern.version
              ExtractDir = [string]$modern.architecture.'64bit'.extract_dir
              ExpectedExtractDir = 'FluentCleaner-win-x64'
            },
            @{
              Name = 'Classic'
              Asset = 'FluentCleaner-Classic-net48.zip'
              Executable = 'FluentCleaner.Classic.exe'
              Url = [string]$classic.url
              Hash = [string]$classic.hash
              ManifestVersion = [string]$classic.version
              ExtractDir = [string]$classic.extract_dir
              ExpectedExtractDir = 'FluentCleaner-net48'
            }
          )

          $root = Join-Path $env:RUNNER_TEMP 'fluentcleaner-release-test'
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          foreach ($test in $tests) {
            Write-Host "=== $($test.Name) ==="
            $asset = @($release.assets | Where-Object { $_.name -eq $test.Asset }) | Select-Object -First 1
            if ($null -eq $asset) { throw "Missing release asset: $($test.Asset)" }

            $expectedUrl = "https://github.com/builtbybel/FluentCleaner/releases/latest/download/$($test.Asset)"
            if ($test.Url -ne $expectedUrl) {
              throw "$($test.Name) manifest URL must use the official latest-download URL: $expectedUrl"
            }
            if ($test.ExtractDir -ne $test.ExpectedExtractDir) {
              throw "$($test.Name) extract_dir is '$($test.ExtractDir)', expected '$($test.ExpectedExtractDir)'."
            }

            $expectedHash = ([string]$asset.digest -replace '^sha256:', '').ToLowerInvariant()
            if ($expectedHash -notmatch '^[0-9a-f]{64}$' -or $test.Hash.ToLowerInvariant() -ne $expectedHash) {
              throw "$($test.Name) manifest SHA-256 does not match the official release asset digest."
            }

            $archive = Join-Path $root $test.Asset
            Invoke-WebRequest -Uri $test.Url -OutFile $archive -MaximumRedirection 10 -TimeoutSec 600
            $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $expectedHash) {
              throw "$($test.Name) latest-download URL hash mismatch. Actual=$actualHash Expected=$expectedHash"
            }

            $destination = Join-Path $root $test.Name
            Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
            $exe = Get-ChildItem -LiteralPath $destination -Filter $test.Executable -File -Recurse -Force | Select-Object -First 1
            if ($null -eq $exe) { throw "$($test.Name) executable was not found after extraction." }

            Write-Host "PASS: $($test.Name) latest-download URL, hash, and archive extraction."
            Write-Host "MANIFEST_VERSION=$($test.ManifestVersion)"
            Write-Host "RELEASE_ASSET_URL=$($asset.browser_download_url)"
            Write-Host "SHA256=$actualHash"
            Write-Host "EXECUTABLE=$($exe.FullName)"

            if ($test.Name -eq 'Classic') {
              $dependency = Join-Path $exe.DirectoryName 'FluentCleaner.Core.dll'
              if (-not (Test-Path -LiteralPath $dependency -PathType Leaf)) {
                throw 'Classic archive is missing FluentCleaner.Core.dll beside the executable.'
              }
              Write-Host 'PASS: Classic dependency DLL is beside its executable.'
            }
          }

      - name: Install Scoop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri 'https://get.scoop.sh' | Invoke-Expression

          $scoop = Join-Path $env:USERPROFILE 'scoop\shims\scoop.ps1'
          if (-not (Test-Path -LiteralPath $scoop -PathType Leaf)) {
            throw "Scoop was not installed at the expected location: $scoop"
          }
          Write-Host "Scoop installed: $scoop"

      - name: Test Modern and Classic checkver and autoupdate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scoopRoot = Join-Path $env:USERPROFILE 'scoop'
          $checkverScript = Join-Path $scoopRoot 'apps\scoop\current\bin\checkver.ps1'
          if (-not (Test-Path -LiteralPath $checkverScript -PathType Leaf)) {
            throw "Scoop checkver script not found: $checkverScript"
          }

          $cases = @(
            @{
              App = 'fluentcleaner'
              Manifest = 'bucket\fluentcleaner.json'
              ExpectedVersion = '26.11.01'
              ExpectedUrl = 'https://github.com/builtbybel/FluentCleaner/releases/latest/download/FluentCleaner-win-x64.zip'
            },
            @{
              App = 'fluentcleaner-classic'
              Manifest = 'bucket\fluentcleaner-classic.json'
              ExpectedVersion = '1.19.269'
              ExpectedUrl = 'https://github.com/builtbybel/FluentCleaner/releases/latest/download/FluentCleaner-Classic-net48.zip'
            }
          )

          foreach ($case in $cases) {
            $testDir = Join-Path (Join-Path $env:RUNNER_TEMP 'fluentcleaner-checkver') $case.App
            New-Item -ItemType Directory -Path $testDir -Force | Out-Null
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $case.Manifest) -Destination (Join-Path $testDir "$($case.App).json")

            $checkverOutput = @(& $checkverScript -App $case.App -Dir $testDir -Update -ForceUpdate -ThrowError 2>&1)
            $checkverOutput | ForEach-Object { Write-Host $_ }

            $updated = Get-Content -LiteralPath (Join-Path $testDir "$($case.App).json") -Raw | ConvertFrom-Json
            if ([string]$updated.version -ne $case.ExpectedVersion) {
              throw "Scoop checkver returned $($case.App) version $($updated.version), expected $($case.ExpectedVersion)."
            }

            if ($case.App -eq 'fluentcleaner') {
              $updatedUrl = [string]$updated.architecture.'64bit'.url
            }
            else {
              $updatedUrl = [string]$updated.url
            }
            if ($updatedUrl -ne $case.ExpectedUrl) {
              throw "Scoop autoupdate produced an unexpected URL for $($case.App): $updatedUrl"
            }
            Write-Host "PASS: Scoop checkver and autoupdate for $($case.App)."
          }

      - name: Install and verify both local manifests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scoop = Join-Path $env:USERPROFILE 'scoop\shims\scoop.ps1'

          $modernManifest = Join-Path $env:GITHUB_WORKSPACE 'bucket\fluentcleaner.json'
          & $scoop install $modernManifest
          if ($LASTEXITCODE -ne 0) { throw 'Scoop failed to install bucket/fluentcleaner.json.' }

          $modernExe = Join-Path $env:USERPROFILE 'scoop\apps\fluentcleaner\current\FCleaner.exe'
          if (-not (Test-Path -LiteralPath $modernExe -PathType Leaf)) {
            throw "Modern installation is missing FCleaner.exe: $modernExe"
          }
          Write-Host 'PASS: Modern manifest installed and FCleaner.exe is in current.'

          $classicManifest = Join-Path $env:GITHUB_WORKSPACE 'bucket\fluentcleaner-classic.json'
          & $scoop install $classicManifest
          if ($LASTEXITCODE -ne 0) { throw 'Scoop failed to install bucket/fluentcleaner-classic.json.' }

          $classicRoot = Join-Path $env:USERPROFILE 'scoop\apps\fluentcleaner-classic\current'
          $classicExe = Join-Path $classicRoot 'FluentCleaner.Classic.exe'
          $classicDependency = Join-Path $classicRoot 'FluentCleaner.Core.dll'
          if (-not (Test-Path -LiteralPath $classicExe -PathType Leaf)) {
            throw "Classic installation is missing FluentCleaner.Classic.exe: $classicExe"
          }
          if (-not (Test-Path -LiteralPath $classicDependency -PathType Leaf)) {
            throw "Classic extract_dir did not place FluentCleaner.Core.dll beside its executable: $classicDependency"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $classicRoot 'Localization\en.json') -PathType Leaf)) {
            throw 'Classic installation is missing Localization/en.json.'
          }
          Write-Host 'PASS: Classic manifest installed with executable, dependencies, and localization beside/in the expected paths.'

          & $scoop list
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the installed Scoop package list.' }
