name: FluentCleaner Release and Scoop Test

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/fluentcleaner-release-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect Modern and Classic release archives
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Download, hash, and extract both official editions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $headers = @{
            'User-Agent' = 'kirobucket-fluentcleaner-release-test'
            'Accept' = 'application/vnd.github+json'
          }

          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/builtbybel/FluentCleaner/releases/latest' -Headers $headers -TimeoutSec 60
          $version = [string]$release.tag_name
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Latest release has no tag_name.' }
          Write-Host "LATEST_RELEASE=$version"

          $root = Join-Path $env:RUNNER_TEMP 'fluentcleaner-release-test'
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          $tests = @(
            @{
              Name = 'Modern'
              Asset = 'FluentCleaner-win-x64.zip'
              Executable = 'FCleaner.exe'
            },
            @{
              Name = 'Classic'
              Asset = 'FluentCleaner-Classic-net48.zip'
              Executable = 'FluentCleaner.Classic.exe'
            }
          )

          foreach ($test in $tests) {
            Write-Host ""
            Write-Host "=== $($test.Name) ==="

            $asset = @($release.assets | Where-Object { $_.name -eq $test.Asset }) | Select-Object -First 1
            if ($null -eq $asset) { throw "Missing release asset: $($test.Asset)" }

            $expectedUrl = "https://github.com/builtbybel/FluentCleaner/releases/download/$version/$($test.Asset)"
            if ($asset.browser_download_url -ne $expectedUrl) {
              throw "Unexpected URL for $($test.Asset): $($asset.browser_download_url)"
            }

            $expectedHash = ([string]$asset.digest -replace '^sha256:', '').ToLowerInvariant()
            if ($expectedHash -notmatch '^[0-9a-f]{64}$') {
              throw "No valid SHA-256 digest published for $($test.Asset): $($asset.digest)"
            }

            $archive = Join-Path $root $test.Asset
            Invoke-WebRequest -Uri $expectedUrl -OutFile $archive -MaximumRedirection 10 -TimeoutSec 600
            $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $expectedHash) {
              throw "SHA-256 mismatch for $($test.Asset). Actual=$actualHash Expected=$expectedHash"
            }
            Write-Host "PASS: Downloaded $($test.Asset)"
            Write-Host "SHA256=$actualHash"

            $destination = Join-Path $root $test.Name
            Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
            $files = @(Get-ChildItem -LiteralPath $destination -File -Recurse -Force)
            if ($files.Count -eq 0) { throw "Archive contains no extracted files: $($test.Asset)" }

            Write-Host "EXTRACTED_FILE_COUNT=$($files.Count)"
            foreach ($file in $files) {
              $relative = $file.FullName.Substring($destination.Length).TrimStart('\','/')
              Write-Host ("{0} ({1} bytes)" -f $relative, $file.Length)
            }

            $exe = Get-ChildItem -LiteralPath $destination -Filter $test.Executable -File -Recurse -Force | Select-Object -First 1
            if ($null -eq $exe) {
              $foundExecutables = @(Get-ChildItem -LiteralPath $destination -Filter '*.exe' -File -Recurse -Force | Select-Object -ExpandProperty Name)
              throw "Expected executable '$($test.Executable)' was not found. EXEs: $($foundExecutables -join ', ')"
            }

            Write-Host "PASS: Found launch executable $($exe.FullName)"
            $versionInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe.FullName)
            Write-Host "PRODUCT_VERSION=$($versionInfo.ProductVersion)"
            Write-Host "FILE_VERSION=$($versionInfo.FileVersion)"
          }

          Write-Host ""
          Write-Host 'PASS: Both editions downloaded, passed SHA-256 verification, and extracted successfully.'
