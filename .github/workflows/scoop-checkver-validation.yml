              }
              Write-Host "FAILED: $($manifest.Name)" -ForegroundColor Red
              Write-Host $_.Exception.Message -ForegroundColor Red
              if ($outputText) {
                Write-Host $outputText
              }
            }
          }

          Write-Host ''
          Write-Host "============================================================"
          Write-Host "Checkver summary"
          Write-Host "============================================================"
          Write-Host "Checked: $($manifests.Count)"
          Write-Host "Failed:  $($failed.Count)"

          if ($failed.Count -gt 0) {
            $failed | Format-Table -AutoSize
            exit 1
          }

          Write-Host "All manifests passed checkver validation." -ForegroundColor Green
