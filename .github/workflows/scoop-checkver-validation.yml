name: Manual Scoop Checkver Validation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/scoop-checkver-validation.yml'
      - 'bucket/**'
      - 'docs/manifest-authoring.md'

permissions:
  contents: read

jobs:
  checkver:
    name: Checkver (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout Bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          path: my_bucket

      - name: Checkout Scoop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          path: scoop_core

      - name: Enable authenticated GitHub API requests in Scoop checkver
        env:
          GITHUB_TOKEN: ${{ secrets.CHECKVER_GITHUB_TOKEN }}
        run: |
          $checkver = Join-Path $env:GITHUB_WORKSPACE 'scoop_core\\bin\\checkver.ps1'
          $source = Get-Content -LiteralPath $checkver -Raw
          $pattern = '(?m)^\s*\$wc\.Headers\.Add\(''Referer'', \(strip_filename \$url\)\)\s*$'
          $matches = [regex]::Matches($source, $pattern)
          if ($matches.Count -ne 1) {
            throw "Expected one Referer header line in Scoop checkver.ps1, found $($matches.Count)."
          }
          $replacement = @'
              if (($url -match '^https://api\.github\.com/') -and $env:GITHUB_TOKEN -and -not ($wc.Headers.AllKeys -contains 'Authorization')) {
                  $wc.Headers.Add('Authorization', "Bearer $env:GITHUB_TOKEN")
                  $wc.Headers.Add('X-GitHub-Api-Version', '2022-11-28')
              }
              $wc.Headers.Add('Referer', (strip_filename $url))
          '@
          $source = [regex]::Replace($source, $pattern, [System.Text.RegularExpressions.MatchEvaluator]{ param($m) $replacement.TrimEnd() }, 1)
          Set-Content -LiteralPath $checkver -Value $source -Encoding utf8 -NoNewline
      - name: Validate changed manifests with checkver
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.CHECKVER_GITHUB_TOKEN }}
          SCOOP_HOME: ${{ github.workspace }}\\scoop_core
        run: |
          $checkver = Join-Path $env:GITHUB_WORKSPACE 'scoop_core\\bin\\checkver.ps1'
          $bucket = Join-Path $env:GITHUB_WORKSPACE 'my_bucket\\bucket'
          $failed = @()
          $skipped = @()
          $failurePattern = "(?i)(couldn't\s+(retrieve|find|match)|could\s+not\s+find|URL .+ is not valid|Conversion from JSON failed|failed to convert JSON)"

          if ($env:EVENT_NAME -eq 'workflow_dispatch' -and [string]::IsNullOrWhiteSpace($env:GITHUB_TOKEN)) {
            throw 'Full-bucket checkver requires a repository secret named CHECKVER_GITHUB_TOKEN (a token that can read public GitHub repositories). Add it under Settings > Secrets and variables > Actions, then rerun workflow_dispatch.'
          }

          if ($env:EVENT_NAME -eq 'push') {
            $baseSha = $env:BASE_SHA.Trim()
            $headSha = $env:HEAD_SHA.Trim()
            if ($baseSha -notmatch '^[0-9a-fA-F]{40}$' -or $headSha -notmatch '^[0-9a-fA-F]{40}$') {
              throw 'Could not determine the push base and head commits for changed-manifest validation.'
            }
            $repoRoot = Split-Path $bucket -Parent
            git -C $repoRoot cat-file -e "${baseSha}^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0) {
              throw "Push base commit $baseSha is unavailable; cannot identify changed manifests."
            }
            $changedPaths = @(git -C $repoRoot diff --name-only $baseSha $headSha)
            if ($LASTEXITCODE -ne 0) {
              throw "Could not compare $baseSha with $headSha."
            }
            $changedManifests = @($changedPaths | Where-Object {
              $_.Replace('\', '/') -match '^bucket/.+\.json$'
            })
            if ($changedManifests.Count -eq 0) {
              Write-Host 'No bucket manifests changed in this push. Use workflow_dispatch to validate the full bucket.'
              exit 0
            }
            $manifests = @($changedManifests | ForEach-Object {
              Join-Path $repoRoot $_
            } | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | ForEach-Object {
              Get-Item -LiteralPath $_
            } | Sort-Object FullName)
          } else {
            $manifests = @(Get-ChildItem -Path $bucket -Filter '*.json' -File -Recurse | Sort-Object FullName)
          }

          Write-Host "Found $($manifests.Count) manifest(s) to validate."

          foreach ($manifest in $manifests) {
            Write-Host ''
            Write-Host '============================================================'
            Write-Host "Checking: $($manifest.Name)"
            Write-Host '============================================================'
            $outputText = ''
            try {
              $output = @(& $checkver -App $manifest.FullName -ThrowError *>&1 | ForEach-Object { "$_" })
              $outputText = $output -join [Environment]::NewLine
              if ($outputText -match $failurePattern) {
                throw "Version detection failed: $($Matches[0])"
              }
              Write-Host "PASS: $($manifest.BaseName)" -ForegroundColor Green
            } catch {
              $reason = $_.Exception.Message
              if ($manifest.Name -ieq 'kvrt.json') {
                $skipped += [PSCustomObject]@{
                  Manifest = $manifest.Name
                  Reason   = $reason
                }
                Write-Warning "SKIPPED: kvrt.json checkver failed; this exemption applies only to kvrt.json."
              }
              else {
                $failed += [PSCustomObject]@{
                  Manifest = $manifest.Name
                  Reason   = $reason
                }
                Write-Host "FAIL: $($manifest.Name) checkver failed: $reason" -ForegroundColor Red
              }
              if ($outputText) { Write-Host $outputText }
              continue
            }
          }

          Write-Host ''
          Write-Host '============================================================'
          Write-Host 'Checkver summary'
          Write-Host '============================================================'
          $passedCount = $manifests.Count - $failed.Count - $skipped.Count
          Write-Host "Checked: $($manifests.Count)"
          Write-Host "Passed:  $passedCount"
          Write-Host "Skipped: $($skipped.Count)"
          Write-Host "Failed:  $($failed.Count)"

          if ($skipped.Count -gt 0) {
            Write-Host ''
            Write-Host 'Only kvrt.json checkver failures are skipped:' -ForegroundColor Yellow
            $skipped | Format-Table -AutoSize
          }

          if ($failed.Count -gt 0) {
            Write-Host ''
            Write-Host 'Checkver failures in manifests other than kvrt.json:' -ForegroundColor Red
            $failed | Format-Table -AutoSize
            exit 1
          }

          Write-Host 'Checkver validation completed. Only kvrt.json failures are skipped; any other manifest failure fails this workflow.' -ForegroundColor Green
