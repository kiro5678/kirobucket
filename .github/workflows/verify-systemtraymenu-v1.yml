name: Verify SystemTrayMenu 1 archive

on:
  push:
    paths:
      - ".github/workflows/verify-systemtraymenu-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout KiroBucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: my_bucket

      - name: Checkout Scoop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          ref: master
          path: scoop_core
          token: ${{ secrets.CHECKVER_GITHUB_TOKEN || github.token }}

      - name: Validate the manifest with Scoop Checkver
        shell: pwsh
        run: |
          $checkver = Join-Path $env:GITHUB_WORKSPACE 'scoop_core\\bin\\checkver.ps1'
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'my_bucket\\bucket\\systemtraymenu1.json'
          $env:SCOOP_HOME = Join-Path $env:GITHUB_WORKSPACE 'scoop_core'
          & $checkver -App $manifest -ThrowError
          & $checkver -App $manifest -Update -ThrowError
          Write-Host 'Updated manifest candidate:'
          Get-Content -LiteralPath $manifest -Raw

      - name: Download and inspect official portable archive
        shell: pwsh
        run: |
          $version = "1.3.5.0"
          $url = "https://github.com/Hofknecht/SystemTrayMenu/releases/download/v$version/SystemTrayMenu-$version.zip"
          $zip = Join-Path $env:RUNNER_TEMP "SystemTrayMenu-$version.zip"
          $extract = Join-Path $env:RUNNER_TEMP "SystemTrayMenu-$version"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $file = Get-Item $zip
          Write-Host "Archive size: $($file.Length) bytes"
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "SHA256: $hash"
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $exe = Get-ChildItem -LiteralPath $extract -Filter "SystemTrayMenu.exe" -File -Recurse
          if (-not $exe) { throw "SystemTrayMenu.exe was not found in the archive." }
          foreach ($item in $exe) {
            $v = (Get-Item $item.FullName).VersionInfo
            Write-Host "Executable: $($item.FullName.Substring($extract.Length + 1))"
            Write-Host "FileVersion: $($v.FileVersion)"
            Write-Host "ProductVersion: $($v.ProductVersion)"
          }
          if ($hash -ne "3a2590df848b8e691dbd4bf2df5e893ff5b68b5a75226e88eeddd0e08be21bd3") {
            throw "SHA-256 mismatch: $hash"
          }
          if ($file.Length -ne 74074919) { throw "Unexpected archive size: $($file.Length)" }
          if ($exe.Count -ne 1) { throw "Expected one SystemTrayMenu.exe, found $($exe.Count)." }
          if ((Split-Path $exe[0].FullName -Parent) -ne $extract) { throw "Expected SystemTrayMenu.exe at archive root." }
          if ($v.FileVersion -ne $version -or $v.ProductVersion -ne $version) { throw "Executable version mismatch." }
