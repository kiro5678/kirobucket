name: Debug SystemTrayMenu 1 JSON formatting

on:
  push:
    paths:
      - ".github/workflows/debug-systemtraymenu-format.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - name: Checkout KiroBucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          path: my_bucket
      - name: Checkout Scoop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          ref: master
          path: scoop_core
      - name: Run official Scoop formatter and show exact differences
        shell: pwsh
        run: |
          $file = Join-Path $env:GITHUB_WORKSPACE 'my_bucket\\bucket\\systemtraymenu1.json'
          $formatter = Join-Path $env:GITHUB_WORKSPACE 'scoop_core\\bin\\formatjson.ps1'
          $before = [System.IO.File]::ReadAllText($file)
          $beforeBytes = [System.IO.File]::ReadAllBytes($file)
          & $formatter -App 'systemtraymenu1' -Dir (Split-Path $file -Parent)
          $after = [System.IO.File]::ReadAllText($file)
          $afterBytes = [System.IO.File]::ReadAllBytes($file)
          Write-Host "Before bytes: $($beforeBytes.Length)"
          Write-Host "After bytes:  $($afterBytes.Length)"
          Write-Host "Exact text match: $($before -ceq $after)"
          Write-Host '--- BEFORE ---'
          Write-Output $before
          Write-Host '--- AFTER FORMAT ---'
          Write-Output $after
          if ($before -cne $after) {
            $beforeLines = $before -split '\r?\n'
            $afterLines = $after -split '\r?\n'
            Write-Host '--- LINE DIFFERENCES ---'
            Compare-Object -ReferenceObject $beforeLines -DifferenceObject $afterLines
          }
