name: HC Player Silent Install and Uninstall Test

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "bucket/hc-player.json"
      - ".github/workflows/hc-player-silent-install-test.yml"

permissions:
  contents: read

jobs:
  test:
    name: Verify official Inno Setup install and uninstall
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download, silently install, inspect, and uninstall HC Player
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $root = Join-Path $env:RUNNER_TEMP 'hc-player-silent-install-test'
          $installDir = Join-Path $root 'Scoop Test Root With Spaces\apps\hc-player\1.7.1'
          $installer = Join-Path $root 'HC_Player_1.7.1_x64_Setup.exe'
          $reportPath = Join-Path $root 'hc-player-install-report.txt'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $report = [System.Collections.Generic.List[string]]::new()

          function Add-Report([string]$Text) {
            $report.Add($Text)
            Write-Host $Text
          }

          function Get-HCPlayerUninstallEntries {
            $roots = @(
              'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
              'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
              'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
            )
            $entries = [System.Collections.Generic.List[object]]::new()
            foreach ($registryRoot in $roots) {
              if (-not (Test-Path -LiteralPath $registryRoot)) { continue }
              foreach ($key in Get-ChildItem -LiteralPath $registryRoot -ErrorAction SilentlyContinue) {
                $properties = Get-ItemProperty -LiteralPath $key.PSPath -ErrorAction SilentlyContinue
                if ([string]$properties.DisplayName -match '(?i)^HC Player(?:\s|$)') {
                  $entries.Add([pscustomobject]@{
                    Key = "$registryRoot\$($key.PSChildName)"
                    DisplayName = [string]$properties.DisplayName
                    DisplayVersion = [string]$properties.DisplayVersion
                    InstallLocation = [string]$properties.InstallLocation
                    UninstallString = [string]$properties.UninstallString
                    QuietUninstallString = [string]$properties.QuietUninstallString
                  })
                }
              }
            }
            return @($entries)
          }

          try {
            Add-Report 'HC Player 1.7.1 official Inno Setup silent installation test'
            Add-Report "Target directory: $installDir"

            $headers = @{
              Accept = 'application/vnd.github+json'
              'User-Agent' = 'kirobucket-hc-player-install-test'
              'X-GitHub-Api-Version' = '2022-11-28'
            }
            $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/henzfdev/HC-Player/releases/latest' -Headers $headers -TimeoutSec 45
            if ($release.draft -or $release.prerelease) { throw 'Latest HC Player release is not stable.' }
            $asset = $release.assets |
              Where-Object { $_.name -match '^HC_Player_[0-9][0-9A-Za-z.-]*_x64_Setup\.exe$' } |
              Select-Object -First 1
            if (-not $asset) { throw 'Official x64 Setup.exe asset was not found.' }
            if ($asset.digest -notmatch '^sha256:([0-9a-fA-F]{64})$') {
              throw 'GitHub release does not provide a valid SHA-256 digest for the setup asset.'
            }
            $expectedHash = $Matches[1].ToLowerInvariant()
            Add-Report "Release: $($release.tag_name)"
            Add-Report "Installer: $($asset.name)"
            Add-Report "Published asset SHA-256: $expectedHash"

            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $installer -MaximumRedirection 10 -TimeoutSec 900
            $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $expectedHash) {
              throw "Installer SHA-256 mismatch. Expected $expectedHash; received $actualHash."
            }
            Add-Report "Downloaded installer SHA-256: $actualHash (PASS)"

            $existingEntries = @(Get-HCPlayerUninstallEntries)
            if ($existingEntries.Count -gt 0) {
              throw "HC Player is already registered on this runner before the test: $($existingEntries.Key -join '; ')."
            }
            if (Test-Path -LiteralPath $installDir) {
              throw "Target directory already exists before installation: $installDir"
            }

            New-Item -ItemType Directory -Path $installDir -Force | Out-Null
            Add-Report 'Running verified installer with Inno Setup silent arguments.'
            $argumentLine = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /CURRENTUSER /DIR="' + $installDir + '"'
            Add-Report "Arguments: $argumentLine"

            $process = Start-Process -FilePath $installer -ArgumentList $argumentLine -PassThru
            try {
              Wait-Process -Id $process.Id -Timeout 900 -ErrorAction Stop
            } catch {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw 'HC Player silent installer did not finish within 15 minutes.'
            }
            $process.Refresh()
            Add-Report "Installer exit code: $($process.ExitCode)"
            if ($process.ExitCode -ne 0) { throw "HC Player installer exited with code $($process.ExitCode)." }

            $mainExe = Join-Path $installDir 'HC Player.exe'
            if (-not (Test-Path -LiteralPath $mainExe -PathType Leaf)) {
              $matches = @(Get-ChildItem -LiteralPath $installDir -Filter 'HC Player.exe' -File -Recurse -Force -ErrorAction SilentlyContinue)
              throw "HC Player.exe was not found at the expected install root. Recursive matches: $($matches.FullName -join '; ')."
            }
            $mainInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($mainExe)
            Add-Report "Application executable: $mainExe"
            Add-Report "Application version: $($mainInfo.FileVersion)"
            Add-Report "Application size: $((Get-Item -LiteralPath $mainExe).Length) bytes"

            $uninstaller = Get-ChildItem -LiteralPath $installDir -Filter 'unins*.exe' -File -Force |
              Sort-Object Name |
              Select-Object -First 1
            if (-not $uninstaller) {
              throw 'No Inno Setup uninstaller (unins*.exe) was created in the Scoop target directory.'
            }
            Add-Report "Uninstaller: $($uninstaller.FullName)"

            $entries = @(Get-HCPlayerUninstallEntries)
            Add-Report "HC Player uninstall registry entries: $($entries.Count)"
            foreach ($entry in $entries) {
              Add-Report "Registry key: $($entry.Key)"
              Add-Report "DisplayName: $($entry.DisplayName)"
              Add-Report "DisplayVersion: $($entry.DisplayVersion)"
              Add-Report "InstallLocation: $($entry.InstallLocation)"
              Add-Report "UninstallString: $($entry.UninstallString)"
              Add-Report "QuietUninstallString: $($entry.QuietUninstallString)"
            }

            $startMenu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
            $desktop = [Environment]::GetFolderPath('Desktop')
            $newShortcuts = @()
            foreach ($folder in @($startMenu, $desktop)) {
              if (Test-Path -LiteralPath $folder) {
                $newShortcuts += @(Get-ChildItem -LiteralPath $folder -Recurse -File -Force -ErrorAction SilentlyContinue |
                  Where-Object { $_.Name -match '(?i)HC Player' } |
                  ForEach-Object { $_.FullName })
              }
            }
            Add-Report "HC Player Start Menu/Desktop shortcuts: $($newShortcuts.Count)"
            foreach ($shortcut in $newShortcuts) { Add-Report "Shortcut: $shortcut" }

            $isPerUser = [bool]($entries | Where-Object { $_.Key -like 'HKCU:*' })
            $isPerMachine = [bool]($entries | Where-Object { $_.Key -like 'HKLM:*' })
            Add-Report "Inno /CURRENTUSER override honored: $isPerUser"
            Add-Report "Machine-wide registration detected: $isPerMachine"

            $runningApp = @(Get-CimInstance -ClassName Win32_Process -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -ieq 'HC Player.exe' -and $_.ExecutablePath -like ($installDir + '*') })
            Add-Report "HC Player application processes before uninstall: $($runningApp.Count)"
            foreach ($p in $runningApp) {
              Add-Report "Stopping HC Player PID $($p.ProcessId): $($p.ExecutablePath)"
              Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue
            }

            Add-Report 'Running the publisher-declared quiet-uninstall mode.'
            $uninstallArgs = '/SILENT /SUPPRESSMSGBOXES /NORESTART'
            Add-Report "Uninstaller arguments: $uninstallArgs"
            $remove = Start-Process -FilePath $uninstaller.FullName -ArgumentList $uninstallArgs -WorkingDirectory $installDir -PassThru
            try {
              Wait-Process -Id $remove.Id -Timeout 180 -ErrorAction Stop
              $remove.Refresh()
              Add-Report "Uninstaller process exit code: $($remove.ExitCode)"
              if ($remove.ExitCode -ne 0) { throw "HC Player uninstaller exited with code $($remove.ExitCode)." }
            } catch {
              Add-Report "Uninstaller did not finish within 180 seconds: $($_.Exception.Message)"
              $uninstallProcesses = @(Get-CimInstance -ClassName Win32_Process -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -match '(?i)^(_?unins|unins)' -or ($_.ExecutablePath -and $_.ExecutablePath -like ($installDir + '*')) })
              foreach ($p in $uninstallProcesses) {
                Add-Report "Uninstaller process: PID $($p.ProcessId) | $($p.Name) | $($p.ExecutablePath) | $($p.CommandLine)"
              }
            }

            $uninstallDeadline = [DateTimeOffset]::UtcNow.AddSeconds(120)
            do {
              Start-Sleep -Seconds 2
              $remainingEntries = @(Get-HCPlayerUninstallEntries)
              $mainStillExists = Test-Path -LiteralPath $mainExe -PathType Leaf
              if (-not $mainStillExists -and $remainingEntries.Count -eq 0) { break }
            } while ([DateTimeOffset]::UtcNow -lt $uninstallDeadline)
            $remainingEntries = @(Get-HCPlayerUninstallEntries)
            $mainStillExists = Test-Path -LiteralPath $mainExe -PathType Leaf
            $uninstallerStillExists = Test-Path -LiteralPath $uninstaller.FullName -PathType Leaf
            $remaining = if (Test-Path -LiteralPath $installDir -PathType Container) {
              @(Get-ChildItem -LiteralPath $installDir -Force -ErrorAction SilentlyContinue)
            } else { @() }
            Add-Report "HC Player.exe remains: $mainStillExists"
            Add-Report "Inno uninstaller remains: $uninstallerStillExists"
            Add-Report "Uninstall registry entries remaining: $($remainingEntries.Count)"
            Add-Report "Entries remaining under install path: $($remaining.Count)"
            foreach ($item in $remaining) { Add-Report "Remaining: $($item.Name)" }

            if ($mainStillExists -or $remainingEntries.Count -gt 0 -or $remaining.Count -gt 0) {
              throw 'The Inno Setup uninstaller did not fully remove HC Player from the requested directory.'
            }
            Add-Report 'Silent uninstall removed application files and registered uninstall entries: PASS'

            @(
              '## HC Player Inno Setup silent install test'
              ''
              '- **Result:** PASS'
              '- **Official release SHA-256:** PASS'
              '- **Silent installation to requested directory:** PASS'
              '- **HC Player.exe present:** PASS'
              '- **Inno uninstaller discovered:** PASS'
              '- **Silent uninstall:** PASS'
              '- **Application files removed:** PASS'
              '- **Uninstall registry entry removed:** PASS'
              '- **Application launch:** Not tested'
            ) | Set-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          } catch {
            Add-Report "FAIL: $($_.Exception.Message)"
            @(
              '## HC Player Inno Setup silent install test'
              ''
              '- **Result:** FAILED'
              "- **Reason:** $($_.Exception.Message)"
              ''
              'See the uploaded report artifact and workflow logs.'
            ) | Set-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            throw
          } finally {
            $report | Set-Content -LiteralPath $reportPath -Encoding utf8
          }

      - name: Upload installation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hc-player-silent-install-report
          path: ${{ runner.temp }}/hc-player-silent-install-test/hc-player-install-report.txt
          if-no-files-found: warn
          retention-days: 14
