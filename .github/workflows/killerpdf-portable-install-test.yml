name: KillerPDF Scoop Payload Extraction Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
    paths:
      - 'bucket/killerpdf.json'
      - '.github/workflows/killerpdf-portable-install-test.yml'
  push:
    branches:
      - master
    paths:
      - 'bucket/killerpdf.json'
      - '.github/workflows/killerpdf-portable-install-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Extract, launch, and persist (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install and test the extracted application
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $env:SCOOP = Join-Path $env:RUNNER_TEMP 'scoop-killerpdf'
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri 'https://get.scoop.sh' | Invoke-Expression
          $env:PATH = (Join-Path $env:SCOOP 'shims') + ';' + $env:PATH

          $localBucket = Join-Path $env:RUNNER_TEMP 'kirobucket-test'
          $localBucketManifestDir = Join-Path $localBucket 'bucket'
          New-Item -ItemType Directory -Path $localBucketManifestDir -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'bucket\killerpdf.json') -Destination $localBucketManifestDir
          Push-Location $localBucket
          try {
            git init --initial-branch=master
            git config user.name 'GitHub Actions'
            git config user.email 'actions@github.com'
            git add bucket/killerpdf.json
            git commit -m 'Seed temporary KillerPDF test bucket'
          }
          finally {
            Pop-Location
          }

          $bucketUrl = 'file:///' + $localBucket.Replace('\', '/')
          scoop bucket add kirobucket $bucketUrl
          scoop install killerpdf

          $tempPayloadArchives = @(Get-ChildItem -LiteralPath $env:TEMP -Filter 'KillerPDF-payload-*.zip' -File -ErrorAction SilentlyContinue)
          if ($tempPayloadArchives.Count -gt 0) {
            throw 'KillerPDF left its temporary embedded-payload ZIP archive behind after Scoop installation.'
          }

          $appDir = Join-Path $env:SCOOP 'apps\killerpdf\current'
          $launcher = Join-Path $appDir 'KillerPDF-Portable.exe'
          $appExe = Join-Path $appDir 'KillerPDF.App.exe'
          $wrapper = Join-Path $appDir 'KillerPDF.cmd'
          $payloadManifest = Join-Path $appDir 'payload.manifest'
          foreach ($required in @($launcher, $appExe, $wrapper, $payloadManifest)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Required Scoop payload file is missing: $required"
            }
          }

          $persistData = Join-Path $env:SCOOP 'persist\killerpdf\KillerPDF-Data'
          if (-not (Test-Path -LiteralPath $persistData -PathType Container)) {
            throw 'Scoop did not create the KillerPDF-Data persistent directory.'
          }

          $expectedDataPath = Join-Path $appDir 'KillerPDF-Data'
          if (-not (Test-Path -LiteralPath $expectedDataPath)) {
            throw 'KillerPDF-Data is not linked from the version directory into Scoop persist.'
          }

          $legacyRuntime = Join-Path $env:LOCALAPPDATA 'KillerPDF\Portable'
          $tempPortableMarkersBefore = @(Get-ChildItem -LiteralPath $env:TEMP -Filter '.killerpdf-portable' -File -Recurse -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName)
          if (Test-Path -LiteralPath $legacyRuntime) {
            Remove-Item -LiteralPath $legacyRuntime -Recurse -Force
          }

          $wrapperProcess = $null
          $childProcess = $null
          try {
            $wrapperProcess = Start-Process -FilePath $wrapper -PassThru
            $deadline = (Get-Date).AddSeconds(60)
            do {
              $childProcess = Get-CimInstance -ClassName Win32_Process -Filter "Name = 'KillerPDF.App.exe'" |
                Where-Object {
                  $_.ExecutablePath -and
                  $_.ExecutablePath.StartsWith($appDir, [System.StringComparison]::OrdinalIgnoreCase)
                } |
                Select-Object -First 1

              if ($null -ne $childProcess) { break }
              if ($wrapperProcess.HasExited) {
                throw "KillerPDF.cmd exited before the Scoop application process appeared (exit code $($wrapperProcess.ExitCode))."
              }
              Start-Sleep -Milliseconds 500
            } while ((Get-Date) -lt $deadline)

            if ($null -eq $childProcess) {
              throw 'KillerPDF.App.exe was not started from the Scoop version directory.'
            }
            if (-not (Test-Path -LiteralPath $childProcess.ExecutablePath -PathType Leaf)) {
              throw 'The extracted application executable is missing.'
            }

            Write-Host "Application launched from Scoop: $($childProcess.ExecutablePath)"
            Start-Sleep -Seconds 10
            $stillRunning = Get-CimInstance -ClassName Win32_Process -Filter "ProcessId = $($childProcess.ProcessId)"
            if ($null -eq $stillRunning) {
              throw 'KillerPDF exited unexpectedly during the launch test.'
            }

            if (Test-Path -LiteralPath $legacyRuntime) {
              throw 'KillerPDF unexpectedly created the vendor launcher runtime extraction directory in LocalAppData.'
            }

            $tempPortableMarkersAfter = @(Get-ChildItem -LiteralPath $env:TEMP -Filter '.killerpdf-portable' -File -Recurse -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName)
            $newTempPortableMarkers = @($tempPortableMarkersAfter | Where-Object { $_ -notin $tempPortableMarkersBefore })
            if ($newTempPortableMarkers.Count -gt 0) {
              throw "KillerPDF unexpectedly extracted a portable runtime under TEMP: $($newTempPortableMarkers -join '; ')"
            }

            Set-Content -LiteralPath (Join-Path $persistData 'kirobucket-persist-test.txt') -Value 'persisted' -Encoding utf8
            Stop-Process -Id ([int]$childProcess.ProcessId) -Force -ErrorAction SilentlyContinue
            if (-not $wrapperProcess.WaitForExit(30000)) {
              throw 'KillerPDF.cmd did not exit after the application process was stopped.'
            }
          }
          finally {
            if ($null -ne $childProcess) {
              Stop-Process -Id ([int]$childProcess.ProcessId) -Force -ErrorAction SilentlyContinue
            }
            if ($null -ne $wrapperProcess -and -not $wrapperProcess.HasExited) {
              Stop-Process -Id $wrapperProcess.Id -Force -ErrorAction SilentlyContinue
            }
          }

          scoop uninstall killerpdf
          if (-not (Test-Path -LiteralPath (Join-Path $env:SCOOP 'persist\killerpdf\KillerPDF-Data\kirobucket-persist-test.txt') -PathType Leaf)) {
            throw 'Scoop uninstall removed persistent user data.'
          }

          Write-Host 'PASS: embedded payload extraction, direct Scoop launch, no portable AppData unpacking, and persist retention.'
