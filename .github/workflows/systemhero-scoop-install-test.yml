name: SystemHero Scoop Install Test

on:
  push:
    branches:
      - master
    paths:
      - 'bucket/systemhero.json'
      - '.github/workflows/systemhero-scoop-install-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Test Inno Setup extraction, shortcut and uninstall
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Scoop in an isolated runner directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $scoopRoot = Join-Path $env:RUNNER_TEMP 'scoop-systemhero-test'
          $installer = Join-Path $env:RUNNER_TEMP 'install-scoop.ps1'
          Invoke-WebRequest -Uri 'https://get.scoop.sh' -OutFile $installer -TimeoutSec 120
          & $installer -ScoopDir $scoopRoot

          $env:SCOOP = $scoopRoot
          $scoopScript = Join-Path $scoopRoot 'apps\scoop\current\bin\scoop.ps1'
          if (-not (Test-Path -LiteralPath $scoopScript -PathType Leaf)) {
            throw "Scoop command script was not found: $scoopScript"
          }
          "SCOOP_ROOT=$scoopRoot" >> $env:GITHUB_ENV
          Write-Host "Scoop root: $scoopRoot"

      - name: Install SystemHero from the checked-out manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scoopRoot = $env:SCOOP_ROOT
          $env:SCOOP = $scoopRoot
          $scoopScript = Join-Path $scoopRoot 'apps\scoop\current\bin\scoop.ps1'
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'bucket\systemhero.json'
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "SystemHero manifest was not found: $manifestPath"
          }

          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json -ErrorAction Stop
          if ($manifest.innosetup -ne $true) {
            throw 'SystemHero manifest must use innosetup: true.'
          }

          $global:LASTEXITCODE = 0
          & $scoopScript install $manifestPath
          if ($null -ne $global:LASTEXITCODE -and $global:LASTEXITCODE -ne 0) {
            throw "Scoop install failed with exit code $global:LASTEXITCODE."
          }

          $versionDir = Join-Path $scoopRoot 'apps\systemhero\current'
          $application = Join-Path $versionDir 'SystemHero.exe'
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Scoop Apps\SystemHero.lnk'

          if (-not (Test-Path -LiteralPath $application -PathType Leaf)) {
            $entries = @(Get-ChildItem -LiteralPath $versionDir -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name)
            throw "SystemHero.exe is missing after Scoop extraction. Found: $($entries -join ', ')"
          }
          $file = Get-Item -LiteralPath $application
          if ($file.Length -le 0) { throw 'SystemHero.exe is empty.' }
          $header = [System.IO.File]::ReadAllBytes($application)
          if ($header.Length -lt 2 -or $header[0] -ne 0x4D -or $header[1] -ne 0x5A) {
            throw 'SystemHero.exe does not have a valid Windows PE MZ header.'
          }
          if (-not (Test-Path -LiteralPath $shortcut -PathType Leaf)) {
            throw "Scoop shortcut was not created: $shortcut"
          }

          $hash = (Get-FileHash -LiteralPath $application -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "PASS: SystemHero.exe extracted ($($file.Length) bytes)."
          Write-Host "Application SHA-256: $hash"
          Write-Host "PASS: Start Menu shortcut exists: $shortcut"
          Write-Host 'The application was not launched; no system optimizations were applied.'

      - name: Uninstall SystemHero and verify Scoop cleanup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SCOOP_ROOT)) {
            Write-Host 'Scoop was not installed; cleanup test is skipped.'
            exit 0
          }

          $scoopRoot = $env:SCOOP_ROOT
          $env:SCOOP = $scoopRoot
          $scoopScript = Join-Path $scoopRoot 'apps\scoop\current\bin\scoop.ps1'
          if (-not (Test-Path -LiteralPath $scoopScript -PathType Leaf)) {
            Write-Host 'Scoop command script is unavailable; cleanup test is skipped.'
            exit 0
          }

          $appRoot = Join-Path $scoopRoot 'apps\systemhero'
          if (Test-Path -LiteralPath $appRoot) {
            $global:LASTEXITCODE = 0
            & $scoopScript uninstall systemhero
            if ($null -ne $global:LASTEXITCODE -and $global:LASTEXITCODE -ne 0) {
              throw "Scoop uninstall failed with exit code $global:LASTEXITCODE."
            }
          }

          if (Test-Path -LiteralPath $appRoot) {
            throw "Scoop uninstall left the app directory behind: $appRoot"
          }
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Scoop Apps\SystemHero.lnk'
          if (Test-Path -LiteralPath $shortcut) {
            throw "Scoop uninstall left the shortcut behind: $shortcut"
          }
          Write-Host 'PASS: Scoop uninstall removed SystemHero files and its shortcut.'
