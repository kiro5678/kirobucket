name: Validate manifest archives

on:
  push:
    branches:
      - master
    paths:
      - 'bucket/edge-drop.json'
      - 'bucket/pinokio.json'
      - 'bucket/unsloth.json'
      - 'bucket/purge.json'
      - 'bucket/foxdesktop.json'
      - 'bucket/whispra.json'
      - 'bucket/0install-win.json'
      - 'bucket/detect-it-easy.json'
      - 'bucket/die-engine.json'
      - 'bucket/pake-chatgpt.json'
      - 'bucket/pake-deepseek.json'
      - 'bucket/pake-excalidraw.json'
      - 'bucket/pake-flomo.json'
      - 'bucket/pake-gemini.json'
      - 'bucket/pake-grok.json'
      - 'bucket/pake-lizhi.json'
      - 'bucket/pake-notion.json'
      - 'bucket/pake-programmusic.json'
      - 'bucket/pake-qwerty.json'
      - 'bucket/pake-twitter.json'
      - 'bucket/pake-wechat.json'
      - 'bucket/pake-weread.json'
      - 'bucket/pake-xiaohongshu.json'
      - 'bucket/pake-youtubemusic.json'
      - 'bucket/pake-youtube.json'
      - 'bucket/purge.json'
      - 'bucket/arbora.json'
      - 'bucket/baudscan.json'
      - 'bucket/ally.json'
      - 'bucket/althea.json'
      - 'bucket/apigo.json'
      - 'bucket/arcmd.json'
      - 'bucket/atlas.json'
      - 'bucket/bentomail.json'
      - 'bucket/biternet.json'
      - 'bucket/bigo-live-recorder.json'
      - '.github/workflows/validate-manifest-archives.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
    paths:
      - 'bucket/browser-picker.json'
      - 'bucket/default-programs-editor.json'
      - 'bucket/firefox-portable-default-browser.json'
      - 'bucket/nomad-launcher-chromium.json'
      - 'bucket/nomad-launcher-floorp.json'
      - 'bucket/nomad-launcher-helium.json'
      - 'bucket/nomad-launcher-librewolf.json'
      - 'bucket/nomad-launcher-mullvad.json'
      - 'bucket/nomad-launcher-waterfox.json'
      - 'bucket/pineapple-assoc-manager.json'
      - 'bucket/portable-registrator.json'
      - 'bucket/ps-sfta.json'
      - 'bucket/win-link-router.json'
      - '.github/workflows/validate-manifest-archives.yml'
      - 'bucket/filebrowser.json'
      - 'bucket/arbora.json'
      - 'bucket/voicestudio.json'
      - 'bucket/foxdesktop.json'
      - 'bucket/whispra.json'
      - 'bucket/pake-chatgpt.json'
      - 'bucket/pake-deepseek.json'
      - 'bucket/pake-excalidraw.json'
      - 'bucket/pake-flomo.json'
      - 'bucket/pake-gemini.json'
      - 'bucket/pake-grok.json'
      - 'bucket/pake-lizhi.json'
      - 'bucket/pake-notion.json'
      - 'bucket/pake-programmusic.json'
      - 'bucket/pake-qwerty.json'
      - 'bucket/pake-twitter.json'
      - 'bucket/pake-wechat.json'
      - 'bucket/pake-weread.json'
      - 'bucket/pake-xiaohongshu.json'
      - 'bucket/pake-youtubemusic.json'
      - 'bucket/pake-youtube.json'
      - 'bucket/gloss.json'
      - 'bucket/wintray.json'
      - 'bucket/mygit.json'
      - 'bucket/pail.json'
      - 'bucket/mayoi.json'
      - 'bucket/lilt.json'
      - 'bucket/bili-fm.json'
      - 'bucket/kero.json'
      - 'bucket/baudscan.json'
      - 'bucket/ally.json'
      - 'bucket/althea.json'
      - 'bucket/apigo.json'
      - 'bucket/arcmd.json'
      - 'bucket/atlas.json'
      - 'bucket/bentomail.json'
      - 'bucket/biternet.json'
      - 'bucket/bigo-live-recorder.json'
  workflow_dispatch:
    inputs:
      manifest:
        description: "Manifest path, e.g. bucket/winzenith.json"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: validate-manifest-archives-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate archive paths
    runs-on: windows-latest

    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate changed manifests against archives
        id: archive_validation
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.event.client_payload.base_sha || '' }}
          EVENT_NAME: ${{ github.event_name }}
          MANIFEST_INPUT: ${{ inputs.manifest || '' }}
        run: |
          $ErrorActionPreference = 'Stop'

          git fetch origin master
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not fetch master.'
          }
          if ($env:EVENT_NAME -eq 'pull_request') {
            Write-Host 'Validating the pull request checkout, including its new and renamed manifests.'
          } else {
            git reset --hard origin/master
            if ($LASTEXITCODE -ne 0) {
              throw 'Could not reset to the latest master.'
            }
          }
          $validatedHeadSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $validatedHeadSha -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'Could not determine the exact commit used for archive validation.'
          }

          $repoRoot = $env:GITHUB_WORKSPACE
          $manifestPaths = @()
          $pakeRegressionManifests = @('bucket/pake-chatgpt.json', 'bucket/pake-deepseek.json', 'bucket/pake-excalidraw.json', 'bucket/pake-flomo.json', 'bucket/pake-gemini.json', 'bucket/pake-grok.json', 'bucket/pake-lizhi.json', 'bucket/pake-notion.json', 'bucket/pake-programmusic.json', 'bucket/pake-qwerty.json', 'bucket/pake-twitter.json', 'bucket/pake-wechat.json', 'bucket/pake-weread.json', 'bucket/pake-xiaohongshu.json', 'bucket/pake-youtubemusic.json', 'bucket/pake-youtube.json')
          if ($env:EVENT_NAME -eq 'pull_request') {
            $baseSha = $env:BASE_SHA.Trim()
            if ($baseSha -notmatch '^[0-9a-fA-F]{40}$') {
              throw 'The pull request base SHA is unavailable; cannot identify changed manifests.'
            }
            git cat-file -e ($baseSha + '^{commit}') 2>$null
            if ($LASTEXITCODE -ne 0) {
              throw "The pull request base commit $baseSha is unavailable."
            }
            $changedPaths = @(git diff --name-only --diff-filter=ACMR $baseSha $validatedHeadSha)
            if ($LASTEXITCODE -ne 0) {
              throw "Could not compare pull request base $baseSha with $validatedHeadSha."
            }
            $manifestPaths = @($changedPaths | Where-Object { $_ -match '(?i)^bucket/.+\.json$' } | Sort-Object -Unique)
            if ($changedPaths -contains '.github/workflows/validate-manifest-archives.yml') {
              # A change to this validator also runs the established Pake MSI regression set.
              $manifestPaths += $pakeRegressionManifests
            }
            $manifestPaths = @($manifestPaths | Sort-Object -Unique)
          } elseif (-not [string]::IsNullOrWhiteSpace($env:MANIFEST_INPUT)) {
            $manualPath = $env:MANIFEST_INPUT.Trim().Replace('\', '/')
            if ($manualPath -notmatch '(?i)^bucket/.+\.json$') {
              throw "Manual validation requires a path under bucket/, such as bucket/winlestia.json. Received: $manualPath"
            }
            if (-not (Test-Path -LiteralPath (Join-Path $repoRoot $manualPath) -PathType Leaf)) {
              throw "Manifest does not exist: $manualPath"
            }
            $manifestPaths = @($manualPath)
          } else {
            $baseSha = $env:BASE_SHA.Trim()
            if ($baseSha -notmatch '^[0-9a-fA-F]{40}$') {
              throw 'The push did not include a valid base SHA. Run this workflow manually with a manifest path.'
            }
            git cat-file -e "${baseSha}^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0) {
              throw "The base commit $baseSha is unavailable; cannot reliably identify changed manifests."
            }
            $changedPaths = @(git diff --name-only --diff-filter=ACMR $baseSha HEAD)
            if ($LASTEXITCODE -ne 0) {
              throw "Could not compare $baseSha with HEAD."
            }
            if ($changedPaths -contains '.github/workflows/validate-manifest-archives.yml') {
              $manifestPaths = $pakeRegressionManifests
            } else {
              $manifestPaths = @($changedPaths | Where-Object { $_ -match '(?i)^bucket/.+\.json$' } | Sort-Object -Unique)
            }
          }

          if ($manifestPaths.Count -eq 0) {
            Write-Host 'No changed manifest JSON files; nothing to validate.'
          } else {
            Write-Host "Validating $($manifestPaths.Count) manifest(s):"
            $manifestPaths | ForEach-Object { Write-Host " - $_" }
          }

          $sevenZipLog = Join-Path $env:RUNNER_TEMP '7zip.log'
          "7-Zip diagnostics for run $env:GITHUB_RUN_ID" | Set-Content -LiteralPath $sevenZipLog

          $sevenZipPath = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZipPath -PathType Leaf)) {
            $sevenZipCommand = Get-Command '7z.exe' -ErrorAction SilentlyContinue
            if ($sevenZipCommand) {
              $sevenZipPath = $sevenZipCommand.Source
            } else {
              $sevenZipPath = 'C:\Program Files (x86)\7-Zip\7z.exe'
            }
          }
          if (-not (Test-Path -LiteralPath $sevenZipPath -PathType Leaf)) {
            throw '7-Zip was not found on the runner; archive layout validation cannot continue.'
          }

          function Get-StringItems {
            param([object]$Value)
            $items = @()
            if ($null -eq $Value) {
              return @()
            }
            if ($Value -is [string]) {
              if (-not [string]::IsNullOrWhiteSpace($Value)) {
                $items += $Value
              }
              return $items
            }
            if ($Value -is [System.Collections.IEnumerable]) {
              foreach ($item in $Value) {
                if ($item -is [string] -and -not [string]::IsNullOrWhiteSpace($item)) {
                  $items += $item
                }
              }
            }
            return $items
          }

          function Get-LaunchPaths {
            param([object]$Value)
            $paths = @()
            if ($null -eq $Value) {
              return @()
            }
            if ($Value -is [System.Array]) {
              $items = $Value
            } else {
              $items = @($Value)
            }
            foreach ($item in $items) {
              $path = $null
              if ($item -is [string]) {
                $path = $item
              } elseif ($item -is [System.Array] -and $item.Count -gt 0 -and $item[0] -is [string]) {
                $path = $item[0]
              } elseif ($item -is [System.Collections.IDictionary] -and $item.Contains('path')) {
                $path = [string]$item['path']
              }
              if (-not [string]::IsNullOrWhiteSpace($path)) {
                $normalized = $path.Trim().Replace('\', '/')
                while ($normalized.StartsWith('./')) {
                  $normalized = $normalized.Substring(2)
                }
                if ($normalized -match '[\$%]') {
                  Write-Warning "Skipping runtime-expanded launch path: $path"
                  continue
                }
                $paths += $normalized.TrimStart('/').TrimEnd('/')
              }
            }
            return @($paths | Sort-Object -Unique)
          }

          function Test-StaticHash {
            param(
              [string]$ArchivePath,
              [object]$HashValue,
              [string]$Context
            )
            if ($null -eq $HashValue -or $HashValue -isnot [string] -or [string]::IsNullOrWhiteSpace($HashValue)) {
              Write-Warning "$Context has no directly verifiable static hash; Scoop's dynamic hash logic may apply."
              return
            }
            $hashText = $HashValue.Trim()
            if ($hashText -match '^(?i:skip)$') {
              Write-Warning "$Context uses hash=skip."
              return
            }
            $algorithm = $null
            $expected = $hashText
            if ($hashText -match '^(sha256|sha1|sha512|md5):([0-9a-fA-F]+)$') {
              $algorithm = $Matches[1].ToUpperInvariant()
              $expected = $Matches[2]
            } else {
              switch ($hashText.Length) {
                32 { $algorithm = 'MD5' }
                40 { $algorithm = 'SHA1' }
                64 { $algorithm = 'SHA256' }
                128 { $algorithm = 'SHA512' }
                default {
                  Write-Warning "$Context uses a non-literal hash specification; checksum validation was skipped."
                  return
                }
              }
            }
            $actual = (Get-FileHash -LiteralPath $ArchivePath -Algorithm $algorithm).Hash
            if ($actual -ine $expected) {
              throw "$Context hash mismatch. Expected $expected; got $actual."
            }
            Write-Host "$Context hash OK ($algorithm)."
          }

          function ConvertTo-ArchivePath {
            param([string]$Path)
            $normalized = $Path.Replace('\', '/')
            while ($normalized.StartsWith('./')) {
              $normalized = $normalized.Substring(2)
            }
            return $normalized.TrimEnd('/')
          }

          $failures = @()
          $downloadCounter = 0
          $innounpPath = $null
          foreach ($relativePath in $manifestPaths) {
            Write-Host ''
            Write-Host '============================================================'
            Write-Host "Manifest: $relativePath"
            Write-Host '============================================================'
            try {
              $manifestFile = Join-Path $repoRoot $relativePath
              $manifest = Get-Content -LiteralPath $manifestFile -Raw | ConvertFrom-Json -AsHashtable
              if (-not $manifest.ContainsKey('version')) {
                throw 'Manifest is missing version.'
              }
              $architectures = @()
              if ($manifest.ContainsKey('architecture') -and $manifest.architecture -is [System.Collections.IDictionary]) {
                foreach ($archName in $manifest.architecture.Keys) {
                  $merged = [ordered]@{}
                  foreach ($key in $manifest.Keys) {
                    if ($key -ne 'architecture') {
                      $merged[$key] = $manifest[$key]
                    }
                  }
                  foreach ($key in $manifest.architecture[$archName].Keys) {
                    $merged[$key] = $manifest.architecture[$archName][$key]
                  }
                  $architectures += [PSCustomObject]@{ Name = [string]$archName; Config = $merged }
                }
              } else {
                $architectures = @([PSCustomObject]@{ Name = 'default'; Config = $manifest })
              }

              foreach ($archConfig in $architectures) {
                $config = $archConfig.Config
                $urls = @(Get-StringItems $config['url'])
                if ($urls.Count -eq 0) {
                  Write-Warning "$relativePath ($($archConfig.Name)): no direct URL; archive paths cannot be checked."
                  continue
                }
                $extractDirs = @(Get-StringItems $config['extract_dir'])
                $extractToDirs = @(Get-StringItems $config['extract_to'])
                $hashItems = @(Get-StringItems $config['hash'])
                $archiveFiles = @()
                $inspectableArchives = 0
                $uninspectedAssets = 0
                $archiveOrdinal = 0

                for ($urlIndex = 0; $urlIndex -lt $urls.Count; $urlIndex++) {
                  $downloadUrl = [string]$urls[$urlIndex]
                  if ($downloadUrl -match '\$[A-Za-z_]') {
                    throw "$relativePath ($($archConfig.Name)): unresolved variable in current download URL: $downloadUrl"
                  }
                  try {
                    $uri = [System.Uri]$downloadUrl
                  } catch {
                    throw "$relativePath ($($archConfig.Name)): invalid download URL: $downloadUrl"
                  }
                  if ($uri.Scheme -notin @('http', 'https')) {
                    throw "$relativePath ($($archConfig.Name)): unsupported download protocol '$($uri.Scheme)' for archive inspection."
                  }

                  $fragmentPath = [System.Uri]::UnescapeDataString($uri.Fragment.TrimStart('#'))
                  $isForced7zip = $uri.Fragment -match '(?i)^#/dl\.7z$'
                  $assetPath = $uri.AbsolutePath
                  if (-not $isForced7zip -and $fragmentPath -match '^/(?<name>.+)$') {
                    $assetPath = $Matches.name
                  }
                  $pathPart = $assetPath.ToLowerInvariant()
                  $looksLikeArchive = $isForced7zip -or ($pathPart -match '\.(zip|7z|rar|cab|tar|tgz|txz|tbz2|msi|nupkg|whl|jar|war|vsix|xpi|apk)$') -or ($pathPart -match '\.tar\.(gz|xz|bz2)$')
                  $extractDir = ''
                  if ($extractDirs.Count -eq 1) {
                    $extractDir = $extractDirs[0]
                  } elseif ($archiveOrdinal -lt $extractDirs.Count) {
                    $extractDir = $extractDirs[$archiveOrdinal]
                  }
                  $extractTo = ''
                  if ($archiveOrdinal -lt $extractToDirs.Count) {
                    $extractTo = $extractToDirs[$archiveOrdinal]
                  }
                  $pathExtension = [System.IO.Path]::GetExtension($assetPath)
                  $isKnownInstaller = $pathPart -match '\.(exe|msix|msixbundle|appx|appxbundle)$'
                  $hasNoExtension = [string]::IsNullOrWhiteSpace($pathExtension)
                  $shouldInspect = $looksLikeArchive -or -not [string]::IsNullOrWhiteSpace($extractDir) -or ($config.Contains('innosetup') -and $config['innosetup'] -eq $true) -or ($hasNoExtension -and -not $isKnownInstaller)
                  if (-not $shouldInspect) {
                    $uninspectedAssets++
                    Write-Warning "$relativePath ($($archConfig.Name)): skipping installer asset that is not an archive: $($uri.AbsolutePath)"
                    continue
                  }

                  $extension = [System.IO.Path]::GetExtension($assetPath)
                  $isCompressedTar = $pathPart -match '\.tar\.(gz|xz|bz2)$'
                  if ($isForced7zip) {
                    $extension = '.7z'
                  } elseif ($isCompressedTar) {
                    $extension = $Matches[0]
                  }
                  if ([string]::IsNullOrWhiteSpace($extension) -or $extension -notmatch '^(\.[a-z0-9]{1,8}|\.tar\.(gz|xz|bz2))$') {
                    $extension = '.archive'
                  }
                  $archivePath = Join-Path $env:RUNNER_TEMP "manifest-archive-$downloadCounter$extension"
                  $downloadCounter++
                  Write-Host "Downloading asset $($urlIndex + 1)/$($urls.Count) for $($archConfig.Name)..."
                  Invoke-WebRequest -Uri $downloadUrl -OutFile $archivePath -MaximumRedirection 10 -TimeoutSec 300

                  $hashValue = $null
                  if ($hashItems.Count -eq 1) {
                    $hashValue = $hashItems[0]
                  } elseif ($urlIndex -lt $hashItems.Count) {
                    $hashValue = $hashItems[$urlIndex]
                  }
                  Test-StaticHash -ArchivePath $archivePath -HashValue $hashValue -Context "$relativePath ($($archConfig.Name), URL $($urlIndex + 1))"
                  # MSI files must be inspected with Windows Installer administrative extraction,
                  # matching Scoop's Expand-MsiArchive behavior. 7-Zip only lists app.cab and MSI tables.
                  if ($pathPart.EndsWith('.msi')) {
                    $msiRoot = Join-Path $env:RUNNER_TEMP "manifest-msi-$downloadCounter"
                    $sourceRoot = Join-Path $msiRoot 'SourceDir'
                    $msiLog = Join-Path $msiRoot 'msi.log'
                    New-Item -ItemType Directory -Path $sourceRoot -Force | Out-Null

                    $msiArguments = @('/a', "`"$archivePath`"", '/qn', "TARGETDIR=`"$sourceRoot`"", '/L*V', "`"$msiLog`"")
                    $msiProcess = Start-Process -FilePath "$env:WINDIR\System32\msiexec.exe" -ArgumentList $msiArguments -Wait -PassThru -ErrorAction Stop
                    $msiExitCode = $msiProcess.ExitCode
                    if ($msiExitCode -notin @(0, 3010)) {
                      $logTail = if (Test-Path -LiteralPath $msiLog) { (Get-Content -LiteralPath $msiLog -Tail 12) -join ' ' } else { 'No MSI log was produced.' }
                      throw "$relativePath ($($archConfig.Name)): msiexec /a failed with exit code $msiExitCode. $logTail"
                    }

                    $msiFiles = @(Get-ChildItem -LiteralPath $sourceRoot -File -Recurse)
                    if ($msiFiles.Count -eq 0) {
                      $logTail = if (Test-Path -LiteralPath $msiLog) { (Get-Content -LiteralPath $msiLog -Tail 12) -join ' ' } else { 'No MSI log was produced.' }
                      throw "$relativePath ($($archConfig.Name)): administrative extraction produced no files. $logTail"
                    }

                    $msiRelativePaths = @($msiFiles | ForEach-Object {
                      $relative = [System.IO.Path]::GetRelativePath($sourceRoot, $_.FullName).Replace('\', '/')
                      if ($extractTo) { "$extractTo/$relative" } else { $relative }
                    })
                    $archiveFiles += $msiRelativePaths
                    $exeDetails = @($msiFiles | Where-Object { $_.Extension -ieq '.exe' } | ForEach-Object {
                      $relative = [System.IO.Path]::GetRelativePath($sourceRoot, $_.FullName).Replace('\', '/')
                      $versionInfo = $_.VersionInfo
                      "{0} | {1} bytes | Product='{2}' | Description='{3}' | Version='{4}'" -f $relative, $_.Length, $versionInfo.ProductName, $versionInfo.FileDescription, $versionInfo.ProductVersion
                    })
                    Write-Host "$relativePath ($($archConfig.Name)): msiexec /a extracted $($msiFiles.Count) file(s). Executables: $($exeDetails -join '; ')"
                    $inspectableArchives++
                    $archiveOrdinal++
                    Remove-Item -LiteralPath $msiRoot -Recurse -Force -ErrorAction SilentlyContinue
                    Remove-Item -LiteralPath $archivePath -Force -ErrorAction SilentlyContinue
                    continue
                  }


                  # Use the same unpacker as Scoop for Inno Setup files. 7-Zip only sees PE
                  # sections for many installer EXEs and cannot verify the application's paths.
                  if (-not $isForced7zip -and $pathPart.EndsWith('.exe') -and $config.Contains('innosetup') -and $config['innosetup'] -eq $true) {
                    if ([string]::IsNullOrWhiteSpace($innounpPath)) {
                      $innounpZip = Join-Path $env:RUNNER_TEMP 'innounp-2.zip'
                      $innounpRoot = Join-Path $env:RUNNER_TEMP 'innounp-helper'
                      Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/jrathlev/InnoUnpacker-Windows-GUI/032d64c782efc6b36766d8f9c3b1b2f042144a58/innounp-2/bin/innounp-2.zip' -OutFile $innounpZip -MaximumRedirection 10 -TimeoutSec 120
                      Test-StaticHash -ArchivePath $innounpZip -HashValue '10fce27b6344b7674d5625cc34afca1c88c12183d957c6d93e401097fa2556cd' -Context 'innounp helper'
                      New-Item -ItemType Directory -Path $innounpRoot -Force | Out-Null
                      Add-Content -LiteralPath $sevenZipLog -Value "`n[innounp helper extraction] $innounpZip"
                      & $sevenZipPath x $innounpZip "-o$innounpRoot" '-y' 2>&1 | Tee-Object -FilePath $sevenZipLog -Append | Out-Null
                      if ($LASTEXITCODE -ne 0) {
                        throw 'Could not extract the innounp helper archive.'
                      }
                      $innounpExe = Get-ChildItem -LiteralPath $innounpRoot -Filter 'innounp.exe' -File -Recurse | Select-Object -First 1
                      if ($null -eq $innounpExe) {
                        throw 'The innounp helper archive did not contain innounp.exe.'
                      }
                      $innounpPath = $innounpExe.FullName
                    }

                    $innoExtractRoot = Join-Path $env:RUNNER_TEMP "manifest-inno-$downloadCounter"
                    New-Item -ItemType Directory -Path $innoExtractRoot -Force | Out-Null
                    $innounpOutput = & $innounpPath '-x' "-d$innoExtractRoot" $archivePath '-y' '-c{app}' 2>&1
                    $innounpExitCode = $LASTEXITCODE
                    if ($innounpExitCode -ne 0) {
                      $innounpDetails = ($innounpOutput | Select-Object -Last 8) -join ' '
                      throw "$relativePath ($($archConfig.Name)): innounp extraction failed with exit code $innounpExitCode. $innounpDetails"
                    }

                    $innoFiles = @(Get-ChildItem -LiteralPath $innoExtractRoot -File -Recurse)
                    if ($innoFiles.Count -eq 0) {
                      throw "$relativePath ($($archConfig.Name)): innounp succeeded but extracted no files from the Inno Setup app directory."
                    }
                    $archiveFiles += @($innoFiles | ForEach-Object {
                      $relative = [System.IO.Path]::GetRelativePath($innoExtractRoot, $_.FullName).Replace('\', '/')
                      if ($extractTo) { "$extractTo/$relative" } else { $relative }
                    })
                    $exeDetails = @($innoFiles | Where-Object { $_.Extension -ieq '.exe' } | ForEach-Object {
                      $relative = [System.IO.Path]::GetRelativePath($innoExtractRoot, $_.FullName).Replace('\', '/')
                      $versionInfo = $_.VersionInfo
                      $stream = [System.IO.File]::OpenRead($_.FullName)
                      try {
                        $reader = [System.IO.BinaryReader]::new($stream)
                        try {
                          $stream.Position = 0x3C
                          $peOffset = $reader.ReadInt32()
                          $stream.Position = $peOffset + 4
                          $machine = $reader.ReadUInt16()
                          $architecture = switch ($machine) {
                            0x014c { 'x86' }
                            0x8664 { 'x64' }
                            0xAA64 { 'ARM64' }
                            default { 'unknown (0x{0:X4})' -f $machine }
                          }
                        } finally {
                          $reader.Dispose()
                        }
                      } finally {
                        $stream.Dispose()
                      }
                      "{0} | {1} | {2} bytes | Product='{3}' | Description='{4}' | Original='{5}' | Version='{6}'" -f $relative, $architecture, $_.Length, $versionInfo.ProductName, $versionInfo.FileDescription, $versionInfo.OriginalFilename, $versionInfo.ProductVersion
                    })
                    Write-Host "$relativePath ($($archConfig.Name)): innounp extracted $($innoFiles.Count) app file(s). Executables: $($exeDetails -join '; ')"
                    $inspectableArchives++
                    $archiveOrdinal++
                    Remove-Item -LiteralPath $innoExtractRoot -Recurse -Force -ErrorAction SilentlyContinue
                    Remove-Item -LiteralPath $archivePath -Force -ErrorAction SilentlyContinue
                    continue
                  }

                  # 7-Zip lists a .tar.gz as one GZip payload. Expand that outer layer first,
                  # then inspect the inner .tar just as Scoop does during installation.
                  $listingArchivePath = $archivePath
                  $tarExtractRoot = $null
                  if ($isCompressedTar) {
                    $tarExtractRoot = Join-Path $env:RUNNER_TEMP "manifest-tar-$downloadCounter"
                    New-Item -ItemType Directory -Path $tarExtractRoot -Force | Out-Null
                    Add-Content -LiteralPath $sevenZipLog -Value "`n[compressed tar extraction] $archivePath"
                    & $sevenZipPath x $archivePath "-o$tarExtractRoot" '-y' 2>&1 | Tee-Object -FilePath $sevenZipLog -Append | Out-Null
                    if ($LASTEXITCODE -ne 0) {
                      throw "$relativePath ($($archConfig.Name)): 7-Zip could not decompress the outer tar compression layer."
                    }
                    $innerTar = Get-ChildItem -LiteralPath $tarExtractRoot -File -Recurse -Filter '*.tar' | Select-Object -First 1
                    if ($null -eq $innerTar) {
                      throw "$relativePath ($($archConfig.Name)): compressed tar archive did not produce an inner .tar file."
                    }
                    $listingArchivePath = $innerTar.FullName
                  }

                  Add-Content -LiteralPath $sevenZipLog -Value "`n[archive listing] $listingArchivePath"
                  $listing = & $sevenZipPath l -slt $listingArchivePath 2>&1
                  $listing | Tee-Object -FilePath $sevenZipLog -Append | Out-Null
                  if ($LASTEXITCODE -ne 0) {
                    throw "$relativePath ($($archConfig.Name)): the asset could not be listed as an archive. URL: $downloadUrl"
                  }
                  $records = @()
                  $current = $null
                  foreach ($lineObject in $listing) {
                    $line = [string]$lineObject
                    if ($line -match '^Path = (.*)$') {
                      if ($null -ne $current) {
                        $records += [PSCustomObject]$current
                      }
                      $current = [ordered]@{ Path = $Matches[1]; Folder = $false }
                    } elseif ($null -ne $current -and $line -match '^Folder = \+$') {
                      $current.Folder = $true
                    }
                  }
                  if ($null -ne $current) {
                    $records += [PSCustomObject]$current
                  }
                  if ($records.Count -le 1) {
                    throw "$relativePath ($($archConfig.Name)): archive listing contained no file entries: $downloadUrl"
                  }
                  $entries = @($records | Select-Object -Skip 1)
                  $normalizedEntries = @()
                  foreach ($entry in $entries) {
                    $entryPath = ConvertTo-ArchivePath ([string]$entry.Path)
                    if (-not [string]::IsNullOrWhiteSpace($entryPath)) {
                      $normalizedEntries += [PSCustomObject]@{ Path = $entryPath; Folder = [bool]$entry.Folder }
                    }
                  }

                  # Scoop's #/dl.7z flow first extracts the NSIS container into $dir.
                  # Electron Builder stores the application payload in a nested app-64.7z.
                  # Reproduce both extraction layers and inspect the files that will live in Scoop.
                  if ($isForced7zip -and $assetPath.EndsWith('.exe')) {
                    $outerRoot = Join-Path $env:RUNNER_TEMP "manifest-nsis-$downloadCounter"
                    New-Item -ItemType Directory -Path $outerRoot -Force | Out-Null
                    Add-Content -LiteralPath $sevenZipLog -Value "`n[forced dl.7z outer NSIS extraction] $archivePath"
                    & $sevenZipPath x $archivePath "-o$outerRoot" '-xr!*.nsis' '-y' 2>&1 | Tee-Object -FilePath $sevenZipLog -Append | Out-Null
                    if ($LASTEXITCODE -ne 0) {
                      throw "$relativePath ($($archConfig.Name)): 7-Zip could not extract the outer NSIS container."
                    }

                    $innerArchive = Get-ChildItem -LiteralPath $outerRoot -Filter 'app-64.7z' -File -Recurse | Select-Object -First 1
                    if ($null -ne $innerArchive) {
                      $payloadRoot = Join-Path $env:RUNNER_TEMP "manifest-payload-$downloadCounter"
                      New-Item -ItemType Directory -Path $payloadRoot -Force | Out-Null
                      Add-Content -LiteralPath $sevenZipLog -Value "`n[nested app-64.7z payload extraction] $($innerArchive.FullName)"
                      & $sevenZipPath x $innerArchive.FullName "-o$payloadRoot" '-y' 2>&1 | Tee-Object -FilePath $sevenZipLog -Append | Out-Null
                      if ($LASTEXITCODE -ne 0) {
                        throw "$relativePath ($($archConfig.Name)): 7-Zip could not extract the inner Electron app-64.7z payload."
                      }

                      $payloadFiles = @(Get-ChildItem -LiteralPath $payloadRoot -File -Recurse)
                      if ($payloadFiles.Count -eq 0) {
                        throw "$relativePath ($($archConfig.Name)): app-64.7z extracted no application files."
                      }
                      $archiveFiles += @($payloadFiles | ForEach-Object {
                        [System.IO.Path]::GetRelativePath($payloadRoot, $_.FullName).Replace('\', '/')
                      })
                      $exeDetails = @($payloadFiles | Where-Object { $_.Extension -ieq '.exe' } | ForEach-Object {
                        [System.IO.Path]::GetRelativePath($payloadRoot, $_.FullName).Replace('\', '/')
                      })
                      if ($relativePath -ieq 'bucket/edge-drop.json') {
                        $requiredPayloadPaths = @('Edge-Drop.exe', 'resources/app.asar', 'resources/startup/EdgeDropStartup.exe')
                        $payloadPaths = @($payloadFiles | ForEach-Object {
                          [System.IO.Path]::GetRelativePath($payloadRoot, $_.FullName).Replace('\', '/')
                        })
                        $missingPayloadPaths = @($requiredPayloadPaths | Where-Object { $_ -notin $payloadPaths })
                        if ($missingPayloadPaths.Count -gt 0) {
                          throw "${relativePath}: missing required application files after nested extraction: $($missingPayloadPaths -join ', ')"
                        }
                        Write-Host "${relativePath}: all required Edge-Drop application files exist in the simulated Scoop version directory."
                      }
                      Write-Host "$relativePath ($($archConfig.Name)): extracted inner Electron payload into the simulated Scoop app directory ($($payloadFiles.Count) files). EXEs: $($exeDetails -join ', ')"
                      $inspectableArchives++
                      $archiveOrdinal++
                      Remove-Item -LiteralPath $outerRoot -Recurse -Force -ErrorAction SilentlyContinue
                      Remove-Item -LiteralPath $payloadRoot -Recurse -Force -ErrorAction SilentlyContinue
                      Remove-Item -LiteralPath $archivePath -Force -ErrorAction SilentlyContinue
                      continue
                    }

                    Remove-Item -LiteralPath $outerRoot -Recurse -Force -ErrorAction SilentlyContinue
                  }

                  if (-not [string]::IsNullOrWhiteSpace($extractDir)) {
                    $prefix = ConvertTo-ArchivePath $extractDir
                    $hasExtractDirectory = @($normalizedEntries | Where-Object {
                      $_.Path.Equals($prefix, [System.StringComparison]::OrdinalIgnoreCase) -or
                      $_.Path.StartsWith("$prefix/", [System.StringComparison]::OrdinalIgnoreCase)
                    }).Count -gt 0
                    if (-not $hasExtractDirectory) {
                      $sample = ($normalizedEntries | Select-Object -First 12 | ForEach-Object { $_.Path }) -join ', '
                      throw "$relativePath ($($archConfig.Name)): extract_dir '$extractDir' does not exist in the archive. First entries: $sample"
                    }
                    $prefixWithSlash = "$prefix/"
                    foreach ($entry in $normalizedEntries) {
                      if (-not $entry.Folder -and $entry.Path.StartsWith($prefixWithSlash, [System.StringComparison]::OrdinalIgnoreCase)) {
                        $relative = $entry.Path.Substring($prefixWithSlash.Length)
                        if ($extractTo) { $archiveFiles += "$extractTo/$relative" } else { $archiveFiles += $relative }
                      }
                    }
                    Write-Host "extract_dir '$extractDir' exists in the archive."
                  } else {
                    $archiveFiles += @($normalizedEntries | Where-Object { -not $_.Folder } | ForEach-Object {
                      if ($extractTo) { "$extractTo/$($_.Path)" } else { $_.Path }
                    })
                  }
                  $inspectableArchives++
                  $archiveOrdinal++
                  if ($null -ne $tarExtractRoot) {
                    Remove-Item -LiteralPath $tarExtractRoot -Recurse -Force -ErrorAction SilentlyContinue
                  }
                  Remove-Item -LiteralPath $archivePath -Force -ErrorAction SilentlyContinue
                }

                if ($inspectableArchives -eq 0) {
                  if ($extractDirs.Count -gt 0) {
                    throw "$relativePath ($($archConfig.Name)): extract_dir was specified, but no archive could be inspected."
                  }
                  Write-Warning "$relativePath ($($archConfig.Name)): no inspectable archive URLs; executable-path validation was skipped."
                  continue
                }

                $expectedPaths = @()
                $expectedPaths += @(Get-LaunchPaths $config['bin'])
                $expectedPaths += @(Get-LaunchPaths $config['shortcuts'])
                $expectedPaths = @($expectedPaths | Sort-Object -Unique)
                $missing = @()
                foreach ($expected in $expectedPaths) {
                  $found = $false
                  foreach ($actualPath in $archiveFiles) {
                    if ([string]::Equals($actualPath, $expected, [System.StringComparison]::OrdinalIgnoreCase)) {
                      $found = $true
                      break
                    }
                  }
                  if (-not $found) {
                    $missing += $expected
                  }
                }

                if ($missing.Count -gt 0) {
                  $hasInstallHooks = $config.Contains('pre_install') -or $config.Contains('post_install')
                  if ($uninspectedAssets -gt 0 -or $hasInstallHooks) {
                    Write-Warning "$relativePath ($($archConfig.Name)): could not confirm these launch paths from the inspected archives: $($missing -join ', '). The manifest has non-archive assets or install hooks."
                  } else {
                    $candidates = @($archiveFiles | Where-Object { $_ -match '(?i)(\.exe$|FILE_Exe$)' } | Select-Object -First 30)
                    if ($candidates.Count -eq 0) {
                      $candidates = @($archiveFiles | Select-Object -First 20)
                    }
                    $candidateText = if ($candidates.Count -gt 0) { " Candidate paths: $($candidates -join ', ')" } else { " No file paths were listed." }
                    throw "$relativePath ($($archConfig.Name)): these bin/shortcut files are missing after extraction: $($missing -join ', ').$candidateText"
                  }
                } elseif ($expectedPaths.Count -gt 0) {
                  Write-Host "$relativePath ($($archConfig.Name)): all declared bin/shortcut paths exist in the inspected archive contents."
                }
              }
            } catch {
              $failures += "$relativePath : $($_.Exception.Message)"
              Write-Host "FAILED: $relativePath" -ForegroundColor Red
              Write-Host $_.Exception.Message -ForegroundColor Red
            }
          }

          Write-Host ''
          Write-Host '============================================================'
          Write-Host 'Archive validation summary'
          Write-Host "Manifests checked: $($manifestPaths.Count)"
          Write-Host "Failures: $($failures.Count)"
          Write-Host '============================================================'
          if ($failures.Count -gt 0) {
            if (Test-Path -LiteralPath $sevenZipLog -PathType Leaf) {
              Write-Host '--- 7zip.log (last 120 lines) ---' -ForegroundColor Yellow
              Get-Content -LiteralPath $sevenZipLog -Tail 120 | ForEach-Object { Write-Host $_ }
              Write-Host '--- end 7zip.log ---' -ForegroundColor Yellow
            }
            $failures | ForEach-Object { Write-Host $_ -ForegroundColor Red }
            exit 1
          }
          Write-Host 'All changed manifests passed archive path validation.' -ForegroundColor Green
          $validatedManifestsJson = ConvertTo-Json -InputObject @($manifestPaths) -Compress
          "validated_manifests=$validatedManifestsJson" >> $env:GITHUB_OUTPUT
          "validated_head_sha=$validatedHeadSha" >> $env:GITHUB_OUTPUT


      - name: Upload 7-Zip diagnostic log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 7zip-log-${{ github.run_id }}
          path: ${{ runner.temp }}/7zip.log
          if-no-files-found: ignore
          retention-days: 7
