name: Manual NixThis Install Path Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-and-inspect:
    name: Install NixThis and inspect its files
    runs-on: windows-2022

    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Scoop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install NixThis from the local manifest
        id: install_nixthis
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $diagRoot = Join-Path $env:RUNNER_TEMP "nixthis-diagnostics"
          New-Item -ItemType Directory -Path $diagRoot -Force | Out-Null

          $manifestPath = Join-Path $env:GITHUB_WORKSPACE "bucket\nixthis.json"
          $installLog = Join-Path $diagRoot "scoop-install.log"

          if (!(Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Manifest not found: $manifestPath"
          }

          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          "Manifest: $manifestPath" | Tee-Object -FilePath $installLog
          "Manifest version: $($manifest.version)" | Tee-Object -FilePath $installLog -Append
          "Scoop root: $env:USERPROFILE\scoop" | Tee-Object -FilePath $installLog -Append

          scoop install $manifestPath 2>&1 | Tee-Object -FilePath $installLog -Append
          if ($LASTEXITCODE -ne 0) {
            throw "scoop install failed with exit code $LASTEXITCODE. See the scoop-install.log artifact."
          }

          "install_exit_code=0" >> $env:GITHUB_OUTPUT

      - name: Inspect actual installation paths and files
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install_nixthis.outcome }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $diagRoot = Join-Path $env:RUNNER_TEMP "nixthis-diagnostics"
          New-Item -ItemType Directory -Path $diagRoot -Force | Out-Null
          $reportPath = Join-Path $diagRoot "nixthis-install-report.txt"
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE "bucket\nixthis.json"
          $appRoot = Join-Path $env:USERPROFILE "scoop\apps\nixthis"
          $current = Join-Path $appRoot "current"
          $persistRoot = Join-Path $env:USERPROFILE "scoop\persist\nixthis"
          $lines = [System.Collections.Generic.List[string]]::new()
          $files = @()
          $missingLaunchPaths = [System.Collections.Generic.List[string]]::new()
          $versionDirectory = $null
          $currentTarget = $null

          $lines.Add("NixThis Scoop installation diagnostic")
          $lines.Add("====================================")
          $lines.Add("Install step outcome: $env:INSTALL_OUTCOME")
          $lines.Add("Runner user: $env:USERPROFILE")
          $lines.Add("Scoop root: $(Join-Path $env:USERPROFILE 'scoop')")
          $lines.Add("App root: $appRoot")
          $lines.Add("Current path: $current")
          $lines.Add("Persist root: $persistRoot")
          $lines.Add("")

          if (Test-Path -LiteralPath $manifestPath -PathType Leaf) {
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            $lines.Add("Manifest version: $($manifest.version)")
            $lines.Add("Download URL: $($manifest.url)")
            $lines.Add("Manifest extract_dir: $($manifest.extract_dir)")
            $lines.Add("Manifest persist: $($manifest.persist -join ', ')")
            $lines.Add("")
          }

          if (Test-Path -LiteralPath $current) {
            $currentItem = Get-Item -LiteralPath $current -Force
            $targetValue = $currentItem.Target
            if ($targetValue -is [array]) {
              $targetValue = $targetValue | Select-Object -First 1
            }

            if (![string]::IsNullOrWhiteSpace([string]$targetValue)) {
              $currentTarget = [string]$targetValue
              if (![System.IO.Path]::IsPathRooted($currentTarget)) {
                $currentTarget = Join-Path $appRoot $currentTarget
              }
              $versionDirectory = [System.IO.Path]::GetFullPath($currentTarget)
            } else {
              $versionDirectory = (Resolve-Path -LiteralPath $current).Path
              $currentTarget = "(current is not a junction; resolved path shown)"
            }

            $lines.Add("Current junction target: $currentTarget")
            $lines.Add("Resolved version directory: $versionDirectory")
            $lines.Add("")

            if (Test-Path -LiteralPath $versionDirectory -PathType Container) {
              $lines.Add("Top-level entries:")
              Get-ChildItem -LiteralPath $versionDirectory -Force |
                Sort-Object Name |
                ForEach-Object {
                  if ($_.PSIsContainer) {
                    $lines.Add("  [DIR]  $($_.FullName)")
                  } else {
                    $lines.Add("  [FILE] $($_.FullName) ($($_.Length) bytes)")
                  }
                }

              $files = @(Get-ChildItem -LiteralPath $versionDirectory -File -Recurse -Force |
                Sort-Object FullName)

              $lines.Add("")
              $lines.Add("All installed files ($($files.Count)):")
              foreach ($file in $files) {
                $lines.Add("  $($file.FullName) [$($file.Length) bytes]")
              }

              $lines.Add("")
              $lines.Add("Key files:")
              foreach ($pattern in @("NixThis.exe", "Settings.json", "Filters.ini", "Sightings.log")) {
                $matches = @($files | Where-Object { $_.Name -ieq $pattern })
                if ($matches.Count -gt 0) {
                  foreach ($item in $matches) {
                    $lines.Add("  FOUND: $($item.FullName)")
                  }
                } else {
                  $lines.Add("  NOT FOUND in app directory: $pattern")
                }
              }
            }
          } else {
            $lines.Add("INSTALLATION DIRECTORY NOT FOUND: $current")
          }

          if (Test-Path -LiteralPath $manifestPath -PathType Leaf) {
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            $launchPaths = [System.Collections.Generic.List[string]]::new()

            if ($manifest.bin -is [string]) {
              $launchPaths.Add([string]$manifest.bin)
            } elseif ($null -ne $manifest.bin) {
              foreach ($binItem in $manifest.bin) {
                if ($binItem -is [string]) {
                  $launchPaths.Add([string]$binItem)
                } elseif ($binItem -is [array] -and $binItem.Count -gt 0) {
                  $launchPaths.Add([string]$binItem[0])
                }
              }
            }

            if ($null -ne $manifest.shortcuts) {
              foreach ($shortcut in $manifest.shortcuts) {
                if ($shortcut -is [array] -and $shortcut.Count -gt 0) {
                  $launchPaths.Add([string]$shortcut[0])
                }
              }
            }

            $lines.Add("")
            $lines.Add("Manifest launch-path checks:")
            foreach ($launchPath in @($launchPaths | Sort-Object -Unique)) {
              $candidate = Join-Path $current ($launchPath -replace '/', '\')
              if (Test-Path -LiteralPath $candidate -PathType Leaf) {
                $lines.Add("  PASS: $candidate")
              } else {
                $lines.Add("  FAIL: $candidate")
                $missingLaunchPaths.Add($launchPath)
              }
            }

            $lines.Add("")
            $lines.Add("Persist-path checks:")
            $persistItems = @()
            if ($manifest.persist -is [string]) {
              $persistItems = @([string]$manifest.persist)
            } elseif ($null -ne $manifest.persist) {
              $persistItems = @($manifest.persist | ForEach-Object { [string]$_ })
            }

            foreach ($persistItem in $persistItems) {
              $relativePersist = $persistItem -replace '/', '\'
              $appDataPath = Join-Path $current $relativePersist
              $persistDataPath = Join-Path $persistRoot $relativePersist
              $lines.Add("  Declared persist item: $persistItem")
              $lines.Add("  App path: $appDataPath (exists: $(Test-Path -LiteralPath $appDataPath))")
              $lines.Add("  Persist path: $persistDataPath (exists: $(Test-Path -LiteralPath $persistDataPath))")
            }
          }

          if (Test-Path -LiteralPath $persistRoot -PathType Container) {
            $persistFiles = @(Get-ChildItem -LiteralPath $persistRoot -File -Recurse -Force | Sort-Object FullName)
            $lines.Add("")
            $lines.Add("Persisted files ($($persistFiles.Count)):")
            foreach ($file in $persistFiles) {
              $lines.Add("  $($file.FullName) [$($file.Length) bytes]")
            }
          } else {
            $lines.Add("")
            $lines.Add("Persist directory has not been created: $persistRoot")
          }

          $lines.Add("")
          $lines.Add("The app executable was not launched by this workflow.")
          Set-Content -LiteralPath $reportPath -Value $lines -Encoding utf8
          Get-Content -LiteralPath $reportPath | ForEach-Object { Write-Host $_ }

          @(
            "## NixThis install diagnostic",
            "",
            "- Install step: **$env:INSTALL_OUTCOME**",
            "- Scoop app directory: `$appRoot`",
            "- Current path: `$current`",
            "- Resolved version directory: `$versionDirectory`",
            "- Files found: **$($files.Count)**",
            "- Persist directory: `$persistRoot`",
            "- Full file listing is available in the `nixthis-install-diagnostics` artifact.",
            ""
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          if ($env:INSTALL_OUTCOME -eq "success" -and $missingLaunchPaths.Count -gt 0) {
            throw "Declared launch paths missing after installation: $($missingLaunchPaths -join ', '). See the diagnostic artifact."
          }

      - name: Upload installation report and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nixthis-install-diagnostics
          path: ${{ runner.temp }}/nixthis-diagnostics/
          if-no-files-found: warn
          retention-days: 7
