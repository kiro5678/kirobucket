name: FxSound Install Test

on:
  push:
    branches:
      - master
    paths:
      - "bucket/fxsound-beta.json"
      - ".github/workflows/fxsound.yml"
  pull_request:
    paths:
      - "bucket/fxsound-beta.json"
      - ".github/workflows/fxsound.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fxsound:
    name: Install / Driver / Audio / Uninstall
    runs-on: windows-2022

    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Scoop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate manifest and checkver
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifest = Join-Path $env:GITHUB_WORKSPACE "bucket\fxsound-beta.json"
          $json = Get-Content $manifest -Raw | ConvertFrom-Json

          if ($json.version -ne "1.2.16.0") {
              throw "Unexpected FxSound beta manifest version: $($json.version)"
          }

          $releasePage = (Invoke-WebRequest -Uri "https://github.com/fxsound2/fxsound-app/releases" -UseBasicParsing).Content
          $match = [regex]::Match($releasePage, 'Version ([\d.]+) \(Beta\)')
          if (!$match.Success) {
              throw "Could not detect the current FxSound Beta version on the official releases page."
          }

          $latestBeta = $match.Groups[1].Value
          Write-Host "Official FxSound Beta version: $latestBeta"

          if ($latestBeta -ne $json.version) {
              throw "Manifest version $($json.version) does not match the official FxSound Beta version $latestBeta."
          }

      - name: Install FxSound from local manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifest = Join-Path $env:GITHUB_WORKSPACE "bucket\fxsound-beta.json"
          scoop install $manifest

      - name: Verify installation location and files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $appRoot = Join-Path $env:USERPROFILE "scoop\apps\fxsound-beta"
          $current = Join-Path $appRoot "current"
          $exe = Join-Path $current "FxSound.exe"
          $setup = Join-Path $current "fxsound_setup.exe"

          if (!(Test-Path $exe -PathType Leaf)) {
              throw "FxSound.exe was not installed under Scoop: $exe"
          }

          if (Test-Path $setup) {
              throw "The setup bootstrapper was left inside the Scoop app directory: $setup"
          }

          $arp = Get-ItemProperty @(
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          ) -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -eq 'FxSound' } |
              Select-Object -First 1

          if (!$arp) {
              throw "FxSound MSI is not registered in Windows."
          }

          if ($arp.InstallLocation) {
              $normalizedArp = [IO.Path]::GetFullPath($arp.InstallLocation).TrimEnd('\')
              $normalizedCurrent = [IO.Path]::GetFullPath($current).TrimEnd('\')
              if ($normalizedArp -ne $normalizedCurrent) {
                  throw "FxSound InstallLocation is not the Scoop directory. Found: $normalizedArp"
              }
          }

          Write-Host "FxSound application directory: $current"
          Write-Host "Registered InstallLocation: $($arp.InstallLocation)"
          Get-ChildItem $current -Force | Select-Object Name, Length

      - name: Verify FxSound driver is installed and active
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $driverFile = Join-Path $env:WINDIR "System32\drivers\fxvad.sys"
          if (!(Test-Path $driverFile -PathType Leaf)) {
              throw "FxSound driver file was not installed: $driverFile"
          }

          $drivers = Get-CimInstance Win32_PnPSignedDriver |
              Where-Object {
                  $_.DeviceName -match "FxSound Audio Enhancer" -or
                  $_.DriverName -match "fxvad" -or
                  $_.InfName -match "fxvad"
              }

          if (!$drivers) {
              throw "FxSound virtual audio driver was not registered with Windows."
          }

          $drivers | Format-List DeviceName, DriverName, DriverVersion, InfName, IsSigned

          $device = Get-PnpDevice -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.FriendlyName -match "FxSound Audio Enhancer" -or
                  $_.InstanceId -match "FXVAD"
              }

          if (!$device) {
              throw "FxSound virtual audio device was not detected."
          }

          $device | Format-Table Status, Class, FriendlyName, InstanceId -AutoSize

          if (@($device | Where-Object Status -ne "OK").Count -gt 0) {
              throw "FxSound virtual audio device is not in OK state."
          }

          $fxdiag = Join-Path $env:USERPROFILE "scoop\apps\fxsound-beta\current\fxdiag.exe"
          if (!(Test-Path $fxdiag -PathType Leaf)) {
              throw "fxdiag.exe was not installed."
          }

          $diagRaw = & $fxdiag --json
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($diagRaw)) {
              throw "FxSound fxdiag.exe failed."
          }

          $diag = $diagRaw | ConvertFrom-Json
          $fxDevice = @($diag.devices) |
              Where-Object { $_.deviceName -eq "FxSound Audio Enhancer" } |
              Select-Object -First 1

          if (!$fxDevice) {
              throw "FxSound Audio Enhancer was not reported by fxdiag.exe."
          }

          $fxDevice | Format-List

          if ($fxDevice.state -ne "Active") {
              throw "FxSound Audio Enhancer is not Active according to fxdiag.exe. State: $($fxDevice.state)"
          }

      - name: Start FxSound and enable processing
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $current = Join-Path $env:USERPROFILE "scoop\apps\fxsound-beta\current"
          $exe = Join-Path $current "FxSound.exe"

          Get-Process -Name FxSound -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue

          Start-Process -FilePath $exe -ArgumentList '--run_minimized'
          Start-Sleep -Seconds 4

          $process = Get-Process -Name FxSound -ErrorAction SilentlyContinue
          if (!$process) {
              throw "FxSound process did not start."
          }

          & $exe --power=1
          Start-Sleep -Seconds 2
          & $exe --status

          $statusPath = Join-Path $env:APPDATA "FxSound\status.json"
          if (!(Test-Path $statusPath -PathType Leaf)) {
              throw "FxSound status.json was not created."
          }

          $status = Get-Content $statusPath -Raw | ConvertFrom-Json
          $status | ConvertTo-Json -Depth 10

          if ($status.power -ne $true) {
              throw "FxSound processing could not be enabled. Current power state: $($status.power)"
          }

          if ([string]::IsNullOrWhiteSpace([string]$status.selected_output)) {
              throw "FxSound has no selected output device."
          }

          Write-Host "FxSound selected output: $($status.selected_output)"
          Write-Host "FxSound processing power: $($status.power)"

      - name: Exercise FxSound audio render path
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $project = Join-Path $env:RUNNER_TEMP "FxSoundAudioSmokeTest"
          New-Item -ItemType Directory -Force -Path $project | Out-Null

          Push-Location $project
          try {
              dotnet new console --framework net8.0
              dotnet add package NAudio --version 2.2.1
              using System;
              using System.Linq;
              using System.Threading;
              using NAudio.CoreAudioApi;
              using NAudio.Wave;
              using NAudio.Wave.SampleProviders;
              
              class Program
              {
                  static int Main()
                  {
                      using var enumerator = new MMDeviceEnumerator();
              
                      var device = enumerator
                          .EnumerateAudioEndPoints(DataFlow.Render, DeviceState.Active)
                          .FirstOrDefault(d =>
                              d.FriendlyName.Equals(
                                  "FxSound Audio Enhancer",
                                  StringComparison.OrdinalIgnoreCase));
              
                      if (device == null)
                      {
                          Console.Error.WriteLine("FxSound Audio Enhancer render endpoint was not found.");
                          return 2;
                      }
              
                      Console.WriteLine($"Endpoint: {device.FriendlyName}");
                      Console.WriteLine($"State: {device.State}");
                      Console.WriteLine($"Format: {device.AudioClient.MixFormat}");
              
                      var format = device.AudioClient.MixFormat;
              
                      var signal = new SignalGenerator(format.SampleRate, format.Channels)
                      {
                          Frequency = 1000,
                          Gain = 0.05,
                          Type = SignalGeneratorType.Sin
                      }.Take(TimeSpan.FromSeconds(3));
              
                      using var output = new WasapiOut(
                          device,
                          AudioClientShareMode.Shared,
                          true,
                          100);
              
                      output.Init(signal.ToWaveProvider16());
                      output.Play();
              
                      var deadline = DateTime.UtcNow.AddSeconds(8);
              
                      while (output.PlaybackState == PlaybackState.Playing &&
                             DateTime.UtcNow < deadline)
                      {
                          Thread.Sleep(100);
                      }
              
                      output.Stop();
              
                      if (DateTime.UtcNow >= deadline)
                      {
                          Console.Error.WriteLine("Audio playback did not complete.");
                          return 3;
                      }
              
                      Console.WriteLine(
                          "WASAPI opened the FxSound virtual render endpoint and accepted a real audio stream.");
              
                      return 0;
                  }
              }

              dotnet run --configuration Release
          }
          finally {
              Pop-Location
          }

      - name: Uninstall FxSound
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-Process -Name FxSound -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
          scoop uninstall fxsound-beta

      - name: Verify uninstall
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $appRoot = Join-Path $env:USERPROFILE "scoop\apps\fxsound-beta"
          if (Test-Path $appRoot) {
              throw "Scoop FxSound directory still exists: $appRoot"
          }

          $device = Get-PnpDevice -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.FriendlyName -match "FxSound Audio Enhancer" -or
                  $_.InstanceId -match "FXVAD"
              }

          if ($device) {
              $device | Format-Table Status, Class, FriendlyName, InstanceId -AutoSize
              throw "FxSound virtual audio device is still installed after uninstall."
          }

          $driverFile = Join-Path $env:WINDIR "System32\drivers\fxvad.sys"
          if (Test-Path $driverFile) {
              throw "FxSound driver file still exists after uninstall: $driverFile"
          }

          $driverStore = pnputil /enum-drivers 2>$null | Out-String
          if ($driverStore -match "(?im)fxvad") {
              throw "FxSound driver package is still present in the Windows Driver Store."
          }

          Write-Host "FxSound application, virtual audio device, and driver package were removed."
