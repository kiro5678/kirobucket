name: NixanDeck Scoop Extraction Test

on:
  push:
    branches:
      - master
    paths:
      - "bucket/nixandeck.json"
      - ".github/workflows/nixandeck-msix-package-test.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "bucket/nixandeck.json"
      - ".github/workflows/nixandeck-msix-package-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoop-extraction-test:
    name: Extract MSIX with Scoop and test unpackaged app
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify manifest, extract MSIX with Scoop and test install lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $manifest = Get-Content -LiteralPath 'bucket/nixandeck.json' -Raw -Encoding utf8 | ConvertFrom-Json -ErrorAction Stop
          if ($manifest.version -ne '1.0.0-beta.1') { throw "Unexpected NixanDeck version: $($manifest.version)" }

          foreach ($field in @('pre_install', 'post_install', 'post_uninstall')) {
            $source = @($manifest.$field) -join [Environment]::NewLine
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $details = $errors | ForEach-Object { "$($_.Extent.StartLineNumber): $($_.Message)" }
              throw "$field PowerShell syntax validation failed: $($details -join '; ')"
            }
            Write-Host "$field PowerShell AST: PASS"
          }

          $latestResponse = Invoke-WebRequest -Uri ([string]$manifest.checkver.url) -MaximumRedirection 10 -TimeoutSec 60
          $versionMatch = [regex]::Match([string]$latestResponse.Content, [string]$manifest.checkver.regex)
          if (-not $versionMatch.Success -or $versionMatch.Groups[1].Value -ne $manifest.version) {
            throw 'The manifest version does not match the current upstream release.'
          }
          Write-Host "checkver: PASS ($($manifest.version))"

          $releaseApi = "https://api.github.com/repos/nurikhsanuddin/nixandeck/releases/tags/v$($manifest.version)"
          $releaseResponse = Invoke-WebRequest -Uri $releaseApi -MaximumRedirection 10 -TimeoutSec 60
          $hashRegex = [string]$manifest.autoupdate.architecture.'64bit'.hash.regex
          $hashMatch = [regex]::Match([string]$releaseResponse.Content, $hashRegex)
          if (-not $hashMatch.Success) { throw 'The autoupdate hash regex did not find the official ZIP digest.' }
          $expectedHash = ([string]$manifest.architecture.'64bit'.hash).ToLowerInvariant()
          if ($hashMatch.Groups[1].Value.ToLowerInvariant() -ne $expectedHash) {
            throw 'The manifest hash does not match the official GitHub release digest.'
          }

          $root = Join-Path $env:RUNNER_TEMP 'nixandeck-scoop-extraction-test'
          $zipPath = Join-Path $root 'NixanDeck-Windows11-x64.zip'
          $scoopSource = Join-Path $root 'scoop-decompress.ps1'
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          Invoke-WebRequest -Uri ([string]$manifest.architecture.'64bit'.url) -OutFile $zipPath -MaximumRedirection 10 -TimeoutSec 900
          $actualHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "ZIP SHA-256 mismatch. Expected $expectedHash; received $actualHash." }
          Write-Host "Official release ZIP SHA-256: PASS ($actualHash)"

          # Scoop's install command loads this same official decompression library before running manifest hooks.
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/ScoopInstaller/Scoop/master/lib/decompress.ps1' -OutFile $scoopSource -MaximumRedirection 10 -TimeoutSec 120
          . $scoopSource
          if (-not (Get-Command Expand-ZipArchive -ErrorAction SilentlyContinue)) {
            throw 'The official Scoop Expand-ZipArchive function was not loaded.'
          }

          $scoopRoot = Join-Path $root 'scoop'
          $app = 'nixandeck'
          $global = $false
          $dir = Join-Path $scoopRoot 'apps\nixandeck\1.0.0-beta.1'
          $original_dir = $dir
          $persist_dir = Join-Path $scoopRoot 'persist\nixandeck'
          $scoopdir = $scoopRoot
          function appdir($name, $isGlobal) { Join-Path (Join-Path $scoopRoot 'apps') $name }
          New-Item -ItemType Directory -Path $dir, $persist_dir -Force | Out-Null

          # Scoop first extracts the manifest's outer ZIP to the version directory.
          Expand-Archive -LiteralPath $zipPath -DestinationPath $dir -Force
          foreach ($name in @('NixanDeck.msix', 'NixanDeck.cer', 'Install.bat')) {
            if (-not (Test-Path -LiteralPath (Join-Path $dir $name) -PathType Leaf)) {
              throw "The official ZIP is missing $name."
            }
          }

          # Recreate the previous Scoop manifest's per-user MSIX registration so pre_install migration is exercised.
          if (@(Get-AppxPackage -Name 'NixanDeck' -ErrorAction SilentlyContinue).Count -gt 0) {
            throw 'The hosted runner unexpectedly already has a NixanDeck package registration.'
          }
          $testCertificatePath = Join-Path $dir 'NixanDeck.cer'
          $testCertificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($testCertificatePath)
          $testStore = [System.Security.Cryptography.X509Certificates.X509Store]::new('TrustedPeople', 'LocalMachine')
          $testStore.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
          $testCertificateWasPresent = $false
          try {
            $testCertificateWasPresent = @($testStore.Certificates | Where-Object { $_.Thumbprint -eq $testCertificate.Thumbprint }).Count -gt 0
            if (-not $testCertificateWasPresent) { $testStore.Add($testCertificate) }
          } finally { $testStore.Close() }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "NIXANDECK_TEST_CERT_THUMBPRINT=$($testCertificate.Thumbprint)"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "NIXANDECK_TEST_CERT_ADDED=$([string](-not $testCertificateWasPresent))"

          if ($PSVersionTable.PSVersion.Major -ge 6) {
            Import-Module Appx -UseWindowsPowerShell -ErrorAction Stop
          } else {
            Import-Module Appx -ErrorAction Stop
          }
          Add-AppxPackage -Path (Join-Path $dir 'NixanDeck.msix') -ErrorAction Stop
          if (@(Get-AppxPackage -Name 'NixanDeck' -ErrorAction SilentlyContinue).Count -lt 1) {
            throw 'Could not register the previous NixanDeck MSIX package for the migration test.'
          }
          Write-Host 'Previous MSIX registration setup for migration test: PASS'

          # Execute the actual manifest pre_install hook with Scoop's official decompression function.
          Invoke-Expression (@($manifest.pre_install) -join [Environment]::NewLine)

          if (@(Get-AppxPackage -Name 'NixanDeck' -ErrorAction SilentlyContinue).Count -ne 0) {
            throw 'The manifest did not remove the previous current-user NixanDeck MSIX registration.'
          }
          Write-Host 'Previous current-user MSIX registration removal: PASS'

          $appDir = Join-Path $dir 'app'
          $exePath = Join-Path $appDir 'WinMacShell.exe'
          $watchdogPath = Join-Path $appDir 'NixanDeck.Watchdog.exe'
          foreach ($required in @('AppxManifest.xml', 'WinMacShell.exe', 'WinMacShell.dll', 'NixanDeck.Watchdog.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $appDir $required) -PathType Leaf)) {
              throw "The extracted MSIX payload is missing $required."
            }
          }
          foreach ($removed in @('NixanDeck.msix', 'NixanDeck.msix.zip', 'NixanDeck.cer', 'Install.bat')) {
            if (Test-Path -LiteralPath (Join-Path $dir $removed)) {
              throw "The manifest left the installer/source file in the Scoop version directory: $removed"
            }
          }
          if ($manifest.shortcuts[0][0] -ne 'app\WinMacShell.exe') {
            throw 'The Start Menu shortcut does not target the extracted WinMacShell.exe.'
          }
          Write-Host 'Scoop Expand-ZipArchive MSIX extraction and payload layout: PASS'

          $packageManifest = [xml](Get-Content -LiteralPath (Join-Path $appDir 'AppxManifest.xml') -Raw)
          $identity = $packageManifest.SelectSingleNode("//*[local-name()='Identity']")
          if ($identity.GetAttribute('Name') -ne 'NixanDeck' -or
              $identity.GetAttribute('Publisher') -ne 'CN=NixanDeck' -or
              $identity.GetAttribute('ProcessorArchitecture') -ne 'x64') {
            throw 'The extracted MSIX identity or architecture is incorrect.'
          }
          Write-Host 'Extracted MSIX manifest identity: PASS'

          # Simulate Scoop persist_data: it creates the persist target and links the named directory into $dir.
          $persistedDataPath = Join-Path $persist_dir 'WinMacShell'
          New-Item -ItemType Directory -Path $persistedDataPath -Force | Out-Null
          New-Item -ItemType Junction -Path (Join-Path $dir 'WinMacShell') -Target $persistedDataPath | Out-Null

          # This runner is disposable. Refuse to touch any pre-existing user profile data.
          $appDataPath = Join-Path $env:APPDATA 'WinMacShell'
          $localAppDataPath = Join-Path $env:LOCALAPPDATA 'WinMacShell'
          if (Test-Path -LiteralPath $appDataPath) { throw "Unexpected pre-existing AppData path; refusing to modify it: $appDataPath" }
          if (Test-Path -LiteralPath $localAppDataPath) { throw "Unexpected pre-existing LocalAppData path; refusing to modify it: $localAppDataPath" }

          # Seed the old MSIX-style config folder to verify migration into Scoop persist.
          New-Item -ItemType Directory -Path $appDataPath -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $appDataPath 'legacy-config-test.txt') -Value 'Existing NixanDeck settings must be preserved.'

          $runKeyPath = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $runKeyExisted = Test-Path -LiteralPath $runKeyPath
          $runKeyBefore = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Software\Microsoft\Windows\CurrentVersion\Run', $false)
          $hadNixanDeckValue = $false
          $oldNixanDeckValue = $null
          $oldNixanDeckKind = [Microsoft.Win32.RegistryValueKind]::String
          if ($null -ne $runKeyBefore) {
            try {
              $hadNixanDeckValue = $runKeyBefore.GetValueNames() -contains 'NixanDeck'
              if ($hadNixanDeckValue) {
                $oldNixanDeckValue = $runKeyBefore.GetValue('NixanDeck', $null, 'DoNotExpandEnvironmentNames')
                $oldNixanDeckKind = $runKeyBefore.GetValueKind('NixanDeck')
              }
            } finally { $runKeyBefore.Dispose() }
          }

          $watchdogIdsBefore = @((Get-Process -Name 'NixanDeck.Watchdog' -ErrorAction SilentlyContinue).Id)
          $directProcess = $null
          $directLaunchPassed = $false
          $watchdogSeen = $false

          try {
            Invoke-Expression (@($manifest.post_install) -join [Environment]::NewLine)

            $appDataItem = Get-Item -LiteralPath $appDataPath -Force
            if (($appDataItem.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -eq 0) {
              throw 'post_install did not create the AppData junction.'
            }
            $junctionMarker = Join-Path $persistedDataPath '.scoop-appdata-junction'
            if (-not (Test-Path -LiteralPath $junctionMarker -PathType Leaf)) {
              throw 'The AppData junction ownership marker was not created in Scoop persist.'
            }
            if (-not (Test-Path -LiteralPath (Join-Path $persistedDataPath 'legacy-config-test.txt') -PathType Leaf)) {
              throw 'The pre-existing AppData settings were not migrated to Scoop persist.'
            }
            if (-not (Test-Path -LiteralPath $runKeyPath)) {
              throw 'post_install did not prepare the current-user Run registry key.'
            }
            Write-Host 'AppData migration, persist junction and startup registry preparation: PASS'

            $directProcess = Start-Process -FilePath $exePath -WorkingDirectory $appDir -PassThru
            Write-Host "Unpackaged WinMacShell PID: $($directProcess.Id)"
            $exitedEarly = $directProcess.WaitForExit(15000)
            $directProcess.Refresh()
            if ($exitedEarly -or $directProcess.HasExited) {
              throw "WinMacShell.exe exited before the 15-second test window. Exit code: $($directProcess.ExitCode)"
            }
            $directLaunchPassed = $true
            Write-Host 'Unpackaged direct launch remained running for 15 seconds: PASS'

            $configPath = Join-Path $persistedDataPath 'config.json'
            if (-not (Test-Path -LiteralPath $configPath -PathType Leaf)) {
              throw 'WinMacShell did not write its config.json through the AppData junction into Scoop persist.'
            }
            $registeredKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Software\Microsoft\Windows\CurrentVersion\Run', $false)
            if ($null -eq $registeredKey) { throw 'The app did not leave a readable Run registry key.' }
            try {
              $registeredValue = [string]$registeredKey.GetValue('NixanDeck', $null, 'DoNotExpandEnvironmentNames')
            } finally { $registeredKey.Dispose() }
            if ([string]::IsNullOrWhiteSpace($registeredValue) -or $registeredValue -notmatch '(?i)WinMacShell\.exe') {
              throw 'Unpackaged NixanDeck did not register its own startup entry.'
            }
            Write-Host 'Application config persistence and unpackaged startup fallback: PASS'
          } finally {
            if ($null -ne $directProcess) {
              $directProcess.Refresh()
              if (-not $directProcess.HasExited) {
                Stop-Process -Id $directProcess.Id -Force -ErrorAction SilentlyContinue
                [void]$directProcess.WaitForExit(10000)
              }
            }

            $watchdogDeadline = [DateTime]::UtcNow.AddSeconds(15)
            do {
              $newWatchdogs = @(Get-Process -Name 'NixanDeck.Watchdog' -ErrorAction SilentlyContinue |
                Where-Object { $watchdogIdsBefore -notcontains $_.Id })
              if ($newWatchdogs.Count -eq 0) { break }
              $watchdogSeen = $true
              Start-Sleep -Milliseconds 500
            } while ([DateTime]::UtcNow -lt $watchdogDeadline)

            if ($watchdogSeen -and $newWatchdogs.Count -eq 0) {
              Write-Host 'Watchdog exit after main app termination: PASS'
            } elseif ($newWatchdogs.Count -gt 0) {
              foreach ($watchdog in $newWatchdogs) {
                Stop-Process -Id $watchdog.Id -Force -ErrorAction SilentlyContinue
              }
              throw 'The test-created NixanDeck Watchdog did not exit after the main application.'
            } else {
              Write-Warning 'The Watchdog process was not observed during the direct-launch test.'
            }

            try {
              Invoke-Expression (@($manifest.post_uninstall) -join [Environment]::NewLine)
            } finally {
              # Restore the runner's original NixanDeck Run value and Run-key existence.
              $runKeyWritable = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Software\Microsoft\Windows\CurrentVersion\Run', $true)
              if ($null -ne $runKeyWritable) {
                try {
                  if ($hadNixanDeckValue) {
                    $runKeyWritable.SetValue('NixanDeck', $oldNixanDeckValue, $oldNixanDeckKind)
                  } else {
                    $runKeyWritable.DeleteValue('NixanDeck', $false)
                  }
                } finally { $runKeyWritable.Dispose() }
              }
              if (-not $runKeyExisted) {
                $currentVersionKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Software\Microsoft\Windows\CurrentVersion', $true)
                if ($null -ne $currentVersionKey) {
                  try {
                    $runKeyCheck = $currentVersionKey.OpenSubKey('Run', $false)
                    if ($null -ne $runKeyCheck) {
                      try {
                        if ($runKeyCheck.GetValueNames().Count -eq 0 -and $runKeyCheck.GetSubKeyNames().Count -eq 0) {
                          $currentVersionKey.DeleteSubKey('Run', $false)
                        }
                      } finally { $runKeyCheck.Dispose() }
                    }
                  } finally { $currentVersionKey.Dispose() }
                }
              }
            }

            if (Test-Path -LiteralPath $appDataPath) {
              $remainingAppData = Get-Item -LiteralPath $appDataPath -Force
              if (($remainingAppData.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
                Remove-Item -LiteralPath $appDataPath -Force
              } else {
                Remove-Item -LiteralPath $appDataPath -Recurse -Force
              }
            }
            if (Test-Path -LiteralPath $localAppDataPath) {
              Remove-Item -LiteralPath $localAppDataPath -Recurse -Force
            }
          }

          if (-not $directLaunchPassed) { throw 'The unpackaged direct-launch test did not complete.' }
          if (Test-Path -LiteralPath $appDataPath) { throw 'post_uninstall left the AppData junction behind.' }
          if (-not (Test-Path -LiteralPath (Join-Path $persistedDataPath 'config.json') -PathType Leaf)) {
            throw 'post_uninstall removed user settings from Scoop persist.'
          }
          if (Test-Path -LiteralPath (Join-Path $persistedDataPath '.scoop-appdata-junction')) {
            throw 'post_uninstall left the AppData ownership marker in persisted data.'
          }
          $postRemovalRunKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Software\Microsoft\Windows\CurrentVersion\Run', $false)
          if ($null -ne $postRemovalRunKey) {
            try {
              $remainingRunValue = [string]$postRemovalRunKey.GetValue('NixanDeck', $null, 'DoNotExpandEnvironmentNames')
            } finally { $postRemovalRunKey.Dispose() }
            if ($remainingRunValue -match '(?i)WinMacShell\.exe') {
              throw 'post_uninstall left the NixanDeck startup registry value behind.'
            }
          }
          if (Test-Path -LiteralPath $localAppDataPath) {
            throw 'post_uninstall left the NixanDeck watchdog PID directory behind.'
          }

          Write-Host 'post_uninstall junction, startup and runtime cleanup: PASS'
          @(
            '## NixanDeck Scoop extraction test'
            ''
            '- Official release SHA-256: PASS'
            '- Scoop Expand-ZipArchive MSIX extraction: PASS'
            '- MSIX identity and x64 payload validation: PASS'
            '- Legacy AppData settings migration: PASS'
            '- Unpackaged direct launch (15 seconds): PASS'
            '- Watchdog exit after application termination: PASS'
            '- Application config persisted in Scoop persist: PASS'
            '- Unpackaged startup registry fallback: PASS'
            '- post_uninstall cleanup while retaining persisted settings: PASS'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

          Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue

      - name: Remove test-created NixanDeck runtime state
        if: always()
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.Major -ge 6) {
            Import-Module Appx -UseWindowsPowerShell -ErrorAction SilentlyContinue
          } else {
            Import-Module Appx -ErrorAction SilentlyContinue
          }
          Get-AppxPackage -Name 'NixanDeck' -ErrorAction SilentlyContinue | Remove-AppxPackage -ErrorAction SilentlyContinue
          $testThumbprint = $env:NIXANDECK_TEST_CERT_THUMBPRINT
          if ($testThumbprint -and $env:NIXANDECK_TEST_CERT_ADDED -eq 'True') {
            $testStore = [System.Security.Cryptography.X509Certificates.X509Store]::new('TrustedPeople', 'LocalMachine')
            $testStore.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
            try {
              $testMatches = $testStore.Certificates.Find(
                [System.Security.Cryptography.X509Certificates.X509FindType]::FindByThumbprint,
                $testThumbprint,
                $false
              )
              foreach ($testMatch in $testMatches) { $testStore.Remove($testMatch) }
            } finally { $testStore.Close() }
          }
          $appDataPath = Join-Path $env:APPDATA 'WinMacShell'
          $localAppDataPath = Join-Path $env:LOCALAPPDATA 'WinMacShell'
          foreach ($path in @($appDataPath, $localAppDataPath)) {
            if (Test-Path -LiteralPath $path) {
              $item = Get-Item -LiteralPath $path -Force
              if (($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
                Remove-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue
              } else {
                Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
              }
            }
          }
