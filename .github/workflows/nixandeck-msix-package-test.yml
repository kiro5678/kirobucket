name: NixanDeck MSIX Package Test

on:
  push:
    branches:
      - master
      - nixandeck-nonportable
    paths:
      - "bucket/nixandeck.json"
      - ".github/workflows/nixandeck-msix-package-test.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "bucket/nixandeck.json"
      - ".github/workflows/nixandeck-msix-package-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msix-install-test:
    name: Verify ZIP, certificate, MSIX install and Scoop hooks
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release metadata, archive and manifest scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $manifest = Get-Content -LiteralPath 'bucket/nixandeck.json' -Raw -Encoding utf8 | ConvertFrom-Json -ErrorAction Stop
          if ($manifest.version -ne '1.0.0-beta.1') { throw "Unexpected manifest version: $($manifest.version)" }

          foreach ($field in @('pre_install', 'post_install', 'pre_uninstall')) {
            $source = @($manifest.$field) -join [Environment]::NewLine
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $details = $errors | ForEach-Object { "$($_.Extent.StartLineNumber): $($_.Message)" }
              throw "$field PowerShell syntax validation failed: $($details -join '; ')"
            }
            Write-Host "$field PowerShell AST: PASS"
          }

          $latestUrl = [string]$manifest.checkver.url
          $latestResponse = Invoke-WebRequest -Uri $latestUrl -MaximumRedirection 10 -TimeoutSec 60
          $versionMatch = [regex]::Match([string]$latestResponse.Content, [string]$manifest.checkver.regex)
          if (-not $versionMatch.Success) { throw 'The checkver regex did not find a release tag in the GitHub API response.' }
          $latestVersion = $versionMatch.Groups[1].Value
          if ($latestVersion -ne $manifest.version) {
            throw "Manifest version $($manifest.version) does not match upstream latest version $latestVersion."
          }
          Write-Host "checkver: PASS ($latestVersion)"

          $releaseApi = "https://api.github.com/repos/nurikhsanuddin/nixandeck/releases/tags/v$($manifest.version)"
          $releaseResponse = Invoke-WebRequest -Uri $releaseApi -MaximumRedirection 10 -TimeoutSec 60
          $hashMatch = [regex]::Match([string]$releaseResponse.Content, [string]$manifest.autoupdate.architecture.'64bit'.hash.regex)
          if (-not $hashMatch.Success) { throw 'The autoupdate hash regex did not find the ZIP asset digest.' }
          $apiHash = $hashMatch.Groups[1].Value.ToLowerInvariant()
          $expectedHash = ([string]$manifest.architecture.'64bit'.hash).ToLowerInvariant()
          if ($apiHash -ne $expectedHash) { throw "Manifest SHA-256 $expectedHash differs from GitHub asset digest $apiHash." }
          Write-Host "autoupdate hash extraction: PASS ($apiHash)"

          $root = Join-Path $env:RUNNER_TEMP 'nixandeck-msix-test'
          $archivePath = Join-Path $root 'NixanDeck-Windows11-x64.zip'
          $extractDir = Join-Path $root 'release'
          $packageDir = Join-Path $root 'msix'
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          $downloadUrl = [string]$manifest.architecture.'64bit'.url
          Invoke-WebRequest -Uri $downloadUrl -OutFile $archivePath -MaximumRedirection 10 -TimeoutSec 900
          $actualHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "ZIP SHA-256 mismatch. Expected $expectedHash; got $actualHash." }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractDir -Force

          foreach ($name in @('Install.bat', 'NixanDeck.cer', 'NixanDeck.msix')) {
            if (-not (Test-Path -LiteralPath (Join-Path $extractDir $name) -PathType Leaf)) {
              throw "The official ZIP is missing $name."
            }
          }
          Write-Host "Official ZIP integrity and payload layout: PASS"

          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
            $command = Get-Command '7z.exe' -ErrorAction SilentlyContinue
            if ($null -eq $command) { throw '7-Zip was not found on the Windows runner.' }
            $sevenZip = $command.Source
          }

          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          & $sevenZip x (Join-Path $extractDir 'NixanDeck.msix') "-o$packageDir" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "7-Zip could not inspect NixanDeck.msix (exit code $LASTEXITCODE)." }

          $appxManifestPath = Join-Path $packageDir 'AppxManifest.xml'
          if (-not (Test-Path -LiteralPath $appxManifestPath -PathType Leaf)) { throw 'AppxManifest.xml is missing from the MSIX package.' }
          [xml]$appxManifest = Get-Content -LiteralPath $appxManifestPath -Raw
          $identity = $appxManifest.SelectSingleNode("//*[local-name()='Identity']")
          $application = $appxManifest.SelectSingleNode("//*[local-name()='Application']")
          if ($identity.GetAttribute('Name') -ne 'NixanDeck') { throw "Unexpected MSIX identity name: $($identity.GetAttribute('Name'))" }
          if ($identity.GetAttribute('Publisher') -ne 'CN=NixanDeck') { throw "Unexpected MSIX publisher: $($identity.GetAttribute('Publisher'))" }
          if ($identity.GetAttribute('ProcessorArchitecture') -ne 'x64') { throw 'The MSIX package is not x64.' }
          if ($application.GetAttribute('Id') -ne 'NixanDeckApp') { throw 'The expected NixanDeckApp application ID was not found.' }
          $appExecutable = $application.GetAttribute('Executable')
          if (-not (Test-Path -LiteralPath (Join-Path $packageDir $appExecutable) -PathType Leaf)) {
            throw "The MSIX application executable is missing: $appExecutable"
          }

          $msixPath = Join-Path $extractDir 'NixanDeck.msix'
          $msixZipPath = Join-Path $root 'NixanDeck.msix.zip'
          Copy-Item -LiteralPath $msixPath -Destination $msixZipPath -Force

          $scoopDecompressSource = Join-Path $root 'scoop-decompress.ps1'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/ScoopInstaller/Scoop/master/lib/decompress.ps1' -OutFile $scoopDecompressSource -MaximumRedirection 10 -TimeoutSec 120
          . $scoopDecompressSource

          $scoopExtractDir = Join-Path $root 'scoop-native-extracted'
          New-Item -ItemType Directory -Path $scoopExtractDir -Force | Out-Null
          Expand-ZipArchive -Path $msixZipPath -DestinationPath $scoopExtractDir

          foreach ($requiredPath in @('AppxManifest.xml', $appExecutable)) {
            if (-not (Test-Path -LiteralPath (Join-Path $scoopExtractDir $requiredPath) -PathType Leaf)) {
              throw "Scoop native Expand-ZipArchive did not extract required MSIX file: $requiredPath"
            }
          }
          Write-Host 'Scoop native Expand-ZipArchive MSIX extraction: PASS'

          $makeAppx = $null
          $kitsRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          if (Test-Path -LiteralPath $kitsRoot -PathType Container) {
            $makeAppx = Get-ChildItem -LiteralPath $kitsRoot -Filter 'MakeAppx.exe' -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Directory.Name -eq 'x64' } |
              Sort-Object -Property FullName -Descending |
              Select-Object -First 1
          }
          if ($null -eq $makeAppx) {
            $certKitMakeAppx = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\App Certification Kit\MakeAppx.exe'
            if (Test-Path -LiteralPath $certKitMakeAppx -PathType Leaf) {
              $makeAppx = Get-Item -LiteralPath $certKitMakeAppx
            }
          }

          if ($null -ne $makeAppx) {
            $makeAppxDir = Join-Path $root 'makeappx-extracted'
            New-Item -ItemType Directory -Path $makeAppxDir -Force | Out-Null
            & $makeAppx.FullName unpack /v /p $msixPath /d $makeAppxDir
            if ($LASTEXITCODE -ne 0) {
              throw "Microsoft MakeAppx failed to unpack NixanDeck.msix (exit code $LASTEXITCODE)."
            }
            foreach ($requiredPath in @('AppxManifest.xml', $appExecutable)) {
              if (-not (Test-Path -LiteralPath (Join-Path $makeAppxDir $requiredPath) -PathType Leaf)) {
                throw "Microsoft MakeAppx did not extract required MSIX file: $requiredPath"
              }
            }
            Write-Host "Microsoft MakeAppx official MSIX unpack: PASS ($($makeAppx.FullName))"
          } else {
            Write-Warning 'MakeAppx.exe is not installed on this runner; Microsoft SDK unpack comparison was skipped.'
          }

          Write-Host "Unpackaged direct-launch smoke test"
          $directExe = Join-Path $scoopExtractDir $appExecutable
          $watchdogExe = Join-Path $scoopExtractDir 'NixanDeck.Watchdog.exe'
          if (-not (Test-Path -LiteralPath $directExe -PathType Leaf)) {
            throw "The extracted application executable is missing: $directExe"
          }
          if (-not (Test-Path -LiteralPath $watchdogExe -PathType Leaf)) {
            throw 'The watchdog executable is missing; direct launch was skipped to avoid leaving the shell hidden on the test runner.'
          }

          $watchdogIdsBefore = @((Get-Process -Name 'NixanDeck.Watchdog' -ErrorAction SilentlyContinue).Id)
          $startupKeyPath = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $hadStartupKey = Test-Path -LiteralPath $startupKeyPath
          if (-not $hadStartupKey) {
            New-Item -Path $startupKeyPath -Force | Out-Null
          }
          $startupKey = Get-Item -LiteralPath $startupKeyPath -ErrorAction Stop
          $hadStartupValue = $startupKey.GetValueNames() -contains 'NixanDeck'
          $oldStartupValue = if ($hadStartupValue) { $startupKey.GetValue('NixanDeck', $null, 'DoNotExpandEnvironmentNames') } else { $null }
          $oldStartupKind = if ($hadStartupValue) { $startupKey.GetValueKind('NixanDeck') } else { [Microsoft.Win32.RegistryValueKind]::String }
          $savedLocalAppData = $env:LOCALAPPDATA
          $testLocalAppData = Join-Path $root 'unpackaged-localappdata'
          New-Item -ItemType Directory -Path $testLocalAppData -Force | Out-Null
          $env:LOCALAPPDATA = $testLocalAppData
          $directProcess = $null
          $directLaunchPassed = $false

          try {
            $directProcess = Start-Process -FilePath $directExe -WorkingDirectory $scoopExtractDir -PassThru
            Write-Host "Unpackaged WinMacShell PID: $($directProcess.Id)"
            $exited = $directProcess.WaitForExit(15000)
            $directProcess.Refresh()
            if ($exited -or $directProcess.HasExited) {
              Write-Host "Unpackaged process exited before the 15-second smoke-test window. Exit code: $($directProcess.ExitCode)"
            } else {
              $directLaunchPassed = $true
              Write-Host 'Unpackaged direct launch stayed running for 15 seconds: PASS'
            }
          } finally {
            if ($null -ne $directProcess) {
              $directProcess.Refresh()
              if (-not $directProcess.HasExited) {
                Stop-Process -Id $directProcess.Id -Force -ErrorAction SilentlyContinue
                [void]$directProcess.WaitForExit(10000)
              }
            }

            # Confirm that the bundled watchdog started, then allow it to restore the Windows shell after the smoke test.
            $watchdogSeen = $false
            $watchdogStartDeadline = [DateTime]::UtcNow.AddSeconds(5)
            do {
              $newWatchdogs = @(Get-Process -Name 'NixanDeck.Watchdog' -ErrorAction SilentlyContinue |
                Where-Object { $watchdogIdsBefore -notcontains $_.Id })
              if ($newWatchdogs.Count -gt 0) {
                $watchdogSeen = $true
                break
              }
              Start-Sleep -Milliseconds 250
            } while ([DateTime]::UtcNow -lt $watchdogStartDeadline)

            $watchdogExitDeadline = [DateTime]::UtcNow.AddSeconds(15)
            do {
              $newWatchdogs = @(Get-Process -Name 'NixanDeck.Watchdog' -ErrorAction SilentlyContinue |
                Where-Object { $watchdogIdsBefore -notcontains $_.Id })
              if ($newWatchdogs.Count -eq 0) { break }
              Start-Sleep -Milliseconds 500
            } while ([DateTime]::UtcNow -lt $watchdogExitDeadline)

            if ($watchdogSeen -and $newWatchdogs.Count -eq 0) {
              Write-Host 'Watchdog exit after main app termination: PASS'
            } elseif (-not $watchdogSeen) {
              Write-Warning 'The bundled watchdog process was not observed during the direct-launch test.'
            } else {
              Write-Warning 'The watchdog did not exit in time; stopping only the test-created watchdog process.'
              foreach ($watchdog in $newWatchdogs) {
                Stop-Process -Id $watchdog.Id -Force -ErrorAction SilentlyContinue
              }
            }

            $env:LOCALAPPDATA = $savedLocalAppData
            $registryRelativePath = 'Software\Microsoft\Windows\CurrentVersion\Run'
            $currentStartupKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey($registryRelativePath, $true)
            if ($null -ne $currentStartupKey) {
              try {
                if ($hadStartupValue) {
                  $currentStartupKey.SetValue('NixanDeck', $oldStartupValue, $oldStartupKind)
                } else {
                  $currentStartupKey.DeleteValue('NixanDeck', $false)
                }
              } finally {
                $currentStartupKey.Dispose()
              }
            }
            if (-not $hadStartupKey) {
              $currentVersionKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Software\Microsoft\Windows\CurrentVersion', $true)
              if ($null -ne $currentVersionKey) {
                try {
                  $runKeyCheck = $currentVersionKey.OpenSubKey('Run', $false)
                  if ($null -ne $runKeyCheck) {
                    try {
                      if ($runKeyCheck.GetValueNames().Count -eq 0 -and $runKeyCheck.GetSubKeyNames().Count -eq 0) {
                        $currentVersionKey.DeleteSubKey('Run', $false)
                      }
                    } finally {
                      $runKeyCheck.Dispose()
                    }
                  }
                } finally {
                  $currentVersionKey.Dispose()
                }
              }
            }
            Remove-Item -LiteralPath $testLocalAppData -Recurse -Force -ErrorAction SilentlyContinue
          }

          if ($directLaunchPassed) {
            'Unpackaged direct launch: PASS (process remained alive for 15 seconds)' |
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          } else {
            'Unpackaged direct launch: FAIL (process exited before 15 seconds)' |
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            throw 'NixanDeck could not remain running when launched directly from the extracted MSIX payload without Add-AppxPackage.'
          }

          $certPath = Join-Path $extractDir 'NixanDeck.cer'
          $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($certPath)
          if ($certificate.Subject -ne $identity.GetAttribute('Publisher')) {
            throw "Certificate subject '$($certificate.Subject)' does not match MSIX publisher '$($identity.GetAttribute('Publisher'))'."
          }
          Write-Host "MSIX identity, architecture, executable and publisher certificate: PASS"

          $app = 'nixandeck'
          $dir = $extractDir
          function is_admin {
            $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
            $principal = [Security.Principal.WindowsPrincipal]::new($identity)
            return $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          }
          if (-not (is_admin)) { throw 'The Windows Actions runner is not elevated; this test requires machine certificate-store access.' }

          $appxInstalled = $false
          try {
            $preInstall = [scriptblock]::Create((@($manifest.pre_install) -join [Environment]::NewLine))
            & $preInstall
            $launcherPath = Join-Path $dir 'NixanDeck.cmd'
            if (-not (Test-Path -LiteralPath $launcherPath -PathType Leaf)) { throw 'The manifest did not create NixanDeck.cmd.' }
            if ([string]$manifest.shortcuts[0][0] -ne 'NixanDeck.cmd') { throw 'The manifest shortcut does not point to the generated launcher.' }

            $postInstall = [scriptblock]::Create((@($manifest.post_install) -join [Environment]::NewLine))
            & $postInstall
            $packages = @(Get-AppxPackage -Name 'NixanDeck' -ErrorAction SilentlyContinue)
            if ($packages.Count -lt 1) { throw 'The post_install hook did not register the NixanDeck MSIX package.' }
            $appxInstalled = $true
            Write-Host "Scoop post_install MSIX registration: PASS ($($packages[0].PackageFullName))"

            $preUninstall = [scriptblock]::Create((@($manifest.pre_uninstall) -join [Environment]::NewLine))
            & $preUninstall
            $remaining = @(Get-AppxPackage -Name 'NixanDeck' -ErrorAction SilentlyContinue)
            if ($remaining.Count -ne 0) { throw 'The pre_uninstall hook did not remove the NixanDeck MSIX registration.' }
            $appxInstalled = $false
            Write-Host 'Scoop pre_uninstall MSIX removal: PASS'
          } finally {
            if ($appxInstalled) {
              if ($PSVersionTable.PSVersion.Major -ge 6) { Import-Module Appx -UseWindowsPowerShell 3>$null -ErrorAction SilentlyContinue }
              Get-AppxPackage -Name 'NixanDeck' -ErrorAction SilentlyContinue | Remove-AppxPackage -ErrorAction SilentlyContinue
            }
            $store = [System.Security.Cryptography.X509Certificates.X509Store]::new('TrustedPeople', 'LocalMachine')
            $store.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
            try {
              $matches = $store.Certificates.Find(
                [System.Security.Cryptography.X509Certificates.X509FindType]::FindByThumbprint,
                $certificate.Thumbprint,
                $false
              )
              foreach ($match in $matches) { $store.Remove($match) }
            } finally {
              $store.Close()
            }
          }
