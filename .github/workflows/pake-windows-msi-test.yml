name: Verify Pake Windows MSI Installers

on:
  pull_request:
    branches:
      - master
    paths:
      - 'bucket/pake-*.json'
      - '.github/workflows/pake-windows-msi-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-uninstall:
    name: Install and uninstall all Pake MSI packages
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify hashes, install, and uninstall each Pake MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $bucket = Join-Path $env:GITHUB_WORKSPACE 'bucket'

          $manifestFiles = @(
            Get-ChildItem -LiteralPath $bucket -Filter 'pake-*.json' -File |
              Where-Object { $_.BaseName -ne 'pake-desktop' } |
              Sort-Object Name
          )
          if ($manifestFiles.Count -ne 16) {
            throw "Expected 16 Pake wrapper manifests, found $($manifestFiles.Count)."
          }

          $workRoot = Join-Path $env:RUNNER_TEMP 'pake-msi-test'
          $downloadRoot = Join-Path $workRoot 'downloads'
          $installRoot = Join-Path $workRoot 'installations'
          $logRoot = Join-Path $workRoot 'logs'
          foreach ($path in @($downloadRoot, $installRoot, $logRoot)) {
            New-Item -ItemType Directory -Path $path -Force | Out-Null
          }

          $installer = New-Object -ComObject WindowsInstaller.Installer
          $shell = New-Object -ComObject WScript.Shell
          $productCodes = @{}
          $results = [System.Collections.Generic.List[object]]::new()
          $shortcutRoots = @(
            (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'),
            (Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs'),
            (Join-Path $env:USERPROFILE 'Desktop'),
            (Join-Path $env:PUBLIC 'Desktop')
          )

          function Get-MsiProperty {
            param(
              [Parameter(Mandatory)] $Database,
              [Parameter(Mandatory)] [string] $Name
            )
            $tick = [char]96
            $query = 'SELECT ' + $tick + 'Value' + $tick + ' FROM ' + $tick + 'Property' + $tick + ' WHERE ' + $tick + 'Property' + $tick + "='$Name'"
            $view = $Database.OpenView($query)
            try {
              $view.Execute()
              $record = $view.Fetch()
              if ($null -eq $record) { return '' }
              return [string]$record.StringData(1)
            } finally {
              $view.Close()
            }
          }

          function Find-InstalledShortcuts {
            param([Parameter(Mandatory)] [string] $InstallDir)
            $found = [System.Collections.Generic.List[string]]::new()
            foreach ($root in $shortcutRoots) {
              if (-not (Test-Path -LiteralPath $root -PathType Container)) { continue }
              $links = Get-ChildItem -LiteralPath $root -Filter '*.lnk' -File -Recurse -ErrorAction SilentlyContinue
              foreach ($link in $links) {
                try {
                  $target = $shell.CreateShortcut($link.FullName).TargetPath
                  if ($target -and $target.StartsWith($InstallDir, [System.StringComparison]::OrdinalIgnoreCase)) {
                    $found.Add($link.FullName)
                  }
                } catch {
                  Write-Output "Could not inspect shortcut $($link.FullName): $($_.Exception.Message)"
                }
              }
            }
            return $found.ToArray()
          }

          foreach ($manifestFile in $manifestFiles) {
            $manifest = Get-Content -LiteralPath $manifestFile.FullName -Raw | ConvertFrom-Json -ErrorAction Stop
            $appId = $manifestFile.BaseName
            $rawUrl = ([string]$manifest.url -split '#', 2)[0]
            if ([string]$manifest.url -notmatch '#/setup\.msi_$') {
              throw "$appId does not use the required Scoop MSI filename fragment."
            }
            if ($rawUrl -notmatch '/([^/]+)_x64\.msi$') {
              throw "$appId does not point to a versioned x64 MSI asset: $rawUrl"
            }
            $expectedProductName = $Matches[1]
            if ($manifest.version -ne '3.18.0') {
              throw "$appId has unexpected version $($manifest.version)."
            }
            if ($manifest.hash -notmatch '^[0-9a-fA-F]{64}$') {
              throw "$appId does not contain a valid SHA-256 hash."
            }
            if ($manifest.checkver.jsonpath -ne '$.tag_name' -or $manifest.checkver.regex -ne '^V(?<version>[\d.]+)$') {
              throw "$appId has unexpected Pake checkver configuration."
            }

            $appDownloadDir = Join-Path $downloadRoot $appId
            New-Item -ItemType Directory -Path $appDownloadDir -Force | Out-Null
            $msiPath = Join-Path $appDownloadDir 'setup.msi_'
            Invoke-WebRequest -Uri $rawUrl -OutFile $msiPath -MaximumRedirection 10 -TimeoutSec 300

            $actualHash = (Get-FileHash -LiteralPath $msiPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $manifest.hash.ToLowerInvariant()) {
              throw "$appId SHA-256 mismatch. Expected $($manifest.hash), got $actualHash."
            }

            $signature = Get-AuthenticodeSignature -FilePath $msiPath
            if ($signature.Status -eq 'HashMismatch') {
              throw "$appId MSI has an invalid Authenticode signature."
            }

            $database = $installer.OpenDatabase($msiPath, 0)
            $productName = Get-MsiProperty -Database $database -Name 'ProductName'
            $productVersion = Get-MsiProperty -Database $database -Name 'ProductVersion'
            $manufacturer = Get-MsiProperty -Database $database -Name 'Manufacturer'
            $productCode = Get-MsiProperty -Database $database -Name 'ProductCode'
            if ($productName -ne $expectedProductName) {
              throw "$appId MSI ProductName '$productName' does not match asset '$expectedProductName'."
            }
            if ($productVersion -ne '3.18.0') {
              throw "$appId MSI ProductVersion '$productVersion' does not match 3.18.0."
            }
            if ([string]::IsNullOrWhiteSpace($productCode)) {
              throw "$appId MSI has no ProductCode."
            }
            if ($productCodes.ContainsKey($productCode)) {
              throw "$appId MSI reuses ProductCode $productCode from $($productCodes[$productCode])."
            }
            $productCodes[$productCode] = $appId

            $installDir = Join-Path $installRoot $appId
            $installLog = Join-Path $logRoot "$appId-install.log"
            $uninstallLog = Join-Path $logRoot "$appId-uninstall.log"
            $quote = [string][char]34
            $quotedMsi = $quote + $msiPath + $quote
            $quotedInstallDir = 'INSTALLDIR=' + $quote + $installDir + $quote
            $quotedInstallLog = $quote + $installLog + $quote
            $installArgs = @('/i', $quotedMsi, '/qn', '/norestart', $quotedInstallDir, '/L*V', $quotedInstallLog)
            $installProcess = Start-Process -FilePath 'msiexec.exe' -ArgumentList $installArgs -Wait -PassThru -Verb RunAs -ErrorAction Stop
            if ($installProcess.ExitCode -notin @(0, 3010)) {
              throw "$appId MSI installation failed with exit code $($installProcess.ExitCode). Log: $installLog"
            }

            if (-not (Test-Path -LiteralPath $installDir -PathType Container)) {
              throw "$appId MSI did not create INSTALLDIR: $installDir"
            }
            $exeFiles = @(Get-ChildItem -LiteralPath $installDir -Filter '*.exe' -File -Recurse -ErrorAction SilentlyContinue)
            if ($exeFiles.Count -eq 0) {
              throw "$appId MSI installed no EXE files under INSTALLDIR."
            }
            $mainExe = $exeFiles | Where-Object { $_.Name -like 'pake-*.exe' } | Select-Object -First 1
            if ($null -eq $mainExe) {
              $mainExe = $exeFiles | Select-Object -First 1
            }
            $shortcuts = @(Find-InstalledShortcuts -InstallDir $installDir)
            if ($shortcuts.Count -lt 2) {
              throw "$appId MSI created only $($shortcuts.Count) shortcut(s) targeting INSTALLDIR; expected Start Menu and Desktop shortcuts."
            }

            $quotedUninstallLog = $quote + $uninstallLog + $quote
            $uninstallArgs = @('/x', $quotedMsi, '/qn', '/norestart', '/L*V', $quotedUninstallLog)
            $uninstallProcess = Start-Process -FilePath 'msiexec.exe' -ArgumentList $uninstallArgs -Wait -PassThru -Verb RunAs -ErrorAction Stop
            if ($uninstallProcess.ExitCode -notin @(0, 3010)) {
              throw "$appId MSI uninstallation failed with exit code $($uninstallProcess.ExitCode). Log: $uninstallLog"
            }

            if (Test-Path -LiteralPath $mainExe.FullName) {
              throw "$appId MSI uninstaller left the main executable behind: $($mainExe.FullName)"
            }
            $remainingShortcuts = @(Find-InstalledShortcuts -InstallDir $installDir)
            if ($remainingShortcuts.Count -gt 0) {
              throw "$appId MSI uninstaller left shortcuts behind: $($remainingShortcuts -join ', ')"
            }

            $results.Add([pscustomobject]@{
              Manifest = $appId
              ProductName = $productName
              ProductVersion = $productVersion
              Manufacturer = $manufacturer
              ProductCode = $productCode
              SHA256 = $actualHash
              Authenticode = $signature.Status
              MainExecutable = $mainExe.Name
              ShortcutsCreated = $shortcuts.Count
              InstallExitCode = $installProcess.ExitCode
              UninstallExitCode = $uninstallProcess.ExitCode
            })
            Write-Output "$appId: hash verified; $productName installed to Scoop-style directory and uninstalled successfully."
          }

          $summary = @(
            '## Pake Windows MSI verification'
            ''
            '| Manifest | MSI Product | Main executable | Shortcuts | Install | Uninstall |'
            '| --- | --- | --- | ---: | ---: | ---: |'
          )
          foreach ($result in $results) {
            $summary += "| $($result.Manifest) | $($result.ProductName) | $($result.MainExecutable) | $($result.ShortcutsCreated) | $($result.InstallExitCode) | $($result.UninstallExitCode) |"
          }
          $summary += ''
          $summary += 'All 16 official Pake v3.18.0 x64 MSI files passed SHA-256 checks and completed an isolated Windows Installer install/uninstall cycle.'
          $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          $results | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $workRoot 'verification-results.json') -Encoding utf8

      - name: Upload MSI logs and verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pake-windows-msi-verification
          path: ${{ runner.temp }}/pake-msi-test/*
          if-no-files-found: ignore
