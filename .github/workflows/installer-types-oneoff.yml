name: One-off Installer and Archive Inspection

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/installer-types-oneoff.yml'

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect ${{ matrix.id }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: coodesker-2.2.2.2
            kind: exe
            url: https://down.coodesker.com/coodesker-desktop/Coodesker-x64_2.2.2.2.exe
            expected: ''
          - id: aula-0.1.3
            kind: exe
            url: https://github.com/luumlabs/aula/releases/download/v0.1.3/Aula-Setup-0.1.3.exe
            expected: 0438bae640a226e44ca3279660e892e88d7ac9c92c4b2051a2515e545ae7658c
          - id: livewallpaper-4.0.1-alpha.4
            kind: exe
            url: https://github.com/GiantappMan/livewallpaper/releases/download/v4.0.1-alpha.4/GiantappWallpaper_4.0.1-alpha.4_x64-setup.exe
            expected: de94726bbad684840fad871dbeec2d292e9c6ebfd90c3bdce4a60c8f5af77ca3
          - id: urlprotocol-0.7
            kind: zip
            url: https://github.com/xifangczy/URLProtocol/releases/download/0.7/URLProtocol.zip
            expected: 2da252504e7c7c6925ab55ed483a0a56ae105848b5f638a5ee065a1a39c706ce
          - id: default-programs-1.2.1-self-contained
            kind: zip
            url: https://github.com/MehranAkbarii/DefaultProgramsRemake/releases/download/v1.2.1/DefaultProgramsDotNetSelfContained.zip
            expected: 76931fe4431f9ff80a841d695d4cb873d6ce561e6f441a371ec400d61343a9a9
          - id: ahk-tts-1.8
            kind: zip
            url: https://github.com/altbdoor/ahk-tts/releases/download/v1.8/ahk_tts.zip
            expected: ''

    steps:
      - name: Download and verify target
        id: target
        shell: pwsh
        env:
          TARGET_URL: ${{ matrix.url }}
          EXPECTED_SHA256: ${{ matrix.expected }}
          TARGET_KIND: ${{ matrix.kind }}
          TARGET_ID: ${{ matrix.id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $work = Join-Path $env:RUNNER_TEMP $env:TARGET_ID
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $uri = [uri]$env:TARGET_URL
          $name = [IO.Path]::GetFileName($uri.AbsolutePath)
          $file = Join-Path $work $name
          try {
            Invoke-WebRequest -Uri $uri.AbsoluteUri -OutFile $file -MaximumRedirection 10 -TimeoutSec 600 -ErrorAction Stop
          } catch {
            Write-Warning "Invoke-WebRequest failed; retrying with curl.exe: $($_.Exception.Message)"
            & curl.exe --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 600 --user-agent 'Mozilla/5.0' --output $file $uri.AbsoluteUri
            if ($LASTEXITCODE -ne 0) { throw "curl.exe failed with exit code $LASTEXITCODE" }
          }
          if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw 'Download did not create a file.' }
          $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($env:EXPECTED_SHA256 -and $hash -ne $env:EXPECTED_SHA256.ToLowerInvariant()) {
            throw "SHA-256 mismatch: expected $env:EXPECTED_SHA256 got $hash"
          }
          $report = [System.Collections.Generic.List[string]]::new()
          $report.Add("Target: $env:TARGET_ID")
          $report.Add("URL: $env:TARGET_URL")
          $report.Add("Filename: $name")
          $report.Add("Size: $((Get-Item -LiteralPath $file).Length)")
          $report.Add("SHA-256: $hash")
          $report.Add("Expected hash verified: $([bool]$env:EXPECTED_SHA256)")
          $report.Add("Kind: $env:TARGET_KIND")
          if ($env:TARGET_KIND -eq 'zip') {
            $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
            if (!(Test-Path -LiteralPath $sevenZip)) { throw '7-Zip executable is missing.' }
            $listing = @(& $sevenZip l -slt $file 2>&1 | ForEach-Object { "$_" })
            if ($LASTEXITCODE -ne 0) { throw "7-Zip listing failed with exit code $LASTEXITCODE" }
            $listing | ForEach-Object { $report.Add($_) }
            $destination = Join-Path $work 'extracted'
            Expand-Archive -LiteralPath $file -DestinationPath $destination -Force
            $report.Add('')
            $report.Add('Extracted files:')
            Get-ChildItem -LiteralPath $destination -Recurse -File | ForEach-Object {
              $relative = $_.FullName.Substring($destination.Length).TrimStart('\','/')
              $report.Add("$relative - $($_.Length) bytes")
            }
          } else {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            $info = [Diagnostics.FileVersionInfo]::GetVersionInfo($file)
            $report.Add("Authenticode: $($signature.Status)")
            $report.Add("Signer: $($signature.SignerCertificate.Subject)")
            $report.Add("Product: $($info.ProductName)")
            $report.Add("Description: $($info.FileDescription)")
            $report.Add("File version: $($info.FileVersion)")
            $dieZip = Join-Path $work 'die.zip'
            $dieDir = Join-Path $work 'die'
            $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/horsicq/DIE-engine/releases/tags/3.21' -Headers @{ 'User-Agent'='kirobucket-installer-inspector'; Accept='application/vnd.github+json' }
            $asset = $release.assets | Where-Object { $_.name -match '^die_win64_portable_[\d.]+_x64\.zip$' } | Select-Object -First 1
            if (!$asset) { throw "Detect It Easy portable release not found: $($release.tag_name)" }
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $dieZip -MaximumRedirection 10 -TimeoutSec 300
            Expand-Archive -LiteralPath $dieZip -DestinationPath $dieDir -Force
            $diec = Get-ChildItem -LiteralPath $dieDir -Filter diec.exe -Recurse -File | Select-Object -First 1
            if (!$diec) { throw 'diec.exe not found in Detect It Easy archive.' }
            $report.Add("Detect It Easy release: $($release.tag_name)")
            $scan = @(& $diec.FullName $file 2>&1 | ForEach-Object { "$_" })
            $exit = $LASTEXITCODE
            $scan | ForEach-Object { $report.Add($_) }
            if ($exit -ne 0) { throw "Detect It Easy exited with code $exit." }

            # Independently test whether 7-Zip can enumerate/extract this EXE.
            $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
            $sevenZipLog = Join-Path $work '7zip.log'
            $archiveListing = @(& $sevenZip l -slt $file 2>&1 | ForEach-Object { "$_" })
            $sevenZipExit = $LASTEXITCODE
            $archiveListing | Set-Content -LiteralPath $sevenZipLog -Encoding utf8
            $report.Add("7-Zip listing exit code: $sevenZipExit")
            $archiveListing | ForEach-Object { $report.Add($_) }
            if ($sevenZipExit -eq 0) {
              $destination = Join-Path $work 'exe-extracted'
              New-Item -ItemType Directory -Path $destination -Force | Out-Null
              $extractOutput = @(& $sevenZip x -y "-o$destination" $file 2>&1 | ForEach-Object { "$_" })
              $extractExit = $LASTEXITCODE
              $extractOutput | ForEach-Object { $report.Add($_) }
              if ($extractExit -ne 0) { throw "7-Zip extraction failed with exit code $extractExit. See 7zip.log." }
              $report.Add('7-Zip extracted files:')
              Get-ChildItem -LiteralPath $destination -Recurse -File | ForEach-Object {
                $relative = $_.FullName.Substring($destination.Length).TrimStart('\','/')
                $report.Add("$relative - $($_.Length) bytes")
              }
            } else {
              $report.Add('7-Zip did not recognize this EXE as an extractable archive.')
            }
          }
          $reportPath = Join-Path $work 'inspection.txt'
          $report | Set-Content -LiteralPath $reportPath -Encoding utf8
          $report | ForEach-Object { Write-Output $_ }
          "report_path=$reportPath" >> $env:GITHUB_OUTPUT
          @("## $env:TARGET_ID","", "- SHA-256: $hash","- Kind: $env:TARGET_KIND","- Details attached as workflow artifact.") | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inspection-${{ matrix.id }}
          path: ${{ runner.temp }}/${{ matrix.id }}/inspection.txt
          if-no-files-found: ignore
