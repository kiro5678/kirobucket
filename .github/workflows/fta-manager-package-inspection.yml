name: FTA-Manager Package Inspection

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/fta-manager-package-inspection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Download pinned module files and test Scoop module layout
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Download required module files and calculate SHA-256
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $commit = '9ca777511edaba2f828d25023477cbe9e4b5a33b'
          $source = "https://raw.githubusercontent.com/feiglein74/FTA-Manager/$commit"
          $root = Join-Path $env:RUNNER_TEMP 'fta-manager-package-inspection'
          $moduleDir = Join-Path $root 'modules\FTA-Manager'
          New-Item -ItemType Directory -Path $moduleDir -Force | Out-Null

          $files = @('FTA-Manager.psd1', 'FTA-Manager.psm1', 'LICENSE')
          $records = [System.Collections.Generic.List[object]]::new()
          foreach ($file in $files) {
            $url = "$source/$file"
            $destination = Join-Path $moduleDir $file
            Write-Host "Downloading $file from pinned upstream commit $commit"
            Invoke-WebRequest -Uri $url -OutFile $destination -TimeoutSec 120
            $item = Get-Item -LiteralPath $destination
            $hash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
            $records.Add([ordered]@{
              file = $file
              url = $url
              sizeBytes = [long]$item.Length
              sha256 = $hash
            })
            Write-Host "FILE: $file"
            Write-Host "URL: $url"
            Write-Host "SIZE_BYTES: $($item.Length)"
            Write-Host "SHA256: $hash"
          }

          $records | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $root 'source-file-hashes.json') -Encoding utf8
          "module_dir=$moduleDir" >> $env:GITHUB_OUTPUT
          "root_dir=$root" >> $env:GITHUB_OUTPUT
          "psd1_sha256=$($records[0].sha256)" >> $env:GITHUB_OUTPUT
          "psm1_sha256=$($records[1].sha256)" >> $env:GITHUB_OUTPUT
          "license_sha256=$($records[2].sha256)" >> $env:GITHUB_OUTPUT
          "psd1_size=$($records[0].sizeBytes)" >> $env:GITHUB_OUTPUT
          "psm1_size=$($records[1].sizeBytes)" >> $env:GITHUB_OUTPUT
          "license_size=$($records[2].sizeBytes)" >> $env:GITHUB_OUTPUT

      - name: Validate Scoop PowerShell module layout in Windows PowerShell 5.1
        shell: pwsh
        env:
          MODULE_PARENT: ${{ steps.package.outputs.root_dir }}/modules
          MODULE_DIR: ${{ steps.package.outputs.module_dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          $testScript = Join-Path $env:RUNNER_TEMP 'test-fta-manager-module.ps1'
          @'
          $ErrorActionPreference = 'Stop'
          $moduleParent = $env:MODULE_PARENT
          $moduleDir = $env:MODULE_DIR
          $manifestPath = Join-Path $moduleDir 'FTA-Manager.psd1'
          $moduleInfo = Test-ModuleManifest -Path $manifestPath -ErrorAction Stop
          if ([string]$moduleInfo.Version -ne '1.2.0') {
              throw "Expected module version 1.2.0; found $($moduleInfo.Version)."
          }

          # Scoop's psmodule property exposes the module through a folder named
          # after the module beneath the Scoop modules directory.
          $env:PSModulePath = "$moduleParent;$env:PSModulePath"
          Import-Module -Name 'FTA-Manager' -Force -ErrorAction Stop

          $requiredCommands = @('Get-FTA', 'Set-FTA', 'Get-PTA', 'Set-PTA', 'Get-AllFTA', 'Get-AllPTA')
          $availableCommands = @(Get-Command -Module FTA-Manager | Select-Object -ExpandProperty Name)
          $missing = @($requiredCommands | Where-Object { $_ -notin $availableCommands })
          if ($missing.Count -gt 0) {
              throw "Module import succeeded but required commands are missing: $($missing -join ', ')"
          }

          Write-Host "MODULE_VERSION: $($moduleInfo.Version)"
          Write-Host "MODULE_GUID: $($moduleInfo.Guid)"
          Write-Host "EXPORTED_COMMAND_COUNT: $($availableCommands.Count)"
          Write-Host "REQUIRED_COMMANDS: $($requiredCommands -join ', ')"
          Write-Host 'PSMODULE_PATH_IMPORT: PASS'
          '@ | Set-Content -LiteralPath $testScript -Encoding utf8

          $windowsPowerShell = Join-Path $env:WINDIR 'System32\WindowsPowerShell\v1.0\powershell.exe'
          if (-not (Test-Path -LiteralPath $windowsPowerShell -PathType Leaf)) {
              throw 'Windows PowerShell 5.1 executable was not found.'
          }
          & $windowsPowerShell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $testScript
          if ($LASTEXITCODE -ne 0) {
              throw "Windows PowerShell 5.1 module validation failed with exit code $LASTEXITCODE."
          }

      - name: Write package summary
        if: always()
        shell: pwsh
        env:
          ROOT_DIR: ${{ steps.package.outputs.root_dir }}
          PSD1_HASH: ${{ steps.package.outputs.psd1_sha256 }}
          PSM1_HASH: ${{ steps.package.outputs.psm1_sha256 }}
          LICENSE_HASH: ${{ steps.package.outputs.license_sha256 }}
          PSD1_SIZE: ${{ steps.package.outputs.psd1_size }}
          PSM1_SIZE: ${{ steps.package.outputs.psm1_size }}
          LICENSE_SIZE: ${{ steps.package.outputs.license_size }}
        run: |
          @(
            '# FTA-Manager Scoop module package inspection'
            ''
            '- Upstream repository: https://github.com/feiglein74/FTA-Manager'
            '- Pinned commit: 9ca777511edaba2f828d25023477cbe9e4b5a33b'
            '- Module version: 1.2.0'
            '- Package type: PowerShell module (not a standalone EXE)'
            '- Scoop integration: psmodule.name = FTA-Manager'
            ''
            '| File | Size (bytes) | SHA-256 |'
            '|---|---:|---|'
            "| FTA-Manager.psd1 | $env:PSD1_SIZE | $env:PSD1_HASH |"
            "| FTA-Manager.psm1 | $env:PSM1_SIZE | $env:PSM1_HASH |"
            "| LICENSE | $env:LICENSE_SIZE | $env:LICENSE_HASH |"
            ''
            '## Safety'
            ''
            '- No Set-FTA, Set-PTA, Disable-UCPD, Enable-UCPD, service installer, or scheduled-task installer was executed.'
            '- No registry values, default-app associations, services, scheduled tasks, or UCPD settings were changed.'
            '- Validation only downloaded the module files, checked the module manifest, and imported the module by name in Windows PowerShell 5.1.'
          ) | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'fta-manager-inspection-summary.md') -Encoding utf8
          Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'fta-manager-inspection-summary.md') |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Upload inspection evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fta-manager-package-inspection
          path: |
            ${{ runner.temp }}/fta-manager-package-inspection/
            ${{ runner.temp }}/fta-manager-inspection-summary.md
            ${{ runner.temp }}/test-fta-manager-module.ps1
          if-no-files-found: warn
          retention-days: 14
