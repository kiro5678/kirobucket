name: NirLauncher Shortcut Audit

on:
  push:
    branches: [master, nirlauncher-shortcut-audit]
    paths:
      - 'bucket/nirlauncher.json'
      - '.github/workflows/nirlauncher-shortcut-audit.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]
    paths:
      - 'bucket/nirlauncher.json'
      - '.github/workflows/nirlauncher-shortcut-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nirlauncher-shortcut-audit-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Inspect NirSoft utility catalog and executable types
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download and inspect official NirLauncher package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $manifest = Get-Content -LiteralPath 'bucket/nirlauncher.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $downloadUrl = ([string]$manifest.url -split '#', 2)[0]
          $expectedHash = [string]$manifest.hash
          if ($downloadUrl -notmatch '^https://') { throw 'The NirLauncher manifest URL is not HTTPS.' }
          if ($expectedHash -notmatch '^[0-9a-fA-F]{64}$') { throw 'The manifest does not contain a static SHA-256 hash.' }

          $archive = Join-Path $env:RUNNER_TEMP 'nirlauncher-package.zip'
          $extractRoot = Join-Path $env:RUNNER_TEMP 'nirlauncher-extracted'
          Invoke-WebRequest -Uri $downloadUrl -OutFile $archive -MaximumRedirection 10 -TimeoutSec 900
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actualHash -ine $expectedHash) {
            throw "NirLauncher SHA-256 mismatch. Expected $expectedHash; got $actualHash."
          }
          Write-Host "Package SHA-256 verified: $actualHash"

          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
            $command = Get-Command '7z.exe' -ErrorAction SilentlyContinue
            if ($command) { $sevenZip = $command.Source }
          }
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
            throw '7-Zip was not found on the Windows runner.'
          }

          New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
          & $sevenZip x $archive "-o$extractRoot" '-pnirsoft9876$' '-y'
          if ($LASTEXITCODE -ne 0) { throw "NirLauncher archive extraction failed with exit code $LASTEXITCODE." }

          $nlp = Get-ChildItem -LiteralPath $extractRoot -Filter 'nirsoft.nlp' -File -Recurse | Select-Object -First 1
          if (-not $nlp) { throw 'nirsoft.nlp was not found in the official package.' }
          Copy-Item -LiteralPath $nlp.FullName -Destination (Join-Path $env:RUNNER_TEMP 'nirsoft.nlp') -Force

          $text = Get-Content -LiteralPath $nlp.FullName -Raw -Encoding Default
          $records = [System.Collections.Generic.List[object]]::new()
          $current = [ordered]@{ Section = ''; Fields = [ordered]@{} }
          foreach ($line in ($text -split '\r?\n')) {
            if ($line -match '^\s*\[(?<section>[^\]]+)\]\s*$') {
              if ($current.Fields.Count -gt 0) { $records.Add([PSCustomObject]$current) }
              $current = [ordered]@{ Section = $Matches.section.Trim(); Fields = [ordered]@{} }
            } elseif ($line -match '^\s*(?<key>[^=;#]+?)\s*=\s*(?<value>.*?)\s*$') {
              $current.Fields[$Matches.key.Trim()] = $Matches.value.Trim().Trim('"')
            }
          }
          if ($current.Fields.Count -gt 0) { $records.Add([PSCustomObject]$current) }
          if ($records.Count -eq 0) { throw 'No utility records could be parsed from nirsoft.nlp.' }

          function Get-PeInfo {
            param([Parameter(Mandatory)][string]$Path)
            $stream = [System.IO.File]::OpenRead($Path)
            try {
              $reader = [System.IO.BinaryReader]::new($stream)
              try {
                if ($stream.Length -lt 256) { return [PSCustomObject]@{ Architecture = 'Invalid'; Subsystem = 'Invalid' } }
                $stream.Position = 0x3C
                $peOffset = $reader.ReadInt32()
                if ($peOffset -lt 0 -or ($peOffset + 92) -gt $stream.Length) {
                  return [PSCustomObject]@{ Architecture = 'Invalid'; Subsystem = 'Invalid' }
                }
                $stream.Position = $peOffset
                if ($reader.ReadUInt32() -ne 0x00004550) {
                  return [PSCustomObject]@{ Architecture = 'Invalid'; Subsystem = 'Invalid' }
                }
                $machine = $reader.ReadUInt16()
                $architecture = switch ($machine) {
                  0x014c { 'x86' }
                  0x8664 { 'x64' }
                  0xAA64 { 'ARM64' }
                  default { 'Unknown' }
                }
                $stream.Position = $peOffset + 24 + 68
                $subsystemValue = $reader.ReadUInt16()
                $subsystem = switch ($subsystemValue) {
                  2 { 'GUI' }
                  3 { 'Console' }
                  default { "Other ($subsystemValue)" }
                }
                return [PSCustomObject]@{ Architecture = $architecture; Subsystem = $subsystem }
              } finally { $reader.Dispose() }
            } finally { $stream.Dispose() }
          }

          $rows = [System.Collections.Generic.List[object]]::new()
          foreach ($record in $records) {
            $exeEntries = @($record.Fields.GetEnumerator() | Where-Object { $_.Key -match '^(?i:exe)\d*$' })
            foreach ($entry in $exeEntries) {
              $relativePath = ([string]$entry.Value).Replace('/', '\').Trim()
              if ([string]::IsNullOrWhiteSpace($relativePath) -or $relativePath -notmatch '(?i)\.exe$') { continue }
              $candidate = Join-Path $nlp.DirectoryName $relativePath
              if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
                $candidateLeaf = [System.IO.Path]::GetFileName($relativePath)
                $sameName = @(Get-ChildItem -LiteralPath $extractRoot -Filter $candidateLeaf -File -Recurse | Select-Object -First 2)
                if ($sameName.Count -eq 1) { $candidate = $sameName[0].FullName }
              }

              if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
                $rows.Add([PSCustomObject]@{
                  Group = $record.Section
                  Utility = [string]$record.Fields['AppName']
                  Description = [string]$record.Fields['ShortDesc']
                  NlpPath = $relativePath
                  SelectedPath = ''
                  Architecture = 'Missing'
                  Subsystem = 'Missing'
                  Decision = 'EXCLUDE - executable missing'
                })
                continue
              }

              $chosen = Get-Item -LiteralPath $candidate
              $baseName = [System.IO.Path]::GetFileNameWithoutExtension($candidate)
              if ($baseName -notmatch '(?i)-x64$') {
                $x64Path = Join-Path $chosen.DirectoryName ($baseName + '-x64.exe')
                if (Test-Path -LiteralPath $x64Path -PathType Leaf) { $chosen = Get-Item -LiteralPath $x64Path }
              }

              $pe = Get-PeInfo -Path $chosen.FullName
              $selectedPath = [System.IO.Path]::GetRelativePath($nlp.DirectoryName, $chosen.FullName).Replace('\','/')
              $decision = if ($pe.Subsystem -eq 'GUI') {
                'SHORTCUT CANDIDATE'
              } elseif ($pe.Subsystem -eq 'Console') {
                'EXCLUDE - console utility'
              } else {
                'REVIEW - unsupported PE type'
              }
              $name = [string]$record.Fields['AppName']
              if ([string]::IsNullOrWhiteSpace($name)) { $name = [System.IO.Path]::GetFileNameWithoutExtension($relativePath) }
              $rows.Add([PSCustomObject]@{
                Group = $record.Section
                Utility = $name
                Description = [string]$record.Fields['ShortDesc']
                NlpPath = $relativePath
                SelectedPath = $selectedPath
                Architecture = $pe.Architecture
                Subsystem = $pe.Subsystem
                Decision = $decision
              })
            }
          }

          $rows = @($rows | Sort-Object Utility, SelectedPath -Unique)
          if ($rows.Count -eq 0) { throw 'nirsoft.nlp contained no executable references in exe fields.' }
          $report = Join-Path $env:RUNNER_TEMP 'nirsoft-shortcut-audit.csv'
          $rows | Export-Csv -LiteralPath $report -NoTypeInformation -Encoding UTF8

          $eligible = @($rows | Where-Object { $_.Decision -eq 'SHORTCUT CANDIDATE' })
          $console = @($rows | Where-Object { $_.Decision -like 'EXCLUDE - console*' })
          $missing = @($rows | Where-Object { $_.Decision -like 'EXCLUDE - executable*' })
          $review = @($rows | Where-Object { $_.Decision -like 'REVIEW -*' })
          Write-Host "NLP records: $($records.Count)"
          Write-Host "Executables referenced: $($rows.Count)"
          Write-Host "GUI shortcut candidates: $($eligible.Count)"
          Write-Host "Console utilities excluded: $($console.Count)"
          Write-Host "Missing executables: $($missing.Count)"
          Write-Host "Needs manual review: $($review.Count)"
          foreach ($row in $rows) {
            Write-Host ("AUDIT | {0} | {1} | {2} | {3} | {4}" -f $row.Utility, $row.SelectedPath, $row.Architecture, $row.Subsystem, $row.Decision)
          }

          @(
            '## NirSoft Start Menu shortcut audit',
            '',
            "- NLP records parsed: $($records.Count)",
            "- Executable records: $($rows.Count)",
            "- GUI shortcut candidates: $($eligible.Count)",
            "- Console tools excluded: $($console.Count)",
            "- Missing executables: $($missing.Count)",
            "- Manual review required: $($review.Count)",
            '',
            'Only executable entries listed in the official NirSoft catalog and identified as PE GUI applications are considered shortcut candidates. Console tools are excluded.'
          ) | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          $eligible | Format-Table -AutoSize | Out-String | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          if ($eligible.Count -eq 0) { throw 'The audit found no GUI utility shortcut candidates.' }

      - name: Upload NirSoft audit files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nirsoft-shortcut-audit
          path: |
            \${{ runner.temp }}/nirsoft-shortcut-audit.csv
            \${{ runner.temp }}/nirsoft.nlp
          if-no-files-found: ignore
          retention-days: 14
