name: Snipmunk NSIS Payload Inspection

on:
  pull_request:
    paths:
      - ".github/workflows/snipmunk-nsis-inspection.yml"
      - "bucket/snipmunk.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Verify and extract the official NSIS release
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download, verify, and extract without running the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $root = Join-Path $env:RUNNER_TEMP 'snipmunk-nsis-inspection'
          $setup = Join-Path $root 'Snipmunk_0.1.2_x64-setup.exe'
          $extract = Join-Path $root 'extracted'
          New-Item -ItemType Directory -Path $root, $extract -Force | Out-Null

          $url = 'https://github.com/Second-Dawn-Lab/snipmunk/releases/download/v0.1.2/Snipmunk_0.1.2_x64-setup.exe'
          $expected = '203b954769f6973a811a9b86dd28aa5ddaec21a6530db5824fbba79931770cb9'
          Invoke-WebRequest -Uri $url -OutFile $setup -MaximumRedirection 10 -TimeoutSec 900
          $actual = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Expected SHA-256: $expected"
          Write-Host "Actual SHA-256:   $actual"
          if ($actual -ne $expected) { throw "SHA-256 mismatch: expected $expected, got $actual." }

          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip)) {
            choco install 7zip -y --no-progress
          }
          if (-not (Test-Path -LiteralPath $sevenZip)) {
            $command = Get-Command '7z.exe' -ErrorAction SilentlyContinue
            if (-not $command) { throw '7-Zip is unavailable on the runner.' }
            $sevenZip = $command.Source
          }

          $listing = & $sevenZip l -slt $setup 2>&1
          $listExit = $LASTEXITCODE
          $listing | Set-Content -LiteralPath (Join-Path $root '7zip-listing.txt') -Encoding utf8
          Write-Host "7-Zip listing exit code: $listExit"
          if ($listExit -ne 0) { throw '7-Zip cannot list the official NSIS installer.' }

          $extractOutput = & $sevenZip x $setup "-o$extract" -y -bd 2>&1
          $extractExit = $LASTEXITCODE
          $extractOutput | Set-Content -LiteralPath (Join-Path $root '7zip-extraction.log') -Encoding utf8
          Write-Host "7-Zip extraction exit code: $extractExit"
          if ($extractExit -ne 0) { throw "7-Zip extraction failed with exit code $extractExit." }

          $files = @(Get-ChildItem -LiteralPath $extract -File -Recurse -Force)
          Write-Host "Extracted files: $($files.Count)"
          foreach ($file in $files | Sort-Object FullName) {
            $relative = [IO.Path]::GetRelativePath($extract, $file.FullName).Replace('\', '/')
            Write-Host ("{0} [{1} bytes]" -f $relative, $file.Length)
          }

          $main = @($files | Where-Object { $_.Name -ieq 'Snipmunk.exe' })
          if ($main.Count -ne 1) {
            throw "Expected exactly one Snipmunk.exe in the extracted payload; found $($main.Count)."
          }
          $mainRelative = [IO.Path]::GetRelativePath($extract, $main[0].FullName).Replace('\', '/')
          Write-Host "VERIFIED MAIN EXECUTABLE: $mainRelative"
          @(
            '## Snipmunk NSIS extraction'
            ''
            "- Installer SHA-256: `$actual`"
            '- 7-Zip listing: PASS'
            '- 7-Zip extraction: PASS'
            "- Extracted files: $($files.Count)"
            "- Main executable: `$mainRelative`"
            ''
            'The installer and extracted executable were not run.'
            ''
            '### Extracted files'
            ($files | Sort-Object FullName | ForEach-Object {
              $relative = [IO.Path]::GetRelativePath($extract, $_.FullName).Replace('\', '/')
              "- `$relative` ($($_.Length) bytes)"
            })
          ) | Set-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

          @(
            "Installer SHA-256: $actual"
            "7-Zip listing exit code: $listExit"
            "7-Zip extraction exit code: $extractExit"
            "Extracted files: $($files.Count)"
            "Main executable: $mainRelative"
          ) | Set-Content -LiteralPath (Join-Path $root 'inspection-summary.txt') -Encoding utf8

      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snipmunk-nsis-inspection
          path: ${{ runner.temp }}/snipmunk-nsis-inspection/
          if-no-files-found: warn
          retention-days: 14
