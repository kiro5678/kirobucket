name: ArboraFM Portable Manifest Validation

on:
  push:
    branches:
      - master
      - inspect-arborafm-portable-0.9.0
    paths:
      - "bucket/arbora.json"
  pull_request:
    branches:
      - master
    paths:
      - "bucket/arbora.json"

permissions:
  contents: read

jobs:
  validate:
    name: Scoop install and uninstall ArboraFM
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Scoop core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          path: scoop_core
          persist-credentials: false

      - name: Validate JSON, archive hash/layout, and checkver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'bucket/arbora.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json -ErrorAction Stop
          if ($manifest.version -ne '0.9.0') { throw "Unexpected manifest version: $($manifest.version)" }
          if ($manifest.url -ne 'https://arborafm.dev/releases/0.9.0/windows/Arbora_0.9.0_x64-portable.zip') {
            throw 'Manifest URL does not match the verified official portable ZIP.'
          }
          if ($manifest.hash -ne '3c816c7a5961a56071a38745ad06342e441de62de16b027b22a565dda8ef3217') {
            throw 'Manifest SHA-256 does not match the value verified by the inspection workflow.'
          }
          if ($manifest.bin -ne 'Arbora.exe') { throw 'Manifest must shim the root-level Arbora.exe.' }
          if ($manifest.checkver.url -ne 'https://arborafm.dev/download') { throw 'Unexpected checkver URL.' }
          $checkver = Join-Path $env:GITHUB_WORKSPACE 'scoop_core/bin/checkver.ps1'
          if (-not (Test-Path -LiteralPath $checkver -PathType Leaf)) { throw 'Scoop checkver.ps1 was not found.' }
          & $checkver -App $manifestPath -ThrowError
          if ($LASTEXITCODE -ne 0) { throw 'Scoop checkver returned a non-zero exit code.' }
          Write-Host 'PASS: Scoop checkver executed against arbora.json; inspect its version output above.'
          if (($manifest.PSObject.Properties.Name -contains 'extract_dir')) { throw 'The archive has no enclosing folder; extract_dir must be omitted.' }
          if (($manifest.PSObject.Properties.Name -contains 'persist')) { throw 'The README states that app data is stored in the Windows user profile; do not invent a persist path.' }

          $zip = Join-Path $env:RUNNER_TEMP 'Arbora_0.9.0_x64-portable.zip'
          Invoke-WebRequest -Uri $manifest.url -OutFile $zip -TimeoutSec 900
          $actualHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $manifest.hash) { throw "SHA-256 mismatch: $actualHash" }

          $sevenZip = (Get-Command '7z.exe' -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { throw '7z.exe is not available on the runner.' }
          $testLog = Join-Path $env:RUNNER_TEMP '7zip.log'
          & $sevenZip t -bb1 $zip 2>&1 | Tee-Object -FilePath $testLog
          if ($LASTEXITCODE -ne 0) {
            Write-Host '7zip.log:'
            Get-Content -LiteralPath $testLog
            throw '7-Zip archive integrity test failed.'
          }

          $extract = Join-Path $env:RUNNER_TEMP 'arbora-manual-extract'
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          $extractLog = Join-Path $env:RUNNER_TEMP '7zip-extract.log'
          & $sevenZip x -y "-o$extract" -bb1 $zip 2>&1 | Tee-Object -FilePath $extractLog
          if ($LASTEXITCODE -ne 0) {
            Write-Host '7zip-extract.log:'
            Get-Content -LiteralPath $extractLog
            throw '7-Zip extraction failed.'
          }
          $exe = Join-Path $extract 'Arbora.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Arbora.exe is not at the archive root.' }
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if ($info.ProductVersion -ne '0.9.0') { throw "EXE ProductVersion mismatch: $($info.ProductVersion)" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($bytes,0x3C)
          $machine = [BitConverter]::ToUInt16($bytes,$peOffset + 4)
          if ($machine -ne 0x8664) { throw ('Expected x64 PE, found machine code 0x{0:X4}' -f $machine) }
          Write-Host "PASS: SHA-256 $actualHash"
          Write-Host "PASS: ZIP archive test and extraction"
          Write-Host "PASS: Arbora.exe ProductVersion $($info.ProductVersion), PE AMD64"

      - name: Install and uninstall with Scoop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'bucket/arbora.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json -ErrorAction Stop
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri 'https://get.scoop.sh' | Invoke-Expression
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            $scoopShim = Join-Path $env:USERPROFILE 'scoop/shims/scoop.ps1'
            if (Test-Path -LiteralPath $scoopShim) { . $scoopShim }
          }
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) { throw 'Scoop bootstrap did not provide the scoop command.' }

          $scoopRoot = Join-Path $env:USERPROFILE 'scoop'
          $localBucket = Join-Path $scoopRoot 'buckets/arborafm-test/bucket'
          New-Item -ItemType Directory -Path $localBucket -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'bucket/arbora.json') -Destination (Join-Path $localBucket 'arbora.json') -Force


          scoop install arbora
          if ($LASTEXITCODE -ne 0) { throw 'scoop install arbora failed.' }

          $prefix = (scoop prefix arbora | Out-String).Trim()
          if ([string]::IsNullOrWhiteSpace($prefix)) { throw 'scoop prefix arbora returned no path.' }
          $installedExe = Join-Path $prefix 'Arbora.exe'
          if (-not (Test-Path -LiteralPath $installedExe -PathType Leaf)) { throw "Installed payload is missing: $installedExe" }
          $installedVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($installedExe).ProductVersion
          if ($installedVersion -ne '0.9.0') { throw "Installed version mismatch: $installedVersion" }
          Write-Host "PASS: Scoop installed Arbora $installedVersion to $prefix"

          scoop uninstall arbora
          if ($LASTEXITCODE -ne 0) { throw 'scoop uninstall arbora failed.' }
          if (Test-Path -LiteralPath $prefix) { throw "Scoop left the application folder behind after uninstall: $prefix" }
          Write-Host 'PASS: Scoop uninstall removed the app folder.'
