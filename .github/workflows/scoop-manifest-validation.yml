name: Manual Scoop Manifest Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate all manifests (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout Bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          path: my_bucket

      - name: Checkout Scoop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          path: scoop_core

      - name: Install test dependencies
        uses: potatoqualitee/psmodulecache@9e4b63833c22c1768d648e115a9c849afdda22a5 # v6.3
        with:
          modules-to-cache: BuildHelpers, Pester
          shell: ${{ matrix.shell }}

      - name: Run official Scoop bucket tests
        env:
          SCOOP_HOME: ${{ github.workspace }}\\scoop_core
        run: |
          .\\my_bucket\\bin\\test.ps1

      - name: Validate every manifest individually
        env:
          SCOOP_HOME: ${{ github.workspace }}\\scoop_core
        run: |
          $checkver = Join-Path $env:GITHUB_WORKSPACE 'scoop_core\\bin\\checkver.ps1'
          $bucket = Join-Path $env:GITHUB_WORKSPACE 'my_bucket\\bucket'
          $failed = @()

          $manifests = Get-ChildItem -Path $bucket -Filter '*.json' -File -Recurse |
            Sort-Object FullName

          Write-Host "Found $($manifests.Count) manifest(s)."

          foreach ($manifest in $manifests) {
            Write-Host ''
            Write-Host "============================================================"
            Write-Host "Checking: $($manifest.Name)"
            Write-Host "============================================================"

            try {
              & $checkver -App $manifest.FullName -ThrowError
              if ($LASTEXITCODE -ne 0) {
                throw "checkver exited with code $LASTEXITCODE"
              }
            }
            catch {
              $failed += [PSCustomObject]@{
                Manifest = $manifest.Name
                Error    = $_.Exception.Message
              }
              Write-Host "FAILED: $($manifest.Name)" -ForegroundColor Red
              Write-Host $_.Exception.Message -ForegroundColor Red
            }
          }

          Write-Host ''
          Write-Host "============================================================"
          Write-Host "Validation summary"
          Write-Host "============================================================"
          Write-Host "Checked: $($manifests.Count)"
          Write-Host "Failed:  $($failed.Count)"

          if ($failed.Count -gt 0) {
            $failed | Format-Table -AutoSize
            exit 1
          }

          Write-Host "All manifests passed validation." -ForegroundColor Green
