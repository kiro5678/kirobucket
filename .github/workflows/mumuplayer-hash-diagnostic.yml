name: MuMuPlayer CDN Hash Diagnostic

on:
  push:
    branches:
      - fix/mumuplayer-persist-nx-device-20261113
    paths:
      - ".github/workflows/mumuplayer-hash-diagnostic.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - name: Download and hash MuMuPlayer NXMAIN installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://a11.gdl.easebar.com/MuMu-setup-nxmain-V1.8.9.5949-overseas-1027211357.exe'
          $expected = 'd92747c4522a60caecb8da2f89174a80c6d0b982f9693f5e1720ef2a2fd84d8b'
          $file = Join-Path $env:RUNNER_TEMP 'mumuplayer-nxmain.exe'
          try {
            Invoke-WebRequest -Uri $url -OutFile $file -MaximumRedirection 10
            $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $size = (Get-Item -LiteralPath $file).Length
            Write-Host "Downloaded bytes: $size"
            Write-Host "Expected SHA256: $expected"
            Write-Host "Actual SHA256:   $actual"
            Write-Host "Hash matches:    $($actual -eq $expected)"
          } catch {
            Write-Host "Download or hash diagnostic failed: $($_.Exception.Message)"
            if ($_.Exception.Response) {
              Write-Host "HTTP status: $([int]$_.Exception.Response.StatusCode)"
            }
            exit 1
          } finally {
            Remove-Item -LiteralPath $file -Force -ErrorAction SilentlyContinue
          }
