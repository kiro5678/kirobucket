name: Inspect NTCore packages

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/ntcore-package-inspection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Download, verify and extract NTCore packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip)) {
            $command = Get-Command 7z.exe -ErrorAction Stop
            $sevenZip = $command.Source
          }

          $root = Join-Path $env:RUNNER_TEMP 'ntcore-inspection'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $targets = @(
            @{ Name='rebel-net'; Url='https://ntcore.com/files/RebelDotNET.zip'; Hash='7bd01e9cb15426642c74f8f3cab45cf7005f7525ab7cb8abc5a32973f383af32'; Type='ZIP' },
            @{ Name='driver-list'; Url='https://ntcore.com/files/DriverList.zip'; Hash='dbc5736808cf7203cf289a269cc27cbcf90a8c69e03eed60ae361ad29da08d28'; Type='ZIP' },
            @{ Name='virtualreg-manager'; Url='https://ntcore.com/files/VirtualRegManager.zip'; Hash='7e807d1106e91c898733a00da01dfa860e468fb14bbe3852fea9892a377d5fa6'; Type='ZIP' },
            @{ Name='dynlogger-x86'; Url='https://ntcore.com/files/DynLogger_x86.zip'; Hash='416e92b91b05ecbcf622476da538785ecfa30910cd42ee1a508361f22a1ccaa5'; Type='ZIP' },
            @{ Name='dynlogger-x64'; Url='https://ntcore.com/files/DynLogger_x64.zip'; Hash='a5e17491696d36f5c9b17f0e73ed33cfb9bf0f14fb035bb40c868ab5b6c0be3c'; Type='ZIP' },
            @{ Name='pe-detective'; Url='https://ntcore.com/files/PE_Detective.zip'; Hash='821f4fa1df9d3a39e32f15183126e56af8dacf4690a8fd01bfac6d850ea36263'; Type='ZIP' },
            @{ Name='wim-installer'; Url='https://ntcore.com/files/WIM_Installer.zip'; Hash='071e2aa6c57478b53e99d45ca588f8b36f9fc673907b3769884112078f357264'; Type='ZIP' },
            @{ Name='screenwriter'; Url='https://ntcore.com/files/ScreenWriter.msi'; Hash='e1bae80b9f7934c14d498a827bb15f8fb963a6fe9de9d7d18223049fb62563ab'; Type='MSI' },
            @{ Name='snsremover'; Url='https://ntcore.com/files/SNSRemover.zip'; Hash='c6405c5ec5ec8646a02a46bcfdf74e05457addabdc58fe78da84ea28d69ca7cd'; Type='ZIP' },
            @{ Name='nodel'; Url='https://ntcore.com/files/NoDel.zip'; Hash='b71b763dd54c5b6d67238d6f118c4ec3bfc531f14663ba59fc72655444ffd386'; Type='ZIP' },
            @{ Name='antimida'; Url='https://ntcore.com/files/antimida_1.0.zip'; Hash='e46fb95c19f2bbf7ec40c72289e701491afaf85d87eb8697991b0152a24e03c9'; Type='ZIP' }
          )

          $summary = [System.Collections.Generic.List[string]]::new()
          $summary.Add('# NTCore package inspection')
          $summary.Add('')
          $summary.Add('No downloaded executable was run.')
          $summary.Add('')

          foreach ($target in $targets) {
            $appDir = Join-Path $root $target.Name
            New-Item -ItemType Directory -Path $appDir -Force | Out-Null
            $fileName = [IO.Path]::GetFileName(([Uri]$target.Url).AbsolutePath)
            $download = Join-Path $appDir $fileName
            $payload = Join-Path $appDir 'payload'
            New-Item -ItemType Directory -Path $payload -Force | Out-Null

            Write-Host "===== $($target.Name) ====="
            Invoke-WebRequest -Uri $target.Url -OutFile $download -TimeoutSec 300
            $hash = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $target.Hash) { throw "$($target.Name): SHA-256 mismatch. Expected $($target.Hash), got $hash." }

            if ($target.Type -eq 'MSI') {
              $log = Join-Path $appDir 'msiexec-admin.log'
              $proc = Start-Process -FilePath "$env:WINDIR\System32\msiexec.exe" -ArgumentList @('/a', $download, '/qn', "TARGETDIR=$payload", '/l*v', $log) -Wait -PassThru
              if ($proc.ExitCode -notin @(0,3010)) { throw "$($target.Name): msiexec /a failed with $($proc.ExitCode)." }
            } else {
              & $sevenZip x $download "-o$payload" -y -bd 2>&1 | Set-Content -LiteralPath (Join-Path $appDir '7zip-extract.log')
              if ($LASTEXITCODE -ne 0) { throw "$($target.Name): 7-Zip extraction failed." }
            }

            $files = @(Get-ChildItem -LiteralPath $payload -File -Recurse -Force)
            if ($files.Count -eq 0) { throw "$($target.Name): extracted package contains no files." }
            $summary.Add("## $($target.Name) ($($target.Type))")
            $summary.Add("- SHA-256: $hash")
            $summary.Add("- Extracted files: $($files.Count)")
            $summary.Add('- Executables:')
            $executables = @($files | Where-Object { $_.Extension -ieq '.exe' })
            foreach ($exe in $executables) {
              $relative = [IO.Path]::GetRelativePath($payload, $exe.FullName).Replace('\','/')
              $summary.Add("  - $relative ($($exe.Length) bytes)")
              Write-Host "EXE: $relative"
            }
            if ($executables.Count -eq 0) { $summary.Add('  - None') }
            $summary.Add('- File inventory:')
            foreach ($item in $files) {
              $relative = [IO.Path]::GetRelativePath($payload, $item.FullName).Replace('\','/')
              $summary.Add("  - $relative")
            }
            $summary.Add('')
          }

          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          $summary | Set-Content -LiteralPath (Join-Path $root 'inspection-report.txt') -Encoding utf8

      - name: Upload extracted package inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ntcore-package-inventory
          path: ${{ runner.temp }}/ntcore-inspection/
          if-no-files-found: error
          retention-days: 7
