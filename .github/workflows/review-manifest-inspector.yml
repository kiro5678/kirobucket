name: Review Manifest Installer and Archive Inspector

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
    paths:
      - 'under review scoop bucket/*.json'
      - '.github/workflows/review-manifest-inspector.yml'

permissions:
  contents: read

concurrency:
  group: review-manifest-inspector-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inspect:
    name: Download, hash, and inspect staged packages
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Inspect staged manifests and package files
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $root = Join-Path $env:RUNNER_TEMP 'review-manifest-inspector'
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
            $command = Get-Command '7z.exe' -ErrorAction SilentlyContinue
            if ($command) { $sevenZip = $command.Source }
          }
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
            throw '7-Zip was not found on the Windows runner.'
          }

          $allChanged = @(git diff --name-only "$env:BASE_SHA...$env:HEAD_SHA")
          $changed = @(git diff --diff-filter=ACMRT --name-only "$env:BASE_SHA...$env:HEAD_SHA" -- 'under review scoop bucket' |
            Where-Object { $_.StartsWith('under review scoop bucket/') -and $_.EndsWith('.json') } |
            Sort-Object -Unique)
          if ($changed.Count -eq 0) {
            $deletedReviewManifests = @($allChanged | Where-Object {
              $_.StartsWith('under review scoop bucket/') -and
              $_.EndsWith('.json') -and
              -not (Test-Path -LiteralPath $_ -PathType Leaf)
            })
            $inspectorWorkflowChanged = $allChanged -contains '.github/workflows/review-manifest-inspector.yml'
            if ($inspectorWorkflowChanged -and $deletedReviewManifests.Count -eq 0) {
              $changed = @(Get-ChildItem -LiteralPath 'under review scoop bucket' -Filter '*.json' -File |
                ForEach-Object { $_.FullName.Substring((Get-Location).Path.Length + 1).Replace('\','/') })
            } else {
              Write-Host 'No added or modified review manifest JSON files changed; package inspection is not required.'
              @(
                '## Review manifest inspection',
                '',
                'No added or modified review manifest JSON files changed in this pull request; package inspection was skipped.'
              ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              exit 0
            }
          }
          $report = [System.Collections.Generic.List[string]]::new()
          $report.Add('# Review manifest inspection')
          $report.Add('')
          $report.Add('| Manifest | Download | SHA-256 | 7-Zip | Payload paths |')
          $report.Add('|---|---|---|---|---|')
          $failures = 0
          $innounpPath = $null
          $sevenZipLog = Join-Path $root '7zip.log'
          '7-Zip diagnostics for this pull request' | Set-Content -LiteralPath $sevenZipLog -Encoding utf8

          foreach ($manifestPath in $changed) {
            $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding utf8 | ConvertFrom-Json -ErrorAction Stop
            $source = $manifest
            if ($manifest.architecture -and $manifest.architecture.'64bit') {
              $source = $manifest.architecture.'64bit'
            }

            $url = [string]$source.url
            if ([string]::IsNullOrWhiteSpace($url)) {
              $report.Add("| $manifestPath | MISSING URL | — | — | — |")
              $failures++
              continue
            }

            $downloadUrl = ($url -split '#', 2)[0]
            $fileName = [IO.Path]::GetFileName(([Uri]$downloadUrl).AbsolutePath)
            if ([string]::IsNullOrWhiteSpace($fileName)) {
              $fileName = [IO.Path]::GetFileNameWithoutExtension($manifestPath) + '.download'
            }

            $appName = [IO.Path]::GetFileNameWithoutExtension($manifestPath)
            $appDir = Join-Path $root $appName
            New-Item -ItemType Directory -Path $appDir -Force | Out-Null
            $downloadPath = Join-Path $appDir $fileName

            try {
              Invoke-WebRequest -Uri $downloadUrl -OutFile $downloadPath -MaximumRedirection 10 -TimeoutSec 900 -ErrorAction Stop
            } catch {
              $safeError = $_.Exception.Message -replace '\|','/'
              $report.Add("| $appName | FAILED | — | — | $safeError |")
              $failures++
              continue
            }

            $hashStatus = 'NOT SET'
            $expectedHash = [string]$source.hash
            if ([string]::IsNullOrWhiteSpace($expectedHash)) {
              $hashStatus = 'MISSING'
              Write-Warning "$appName has no expected SHA-256."
            } elseif ($expectedHash -match '^[0-9a-fA-F]{64}$') {
              $actualHash = (Get-FileHash -LiteralPath $downloadPath -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actualHash -eq $expectedHash.ToLowerInvariant()) {
                $hashStatus = 'PASS'
              } else {
                $hashStatus = 'MISMATCH'
                $failures++
                Write-Warning "$appName SHA-256 mismatch: expected $expectedHash, got $actualHash"
              }
            } else {
              $hashStatus = 'UNSUPPORTED FORMAT'
              $failures++
            }

            $archiveStatus = 'NOT A 7-Zip ARCHIVE'
            $payloadStatus = 'Installer family / payload requires separate inspection'
            $extension = [IO.Path]::GetExtension($downloadPath)
            $isArchive = $extension -match '(?i)^\.(zip|7z|rar|tar|gz|tgz)$'
            $isDirectExecutable = ($extension -ieq '.exe') -and ($fileName -ieq [string]$manifest.bin)
            $isInnoSetup = ($manifest.innosetup -eq $true) -and ($extension -ieq '.exe')

            if ($isInnoSetup) {
              try {
                if ([string]::IsNullOrWhiteSpace($innounpPath)) {
                  $innounpZip = Join-Path $root 'innounp-2.zip'
                  $innounpRoot = Join-Path $root 'innounp-helper'
                  Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/jrathlev/InnoUnpacker-Windows-GUI/032d64c782efc6b36766d8f9c3b1b2f042144a58/innounp-2/bin/innounp-2.zip' -OutFile $innounpZip -MaximumRedirection 10 -TimeoutSec 180 -ErrorAction Stop
                  $helperHash = (Get-FileHash -LiteralPath $innounpZip -Algorithm SHA256).Hash.ToLowerInvariant()
                  if ($helperHash -ne '10fce27b6344b7674d5625cc34afca1c88c12183d957c6d93e401097fa2556cd') {
                    throw "innounp helper SHA-256 mismatch: $helperHash"
                  }
                  New-Item -ItemType Directory -Path $innounpRoot -Force | Out-Null
                  Add-Content -LiteralPath $sevenZipLog -Value "`n[innounp helper extraction] $innounpZip"
                  & $sevenZip x $innounpZip "-o$innounpRoot" '-y' 2>&1 | Tee-Object -FilePath $sevenZipLog -Append | Out-Null
                  if ($LASTEXITCODE -ne 0) {
                    throw 'Could not extract the verified innounp helper archive.'
                  }
                  $innounpExe = Get-ChildItem -LiteralPath $innounpRoot -Filter 'innounp.exe' -File -Recurse | Select-Object -First 1
                  if ($null -eq $innounpExe) {
                    throw 'The verified innounp helper archive did not contain innounp.exe.'
                  }
                  $innounpPath = $innounpExe.FullName
                }

                $innoExtractRoot = Join-Path $appDir 'inno-app'
                New-Item -ItemType Directory -Path $innoExtractRoot -Force | Out-Null
                $innounpOutput = & $innounpPath '-x' "-d$innoExtractRoot" $downloadPath '-y' '-c{app}' 2>&1
                $innounpExitCode = $LASTEXITCODE
                Add-Content -LiteralPath $sevenZipLog -Value ([Environment]::NewLine + "===== $appName : innounp -x -c{app} =====")
                $innounpOutput | Add-Content -LiteralPath $sevenZipLog
                if ($innounpExitCode -ne 0) {
                  $details = ($innounpOutput | Select-Object -Last 10) -join ' '
                  throw "innounp extraction failed with exit code $innounpExitCode. $details"
                }

                $innoFiles = @(Get-ChildItem -LiteralPath $innoExtractRoot -File -Recurse)
                if ($innoFiles.Count -eq 0) {
                  throw 'innounp reported success but extracted no files from {app}.'
                }
                $exeFiles = @($innoFiles | Where-Object { $_.Extension -ieq '.exe' } |
                  ForEach-Object { [IO.Path]::GetRelativePath($innoExtractRoot, $_.FullName).Replace('\','/') })
                if ($exeFiles.Count -eq 0) {
                  throw 'The extracted Inno Setup app directory contains no EXE files.'
                }
                $archiveStatus = 'INNO LIST + EXTRACT PASS'
                $payloadStatus = $exeFiles -join ', '
                Write-Host "$appName: innounp extracted $($innoFiles.Count) app file(s). EXEs: $($exeFiles -join ', ')"
                if ($manifest.bin -is [string] -and -not [string]::IsNullOrWhiteSpace($manifest.bin)) {
                  $expectedBin = ([string]$manifest.bin).Replace('\','/')
                  if ($exeFiles -contains $expectedBin) {
                    Write-Host "$appName declared bin path exists in extracted Inno payload: $expectedBin"
                  } else {
                    throw "$appName declared bin path was not found in the Inno payload: $expectedBin"
                  }
                }
              } catch {
                $archiveStatus = 'INNO EXTRACT FAILED'
                $payloadStatus = $_.Exception.Message
                $failures++
                Add-Content -LiteralPath $sevenZipLog -Value ([Environment]::NewLine + "===== $appName : innounp error =====")
                Add-Content -LiteralPath $sevenZipLog -Value $_.Exception.ToString()
              }
            } elseif ($isDirectExecutable) {
              $archiveStatus = 'STANDALONE EXECUTABLE'
              $payloadStatus = 'Downloaded filename matches manifest bin'
            } else {
              $listOutput = & $sevenZip l -slt $downloadPath 2>&1
              $listExit = $LASTEXITCODE
              Add-Content -LiteralPath $sevenZipLog -Value ([Environment]::NewLine + "===== $appName : 7z l =====")
              $listOutput | Add-Content -LiteralPath $sevenZipLog

              if ($listExit -eq 0) {
                $extractDir = Join-Path $appDir 'extracted'
                New-Item -ItemType Directory -Path $extractDir -Force | Out-Null
                $extractOutput = & $sevenZip x -y "-o$extractDir" $downloadPath 2>&1
                $extractExit = $LASTEXITCODE
                Add-Content -LiteralPath $sevenZipLog -Value ([Environment]::NewLine + "===== $appName : 7z x =====")
                $extractOutput | Add-Content -LiteralPath $sevenZipLog

                if ($extractExit -eq 0) {
                  $archiveStatus = 'LIST + EXTRACT PASS'
                  $exeFiles = @(Get-ChildItem -LiteralPath $extractDir -Filter '*.exe' -File -Recurse -ErrorAction SilentlyContinue |
                    ForEach-Object { $_.FullName.Substring($extractDir.Length).TrimStart('\','/') })
                  if ($exeFiles.Count -gt 0) {
                    $payloadStatus = $exeFiles -join ', '
                  } else {
                    $payloadStatus = 'No EXE found in extracted payload'
                  }

                  $nestedArchives = @(Get-ChildItem -LiteralPath $extractDir -Filter 'app-64.7z' -File -Recurse -ErrorAction SilentlyContinue)
                  foreach ($nestedArchive in $nestedArchives) {
                    Write-Host "Found nested app archive: $($nestedArchive.FullName) ($($nestedArchive.Length) bytes)"
                    $nestedList = & $sevenZip l -slt $nestedArchive.FullName 2>&1
                    $nestedListExit = $LASTEXITCODE
                    Add-Content -LiteralPath $sevenZipLog -Value ([Environment]::NewLine + "===== $appName : nested 7z l =====")
                    $nestedList | Add-Content -LiteralPath $sevenZipLog
                    if ($nestedListExit -eq 0) {
                      $nestedDir = Join-Path $appDir 'nested-app'
                      New-Item -ItemType Directory -Path $nestedDir -Force | Out-Null
                      $nestedExtract = & $sevenZip x -y "-o$nestedDir" $nestedArchive.FullName 2>&1
                      $nestedExtractExit = $LASTEXITCODE
                      Add-Content -LiteralPath $sevenZipLog -Value ([Environment]::NewLine + "===== $appName : nested 7z x =====")
                      $nestedExtract | Add-Content -LiteralPath $sevenZipLog
                      if ($nestedExtractExit -eq 0) {
                        $nestedExeFiles = @(Get-ChildItem -LiteralPath $nestedDir -Filter '*.exe' -File -Recurse -ErrorAction SilentlyContinue |
                          ForEach-Object { $_.FullName.Substring($nestedDir.Length).TrimStart([char[]](92, 47)) })
                        Write-Host "Nested application EXE paths: $($nestedExeFiles -join ', ')"
                        if ($nestedExeFiles.Count -gt 0) {
                          $payloadStatus += "; nested app: $($nestedExeFiles -join ', ')"
                        }
                      } else {
                        Write-Warning "Nested app archive extraction failed with exit $nestedExtractExit."
                      }
                    } else {
                      Write-Warning "Nested app archive listing failed with exit $nestedListExit."
                    }
                  }

                  if ($manifest.bin -is [string] -and -not [string]::IsNullOrWhiteSpace($manifest.bin)) {
                    $expectedBin = ([string]$manifest.bin).Replace('\','/')
                    if ($exeFiles -contains $expectedBin) {
                      Write-Host "$appName declared bin path exists in extracted payload: $expectedBin"
                    } else {
                      Write-Warning "$appName declared bin path not found in extracted payload: $expectedBin"
                    }
                  }
                } else {
                  $archiveStatus = "EXTRACT FAILED (exit $extractExit)"
                  $payloadStatus = 'See 7zip.log'
                  if ($isArchive) { $failures++ }
                }
              } elseif ($isArchive) {
                $archiveStatus = "ARCHIVE LIST FAILED (exit $listExit)"
                $payloadStatus = 'See 7zip.log'
                $failures++
              }
            }

            if ($payloadStatus.Length -gt 240) {
              $payloadStatus = $payloadStatus.Substring(0,237) + '...'
            }
            $safePayload = $payloadStatus -replace '\|','/'
            $report.Add("| $appName | OK | $hashStatus | $archiveStatus | $safePayload |")
          }

          $report.Add('')
          $report.Add('7-Zip transcript is uploaded as the review-manifest-7zip-logs artifact.')
          $report | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Write-Host "Inspection completed. Blocking errors: $failures"
          if ($failures -gt 0) { exit 1 }
          exit 0

      - name: Upload 7-Zip diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-manifest-7zip-logs
          path: ${{ runner.temp }}/review-manifest-inspector/7zip.log
          if-no-files-found: warn
