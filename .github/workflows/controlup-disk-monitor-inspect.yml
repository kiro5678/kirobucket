name: Inspect ControlUp Disk Monitor MSI

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/controlup-disk-monitor-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download and inspect the official MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $url = 'https://www.controlup.com/wp-content/files/ControlUp_Disk_Monitor_09.25.msi'
          $work = Join-Path $env:RUNNER_TEMP 'controlup-disk-monitor'
          $extract = Join-Path $work 'admin-image'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $msi = Join-Path $work 'ControlUp_Disk_Monitor_09.25.msi'
          $report = [System.Collections.Generic.List[string]]::new()
          $report.Add('# ControlUp Disk Monitor MSI inspection')
          $report.Add('')
          $report.Add("- Source: $url")
          $report.Add("- Checked: $([DateTime]::UtcNow.ToString('yyyy-MM-dd HH:mm:ss UTC'))")
          try {
            Invoke-WebRequest -Uri $url -OutFile $msi -TimeoutSec 180 -MaximumRedirection 10
            $item = Get-Item -LiteralPath $msi
            $hash = (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash.ToLowerInvariant()
            $signature = Get-AuthenticodeSignature -FilePath $msi
            $report.Add("- Download size: $($item.Length) bytes")
            $report.Add("- SHA-256: $hash")
            $report.Add("- PowerShell Authenticode status: $($signature.Status)")
            $report.Add("- Signer: $($signature.SignerCertificate.Subject)")

            $signtoolPath = Get-ChildItem -LiteralPath "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -File -Recurse -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            if ($signtoolPath) {
              $signtoolOutput = @(& $signtoolPath verify /pa /all /v $msi 2>&1 | ForEach-Object { [string]$_ })
              $signtoolExit = $LASTEXITCODE
              $report.Add("- SignTool verification exit code: $signtoolExit")
              foreach ($line in ($signtoolOutput | Select-Object -Last 20)) { $report.Add("- SignTool: $line") }
            } else {
              $report.Add('- SignTool was not found on the runner.')
            }

            New-Item -ItemType Directory -Path $extract -Force | Out-Null
            $arguments = "/a `"$msi`" /qn /norestart TARGETDIR=`"$extract`""
            $process = Start-Process -FilePath 'msiexec.exe' -ArgumentList $arguments -Wait -PassThru
            $report.Add('')
            $report.Add('## Administrative extraction test (msiexec /a)')
            $report.Add("- Exit code: $($process.ExitCode)")
            $extracted = @(Get-ChildItem -LiteralPath $extract -File -Recurse -ErrorAction SilentlyContinue)
            $report.Add("- Extracted files: $($extracted.Count)")
            foreach ($file in ($extracted | Select-Object -First 100)) {
              $relative = $file.FullName.Substring($extract.Length).TrimStart('\')
              $report.Add("- $relative")
            }

            $report.Add('')
            $report.Add('## Extracted service-install indicators')
            $scriptFiles = @($extracted | Where-Object { $_.Extension -in @('.ps1','.cmd','.bat','.vbs') })
            if ($scriptFiles.Count -eq 0) {
              $report.Add('- No standalone PowerShell/cmd/batch/VBS files were found in the administrative image.')
            }
            foreach ($script in $scriptFiles) {
              $matches = Select-String -LiteralPath $script.FullName -Pattern 'New-Service|Remove-Service|sc\.exe|CreateService|DeleteService|Start-Service|Stop-Service|DiskMonitor' -ErrorAction SilentlyContinue
              foreach ($match in ($matches | Select-Object -First 30)) {
                $relative = $script.FullName.Substring($extract.Length).TrimStart('\')
                $report.Add("- ${relative}:$($match.LineNumber): $($match.Line.Trim())")
              }
            }

            if ($process.ExitCode -notin @(0,3010)) {
              throw "MSI administrative extraction failed with exit code $($process.ExitCode)."
            }
            if ($signature.Status -eq 'HashMismatch' -or ($signtoolPath -and $signtoolExit -ne 0)) {
              $report.Add('')
              $report.Add('SECURITY WARNING: at least one Authenticode verification method reported a signature failure. Do not run the MSI until the publisher confirms the package integrity.')
              Write-Warning 'The MSI signature did not pass all signature checks; package execution is not being tested.'
            }
            $report.Add('')
            $report.Add('Download, SHA-256 calculation and administrative MSI extraction completed.')
            $report | Set-Content -LiteralPath (Join-Path $work 'inspection.md') -Encoding utf8
            $report | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          } catch {
            $report.Add('')
            $report.Add("FAILED: $($_.Exception.Message)")
            $report | Set-Content -LiteralPath (Join-Path $work 'inspection.md') -Encoding utf8
            $report | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            throw
          }
      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlup-disk-monitor-msi-inspection
          path: ${{ runner.temp }}/controlup-disk-monitor/inspection.md
          if-no-files-found: warn
          retention-days: 14
