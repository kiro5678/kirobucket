name: Inspect ControlUp Disk Monitor MSI

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/controlup-disk-monitor-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download and inspect the official MSI
        id: inspect
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $url = 'https://www.controlup.com/wp-content/files/ControlUp_Disk_Monitor_09.25.msi'
          $work = Join-Path $env:RUNNER_TEMP 'controlup-disk-monitor'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $msi = Join-Path $work 'ControlUp_Disk_Monitor_09.25.msi'
          $report = [System.Collections.Generic.List[string]]::new()
          $report.Add('# ControlUp Disk Monitor MSI inspection')
          $report.Add('')
          $report.Add("- Source: $url")
          $report.Add("- Checked: $([DateTime]::UtcNow.ToString('yyyy-MM-dd HH:mm:ss UTC'))")
          try {
            Invoke-WebRequest -Uri $url -OutFile $msi -TimeoutSec 180 -MaximumRedirection 10
            $item = Get-Item -LiteralPath $msi
            $hash = (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash.ToLowerInvariant()
            $signature = Get-AuthenticodeSignature -FilePath $msi
            $report.Add("- Download size: $($item.Length) bytes")
            $report.Add("- SHA-256: $hash")
            $report.Add("- Authenticode status: $($signature.Status)")
            $report.Add("- Signer: $($signature.SignerCertificate.Subject)")
            $signtool = Get-Command signtool.exe -ErrorAction SilentlyContinue
            if ($signtool) {
              $signtoolOutput = @(& $signtool.Source verify /pa /all /v $msi 2>&1 | ForEach-Object { [string]$_ })
              $signtoolExit = $LASTEXITCODE
              $report.Add("- signtool verify exit code: $signtoolExit")
              foreach ($line in ($signtoolOutput | Select-Object -Last 12)) { $report.Add("- signtool: $line") }
            } else {
              $report.Add('- signtool.exe not found on runner.')
            }
            $report.Add('')
            $wi = New-Object -ComObject WindowsInstaller.Installer
            $db = $wi.OpenDatabase($msi, 0)

            function Get-MsiRows {
              param(
                [Parameter(Mandatory)][string]$Query,
                [Parameter(Mandatory)][int]$FieldCount
              )
              $view = $db.OpenView($Query)
              $view.Execute()
              $rows = [System.Collections.Generic.List[object]]::new()
              while ($null -ne ($record = $view.Fetch())) {
                $values = [string[]]::new($FieldCount)
                for ($column = 1; $column -le $FieldCount; $column++) {
                  $values[$column - 1] = [string]$record.StringData($column)
                }
                $rows.Add([PSCustomObject]@{ Values = $values })
              }
              $view.Close()
              return $rows.ToArray()
            }

            $properties = @{}
            foreach ($row in (Get-MsiRows -Query 'SELECT `Property`, `Value` FROM `Property`' -FieldCount 2)) {
              $properties[[string]$row.Values[0]] = [string]$row.Values[1]
            }
            $report.Add('## MSI properties')
            foreach ($key in @('ProductName','ProductVersion','Manufacturer','ProductCode','UpgradeCode','InstallLocation')) {
              if ($properties.ContainsKey($key)) { $report.Add("- ${key}: $($properties[$key])") }
            }
            $tableNames = @((Get-MsiRows -Query 'SELECT `Name` FROM `_Tables`' -FieldCount 1) | ForEach-Object { [string]$_.Values[0] })
            $report.Add('')
            $report.Add('## MSI service/custom-action metadata')
            if ($tableNames -contains 'ServiceInstall') {
              $report.Add('### ServiceInstall')
              foreach ($row in (Get-MsiRows -Query 'SELECT `Name`, `DisplayName`, `StartType`, `ServiceType`, `Arguments`, `Component_` FROM `ServiceInstall`' -FieldCount 6)) {
                $report.Add("- Name=$($row.Values[0]); DisplayName=$($row.Values[1]); StartType=$($row.Values[2]); ServiceType=$($row.Values[3]); Arguments=$($row.Values[4]); Component=$($row.Values[5])")
              }
            } else { $report.Add('- No ServiceInstall table.') }
            if ($tableNames -contains 'CustomAction') {
              $report.Add('### CustomAction')
              foreach ($row in (Get-MsiRows -Query 'SELECT `Action`, `Type`, `Source`, `Target` FROM `CustomAction`' -FieldCount 4)) {
                $report.Add("- Action=$($row.Values[0]); Type=$($row.Values[1]); Source=$($row.Values[2]); Target=$($row.Values[3])")
              }
            } else { $report.Add('- No CustomAction table.') }

            if ($tableNames -contains 'File') {
              $report.Add('')
              $report.Add('## Payload file table')
              foreach ($row in (Get-MsiRows -Query 'SELECT `FileName`, `FileSize`, `Component_` FROM `File`' -FieldCount 3)) {
                $report.Add("- $($row.Values[0]) | $($row.Values[1]) bytes | Component $($row.Values[2])")
              }
            }

            $extract = Join-Path $work 'admin-image'
            New-Item -ItemType Directory -Path $extract -Force | Out-Null
            $arguments = @('/a', "`"$msi`"", '/qn', '/norestart', "TARGETDIR=`"$extract`"")
            $process = Start-Process -FilePath 'msiexec.exe' -ArgumentList $arguments -Wait -PassThru
            $report.Add('')
            $report.Add('## Administrative extraction test')
            $report.Add("- msiexec /a exit code: $($process.ExitCode)")
            $extracted = @(Get-ChildItem -LiteralPath $extract -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 100)
            $report.Add("- Files extracted (up to 100 listed): $($extracted.Count)")
            foreach ($file in $extracted) { $report.Add("- $($file.FullName.Substring($extract.Length).TrimStart('\'))") }
            if ($process.ExitCode -notin @(0,3010)) {
              throw "MSI administrative extraction failed with exit code $($process.ExitCode)."
            }
            $report.Add('')
            $report.Add('MSI download, hash, metadata inspection and administrative extraction completed.')
            $report | Set-Content -LiteralPath (Join-Path $work 'inspection.md') -Encoding utf8
            $report | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            "sha256=$hash" >> $env:GITHUB_OUTPUT
          } catch {
            $report.Add('')
            $report.Add("FAILED: $($_.Exception.Message)")
            $report | Set-Content -LiteralPath (Join-Path $work 'inspection.md') -Encoding utf8
            $report | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            throw
          }
      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlup-disk-monitor-msi-inspection
          path: ${{ runner.temp }}/controlup-disk-monitor/inspection.md
          if-no-files-found: warn
          retention-days: 14
