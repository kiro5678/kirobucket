name: Termemo Scoop Lifecycle Test

on:
  pull_request:
    branches:
      - master
    paths:
      - "bucket/termemo.json"
      - ".github/workflows/termemo-scoop-test.yml"
  push:
    branches:
      - master
    paths:
      - "bucket/termemo.json"
      - ".github/workflows/termemo-scoop-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    name: Check, install, launch, persist, update, uninstall, and reinstall
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Scoop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $env:SCOOP = Join-Path $env:RUNNER_TEMP 'scoop-termemo-lifecycle'
          "SCOOP=$env:SCOOP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $env:SCOOP 'shims') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri 'https://get.scoop.sh' | Invoke-Expression
          $env:PATH = (Join-Path $env:SCOOP 'shims') + ';' + $env:PATH
          scoop --version

      - name: Verify Scoop formatter output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:SCOOP_HOME = (scoop prefix scoop).Trim()
          $formatter = Join-Path $env:GITHUB_WORKSPACE 'bin\formatjson.ps1'
          & $formatter 'termemo'
          git diff --exit-code -- bucket/termemo.json
          if ($LASTEXITCODE -ne 0) {
            throw 'Termemo manifest differs from the repository Scoop formatjson.ps1 output.'
          }

      - name: Force checkver and validate release hash
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'bucket\termemo.json'
          $manifestDir = Split-Path -Parent $manifestPath
          $checkver = Join-Path $env:SCOOP 'apps\scoop\current\bin\checkver.ps1'
          if (-not (Test-Path -LiteralPath $checkver -PathType Leaf)) {
            throw "Scoop checkver.ps1 was not found: $checkver"
          }
          & $checkver 'termemo' $manifestDir -ForceUpdate -ThrowError

          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.version -ne '0.3.1') {
            throw "Unexpected upstream version: $($manifest.version)"
          }
          if ($manifest.hash -ne '80c0e451f561ca4dc755749ce76b7d21648b6700aeee8183ebfb6024a41c8b11') {
            throw "Forced autoupdate returned an unexpected MSI SHA-256: $($manifest.hash)"
          }
          Write-Host "PASS: checkver found $($manifest.version) and autoupdate resolved the official MSI SHA-256."

      - name: Install manifest and verify executable, shortcut, and data junctions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'bucket\termemo.json'
          scoop install $manifestPath
          if ($LASTEXITCODE -ne 0) { throw "Scoop install failed with exit code $LASTEXITCODE." }

          $appDir = Join-Path $env:SCOOP 'apps\termemo\current'
          $exe = Join-Path $appDir 'termemo.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Extracted Termemo executable is missing: $exe"
          }

          $shortcutRoot = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          $shortcutFile = Get-ChildItem -LiteralPath $shortcutRoot -Filter 'Termemo.lnk' -File -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($null -eq $shortcutFile) { throw 'Termemo Start Menu shortcut was not created.' }
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut($shortcutFile.FullName)
          if ($shortcut.TargetPath -ne $exe) {
            throw "Shortcut target mismatch: $($shortcut.TargetPath)"
          }

          $persistData = Join-Path $env:SCOOP 'persist\termemo\data'
          $persistLocal = Join-Path $env:SCOOP 'persist\termemo\local-data'
          $appData = Join-Path $env:APPDATA 'dev.commandpad.app'
          $localData = Join-Path $env:LOCALAPPDATA 'dev.commandpad.app'

          function Assert-TermemoJunction([string]$Path, [string]$Target) {
            $item = Get-Item -LiteralPath $Path -Force -ErrorAction Stop
            if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0 -or
                $item.LinkType -ne 'Junction' -or
                [IO.Path]::GetFullPath([string]$item.Target) -ine [IO.Path]::GetFullPath($Target)) {
              throw "Unexpected Termemo persistence junction: $Path -> $($item.Target)"
            }
          }

          Assert-TermemoJunction -Path $appData -Target $persistData
          Assert-TermemoJunction -Path $localData -Target $persistLocal

          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          $process.Refresh()
          if ($process.HasExited) {
            throw "Termemo exited during the 10-second Windows launch smoke test (exit code $($process.ExitCode))."
          }
          Stop-Process -Id $process.Id -Force
          Wait-Process -Id $process.Id -ErrorAction SilentlyContinue

          $defaultWorkspace = Join-Path $persistData 'default-workspace\.cmdpad\workspace.json'
          if (-not (Test-Path -LiteralPath $defaultWorkspace -PathType Leaf)) {
            throw "Termemo did not create its default workspace under Scoop persist: $defaultWorkspace"
          }

          Set-Content -LiteralPath (Join-Path $persistData 'scoop-persist-check.txt') -Value 'Termemo data survives Scoop uninstall.'
          Set-Content -LiteralPath (Join-Path $persistLocal 'webview-persist-check.txt') -Value 'Termemo WebView2 data survives Scoop uninstall.'
          Write-Host "PASS: executable, shortcut, both junctions, and default workspace verified."

      - name: Force update and verify Scoop retains external data junctions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          scoop update termemo --force
          if ($LASTEXITCODE -ne 0) { throw "Scoop update failed with exit code $LASTEXITCODE." }

          $appData = Join-Path $env:APPDATA 'dev.commandpad.app'
          $localData = Join-Path $env:LOCALAPPDATA 'dev.commandpad.app'
          $persistData = Join-Path $env:SCOOP 'persist\\termemo\\data'
          $persistLocal = Join-Path $env:SCOOP 'persist\\termemo\\local-data'

          foreach ($pair in @(
            @{ Path = $appData; Target = $persistData },
            @{ Path = $localData; Target = $persistLocal }
          )) {
            $item = Get-Item -LiteralPath $pair.Path -Force -ErrorAction Stop
            if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0 -or
                $item.LinkType -ne 'Junction' -or
                [IO.Path]::GetFullPath([string]$item.Target) -ine [IO.Path]::GetFullPath([string]$pair.Target)) {
              throw "Scoop update broke Termemo's persistence junction: $($pair.Path) -> $($item.Target)"
            }
          }

          foreach ($marker in @(
            (Join-Path $persistData 'scoop-persist-check.txt'),
            (Join-Path $persistLocal 'webview-persist-check.txt'),
            (Join-Path $persistData 'default-workspace\\.cmdpad\\workspace.json')
          )) {
            if (-not (Test-Path -LiteralPath $marker -PathType Leaf)) {
              throw "Termemo data did not survive Scoop update: $marker"
            }
          }

          $exe = Join-Path $env:SCOOP 'apps\\termemo\\current\\termemo.exe'
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          $process.Refresh()
          if ($process.HasExited) {
            throw "Termemo failed to launch after Scoop update (exit code $($process.ExitCode))."
          }
          Stop-Process -Id $process.Id -Force
          Wait-Process -Id $process.Id -ErrorAction SilentlyContinue
          Write-Host 'PASS: forced Scoop update retained both junctions and all persistent data; Termemo launched again.'

      - name: Uninstall and verify persisted data retention
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          scoop uninstall termemo
          if ($LASTEXITCODE -ne 0) { throw "Scoop uninstall failed with exit code $LASTEXITCODE." }

          $appData = Join-Path $env:APPDATA 'dev.commandpad.app'
          $localData = Join-Path $env:LOCALAPPDATA 'dev.commandpad.app'
          if (Test-Path -LiteralPath $appData) { throw "Termemo AppData junction remains after uninstall: $appData" }
          if (Test-Path -LiteralPath $localData) { throw "Termemo LocalAppData junction remains after uninstall: $localData" }

          $persistData = Join-Path $env:SCOOP 'persist\termemo\data'
          $persistLocal = Join-Path $env:SCOOP 'persist\termemo\local-data'
          foreach ($marker in @(
            (Join-Path $persistData 'scoop-persist-check.txt'),
            (Join-Path $persistLocal 'webview-persist-check.txt'),
            (Join-Path $persistData 'default-workspace\.cmdpad\workspace.json')
          )) {
            if (-not (Test-Path -LiteralPath $marker -PathType Leaf)) {
              throw "Persisted Termemo data was deleted: $marker"
            }
          }
          Write-Host 'PASS: both external junctions were removed and all persistent markers survived.'

      - name: Reinstall, verify persistence reattachment, and uninstall again
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'bucket\termemo.json'
          scoop install $manifestPath
          if ($LASTEXITCODE -ne 0) { throw "Second Scoop install failed with exit code $LASTEXITCODE." }

          $appData = Join-Path $env:APPDATA 'dev.commandpad.app'
          $localData = Join-Path $env:LOCALAPPDATA 'dev.commandpad.app'
          $persistData = Join-Path $env:SCOOP 'persist\termemo\data'
          $persistLocal = Join-Path $env:SCOOP 'persist\termemo\local-data'

          foreach ($pair in @(
            @{ Path = $appData; Target = $persistData },
            @{ Path = $localData; Target = $persistLocal }
          )) {
            $item = Get-Item -LiteralPath $pair.Path -Force -ErrorAction Stop
            if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0 -or
                $item.LinkType -ne 'Junction' -or
                [IO.Path]::GetFullPath([string]$item.Target) -ine [IO.Path]::GetFullPath([string]$pair.Target)) {
              throw "Termemo persistence reattachment failed: $($pair.Path) -> $($item.Target)"
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $persistData 'scoop-persist-check.txt') -PathType Leaf)) {
            throw 'Termemo AppData marker did not survive reinstall.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $persistLocal 'webview-persist-check.txt') -PathType Leaf)) {
            throw 'Termemo WebView2 marker did not survive reinstall.'
          }

          scoop uninstall termemo
          if ($LASTEXITCODE -ne 0) { throw "Final Scoop uninstall failed with exit code $LASTEXITCODE." }
          if (Test-Path -LiteralPath $appData) { throw "AppData junction remains after final uninstall: $appData" }
          if (Test-Path -LiteralPath $localData) { throw "LocalData junction remains after final uninstall: $localData" }
          if (-not (Test-Path -LiteralPath (Join-Path $persistData 'scoop-persist-check.txt') -PathType Leaf)) {
            throw 'Termemo AppData persistence was not retained after final uninstall.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $persistLocal 'webview-persist-check.txt') -PathType Leaf)) {
            throw 'Termemo WebView2 persistence was not retained after final uninstall.'
          }
          Write-Host 'PASS: reinstall restored both junctions; final uninstall removed only the links and retained both data directories.'

