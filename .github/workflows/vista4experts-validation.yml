name: Validate NTCore Vista4Experts manifest

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/vista4experts-validation.yml"
      - "bucket/vista4experts.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: my_bucket

      - name: Checkout Scoop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          ref: master
          path: scoop_core

      - name: Validate checkver, ZIP extraction, SHA-256 and autoupdate
        shell: pwsh
        env:
          SCOOP_HOME: ${{ github.workspace }}/scoop_core
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'my_bucket/bucket/vista4experts.json'
          $checkver = Join-Path $env:GITHUB_WORKSPACE 'scoop_core/bin/checkver.ps1'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json -AsHashtable

          $checkOutput = @(& $checkver -App $manifestPath -ThrowError *>&1 | ForEach-Object { [string]$_ })
          $checkText = $checkOutput -join [Environment]::NewLine
          if ($checkText -match '(?i)(couldn''t\s+(retrieve|find|match)|URL .+ is not valid|Conversion from JSON failed|failed to convert JSON)') {
            throw "Scoop checkver reported an error: $($Matches[0])"
          }
          Write-Host 'PASS: checkver'

          $root = Join-Path $env:RUNNER_TEMP 'vista4experts-validation'
          $archive = Join-Path $root 'Vista4Experts.zip'
          $extract = Join-Path $root 'payload'
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          Invoke-WebRequest -Uri $manifest.url -OutFile $archive -TimeoutSec 180
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $manifest.hash.ToLowerInvariant()) {
            throw "SHA-256 mismatch. Expected $($manifest.hash); got $actualHash."
          }
          Write-Host "PASS: SHA-256 $actualHash"

          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip)) {
            $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          }
          & $sevenZip x $archive "-o$extract" -y -bd
          if ($LASTEXITCODE -ne 0) { throw "7-Zip extraction failed with exit code $LASTEXITCODE." }
          $launcher = Join-Path $extract 'Vista4Experts.exe'
          if (-not (Test-Path -LiteralPath $launcher -PathType Leaf)) {
            throw 'Vista4Experts.exe was not found at the declared shortcut path after extraction.'
          }
          Write-Host 'PASS: archive extraction and shortcut target'

          $testManifest = Join-Path $root 'vista4experts-update-test.json'
          Copy-Item -LiteralPath $manifestPath -Destination $testManifest
          $updateOutput = @(& $checkver -App $testManifest -ForceUpdate -ThrowError *>&1 | ForEach-Object { [string]$_ })
          $updateText = $updateOutput -join [Environment]::NewLine
          if ($updateText -match '(?i)(couldn''t\s+(retrieve|find|match)|URL .+ is not valid|Conversion from JSON failed|failed to convert JSON|Could not update .+hash for .+ failed)') {
            throw "Scoop autoupdate reported an error: $($Matches[0])"
          }
          $updated = Get-Content -LiteralPath $testManifest -Raw | ConvertFrom-Json -AsHashtable
          if ($updated.url -ne $manifest.autoupdate.url) {
            throw "Autoupdate changed the URL unexpectedly: $($updated.url)"
          }
          if ($updated.hash -notmatch '^[a-fA-F0-9]{64}$') {
            throw 'Autoupdate did not produce a valid SHA-256 hash.'
          }
          Write-Host 'PASS: forced autoupdate URL/hash template'

          @(
            '# Vista4Experts manifest validation',
            '',
            '- checkver: PASS',
            "- SHA-256: PASS ($actualHash)",
            '- ZIP extraction and shortcut target: PASS',
            '- Forced autoupdate URL/hash template: PASS',
            '- No downloaded executable was run.'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
