name: Normalize manifest newlines

on:
  push:
    paths:
      - "bucket/**"
      - ".github/workflows/format-manifests.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-manifests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  normalize:
    name: Normalize Scoop manifest endings
    runs-on: windows-latest

    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Normalize manifest endings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git fetch origin master
          git reset --hard origin/master

          $bucketPath = Join-Path $env:GITHUB_WORKSPACE "bucket"

          Get-ChildItem -Path $bucketPath -Filter "*.json" -File -Recurse | ForEach-Object {
            $fileBytes = [System.IO.File]::ReadAllBytes($_.FullName)
            $contentLength = $fileBytes.Length

            while ($contentLength -gt 0 -and ($fileBytes[$contentLength - 1] -eq 10 -or $fileBytes[$contentLength - 1] -eq 13 -or $fileBytes[$contentLength - 1] -eq 32 -or $fileBytes[$contentLength - 1] -eq 9)) {
              $contentLength--
            }

            $trailingLength = $fileBytes.Length - $contentLength
            $hasSingleCrLf = $false
            if ($trailingLength -eq 2) {
              $hasSingleCrLf = $fileBytes[$contentLength] -eq 13 -and $fileBytes[$contentLength + 1] -eq 10
            }

            if (-not $hasSingleCrLf) {
              $normalizedBytes = [byte[]]::new($contentLength + 2)
              [System.Array]::Copy($fileBytes, $normalizedBytes, $contentLength)
              $normalizedBytes[$contentLength] = 13
              $normalizedBytes[$contentLength + 1] = 10
              [System.IO.File]::WriteAllBytes($_.FullName, $normalizedBytes)
            }
          }

      - name: Commit normalization changes
        id: commit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bucket
          git diff --cached --quiet
          $diffExitCode = $LASTEXITCODE

          if ($diffExitCode -eq 0) {
            Write-Host "All manifests already have exactly one CRLF at end of file."
            "changed=false" >> $env:GITHUB_OUTPUT
          } elseif ($diffExitCode -eq 1) {
            git commit -m "chore: remove extra manifest newlines"
            if ($LASTEXITCODE -ne 0) {
              throw "Could not commit normalized manifests."
            }

            $maxPushAttempts = 5
            $pushed = $false

            for ($attempt = 1; $attempt -le $maxPushAttempts; $attempt++) {
              git fetch origin master
              if ($LASTEXITCODE -ne 0) {
                throw "Could not fetch the latest master before pushing normalized manifests."
              }

              git rebase origin/master
              if ($LASTEXITCODE -ne 0) {
                git rebase --abort 2>$null
                throw "Could not rebase normalization changes onto the latest master. Check for concurrent edits to bucket manifests."
              }

              git push origin HEAD:master
              if ($LASTEXITCODE -eq 0) {
                $pushed = $true
                break
              }

              if ($attempt -lt $maxPushAttempts) {
                Write-Warning "master changed during the push; fetching and rebasing again (attempt $attempt of $maxPushAttempts)."
                Start-Sleep -Seconds 1
              }
            }

            if (-not $pushed) {
              throw "Could not push normalized manifests after $maxPushAttempts attempts because master kept changing."
            }

            "changed=true" >> $env:GITHUB_OUTPUT
          } else {
            throw "Could not inspect staged manifest changes."
          }

      - name: Trigger archive validation after normalization
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
          BASE_SHA: ${{ github.event.before || '' }}
          NORMALIZATION_CHANGED: ${{ steps.commit.outputs.changed || 'false' }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:EVENT_NAME -eq 'push' -and
              $env:HEAD_COMMIT_MESSAGE -eq 'chore: remove extra manifest newlines' -and
              $env:NORMALIZATION_CHANGED -ne 'true') {
            Write-Host "Skipping validation dispatch for the formatter's own no-op push."
            exit 0
          }

          $baseSha = $env:BASE_SHA.Trim()
          if ($baseSha -notmatch '^[0-9a-fA-F]{40}$') {
            $baseSha = (git rev-parse HEAD^).Trim()
            if ($LASTEXITCODE -ne 0 -or $baseSha -notmatch '^[0-9a-fA-F]{40}$') {
              throw "Could not determine the base commit for manifest validation."
            }
          }

          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $body = @{
            event_type = "manifests-normalized"
            client_payload = @{
              base_sha = $baseSha
            }
          } | ConvertTo-Json -Depth 4

          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:REPOSITORY/dispatches" -Headers $headers -ContentType "application/json" -Body $body
