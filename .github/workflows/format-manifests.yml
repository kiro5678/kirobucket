name: Normalize manifest newlines

on:
  push:
    branches:
      - master
    paths:
      - 'under review kirobucket/*.json'
  workflow_dispatch:
    inputs:
      manifest:
        description: "Optional path under bucket/ or under review kirobucket/. Leave empty to normalize both folders."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: format-manifests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  normalize:
    name: Normalize Scoop manifest endings
    runs-on: windows-latest

    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Normalize manifest endings
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before || '' }}
          PUSH_SHA: ${{ github.sha }}
          MANIFEST_INPUT: ${{ inputs.manifest || '' }}
        run: |
          $ErrorActionPreference = "Stop"
          git fetch origin master
          git reset --hard origin/master

          $repoRoot = $env:GITHUB_WORKSPACE
          $manifestFiles = @()
          $manifestInput = $env:MANIFEST_INPUT.Trim().Replace('\', '/')
          if (-not [string]::IsNullOrWhiteSpace($manifestInput)) {
            if ($manifestInput -match '(?i)^[^/]+\.json$') {
              $manifestInput = "bucket/$manifestInput"
            }
            if ($manifestInput -notmatch '(?i)^(?:bucket|under review kirobucket)/[^/]+\.json$') {
              throw "Provide bucket/filename.json or under review kirobucket/filename.json. Received: $manifestInput"
            }
            $manifestPath = Join-Path $repoRoot $manifestInput
            if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
              throw "Manifest does not exist: $manifestInput"
            }
            $manifestFiles = @(Get-Item -LiteralPath $manifestPath)
          } elseif ($env:EVENT_NAME -eq 'push') {
            $before = [string]$env:PUSH_BEFORE
            $after = [string]$env:PUSH_SHA
            if ([string]::IsNullOrWhiteSpace($before) -or $before -match '^0+$') {
              $changedFiles = @(git diff-tree --no-commit-id --name-only -r $after -- "under review kirobucket")
            } else {
              $changedFiles = @(git diff --name-only $before $after -- "under review kirobucket")
            }
            if ($LASTEXITCODE -ne 0) {
              throw "Could not determine changed review manifests for push $before..$after."
            }

            $manifestFiles = @(
              foreach ($file in $changedFiles) {
                $normalized = ([string]$file).Replace('\', '/')
                if ($normalized -match '(?i)^under review kirobucket/[^/]+\.json$' -and
                    (Test-Path -LiteralPath $normalized -PathType Leaf)) {
                  Get-Item -LiteralPath $normalized
                }
              }
            )
            Write-Host "Found $($manifestFiles.Count) changed review manifest(s) to normalize."
          } else {
            $manifestFiles = @(
              foreach ($relativeRoot in @('bucket', 'under review kirobucket')) {
                $rootPath = Join-Path $repoRoot $relativeRoot
                if (Test-Path -LiteralPath $rootPath -PathType Container) {
                  Get-ChildItem -LiteralPath $rootPath -Filter '*.json' -File -Recurse
                }
              }
            )
          }

          $manifestFiles | ForEach-Object {
            $fileBytes = [System.IO.File]::ReadAllBytes($_.FullName)
            $contentLength = $fileBytes.Length

            while ($contentLength -gt 0 -and ($fileBytes[$contentLength - 1] -eq 10 -or $fileBytes[$contentLength - 1] -eq 13 -or $fileBytes[$contentLength - 1] -eq 32 -or $fileBytes[$contentLength - 1] -eq 9)) {
              $contentLength--
            }

            $trailingLength = $fileBytes.Length - $contentLength
            $hasSingleCrLf = $false
            if ($trailingLength -eq 2) {
              $hasSingleCrLf = $fileBytes[$contentLength] -eq 13 -and $fileBytes[$contentLength + 1] -eq 10
            }

            if (-not $hasSingleCrLf) {
              $normalizedBytes = [byte[]]::new($contentLength + 2)
              [System.Array]::Copy($fileBytes, $normalizedBytes, $contentLength)
              $normalizedBytes[$contentLength] = 13
              $normalizedBytes[$contentLength + 1] = 10
              [System.IO.File]::WriteAllBytes($_.FullName, $normalizedBytes)
            }
          }

      - name: Commit normalization changes
        id: commit
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ($env:EVENT_NAME -eq 'push') {
            git add -- "under review kirobucket"
          } else {
            git add -- bucket "under review kirobucket"
          }
          git diff --cached --quiet
          $diffExitCode = $LASTEXITCODE

          if ($diffExitCode -eq 0) {
            Write-Host "All selected manifests already have exactly one CRLF at end of file."
            "changed=false" >> $env:GITHUB_OUTPUT
          } elseif ($diffExitCode -eq 1) {
            git commit -m "chore: remove extra manifest newlines"
            if ($LASTEXITCODE -ne 0) {
              throw "Could not commit normalized manifests."
            }

            $maxPushAttempts = 5
            $pushed = $false

            for ($attempt = 1; $attempt -le $maxPushAttempts; $attempt++) {
              git fetch origin master
              if ($LASTEXITCODE -ne 0) {
                throw "Could not fetch the latest master before pushing normalized manifests."
              }

              git rebase origin/master
              if ($LASTEXITCODE -ne 0) {
                git rebase --abort 2>$null
                throw "Could not rebase normalization changes onto the latest master. Check for concurrent edits to bucket manifests."
              }

              git push origin HEAD:master
              if ($LASTEXITCODE -eq 0) {
                $pushed = $true
                break
              }

              if ($attempt -lt $maxPushAttempts) {
                Write-Warning "master changed during the push; fetching and rebasing again (attempt $attempt of $maxPushAttempts)."
                Start-Sleep -Seconds 1
              }
            }

            if (-not $pushed) {
              throw "Could not push normalized manifests after $maxPushAttempts attempts because master kept changing."
            }

            "changed=true" >> $env:GITHUB_OUTPUT
          } else {
            throw "Could not inspect staged manifest changes."
          }

