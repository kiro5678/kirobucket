name: Inspect FrameCapt installer

on:
  push:
    branches:
      - master
    paths:
      - 'bucket/framecapt.json'
      - '.github/workflows/framecapt-installer-inspection.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Inspect official FrameCapt installer without executing it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $homepage = (Invoke-WebRequest -Uri 'https://www.framecapt.com/' -UseBasicParsing).Content
          $versionMatch = [regex]::Match([string]$homepage, '(?is)\bversion\s*(?:</?[^>]+>\s*)*v?([0-9]+\.[0-9]+\.[0-9]+)\b')
          $hashMatch = [regex]::Match([string]$homepage, '(?is)SHA-256.{0,200}?([a-f0-9]{64})')
          if (-not $versionMatch.Success) { throw 'The FrameCapt checkver pattern did not match the official homepage.' }
          if (-not $hashMatch.Success) { throw 'The FrameCapt autoupdate hash pattern did not match the official homepage.' }
          Write-Host "Homepage version: $($versionMatch.Groups[1].Value)"
          Write-Host "Homepage SHA-256: $($hashMatch.Groups[1].Value)"
          if ($versionMatch.Groups[1].Value -ne '1.0.1') { throw 'Homepage version does not match the manifest version.' }
          if ($hashMatch.Groups[1].Value -ne 'ad10b8ac2638ae337f1950f87736fd6e7337a5611f329988ac6e9d017c3f7865') { throw 'Homepage SHA-256 does not match the manifest hash.' }

          $url = 'https://www.framecapt.com/api/download'
          $expectedHash = 'ad10b8ac2638ae337f1950f87736fd6e7337a5611f329988ac6e9d017c3f7865'
          $work = Join-Path $env:RUNNER_TEMP 'framecapt-inspection'
          $installer = Join-Path $work 'FrameCapt-Setup.exe'
          $helperZip = Join-Path $work 'innounp.zip'
          $helperRoot = Join-Path $work 'innounp'
          $extractRoot = Join-Path $work 'app'

          New-Item -ItemType Directory -Path $work -Force | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $installer -MaximumRedirection 10 -TimeoutSec 180

          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Downloaded file size: $((Get-Item -LiteralPath $installer).Length) bytes"
          Write-Host "Actual SHA-256: $actualHash"
          if ($actualHash -ne $expectedHash) {
            throw "Official SHA-256 mismatch. Expected $expectedHash, received $actualHash."
          }

          $signature = Get-AuthenticodeSignature -FilePath $installer
          Write-Host "Authenticode status: $($signature.Status)"
          Write-Host "Signer: $($signature.SignerCertificate.Subject)"

          $bytes = [System.IO.File]::ReadAllBytes($installer)
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          $markers = @('Inno Setup Setup Data', 'Nullsoft Install System', 'WixBundle', 'InstallShield')
          foreach ($marker in $markers) {
            Write-Host ("Signature marker '{0}': {1}" -f $marker, $text.Contains($marker))
          }

          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/jrathlev/InnoUnpacker-Windows-GUI/032d64c782efc6b36766d8f9c3b1b2f042144a58/innounp-2/bin/innounp-2.zip' -OutFile $helperZip -MaximumRedirection 10 -TimeoutSec 120
          $helperHash = (Get-FileHash -LiteralPath $helperZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($helperHash -ne '10fce27b6344b7674d5625cc34afca1c88c12183d957c6d93e401097fa2556cd') {
            throw "innounp helper SHA-256 mismatch: $helperHash"
          }

          Expand-Archive -LiteralPath $helperZip -DestinationPath $helperRoot -Force
          $innounp = Get-ChildItem -LiteralPath $helperRoot -Filter 'innounp.exe' -File -Recurse | Select-Object -First 1
          if ($null -eq $innounp) {
            throw 'The verified innounp helper archive did not contain innounp.exe.'
          }

          New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
          $output = & $innounp.FullName '-x' "-d$extractRoot" $installer '-y' '-c{app}' 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          Write-Host "innounp exit code: $exitCode"
          if ($exitCode -ne 0) {
            throw "Inno Setup extraction failed with exit code $exitCode."
          }

          $files = @(Get-ChildItem -LiteralPath $extractRoot -File -Recurse)
          if ($files.Count -eq 0) {
            throw 'Inno Setup extraction returned no application files.'
          }

          Write-Host '--- Extracted application files ---'
          foreach ($file in $files) {
            $relative = [System.IO.Path]::GetRelativePath($extractRoot, $file.FullName).Replace('\', '/')
            Write-Host ("{0} | {1} bytes" -f $relative, $file.Length)
          }

          Write-Host '--- Executable candidates (static metadata only) ---'
          foreach ($file in ($files | Where-Object { $_.Extension -ieq '.exe' })) {
            $version = $file.VersionInfo
            Write-Host ("{0} | Product='{1}' | Description='{2}' | Original='{3}' | Version='{4}'" -f
              [System.IO.Path]::GetRelativePath($extractRoot, $file.FullName),
              $version.ProductName,
              $version.FileDescription,
              $version.OriginalFilename,
              $version.ProductVersion)
          }

          Write-Host 'No extracted executable was launched.'

      - name: Test Scoop install, launcher, shortcut, and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $env:SCOOP = Join-Path $env:RUNNER_TEMP 'scoop-root'
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri 'https://get.scoop.sh' | Invoke-Expression

          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            throw 'Scoop command was not available after installation.'
          }

          scoop bucket add kirobucket 'https://github.com/kiro5678/kirobucket'
          if ($LASTEXITCODE -ne 0) { throw 'Could not add kirobucket.' }

          scoop install framecapt
          if ($LASTEXITCODE -ne 0) { throw 'Scoop could not install FrameCapt.' }

          $appDir = Join-Path $env:SCOOP 'apps\framecapt\current'
          $appExe = Join-Path $appDir 'FrameCapt.exe'
          $shim = Join-Path $env:SCOOP 'shims\framecapt.exe'
          $startMenu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          if (-not (Test-Path -LiteralPath $appExe -PathType Leaf)) {
            throw "Installed application executable is missing: $appExe"
          }
          if (-not (Test-Path -LiteralPath $shim -PathType Leaf)) {
            throw "Scoop executable shim is missing: $shim"
          }
          $shortcut = Get-ChildItem -LiteralPath $startMenu -Filter 'FrameCapt.lnk' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $shortcut) { throw 'FrameCapt Start Menu shortcut was not created.' }

          Write-Host "Installed executable: $appExe"
          Write-Host "Scoop shim: $shim"
          Write-Host "Start Menu shortcut: $($shortcut.FullName)"

          scoop uninstall framecapt
          if ($LASTEXITCODE -ne 0) { throw 'Scoop could not uninstall FrameCapt.' }
          if (Test-Path -LiteralPath (Join-Path $env:SCOOP 'apps\framecapt')) {
            throw 'FrameCapt application directory remained after uninstall.'
          }
          if (Test-Path -LiteralPath $shim) { throw 'FrameCapt shim remained after uninstall.' }
          if (Test-Path -LiteralPath $shortcut.FullName) { throw 'FrameCapt Start Menu shortcut remained after uninstall.' }
          Write-Host 'Scoop install and uninstall checks passed.'
