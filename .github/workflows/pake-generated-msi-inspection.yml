name: Pake Scoop Install Validation

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]
    paths:
      - 'bucket/pake-*.json'
      - '.github/workflows/pake-generated-msi-inspection.yml'

permissions:
  contents: read

jobs:
  test-all-pake:
    name: Test all Pake manifests with Scoop
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout official Scoop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          path: scoop_core
          persist-credentials: false

      - name: Install every Pake manifest through Scoop and verify installed files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $env:SCOOP = Join-Path $env:RUNNER_TEMP 'scoop-root'
          $env:SCOOP_CACHE = Join-Path $env:RUNNER_TEMP 'scoop-cache'
          $scoopScript = Join-Path $env:GITHUB_WORKSPACE 'scoop_core\bin\scoop.ps1'
          $shimSource = Join-Path $env:GITHUB_WORKSPACE 'scoop_core\supporting\shims'
          $shimDestination = Join-Path $env:SCOOP 'apps\scoop\current\supporting\shims'
          $reportRoot = Join-Path $env:RUNNER_TEMP 'pake-validation'
          $reportPath = Join-Path $reportRoot 'pake-install-report.txt'

          foreach ($directory in @('shims', 'apps', 'buckets', 'persist')) {
            New-Item -ItemType Directory -Path (Join-Path $env:SCOOP $directory) -Force | Out-Null
          }
          New-Item -ItemType Directory -Path $env:SCOOP_CACHE -Force | Out-Null
          New-Item -ItemType Directory -Path $shimDestination -Force | Out-Null
          New-Item -ItemType Directory -Path $reportRoot -Force | Out-Null
          Copy-Item -Path (Join-Path $shimSource '*') -Destination $shimDestination -Recurse -Force

          $manifestFiles = @(Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'bucket') -Filter 'pake-*.json' -File | Sort-Object Name)
          if ($manifestFiles.Count -eq 0) {
            throw 'No bucket/pake-*.json manifests were found.'
          }

          $report = [System.Collections.Generic.List[string]]::new()
          $failures = [System.Collections.Generic.List[string]]::new()
          $msiCount = 0
          $otherCount = 0

          foreach ($manifestFile in $manifestFiles) {
            $appName = [System.IO.Path]::GetFileNameWithoutExtension($manifestFile.Name)
            Write-Host ''
            Write-Host "============================================================"
            Write-Host "Testing $appName"
            Write-Host "============================================================"

            try {
              $manifest = Get-Content -LiteralPath $manifestFile.FullName -Raw | ConvertFrom-Json -ErrorAction Stop
              $urls = @($manifest.url)
              if ($urls.Count -eq 0 -or [string]::IsNullOrWhiteSpace([string]$urls[0])) {
                throw "Manifest $appName has no download URL."
              }

              $mainUrl = [string]$urls[0]
              $isMsi = $mainUrl -match '(?i)\.msi(?:#|$)'
              if ($isMsi) {
                $msiCount++
                if ($mainUrl -notmatch '#/dl\.msi$') {
                  throw "MSI URL for $appName does not use the required #/dl.msi suffix: $mainUrl"
                }
                if ($manifest.autoupdate -and $manifest.autoupdate.url -is [string] -and $manifest.autoupdate.url -notmatch '#/dl\.msi$') {
                  throw "Autoupdate MSI URL for $appName does not use #/dl.msi."
                }
              } else {
                $otherCount++
                if ($mainUrl -match '#/dl\.msi$') {
                  throw "Non-MSI package $appName was incorrectly marked with #/dl.msi."
                }
                Write-Host "Non-MSI package; testing its existing extraction method: $mainUrl"
              }

              & $scoopScript install --no-update-scoop $manifestFile.FullName

              $appRoot = Join-Path $env:SCOOP "apps\$appName\current"
              if (-not (Test-Path -LiteralPath $appRoot -PathType Container)) {
                throw "Scoop did not create the current app directory for $appName."
              }

              $expectedPaths = [System.Collections.Generic.List[string]]::new()
              foreach ($entry in @($manifest.bin)) {
                if ($entry -is [System.Array]) {
                  if ($entry.Count -gt 0) { $expectedPaths.Add([string]$entry[0]) }
                } elseif ($entry -is [string]) {
                  $expectedPaths.Add([string]$entry)
                }
              }
              foreach ($entry in @($manifest.shortcuts)) {
                if ($entry -is [System.Array]) {
                  if ($entry.Count -gt 0) { $expectedPaths.Add([string]$entry[0]) }
                } elseif ($entry -is [string]) {
                  $expectedPaths.Add([string]$entry)
                }
              }
              $expectedPaths = @($expectedPaths | Sort-Object -Unique)
              if ($expectedPaths.Count -eq 0) {
                throw "Manifest $appName has no bin or shortcut path to verify."
              }

              foreach ($relativePath in $expectedPaths) {
                $installedFile = Join-Path $appRoot $relativePath
                if (-not (Test-Path -LiteralPath $installedFile -PathType Leaf)) {
                  throw "Scoop installed $appName but the declared launch file is missing: $relativePath"
                }
                $report.Add("  VERIFIED: $relativePath")
              }

              $type = if ($isMsi) { 'MSI with dl.msi' } else { 'non-MSI, original extraction method' }
              $report.Add("[$appName] PASS | Version=$($manifest.version) | Type=$type")
              Write-Host "PASS: $appName"
            } catch {
              $message = "$appName : $($_.Exception.Message)"
              $failures.Add($message)
              $report.Add("[$appName] FAIL | $($_.Exception.Message)")
              Write-Host "FAILED: $message" -ForegroundColor Red
              $logs = @(Get-ChildItem -LiteralPath $env:SCOOP -Filter '*.log' -File -Recurse -ErrorAction SilentlyContinue)
              foreach ($log in $logs) {
                Write-Host "--- $($log.FullName) ---"
                Get-Content -LiteralPath $log.FullName -Tail 80 | ForEach-Object { Write-Host $_ }
              }
            }
          }

          $report.Insert(0, "Pake manifests tested: $($manifestFiles.Count); MSI manifests: $msiCount; other package types: $otherCount")
          $report | Set-Content -LiteralPath $reportPath -Encoding utf8
          $report | ForEach-Object { Write-Output $_ }

          Write-Host ''
          Write-Host "Total manifests: $($manifestFiles.Count)"
          Write-Host "MSI manifests: $msiCount"
          Write-Host "Other package types: $otherCount"
          Write-Host "Failures: $($failures.Count)"
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Host $_ -ForegroundColor Red }
            exit 1
          }

      - name: Upload Pake validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pake-install-validation
          path: ${{ runner.temp }}/pake-validation/pake-install-report.txt
          if-no-files-found: ignore
