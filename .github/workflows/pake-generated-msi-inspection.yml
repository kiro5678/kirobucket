name: Pake Generated MSI Inspection

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]
    paths:
      - 'bucket/pake-chatgpt.json'
      - 'bucket/pake-deepseek.json'
      - 'bucket/pake-excalidraw.json'
      - 'bucket/pake-flomo.json'
      - 'bucket/pake-gemini.json'
      - 'bucket/pake-grok.json'
      - 'bucket/pake-lizhi.json'
      - 'bucket/pake-notion.json'
      - 'bucket/pake-programmusic.json'
      - 'bucket/pake-qwerty.json'
      - 'bucket/pake-twitter.json'
      - 'bucket/pake-wechat.json'
      - 'bucket/pake-weread.json'
      - 'bucket/pake-xiaohongshu.json'
      - 'bucket/pake-youtubemusic.json'
      - 'bucket/pake-youtube.json'

permissions:
  contents: read

jobs:
  inspect-msi:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Scoop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          path: scoop_core
          persist-credentials: false

      - name: Download, hash, and administratively extract every Pake MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $names = @('pake-chatgpt', 'pake-deepseek', 'pake-excalidraw', 'pake-flomo', 'pake-gemini', 'pake-grok', 'pake-lizhi', 'pake-notion', 'pake-programmusic', 'pake-qwerty', 'pake-twitter', 'pake-wechat', 'pake-weread', 'pake-xiaohongshu', 'pake-youtubemusic', 'pake-youtube')
          $root = Join-Path $env:RUNNER_TEMP 'pake-msi-inspection'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $report = [System.Collections.Generic.List[string]]::new()

          foreach ($name in $names) {
            $manifestPath = Join-Path $env:GITHUB_WORKSPACE "bucket/$name.json"
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            $installer = Join-Path $root "$name.msi"
            $target = Join-Path $root $name
            New-Item -ItemType Directory -Path $target -Force | Out-Null

            Invoke-WebRequest -Uri $manifest.url -OutFile $installer
            $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $manifest.hash.ToLowerInvariant()) {
              throw "SHA-256 mismatch for $name. Expected $($manifest.hash), got $actual"
            }

            $arguments = @('/a', "`"$installer`"", '/qn', "TARGETDIR=`"$target`"")
            $process = Start-Process -FilePath "$env:WINDIR\System32\msiexec.exe" -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) {
              throw "Administrative MSI extraction failed for $name with exit code $($process.ExitCode)"
            }

            $executables = @(Get-ChildItem -LiteralPath $target -Filter '*.exe' -File -Recurse -ErrorAction SilentlyContinue)
            if ($executables.Count -eq 0) {
              throw "No EXE files found after administrative extraction for $name"
            }


            $expectedLaunchPaths = [System.Collections.Generic.List[string]]::new()
            foreach ($entry in @($manifest.bin)) {
              if ($entry -is [System.Array]) {
                if ($entry.Count -gt 0) { $expectedLaunchPaths.Add([string]$entry[0]) }
              } elseif ($entry -is [string]) {
                $expectedLaunchPaths.Add($entry)
              }
            }
            foreach ($entry in @($manifest.shortcuts)) {
              if ($entry -is [System.Array]) {
                if ($entry.Count -gt 0) { $expectedLaunchPaths.Add([string]$entry[0]) }
              } elseif ($entry -is [string]) {
                $expectedLaunchPaths.Add($entry)
              }
            }
            $expectedLaunchPaths = @($expectedLaunchPaths | Sort-Object -Unique)
            if ($expectedLaunchPaths.Count -eq 0) {
              throw "Manifest $name does not declare a bin or shortcut path to verify."
            }
            foreach ($relativePath in $expectedLaunchPaths) {
              $expectedFile = Join-Path $target $relativePath
              if (-not (Test-Path -LiteralPath $expectedFile -PathType Leaf)) {
                throw "Declared launch path '$relativePath' was not present after extracting $name."
              }
            }

            $report.Add("[$name] SHA256=$actual")
            foreach ($relativePath in $expectedLaunchPaths) { $report.Add("  VERIFIED LAUNCH PATH: $relativePath") }
            foreach ($exe in $executables) {
              $relative = $exe.FullName.Substring($target.Length).TrimStart('\')
              $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe.FullName)
              $report.Add("  EXE: $relative | Product=$($info.ProductName) | Description=$($info.FileDescription)")
            }
            Write-Output "Extracted ${name}: $($executables.Count) EXE file(s)"
          }

          $reportPath = Join-Path $root 'inspection-report.txt'
          $report | Set-Content -LiteralPath $reportPath -Encoding utf8
          $report | ForEach-Object { Write-Output $_ }

      - name: Install Grok with Scoop using the dl.msi manifest URL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $env:SCOOP = Join-Path $env:RUNNER_TEMP 'scoop-root'
          $env:SCOOP_CACHE = Join-Path $env:RUNNER_TEMP 'scoop-cache'
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'bucket\pake-grok.json'
          $scoopScript = Join-Path $env:GITHUB_WORKSPACE 'scoop_core\bin\scoop.ps1'
          New-Item -ItemType Directory -Path $env:SCOOP -Force | Out-Null
          New-Item -ItemType Directory -Path $env:SCOOP_CACHE -Force | Out-Null
          & $scoopScript install --no-update-scoop $manifestPath
          $appRoot = Join-Path $env:SCOOP 'apps\pake-grok\3.18.0'
          $expectedExe = Join-Path $appRoot 'PFiles\Grok\pake-grok.exe'
          if (-not (Test-Path -LiteralPath $expectedExe -PathType Leaf)) {
            throw "Scoop installation did not produce the declared executable at $expectedExe"
          }
          Write-Host "SCOOP INSTALL VERIFIED: $expectedExe"
          Get-ChildItem -LiteralPath $appRoot -File -Recurse |
            ForEach-Object { Write-Host ("INSTALLED FILE: " + [System.IO.Path]::GetRelativePath($appRoot, $_.FullName)) }

      - name: Upload inspection report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pake-generated-msi-inspection
          path: ${{ runner.temp }}/pake-msi-inspection/inspection-report.txt
          if-no-files-found: error
