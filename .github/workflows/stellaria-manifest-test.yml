name: Test Stellaria Scoop Manifest

on:
  pull_request:
    branches:
      - master
    paths:
      - "bucket/stellaria.json"
      - ".github/workflows/stellaria-manifest-test.yml"

permissions:
  contents: read

jobs:
  install-test:
    name: Check version, install, junctions, and uninstall
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Scoop into a custom root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:SCOOP = Join-Path $env:RUNNER_TEMP 'scoop-custom-root'
          $installer = Join-Path $env:RUNNER_TEMP 'scoop-install.ps1'

          Invoke-WebRequest -Uri 'https://get.scoop.sh' -OutFile $installer
          & $installer -ScoopDir $env:SCOOP
          if ($LASTEXITCODE -ne 0) {
            throw "Scoop installation failed with exit code $LASTEXITCODE."
          }

          Add-Content -Path $env:GITHUB_ENV -Value "SCOOP=$env:SCOOP"
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:SCOOP 'shims')
          $env:PATH = "$(Join-Path $env:SCOOP 'shims');$env:PATH"
          scoop --version
          scoop bucket add extras https://github.com/ScoopInstaller/Extras

      - name: Verify checkver against the official release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checkver = Join-Path $env:SCOOP 'apps\scoop\current\bin\checkver.ps1'
          if (-not (Test-Path -LiteralPath $checkver)) {
            throw "Scoop checkver.ps1 was not found: $checkver"
          }

          & $checkver -App stellaria -Dir (Join-Path $env:GITHUB_WORKSPACE 'bucket')

      - name: Install Stellaria from the manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          scoop install (Join-Path $env:GITHUB_WORKSPACE 'bucket\stellaria.json')

          $app = Join-Path $env:SCOOP 'apps\stellaria\current'
          $requiredFiles = @(
            'bin\stellaria-helper.exe',
            'bin\stellaria-launcher.exe',
            'pack\zpack.json',
            'pack\native\StellariaSwitcher.exe',
            'registry\index.json'
          )

          foreach ($relative in $requiredFiles) {
            $path = Join-Path $app $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required Stellaria file is missing: $path"
            }
          }

          $profilePath = [Environment]::GetFolderPath('UserProfile')
          $junctions = @(
            @{
              Path = Join-Path $profilePath '.glzr\zebar\stellaria'
              Target = Join-Path $app 'pack'
            },
            @{
              Path = Join-Path $profilePath '.stellaria\bin'
              Target = Join-Path $app 'bin'
            },
            @{
              Path = Join-Path $profilePath '.stellaria\registry'
              Target = Join-Path $app 'registry'
            },
            @{
              Path = Join-Path $profilePath 'scoop\apps\zebar\current'
              Target = Join-Path $env:SCOOP 'apps\zebar\current'
            }
          )

          foreach ($junction in $junctions) {
            $path = $junction.Path
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Expected junction is missing: $path"
            }
            $item = Get-Item -LiteralPath $path -Force
            if (-not ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
              throw "Expected a junction but found an ordinary directory: $path"
            }
            $actualTarget = [IO.Path]::GetFullPath([string]$item.Target).TrimEnd('\')
            $expectedTarget = [IO.Path]::GetFullPath([string]$junction.Target).TrimEnd('\')
            if ($actualTarget -ine $expectedTarget) {
              throw "Junction target mismatch at $path. Expected $expectedTarget, received $actualTarget."
            }
          }

          $programs = [Environment]::GetFolderPath('Programs')
          $shortcut = Join-Path $programs 'Scoop Apps\Stellaria.lnk'
          if (-not (Test-Path -LiteralPath $shortcut -PathType Leaf)) {
            throw "The Stellaria Start menu shortcut is missing: $shortcut"
          }

          & schtasks.exe /Query /TN 'Stellaria - Helper' *> $null
          $taskQueryExitCode = $LASTEXITCODE
          if ($taskQueryExitCode -eq 0) {
            throw 'The manifest unexpectedly enabled the Stellaria logon task.'
          }
          $global:LASTEXITCODE = 0

          if (Get-Process -Name 'stellaria-helper','stellaria-launcher' -ErrorAction SilentlyContinue) {
            throw 'The manifest unexpectedly launched Stellaria during installation.'
          }

          Write-Host 'PASS: ZIP files, executable paths, all junctions, shortcut, and non-activation checks passed.'

      - name: Uninstall Stellaria and verify cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          scoop uninstall stellaria

          $profilePath = [Environment]::GetFolderPath('UserProfile')
          $removedLinks = @(
            (Join-Path $profilePath '.glzr\zebar\stellaria'),
            (Join-Path $profilePath '.stellaria\bin'),
            (Join-Path $profilePath '.stellaria\registry'),
            (Join-Path $profilePath 'scoop\apps\zebar\current')
          )

          foreach ($path in $removedLinks) {
            if (Test-Path -LiteralPath $path) {
              throw "Scoop uninstall left a managed junction behind: $path"
            }
          }

          $zebarExe = Join-Path $env:SCOOP 'apps\zebar\current\zebar.exe'
          if (-not (Test-Path -LiteralPath $zebarExe -PathType Leaf)) {
            throw 'Uninstalling Stellaria unexpectedly removed its Zebar dependency.'
          }

          Write-Host 'PASS: Stellaria junctions were removed and the Zebar dependency was preserved.'
