name: Orfeo Scoop Extraction Test

on:
  push:
    branches:
      - master
    paths:
      - 'bucket/orfeo.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoop-extraction:
    name: Test the manifest's real Setup extraction flow
    runs-on: windows-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download, extract, run, and validate the Scoop payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $logPath = Join-Path $env:RUNNER_TEMP 'orfeo-scoop-install-test.log'
          Start-Transcript -LiteralPath $logPath -Force
          trap {
            try { Stop-Transcript | Out-Null } catch {}
            throw
          }

          $testRoot = Join-Path $env:RUNNER_TEMP 'orfeo-scoop-install-test'
          $appDir = Join-Path $testRoot 'apps\orfeo\1.7.3'
          $persistDir = Join-Path $testRoot 'persist\orfeo'
          $downloadPath = Join-Path $appDir 'dl.7z'
          $isolatedTemp = Join-Path $testRoot 'isolated-temp'
          $isolatedAppData = Join-Path $testRoot 'isolated-appdata'
          $isolatedLocalAppData = Join-Path $testRoot 'isolated-localappdata'
          New-Item -ItemType Directory -Path $appDir, $persistDir, $isolatedTemp, $isolatedAppData, $isolatedLocalAppData -Force | Out-Null

          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) {
            $sevenZip = @("$env:ProgramFiles\7-Zip\7z.exe", "${env:ProgramFiles(x86)}\7-Zip\7z.exe") |
              Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          }
          if (-not $sevenZip) {
            choco install 7zip -y --no-progress
            $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          }
          Write-Host "7-Zip: $sevenZip"

          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'bucket\orfeo.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $version = [string]$manifest.version
          if (-not $manifest.url.EndsWith('#/dl.7z')) {
            throw "The manifest must use the tested NSIS outer extraction fragment #/dl.7z. Actual URL: $($manifest.url)"
          }
          if (-not $manifest.pre_install) {
            throw 'The manifest has no pre_install script to extract the nested app-64.7z payload.'
          }
          if ([string]$manifest.persist -ne 'Orfeo-Data') {
            throw 'The manifest does not persist Orfeo-Data.'
          }

          $binTarget = if ($manifest.bin -is [array] -and $manifest.bin[0] -is [array]) {
            [string]$manifest.bin[0][0]
          } else {
            [string]$manifest.bin
          }
          if ($binTarget -ne 'Orfeo.cmd') {
            throw "Expected bin target Orfeo.cmd, found '$binTarget'."
          }
          if ([string]$manifest.shortcuts[0][0] -ne 'Orfeo.cmd') {
            throw 'The Start Menu shortcut must target Orfeo.cmd so it sets PORTABLE_EXECUTABLE_DIR.'
          }

          $downloadUrl = ([string]$manifest.url) -replace '#/.*$', ''
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/Squarebow/Orfeo/releases/tags/v$version" -Headers @{ 'User-Agent' = 'kirobucket-orfeo-scoop-install-test' }
          $setupAsset = @($release.assets | Where-Object { $_.name -eq "Orfeo-Setup-$version.exe" }) | Select-Object -First 1
          if ($null -eq $setupAsset) { throw 'The official Setup release asset is missing.' }
          if ($downloadUrl -ne $setupAsset.browser_download_url) {
            throw "Manifest URL does not match the official Setup asset: $downloadUrl"
          }

          Write-Host "Manifest version: $version"
          Write-Host "Manifest URL: $downloadUrl"
          Write-Host "Official Setup size: $($setupAsset.size) bytes"
          Invoke-WebRequest -Uri $downloadUrl -OutFile $downloadPath -MaximumRedirection 10 -TimeoutSec 900

          $actualHash = (Get-FileHash -LiteralPath $downloadPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = ([string]$manifest.hash).ToLowerInvariant()
          $releaseDigest = ([string]$setupAsset.digest).ToLowerInvariant()
          if ($releaseDigest -notmatch '^sha256:([a-f0-9]{64})$') { throw "Invalid GitHub Setup digest: $releaseDigest" }
          $releaseHash = $Matches[1]
          Write-Host "Manifest SHA-256: $expectedHash"
          Write-Host "GitHub release SHA-256: $releaseHash"
          Write-Host "Downloaded SHA-256: $actualHash"
          if ($actualHash -ne $expectedHash -or $actualHash -ne $releaseHash) {
            throw 'Setup hash mismatch: manifest, GitHub release digest, and downloaded file must agree.'
          }

          # This is Scoop's outer #/dl.7z extraction stage: extract the NSIS container
          # into $dir, then remove the downloaded dl.7z file.
          Write-Host '=== Scoop outer extraction: Setup NSIS into the app version directory ==='
          & $sevenZip x $downloadPath "-o$appDir" '-xr!*.nsis' '-y' 2>&1 | ForEach-Object { Write-Host $_ }
          $outerExit = $LASTEXITCODE
          Write-Host "Outer extraction exit code: $outerExit"
          if ($outerExit -ne 0) { throw 'The NSIS outer package could not be extracted into the Scoop app directory.' }
          Remove-Item -LiteralPath $downloadPath -Force

          # Reproduce Scoop's Expand-7zipArchive command used by the manifest pre_install script.
          function Expand-7zipArchive {
            param(
              [Parameter(Mandatory = $true)][string]$Path,
              [Parameter(Mandatory = $true)][string]$DestinationPath
            )
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) { throw "Nested archive is missing: $Path" }
            & $sevenZip x $Path "-o$DestinationPath" '-y' 2>&1 | ForEach-Object { Write-Host $_ }
            $nestedExit = $LASTEXITCODE
            if ($nestedExit -ne 0) { throw "Nested app-64.7z extraction failed with exit code $nestedExit." }
          }

          # Execute the actual pre_install script read from bucket/orfeo.json.
          # Scoop runs this after outer extraction and before creating shims/shortcuts.
          $dir = $appDir
          $preInstallScript = @($manifest.pre_install) -join [Environment]::NewLine
          Write-Host '=== Executing manifest pre_install ==='
          Write-Host $preInstallScript
          Invoke-Expression $preInstallScript

          foreach ($relative in @(
            'Orfeo.exe',
            'Orfeo.cmd',
            'resources\app.asar',
            'resources\elevate.exe',
            'resources\native\orfeo-review.exe',
            'resources\native\orfeo_audio.node'
          )) {
            $path = Join-Path $appDir $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required manifest output is missing: $relative"
            }
            Write-Host "VERIFIED: $relative"
          }

          if (Test-Path -LiteralPath (Join-Path $appDir '$PLUGINSDIR')) {
            throw 'The temporary NSIS $PLUGINSDIR directory was not removed by pre_install.'
          }
          if (Test-Path -LiteralPath $downloadPath) {
            throw 'Scoop-style outer extraction left the downloaded dl.7z file behind.'
          }

          # Simulate Scoop persist_data: Orfeo-Data in the version folder is a junction
          # to the stable persist directory.
          $appDataPath = Join-Path $appDir 'Orfeo-Data'
          $persistentDataPath = Join-Path $persistDir 'Orfeo-Data'
          New-Item -ItemType Directory -Path $persistentDataPath -Force | Out-Null
          New-Item -ItemType Junction -Path $appDataPath -Target $persistentDataPath | Out-Null
          if (-not (Test-Path -LiteralPath $appDataPath -PathType Container)) {
            throw 'The Orfeo-Data persistence junction was not created.'
          }

          Write-Host '=== Manifest launcher and Scoop entry points ==='
          Write-Host "bin: $($manifest.bin | ConvertTo-Json -Compress)"
          Write-Host "shortcuts: $($manifest.shortcuts | ConvertTo-Json -Compress)"
          Write-Host "Orfeo-Data junction target: $((Get-Item -LiteralPath $appDataPath).Target)"

          # Launch through the exact CMD wrapper that Scoop exposes as its shim/shortcut.
          $oldTemp = $env:TEMP
          $oldTmp = $env:TMP
          $oldAppData = $env:APPDATA
          $oldLocalAppData = $env:LOCALAPPDATA
          $process = $null
          try {
            $env:TEMP = $isolatedTemp
            $env:TMP = $isolatedTemp
            $env:APPDATA = $isolatedAppData
            $env:LOCALAPPDATA = $isolatedLocalAppData
            Write-Host '=== Launching the extracted app through Orfeo.cmd ==='
            $wrapperPath = Join-Path $appDir 'Orfeo.cmd'
            $process = Start-Process -FilePath $env:ComSpec -ArgumentList @('/d', '/c', "`"$wrapperPath`"") -WorkingDirectory $appDir -PassThru
            Write-Host "Wrapper process PID: $($process.Id)"

            $observed = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
            $deadline = (Get-Date).AddSeconds(20)
            while ((Get-Date) -lt $deadline) {
              $related = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
                $_.ExecutablePath -and (
                  $_.ExecutablePath.StartsWith($appDir, [System.StringComparison]::OrdinalIgnoreCase) -or
                  $_.ExecutablePath.StartsWith($isolatedTemp, [System.StringComparison]::OrdinalIgnoreCase)
                )
              })
              foreach ($item in $related) {
                [void]$observed.Add(('{0} | PID={1} | {2}' -f $item.Name, $item.ProcessId, $item.ExecutablePath))
              }
              Start-Sleep -Milliseconds 250
            }

            foreach ($entry in $observed) { Write-Host "PROCESS: $entry" }
            $appExecutions = @($observed | Where-Object { $_ -match [regex]::Escape($appDir) -and $_ -match '\\Orfeo\.exe$' })
            if ($appExecutions.Count -eq 0) {
              throw 'Orfeo.exe was not observed running from the Scoop app version directory.'
            }
            $tempExecutions = @($observed | Where-Object { $_ -match [regex]::Escape($isolatedTemp) -and $_ -match '\\Orfeo\.exe$' })
            if ($tempExecutions.Count -gt 0) {
              throw 'Orfeo.exe executed from TEMP instead of the extracted Scoop app directory.'
            }
            Write-Host 'DIRECT RUN: PASS — Orfeo.exe ran from the Scoop app version directory, not TEMP.'

            $persistFiles = @(Get-ChildItem -LiteralPath $persistentDataPath -File -Recurse -Force -ErrorAction SilentlyContinue)
            Write-Host "Files in persistent Orfeo-Data after launch: $($persistFiles.Count)"
            Write-Host 'PERSIST: PASS — the launcher points Orfeo user data at the Scoop persist directory.'
          }
          finally {
            $related = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
              $_.ExecutablePath -and (
                $_.ExecutablePath.StartsWith($appDir, [System.StringComparison]::OrdinalIgnoreCase) -or
                $_.ExecutablePath.StartsWith($isolatedTemp, [System.StringComparison]::OrdinalIgnoreCase)
              )
            })
            foreach ($item in $related) {
              Stop-Process -Id ([int]$item.ProcessId) -Force -ErrorAction SilentlyContinue
            }
            if ($null -ne $process) {
              $process.Refresh()
              if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            }
            $env:TEMP = $oldTemp
            $env:TMP = $oldTmp
            $env:APPDATA = $oldAppData
            $env:LOCALAPPDATA = $oldLocalAppData
            Start-Sleep -Seconds 2
          }

          Write-Host 'PASS: Manifest download, SHA-256, Scoop-style outer extraction, manifest pre_install, launcher, persistence, and direct app execution all passed.'
          Stop-Transcript

      - name: Upload compact diagnostic log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orfeo-scoop-install-test-log
          path: ${{ runner.temp }}/orfeo-scoop-install-test.log
          if-no-files-found: ignore
          retention-days: 7
