name: Orfeo Scoop Extraction Experiments

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/orfeo-scoop-extraction-experiments.yml'
      - 'bucket/orfeo.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extraction:
    name: Extract Portable first, fall back to Setup
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Locate 7-Zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) {
            $candidates = @(
              "$env:ProgramFiles\7-Zip\7z.exe",
              "${env:ProgramFiles(x86)}\7-Zip\7z.exe"
            )
            $sevenZip = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          }
          if (-not $sevenZip) {
            choco install 7zip -y --no-progress
            $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          }
          Write-Host "Using 7-Zip: $sevenZip"
          & $sevenZip | Select-Object -First 2
          "SEVENZIP_PATH=$sevenZip" >> $env:GITHUB_ENV

      - name: Download packages, test Portable extraction, then Setup fallback
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $testRoot = Join-Path $env:RUNNER_TEMP 'orfeo-scoop-extraction-test'
          $portableExe = Join-Path $testRoot 'Orfeo-portable.exe'
          $setupExe = Join-Path $testRoot 'Orfeo-Setup.exe'
          $portableOut = Join-Path $testRoot 'portable-extracted'
          $setupOuter = Join-Path $testRoot 'setup-outer'
          $setupPayload = Join-Path $testRoot 'setup-payload'
          $setupInstalled = Join-Path $testRoot 'setup-installed'
          $isolatedTemp = Join-Path $testRoot 'isolated-temp'
          New-Item -ItemType Directory -Path $testRoot, $portableOut, $setupOuter, $setupPayload, $isolatedTemp -Force | Out-Null

          function Find-OrfeoAppRoot([string]$Root) {
            if (-not (Test-Path -LiteralPath $Root -PathType Container)) { return $null }
            $candidates = @(Get-ChildItem -LiteralPath $Root -Filter 'Orfeo.exe' -File -Recurse -Force -ErrorAction SilentlyContinue)
            foreach ($candidate in $candidates) {
              $resources = Join-Path $candidate.DirectoryName 'resources'
              $asar = Join-Path $resources 'app.asar'
              if (Test-Path -LiteralPath $asar -PathType Leaf) {
                return $candidate.DirectoryName
              }
            }
            return $null
          }

          function Show-AppInventory([string]$Root) {
            $files = @(Get-ChildItem -LiteralPath $Root -File -Recurse -Force -ErrorAction SilentlyContinue)
            Write-Host "Application root: $Root"
            Write-Host "Extracted files: $($files.Count)"
            foreach ($relative in @('Orfeo.exe', 'resources\app.asar', 'resources\elevate.exe', 'resources\native\orfeo-review.exe', 'resources\native\orfeo_audio.node')) {
              $path = Join-Path $Root $relative
              Write-Host ("{0}: {1}" -f $relative, (Test-Path -LiteralPath $path -PathType Leaf))
            }
            $files | Where-Object { $_.Extension -ieq '.exe' -or $_.Name -ieq 'app.asar' } |
              Select-Object -First 40 |
              ForEach-Object { Write-Host ("APP FILE: " + [System.IO.Path]::GetRelativePath($Root, $_.FullName)) }
          }

          $manifest = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'bucket\orfeo.json') -Raw | ConvertFrom-Json
          $version = [string]$manifest.version
          $portableUrl = ([string]$manifest.url) -replace '#/.*$', ''
          if ($portableUrl -notmatch 'Orfeo-' + [regex]::Escape($version) + '-portable\.exe$') {
            throw "The manifest URL is not the expected versioned Portable asset: $portableUrl"
          }

          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/Squarebow/Orfeo/releases/tags/v$version" -Headers @{ 'User-Agent' = 'kirobucket-orfeo-extraction-test' }
          $portableAsset = @($release.assets | Where-Object { $_.name -eq "Orfeo-$version-portable.exe" }) | Select-Object -First 1
          $setupAsset = @($release.assets | Where-Object { $_.name -eq "Orfeo-Setup-$version.exe" }) | Select-Object -First 1
          if ($null -eq $portableAsset) { throw 'Official Portable release asset is missing.' }
          if ($null -eq $setupAsset) { throw 'Official Setup release asset is missing; fallback cannot be tested.' }

          Write-Host "Manifest version: $version"
          Write-Host "Portable asset: $($portableAsset.name) ($($portableAsset.size) bytes)"
          Write-Host "Setup fallback asset: $($setupAsset.name) ($($setupAsset.size) bytes)"
          Invoke-WebRequest -Uri $portableUrl -OutFile $portableExe -MaximumRedirection 10 -TimeoutSec 900
          Invoke-WebRequest -Uri $setupAsset.browser_download_url -OutFile $setupExe -MaximumRedirection 10 -TimeoutSec 900

          $portableHash = (Get-FileHash -LiteralPath $portableExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedPortableHash = ([string]$manifest.hash).ToLowerInvariant()
          Write-Host "Manifest Portable SHA-256: $expectedPortableHash"
          Write-Host "Downloaded Portable SHA-256: $portableHash"
          if ($portableHash -ne $expectedPortableHash) { throw 'Portable download does not match bucket/orfeo.json SHA-256.' }

          $setupHash = (Get-FileHash -LiteralPath $setupExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupDigest = ([string]$setupAsset.digest).ToLowerInvariant()
          if ($setupDigest -notmatch '^sha256:([a-f0-9]{64})$') {
            throw "GitHub has not published a usable SHA-256 digest for the Setup asset: $setupDigest"
          }
          $expectedSetupHash = $Matches[1]
          Write-Host "GitHub Setup SHA-256: $expectedSetupHash"
          Write-Host "Downloaded Setup SHA-256: $setupHash"
          if ($setupHash -ne $expectedSetupHash) { throw 'Setup download does not match GitHub release SHA-256.' }

          $sevenZip = $env:SEVENZIP_PATH
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) { throw "7-Zip was not found: $sevenZip" }

          $selectedMethod = $null
          $appRoot = $null

          # Attempt 1: the official electron-builder Portable SFX executable.
          Write-Host ''
          Write-Host '=== ATTEMPT 1: Extract the official Portable EXE into a Scoop-style app directory ==='
          $portableListing = & $sevenZip l -slt $portableExe 2>&1
          $portableListExit = $LASTEXITCODE
          Write-Host "Portable 7-Zip listing exit code: $portableListExit"
          $portableListing | Select-Object -First 45 | ForEach-Object { Write-Host $_ }

          if ($portableListExit -eq 0) {
            & $sevenZip x $portableExe "-o$portableOut" '-y' 2>&1 | ForEach-Object { Write-Host $_ }
            $portableExtractExit = $LASTEXITCODE
            Write-Host "Portable extraction exit code: $portableExtractExit"
            $candidate = Find-OrfeoAppRoot $portableOut
            if ($null -ne $candidate) {
              $selectedMethod = 'Portable EXE extracted directly with 7-Zip'
              $appRoot = $candidate
              Write-Host 'PORTABLE EXTRACTION: PASS — Orfeo.exe and resources\app.asar are present in the extracted payload.'
            } else {
              Write-Warning 'Portable EXE was listable/extractable, but the required Orfeo.exe + resources\app.asar layout was not found.'
            }
          } else {
            Write-Warning '7-Zip could not list the Portable EXE as an archive.'
          }

          # Attempt 2: the official NSIS Setup package. Prefer extracting its nested app-64.7z
          # without running vendor setup actions.
          if ($null -eq $appRoot) {
            Write-Host ''
            Write-Host '=== ATTEMPT 2: Extract the official Setup NSIS payload ==='
            $setupListing = & $sevenZip l -slt $setupExe 2>&1
            $setupListExit = $LASTEXITCODE
            Write-Host "Setup 7-Zip listing exit code: $setupListExit"
            $setupListing | Select-Object -First 70 | ForEach-Object { Write-Host $_ }

            if ($setupListExit -eq 0) {
              & $sevenZip x $setupExe "-o$setupOuter" '-xr!*.nsis' '-y' 2>&1 | ForEach-Object { Write-Host $_ }
              $setupExtractExit = $LASTEXITCODE
              Write-Host "Setup outer extraction exit code: $setupExtractExit"
              $innerArchive = Get-ChildItem -LiteralPath $setupOuter -Filter 'app-64.7z' -File -Recurse -Force -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($null -ne $innerArchive) {
                Write-Host "Found nested application archive: $($innerArchive.FullName)"
                & $sevenZip x $innerArchive.FullName "-o$setupPayload" '-y' 2>&1 | ForEach-Object { Write-Host $_ }
                $innerExit = $LASTEXITCODE
                Write-Host "Nested app-64.7z extraction exit code: $innerExit"
                $candidate = Find-OrfeoAppRoot $setupPayload
                if ($innerExit -le 1 -and $null -ne $candidate) {
                  $selectedMethod = 'Setup NSIS outer extraction plus nested app-64.7z extraction'
                  $appRoot = $candidate
                  Write-Host 'SETUP PAYLOAD EXTRACTION: PASS — required application files are present.'
                } else {
                  Write-Warning 'Nested app-64.7z extraction did not produce a complete Orfeo application tree.'
                }
              } else {
                Write-Warning 'No app-64.7z was exposed by 7-Zip in the outer Setup extraction.'
              }
            } else {
              Write-Warning '7-Zip could not list the NSIS Setup package.'
            }
          }

          # Attempt 3: last-resort fallback — run Setup silently into a disposable test directory.
          if ($null -eq $appRoot) {
            Write-Host ''
            Write-Host '=== ATTEMPT 3: Run the official Setup silently into the test directory ==='
            New-Item -ItemType Directory -Path $setupInstalled -Force | Out-Null
            $isolatedRoaming = Join-Path $testRoot 'isolated-appdata'
            $isolatedLocal = Join-Path $testRoot 'isolated-localappdata'
            New-Item -ItemType Directory -Path $isolatedRoaming, $isolatedLocal -Force | Out-Null
            $oldAppData = $env:APPDATA
            $oldLocalAppData = $env:LOCALAPPDATA
            try {
              $env:APPDATA = $isolatedRoaming
              $env:LOCALAPPDATA = $isolatedLocal
              $installerProcess = Start-Process -FilePath $setupExe -ArgumentList @('/S', "/D=$setupInstalled") -Wait -PassThru
              Write-Host "Setup silent-install exit code: $($installerProcess.ExitCode)"
            } finally {
              $env:APPDATA = $oldAppData
              $env:LOCALAPPDATA = $oldLocalAppData
            }
            $candidate = Find-OrfeoAppRoot $setupInstalled
            if ($null -ne $candidate) {
              $selectedMethod = 'Official Setup installed silently into the Scoop test directory'
              $appRoot = $candidate
              Write-Host 'SETUP SILENT INSTALL: PASS — required application files are present.'
            } else {
              throw 'Both Portable and Setup approaches failed to produce Orfeo.exe with resources\app.asar. See the extraction logs above.'
            }
          }

          Write-Host ''
          Write-Host "SELECTED METHOD: $selectedMethod"
          Show-AppInventory $appRoot

          $exePath = Join-Path $appRoot 'Orfeo.exe'
          $wrapperPath = Join-Path $appRoot 'Orfeo.cmd'
          $wrapperLines = @(
            '@echo off',
            'set "PORTABLE_EXECUTABLE_DIR=%~dp0"',
            '"%~dp0Orfeo.exe" %*'
          )
          Set-Content -LiteralPath $wrapperPath -Value $wrapperLines -Encoding ASCII
          Write-Host 'Created a test launcher that sets PORTABLE_EXECUTABLE_DIR to the Scoop app directory.'
          Get-Content -LiteralPath $wrapperPath | ForEach-Object { Write-Host "WRAPPER: $_" }

          # Launch the extracted application directly (not the self-extracting Portable wrapper).
          # This confirms that the selected Scoop payload can run from its permanent app directory.
          $env:TEMP = $isolatedTemp
          $env:TMP = $isolatedTemp
          $env:PORTABLE_EXECUTABLE_DIR = $appRoot
          $process = $null
          try {
            Write-Host 'Launching extracted Orfeo.exe directly from the selected app directory...'
            $process = Start-Process -FilePath $exePath -WorkingDirectory $appRoot -PassThru
            Write-Host "Extracted Orfeo process PID: $($process.Id)"
            $observedProcesses = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
            $deadline = (Get-Date).AddSeconds(20)
            while ((Get-Date) -lt $deadline) {
              $foundProcesses = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
                $_.ExecutablePath -and (
                  $_.ExecutablePath.StartsWith($appRoot, [System.StringComparison]::OrdinalIgnoreCase) -or
                  $_.ExecutablePath.StartsWith($isolatedTemp, [System.StringComparison]::OrdinalIgnoreCase)
                )
              })
              foreach ($found in $foundProcesses) {
                [void]$observedProcesses.Add(('{0} | PID={1} | {2}' -f $found.Name, $found.ProcessId, $found.ExecutablePath))
              }
              Start-Sleep -Milliseconds 250
            }

            Write-Host "Observed app/temp processes: $($observedProcesses.Count)"
            foreach ($entry in $observedProcesses) { Write-Host "PROCESS: $entry" }
            $appProcesses = @($observedProcesses | Where-Object { $_ -match '\\Orfeo\.exe$' -and $_ -match [regex]::Escape($appRoot) })
            if ($appProcesses.Count -eq 0) {
              throw 'The extracted Orfeo.exe was not observed running from the selected app directory.'
            }
            $tempOrfeo = @($observedProcesses | Where-Object { $_ -match [regex]::Escape($isolatedTemp) -and $_ -match '\\Orfeo\.exe$' })
            if ($tempOrfeo.Count -gt 0) {
              throw 'Orfeo.exe was still observed running from TEMP after direct launch of the extracted app.'
            }
            Write-Host 'DIRECT LAUNCH: PASS — Orfeo.exe executed from the app directory, not from TEMP.'
            $dataPath = Join-Path $appRoot 'Orfeo-Data'
            Write-Host "Orfeo-Data present after launch: $(Test-Path -LiteralPath $dataPath -PathType Container)"
          }
          finally {
            $relatedProcesses = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
              $_.ExecutablePath -and (
                $_.ExecutablePath.StartsWith($appRoot, [System.StringComparison]::OrdinalIgnoreCase) -or
                $_.ExecutablePath.StartsWith($isolatedTemp, [System.StringComparison]::OrdinalIgnoreCase)
              )
            })
            foreach ($related in $relatedProcesses) {
              Stop-Process -Id ([int]$related.ProcessId) -Force -ErrorAction SilentlyContinue
            }
            if ($null -ne $process) {
              $process.Refresh()
              if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            }
            Start-Sleep -Seconds 2
          }

          "SELECTED_METHOD=$selectedMethod" >> $env:GITHUB_OUTPUT
          Write-Host ''
          Write-Host 'PASS: A complete Orfeo application tree was extracted/installed and the extracted executable ran from the Scoop-style app directory.'

      - name: Upload extraction experiment log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orfeo-scoop-extraction-experiment
          path: ${{ runner.temp }}/orfeo-scoop-extraction-test/**
          if-no-files-found: ignore
          retention-days: 7
