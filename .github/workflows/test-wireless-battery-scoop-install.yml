name: Wireless Battery Scoop Install Test

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/test-wireless-battery-scoop-install.yml"
      - "bucket/wireless-battery.json"
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/test-wireless-battery-scoop-install.yml"
      - "bucket/wireless-battery.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Scoop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          }
          $scoopRoot = if ($env:SCOOP) { $env:SCOOP } else { Join-Path $env:USERPROFILE 'scoop' }
          $env:SCOOP = $scoopRoot
          $env:Path = (Join-Path $scoopRoot 'shims') + ';' + $env:Path
          (Join-Path $scoopRoot 'shims') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          scoop --version

      - name: Install Wireless Battery from the portable archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'bucket\wireless-battery.json'
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Wireless Battery manifest was not found: $manifestPath"
          }

          scoop install $manifestPath
          if ($LASTEXITCODE -ne 0) { throw "Scoop install failed with exit code $LASTEXITCODE." }

          $prefix = (& scoop prefix wireless-battery | Select-Object -Last 1).Trim()
          if (-not (Test-Path -LiteralPath $prefix -PathType Container)) {
            throw "Scoop did not create the Wireless Battery installation directory: $prefix"
          }

          $required = @(
            'WirelessBattery.exe',
            'headsetcontrol.exe',
            'LICENSE.txt',
            'THIRD_PARTY_NOTICES.txt'
          )
          foreach ($name in $required) {
            $path = Join-Path $prefix $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Portable ZIP payload is missing: $name"
            }
          }

          $shortcutRoot = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          $shortcuts = @(Get-ChildItem -LiteralPath $shortcutRoot -Filter 'Wireless Battery.lnk' -File -Recurse -ErrorAction SilentlyContinue)
          if ($shortcuts.Count -eq 0) { throw 'The Wireless Battery Start Menu shortcut was not created.' }
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut($shortcuts[0].FullName)
          if (-not (Test-Path -LiteralPath $shortcut.TargetPath -PathType Leaf)) {
            throw "The Wireless Battery shortcut target is missing: $($shortcut.TargetPath)"
          }
          if ([IO.Path]::GetFileName($shortcut.TargetPath) -ne 'WirelessBattery.exe') {
            throw "The shortcut does not target WirelessBattery.exe: $($shortcut.TargetPath)"
          }

          Write-Host "Scoop prefix: $prefix"
          Write-Host "Start Menu shortcut: $($shortcuts[0].FullName)"
          Write-Host "Shortcut target: $($shortcut.TargetPath)"

          @(
            '## Wireless Battery Scoop install test'
            ''
            '- Scoop installed the official portable ZIP and validated its SHA-256.'
            '- WirelessBattery.exe and the bundled HeadsetControl executable are present.'
            '- The upstream Inno Setup installer was not executed.'
            '- License and third-party notices are present.'
            '- The Start Menu shortcut targets WirelessBattery.exe.'
            '- The application itself was not launched.'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Uninstall test package
        if: always()
        shell: pwsh
        run: |
          if (Get-Command scoop -ErrorAction SilentlyContinue) {
            scoop uninstall wireless-battery
            if ($LASTEXITCODE -ne 0) { Write-Warning "Scoop uninstall returned exit code $LASTEXITCODE." }
          }
