name: Manifest Pipeline

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "Manifest already committed to master that you want to validate, e.g. bucket/taskexplorer.json"
        required: true
        type: string
      force_update:
        description: "Force the autoupdate URL/hash template test, even if upstream has no newer version"
        required: false
        default: true
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: manifest-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    name: Run manifest stages in order
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine manifests to validate
        id: input
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANIFEST_INPUT: ${{ inputs.manifest }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPaths = [System.Collections.Generic.List[string]]::new()
          $needsTable = $false

          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $path = ([string]$env:MANIFEST_INPUT).Trim().Replace('\', '/')
            if ($path -notmatch '(?i)^(?:bucket/)?(?<name>[^/]+\.json)$') {
              throw "Provide one manifest filename or bucket/filename.json. Received: $path"
            }
            $manifestPaths.Add("bucket/$($Matches.name)")
            $needsTable = $true
          } else {
            $before = [string]$env:PUSH_BEFORE
            $after = [string]$env:PUSH_SHA
            if ([string]::IsNullOrWhiteSpace($before) -or $before -match '^0+$') {
              $changedFiles = @(git diff-tree --no-commit-id --name-only -r $after -- bucket)
            } else {
              $changedFiles = @(git diff --name-only $before $after -- bucket)
            }
            if ($LASTEXITCODE -ne 0) {
              throw "Could not determine changed files for push $before..$after."
            }

            foreach ($file in $changedFiles) {
              $normalized = ([string]$file).Replace('\', '/')
              if ($normalized -match '(?i)^bucket/[^/]+\.json$') {
                $needsTable = $true
                if (Test-Path -LiteralPath $normalized -PathType Leaf) {
                  $manifestPaths.Add($normalized)
                }
              }
            }
          }

          $manifestPaths = @($manifestPaths | Sort-Object -Unique)
          if ($manifestPaths.Count -eq 0) {
            "has_manifests=false" >> $env:GITHUB_OUTPUT
            "needs_table=$($needsTable.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
            "manifests=" >> $env:GITHUB_OUTPUT
            Write-Host "No existing root-level manifest files changed."
            exit 0
          }

          "has_manifests=true" >> $env:GITHUB_OUTPUT
          "needs_table=$($needsTable.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "manifests<<MANIFESTLIST" >> $env:GITHUB_OUTPUT
          foreach ($manifestPath in $manifestPaths) {
            $manifestPath >> $env:GITHUB_OUTPUT
          }
          "MANIFESTLIST" >> $env:GITHUB_OUTPUT

      - name: Run required workflows sequentially
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PIPELINE_SHA: ${{ github.sha }}
          MANIFESTS: ${{ steps.input.outputs.manifests }}
          HAS_MANIFESTS: ${{ steps.input.outputs.has_manifests }}
          NEEDS_TABLE: ${{ steps.input.outputs.needs_table }}
          FORCE_UPDATE_INPUT: ${{ inputs.force_update }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $manifestPaths = @($env:MANIFESTS -split '\r?\n' | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          $needsTable = $env:NEEDS_TABLE -eq 'true'
          if ($manifestPaths.Count -eq 0 -and -not $needsTable) {
            @('## Manifest pipeline', '', 'No manifest JSON files changed; no validation or index regeneration was required.') |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            exit 0
          }

          $forceUpdate = [string]$env:FORCE_UPDATE_INPUT
          if ($env:EVENT_NAME -eq 'push' -or [string]::IsNullOrWhiteSpace($forceUpdate)) {
            $forceUpdate = 'true'
          } else {
            $forceUpdate = $forceUpdate.ToLowerInvariant()
          }

          $apiRoot = "https://api.github.com/repos/$env:GH_REPOSITORY"
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'kirobucket-manifest-pipeline'
          }
          $summary = [System.Collections.Generic.List[string]]::new()
          $summary.Add("## Manifest pipeline")
          $summary.Add("")
          $summary.Add("- Trigger: $env:EVENT_NAME")
          $summary.Add("- Manifests: $($manifestPaths -join ', ')")
          $summary.Add("- Force autoupdate test: $forceUpdate")
          $summary.Add("")

          function Get-WorkflowRuns {
            param(
              [Parameter(Mandatory)][string]$WorkflowFile,
              [string]$Event = 'workflow_dispatch'
            )
            $uri = "$apiRoot/actions/workflows/$WorkflowFile/runs?branch=master&event=$Event&per_page=100"
            Invoke-RestMethod -Method Get -Uri $uri -Headers $headers -TimeoutSec 30 -ErrorAction Stop
          }

          function Wait-ForExistingWorkflow {
            param(
              [Parameter(Mandatory)][string]$WorkflowFile,
              [Parameter(Mandatory)][string]$HeadSha
            )

            $deadline = [DateTimeOffset]::UtcNow.AddMinutes(45)
            while ([DateTimeOffset]::UtcNow -lt $deadline) {
              $runs = Get-WorkflowRuns -WorkflowFile $WorkflowFile -Event 'push'
              $matchingRuns = @($runs.workflow_runs |
                Where-Object { [string]$_.head_sha -eq $HeadSha } |
                Sort-Object { [DateTimeOffset]::Parse([string]$_.created_at) } -Descending)

              if ($matchingRuns.Count -gt 0) {
                $run = $matchingRuns[0]
                Write-Host "Existing push-triggered workflow run: $($run.html_url)"
                if ($run.status -eq 'completed') {
                  if ($run.conclusion -ne 'success') {
                    $summary.Add("- FAILED: $WorkflowFile — conclusion: $($run.conclusion)")
                    $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
                    throw "Push-triggered workflow $WorkflowFile failed with conclusion '$($run.conclusion)'."
                  }
                  $summary.Add("- PASS: $WorkflowFile — $($run.html_url)")
                  return
                }
              }

              Start-Sleep -Seconds 8
            }

            throw "Timed out waiting for push-triggered $WorkflowFile for commit $HeadSha."
          }

          function Start-And-WaitWorkflow {
            param(
              [Parameter(Mandatory)][string]$WorkflowFile,
              [hashtable]$Inputs = @{}
            )

            Write-Host ""
            Write-Host "============================================================"
            Write-Host "Starting workflow: $WorkflowFile"
            Write-Host "============================================================"

            $before = Get-WorkflowRuns -WorkflowFile $WorkflowFile
            $knownIds = @($before.workflow_runs | ForEach-Object { [string]$_.id })
            $dispatchStarted = [DateTimeOffset]::UtcNow
            $payload = @{
              ref = 'master'
              inputs = $Inputs
            } | ConvertTo-Json -Depth 6 -Compress

            Invoke-RestMethod -Method Post -Uri "$apiRoot/actions/workflows/$WorkflowFile/dispatches" -Headers $headers -ContentType 'application/json' -Body $payload -TimeoutSec 30 -ErrorAction Stop | Out-Null

            $deadline = [DateTimeOffset]::UtcNow.AddMinutes(45)
            $childRun = $null
            while ([DateTimeOffset]::UtcNow -lt $deadline) {
              Start-Sleep -Seconds 8
              $current = Get-WorkflowRuns -WorkflowFile $WorkflowFile
              if ($null -eq $childRun) {
                $eligibleRuns = @($current.workflow_runs | Where-Object {
                  ($knownIds -notcontains [string]$_.id) -and
                  ([DateTimeOffset]::Parse([string]$_.created_at) -ge $dispatchStarted.AddSeconds(-10))
                } | Sort-Object { [DateTimeOffset]::Parse([string]$_.created_at) } -Descending)
                if ($eligibleRuns.Count -gt 0) { $childRun = $eligibleRuns[0] }
              } else {
                $refreshedRun = @($current.workflow_runs | Where-Object { [string]$_.id -eq [string]$childRun.id } | Select-Object -First 1)
                if ($refreshedRun.Count -gt 0) { $childRun = $refreshedRun[0] }
              }

              if ($null -eq $childRun) { continue }

              Write-Host "Workflow run: $($childRun.html_url)"
              if ($childRun.status -ne 'completed') {
                continue
              }

              if ($childRun.conclusion -ne 'success') {
                $summary.Add("- FAILED: $WorkflowFile — conclusion: $($childRun.conclusion)")
                $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
                throw "Workflow $WorkflowFile failed with conclusion '$($childRun.conclusion)'. Pipeline stopped."
              }

              $summary.Add("- PASS: $WorkflowFile — $($childRun.html_url)")
              Write-Host "PASS: $WorkflowFile"
              return
            }

            throw "Timed out waiting for $WorkflowFile to complete within 45 minutes."
          }

          foreach ($manifestPath in $manifestPaths) {
            $env:MANIFEST_PATH = $manifestPath
            $summary.Add("### $manifestPath")
            Write-Host ""
            Write-Host "Processing manifest: $manifestPath"

            Start-And-WaitWorkflow -WorkflowFile 'format-manifests.yml' -Inputs @{ manifest = $env:MANIFEST_PATH }
            Start-And-WaitWorkflow -WorkflowFile 'scoop-checkver-validation.yml' -Inputs @{ manifest = $env:MANIFEST_PATH }
            Start-And-WaitWorkflow -WorkflowFile 'validate-manifest-archives.yml' -Inputs @{ manifest = $env:MANIFEST_PATH }

            if ($env:MANIFEST_PATH -ieq 'bucket/fxsound.json') {
              if ($env:EVENT_NAME -eq 'push') {
                Wait-ForExistingWorkflow -WorkflowFile 'fxsound.yml' -HeadSha $env:PIPELINE_SHA
              } else {
                Start-And-WaitWorkflow -WorkflowFile 'fxsound.yml'
              }
            }

            Start-And-WaitWorkflow -WorkflowFile 'scoop-autoupdate-validation.yml' -Inputs @{
              manifest = $env:MANIFEST_PATH
              force_update = $forceUpdate
            }
            Start-And-WaitWorkflow -WorkflowFile 'ci.yml'
          }

          if ($needsTable) {
            Start-And-WaitWorkflow -WorkflowFile 'manifest-table.yml'
          }

          $summary.Add("")
          $summary.Add("All manifest pipeline stages passed.")
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          Write-Host "All manifest pipeline stages passed."
