name: Manual Manifest Pipeline

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "Manifest already committed to master that you want to validate, e.g. bucket/taskexplorer.json"
        required: true
        type: string
      force_update:
        description: "Force the autoupdate URL/hash template test, even if upstream has no newer version"
        required: false
        default: true
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: manual-manifest-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    name: Run manifest stages in order
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Validate manifest input
        id: input
        shell: pwsh
        env:
          MANIFEST_INPUT: ${{ inputs.manifest }}
        run: |
          $ErrorActionPreference = 'Stop'
          $path = $env:MANIFEST_INPUT.Trim().Replace('\', '/')
          if ($path -notmatch '(?i)^(?:bucket/)?(?<name>[^/]+\.json)$') {
            throw "Provide one manifest filename or bucket/filename.json. Received: $path"
          }
          "manifest=bucket/$($Matches.name)" >> $env:GITHUB_OUTPUT

      - name: Run required workflows sequentially
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          MANIFEST_PATH: ${{ steps.input.outputs.manifest }}
          FORCE_UPDATE: ${{ inputs.force_update }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $apiRoot = "https://api.github.com/repos/$env:GH_REPOSITORY"
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'kirobucket-manifest-pipeline'
          }
          $summary = [System.Collections.Generic.List[string]]::new()
          $summary.Add("## Manual manifest pipeline")
          $summary.Add("")
          $summary.Add("- Manifest: $env:MANIFEST_PATH")
          $summary.Add("- Force autoupdate test: $env:FORCE_UPDATE")
          $summary.Add("")

          function Get-WorkflowRuns {
            param([Parameter(Mandatory)][string]$WorkflowFile)
            $uri = "$apiRoot/actions/workflows/$WorkflowFile/runs?branch=master&event=workflow_dispatch&per_page=100"
            Invoke-RestMethod -Method Get -Uri $uri -Headers $headers -TimeoutSec 30 -ErrorAction Stop
          }

          function Start-And-WaitWorkflow {
            param(
              [Parameter(Mandatory)][string]$WorkflowFile,
              [hashtable]$Inputs = @{}
            )

            Write-Host ""
            Write-Host "============================================================"
            Write-Host "Starting workflow: $WorkflowFile"
            Write-Host "============================================================"

            $before = Get-WorkflowRuns -WorkflowFile $WorkflowFile
            $knownIds = @($before.workflow_runs | ForEach-Object { [string]$_.id })
            $dispatchStarted = [DateTimeOffset]::UtcNow
            $payload = @{
              ref = 'master'
              inputs = $Inputs
            } | ConvertTo-Json -Depth 6 -Compress

            Invoke-RestMethod -Method Post -Uri "$apiRoot/actions/workflows/$WorkflowFile/dispatches" -Headers $headers -ContentType 'application/json' -Body $payload -TimeoutSec 30 -ErrorAction Stop | Out-Null

            $deadline = [DateTimeOffset]::UtcNow.AddMinutes(45)
            $childRun = $null
            while ([DateTimeOffset]::UtcNow -lt $deadline) {
              Start-Sleep -Seconds 8
              $current = Get-WorkflowRuns -WorkflowFile $WorkflowFile
              if ($null -eq $childRun) {
                $eligibleRuns = @($current.workflow_runs | Where-Object {
                  ($knownIds -notcontains [string]$_.id) -and
                  ([DateTimeOffset]::Parse([string]$_.created_at) -ge $dispatchStarted.AddSeconds(-10))
                } | Sort-Object { [DateTimeOffset]::Parse([string]$_.created_at) } -Descending)
                if ($eligibleRuns.Count -gt 0) { $childRun = $eligibleRuns[0] }
              } else {
                $refreshedRun = @($current.workflow_runs | Where-Object { [string]$_.id -eq [string]$childRun.id } | Select-Object -First 1)
                if ($refreshedRun.Count -gt 0) { $childRun = $refreshedRun[0] }
              }

              if ($null -eq $childRun) { continue }

              Write-Host "Workflow run: $($childRun.html_url)"
              if ($childRun.status -ne 'completed') {
                continue
              }

              if ($childRun.conclusion -ne 'success') {
                $summary.Add("- FAILED: $WorkflowFile — conclusion: $($childRun.conclusion)")
                $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
                throw "Workflow $WorkflowFile failed with conclusion '$($childRun.conclusion)'. Pipeline stopped."
              }

              $summary.Add("- PASS: $WorkflowFile — $($childRun.html_url)")
              Write-Host "PASS: $WorkflowFile"
              return
            }

            throw "Timed out waiting for $WorkflowFile to complete within 45 minutes."
          }

          Start-And-WaitWorkflow -WorkflowFile 'format-manifests.yml' -Inputs @{ manifest = $env:MANIFEST_PATH }
          Start-And-WaitWorkflow -WorkflowFile 'scoop-checkver-validation.yml' -Inputs @{ manifest = $env:MANIFEST_PATH }
          Start-And-WaitWorkflow -WorkflowFile 'validate-manifest-archives.yml' -Inputs @{ manifest = $env:MANIFEST_PATH }

          if ($env:MANIFEST_PATH -ieq 'bucket/fxsound.json') {
            Start-And-WaitWorkflow -WorkflowFile 'fxsound.yml'
          }

          Start-And-WaitWorkflow -WorkflowFile 'scoop-autoupdate-validation.yml' -Inputs @{
            manifest = $env:MANIFEST_PATH
            force_update = ([string]$env:FORCE_UPDATE).ToLowerInvariant()
          }
          Start-And-WaitWorkflow -WorkflowFile 'ci.yml'
          Start-And-WaitWorkflow -WorkflowFile 'manifest-table.yml'

          $summary.Add("")
          $summary.Add("All manifest pipeline stages passed.")
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          Write-Host "All manifest pipeline stages passed."
