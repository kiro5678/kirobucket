name: Temporary Biscuit Autoupdate Probe

on:
  push:
    branches:
      - add-biscuit

permissions:
  contents: read

jobs:
  autoupdate-probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Biscuit manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: add-biscuit

      - name: Checkout Scoop core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ScoopInstaller/Scoop
          path: scoop_core

      - name: Exercise Scoop version, URL, and hash update
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCOOP_HOME: ${{ github.workspace }}/scoop_core
        run: |
          $ErrorActionPreference = 'Stop'
          $sourcePath = Join-Path $env:GITHUB_WORKSPACE 'bucket\biscuit.json'
          $checkver = Join-Path $env:GITHUB_WORKSPACE 'scoop_core\bin\checkver.ps1'
          $testDir = Join-Path $env:RUNNER_TEMP ("biscuit-autoupdate-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $testDir -Force | Out-Null
          $testManifestPath = Join-Path $testDir 'biscuit.json'
          Copy-Item -LiteralPath $sourcePath -Destination $testManifestPath
          try {
            $output = @(& $checkver -App $testManifestPath -ForceUpdate -ThrowError *>&1 | ForEach-Object { [string]$_ })
            $outputText = $output -join [Environment]::NewLine
            if ($outputText -match '(?i)(couldn''t\s+(retrieve|find|match)|could\s+not\s+find|URL .+ is not valid|Conversion from JSON failed|failed to convert JSON)') {
              throw "Scoop reported an update error: $($Matches[0]). Output: $outputText"
            }
            if ($outputText) { Write-Host $outputText }
            $updated = Get-Content -LiteralPath $testManifestPath -Raw | ConvertFrom-Json
            $expectedUrl = 'https://github.com/agata/dl.biscuit/releases/download/2.2.1/Biscuit-2.2.1-setup.exe'
            $expectedHash = '9b8a54a946a84d8fe7894432a53570435612199ccf839d6a3b771ff3210fbac3'
            if ($updated.version -ne '2.2.1') { throw "Expected version 2.2.1; found $($updated.version)." }
            if ($updated.architecture.'64bit'.url -ne $expectedUrl) { throw "Autoupdate produced an unexpected URL: $($updated.architecture.'64bit'.url)" }
            if ($updated.architecture.'64bit'.hash.ToLowerInvariant() -ne $expectedHash) { throw "Autoupdate produced an unexpected hash: $($updated.architecture.'64bit'.hash)" }
            Write-Output "Verified version: $($updated.version)"
            Write-Output "Verified URL: $($updated.architecture.'64bit'.url)"
            Write-Output "Verified SHA-256: $($updated.architecture.'64bit'.hash)"
            Write-Output 'Scoop ForceUpdate passed for Biscuit.'
          }
          finally {
            Remove-Item -LiteralPath $testDir -Recurse -Force -ErrorAction SilentlyContinue
          }
