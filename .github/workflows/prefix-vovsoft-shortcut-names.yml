name: Prefix Vovsoft shortcut names

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/prefix-vovsoft-shortcut-names.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prefix-shortcuts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0

      - name: Prefix shortcut display names
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          manifests = sorted(Path("bucket").glob("vovsoft-*.json"))
          if len(manifests) != 174:
              raise SystemExit(f"Expected 174 Vovsoft manifests, found {len(manifests)}; refusing to make partial changes.")

          changed = []
          checked_shortcuts = 0
          already_prefixed = 0
          for path in manifests:
              original = path.read_text(encoding="utf-8-sig")
              data = json.loads(original)
              shortcuts = data.get("shortcuts")
              if not isinstance(shortcuts, list):
                  continue

              file_changed = False
              for shortcut in shortcuts:
                  if isinstance(shortcut, list) and len(shortcut) >= 2 and isinstance(shortcut[1], str):
                      checked_shortcuts += 1
                      name = shortcut[1]
                      if re.match(r"(?i)^vovsoft(?:\\s|$)", name):
                          already_prefixed += 1
                          continue
                      shortcut[1] = "Vovsoft " + name
                      file_changed = True
                  elif isinstance(shortcut, dict) and isinstance(shortcut.get("name"), str):
                      checked_shortcuts += 1
                      name = shortcut["name"]
                      if re.match(r"(?i)^vovsoft(?:\\s|$)", name):
                          already_prefixed += 1
                          continue
                      shortcut["name"] = "Vovsoft " + name
                      file_changed = True

              if file_changed:
                  path.write_text(json.dumps(data, indent=4, ensure_ascii=False) + "\\n", encoding="utf-8", newline="\\n")
                  changed.append(str(path))

          print(f"Vovsoft manifests checked: {len(manifests)}")
          print(f"Shortcut entries checked: {checked_shortcuts}")
          print(f"Shortcut names already prefixed: {already_prefixed}")
          print(f"Manifests updated: {len(changed)}")
          for path in changed:
              print(f"UPDATED: {path}")

          # Remove this one-time workflow as part of the same commit.
          Path(".github/workflows/prefix-vovsoft-shortcut-names.yml").unlink(missing_ok=True)
          PY

      - name: Commit and push changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A bucket .github/workflows/prefix-vovsoft-shortcut-names.yml
          git commit -m "Prefix Vovsoft shortcut display names"
          git push origin HEAD:master
