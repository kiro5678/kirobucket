name: MuMuPlayer Scoop Registry and Uninstall Regression

on:
  push:
    branches:
      - master
      - 'fix/*'
    paths:
      - "bucket/mumuplayer.json"
      - ".github/workflows/mumuplayer-scoop-upgrade-test.yml"
      - "tests/mumuplayer-stable-root.Tests.ps1"
  pull_request:
    branches:
      - master
    paths:
      - "bucket/mumuplayer.json"
      - ".github/workflows/mumuplayer-scoop-upgrade-test.yml"
      - "tests/mumuplayer-stable-root.Tests.ps1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-registry-uninstall-regression:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Scoop and validate manifest with official checkver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force

          $scoopRoot = Join-Path $env:RUNNER_TEMP 'scoop-mumu-validation'
          $env:SCOOP = $scoopRoot
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            Invoke-RestMethod -Uri 'https://get.scoop.sh' | Invoke-Expression
          }

          $shims = Join-Path $scoopRoot 'shims'
          if (-not (Test-Path -LiteralPath $shims)) {
            throw "Scoop shims directory was not created: $shims"
          }
          $env:Path = "$shims;$env:Path"
          $shims | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          $checkver = Join-Path $scoopRoot 'apps\scoop\current\bin\checkver.ps1'
          if (-not (Test-Path -LiteralPath $checkver -PathType Leaf)) {
            throw "Official Scoop checkver script was not found: $checkver"
          }

          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'bucket\mumuplayer.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json -ErrorAction Stop
          if ($manifest.architecture.'64bit'.url -notmatch '-overseas-') {
            throw 'The MuMuPlayer manifest must remain on the Global/overseas channel.'
          }
          foreach ($persistName in @('configs','vms','nx_device')) {
            if (@($manifest.persist) -notcontains $persistName) {
              throw "The MuMuPlayer manifest must persist '$persistName'."
            }
          }

          foreach ($entry in @(
            @{ Name = 'pre_install'; Text = (@($manifest.pre_install) -join [Environment]::NewLine) },
            @{ Name = 'post_uninstall'; Text = (@($manifest.post_uninstall) -join [Environment]::NewLine) }
          )) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseInput(
              $entry.Text,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "The MuMuPlayer $($entry.Name) PowerShell script has syntax errors."
            }
          }

          $scriptText = @($manifest.pre_install) -join [Environment]::NewLine
          foreach ($requiredText in @(
            'Get-MuMuPreviousScoopVersionRoot',
            'Update-MuMuUninstallRegistration',
            'Update-MuMuServicePath',
            'Restore-MuMuRegistryChanges',
            'MuMuPlayerRemoteService',
            'install_prepare',
            'commit',
            'cache_path'
          )) {
            if (-not $scriptText.Contains($requiredText)) {
              throw "The pre_install script is missing required handling: $requiredText"
            }
          }

          foreach ($forbiddenText in @(
            'Find-MuMuPreviousVersionInstallRoot',
            'Move-MuMuInstallRootToVersion',
            'Move-MuMuPersistDataIntoVersion',
            'Restore-MuMuCurrentVersionJunction',
            '$appDataConfigPaths'
          )) {
            if ($scriptText.Contains($forbiddenText)) {
              throw "The pre_install script contains out-of-scope migration logic: $forbiddenText"
            }
          }

          if ($scriptText -notmatch '\$installRoot\s*=\s*\[IO\.Path\]::GetFullPath\(\$dir\)') {
            throw 'The MuMuPlayer payload must use Scoop $dir, the real version directory during pre_install.'
          }
          if ($scriptText -notmatch '"/D=\$installRoot"') {
            throw 'The MuMuPlayer installer must receive the real version directory as its /D target.'
          }
          if ($scriptText -match 'APPDATA|ProgramData') {
            throw 'The previous install root must not be discovered through AppData or ProgramData.'
          }
          if ($manifest.shortcuts[0][0] -ne 'nx_main\MuMuNxMain.exe') {
            throw 'The shortcut must target the MuMuPlayer NX-main executable.'
          }

          & $checkver -App 'mumuplayer' -Dir (Join-Path $env:GITHUB_WORKSPACE 'bucket') -ThrowError
          if (-not $?) { throw 'Official Scoop checkver returned an unsuccessful result.' }

      - name: Run Registry, service, update-guard and uninstall regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'tests\mumuplayer-stable-root.Tests.ps1')

      - name: Cleanup mock test roots
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Directory -Filter 'mumu-registry-*' -ErrorAction SilentlyContinue |
            ForEach-Object { Remove-Item -LiteralPath $_.FullName -Recurse -Force -ErrorAction SilentlyContinue }
