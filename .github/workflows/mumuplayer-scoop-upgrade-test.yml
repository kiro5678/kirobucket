name: MuMuPlayer Persisted Path Migration Regression

on:
  push:
    branches:
      - master
      - 'fix/*'
    paths:
      - "bucket/mumuplayer.json"
      - ".github/workflows/mumuplayer-scoop-upgrade-test.yml"
      - "tests/mumuplayer-persist-path-migration.Tests.ps1"
  pull_request:
    branches:
      - master
    paths:
      - "bucket/mumuplayer.json"
      - ".github/workflows/mumuplayer-scoop-upgrade-test.yml"
      - "tests/mumuplayer-persist-path-migration.Tests.ps1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-migration-simulation:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Scoop and validate manifest with official checkver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force

          $scoopRoot = Join-Path $env:RUNNER_TEMP 'scoop-mumu-validation'
          $env:SCOOP = $scoopRoot
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            Invoke-RestMethod -Uri 'https://get.scoop.sh' | Invoke-Expression
          }

          $shims = Join-Path $scoopRoot 'shims'
          if (-not (Test-Path -LiteralPath $shims)) {
            throw "Scoop shims directory was not created: $shims"
          }
          $env:Path = "$shims;$env:Path"
          $shims | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          $checkver = Join-Path $scoopRoot 'apps\scoop\current\bin\checkver.ps1'
          if (-not (Test-Path -LiteralPath $checkver -PathType Leaf)) {
            throw "Official Scoop checkver script was not found: $checkver"
          }

          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'bucket\mumuplayer.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json -ErrorAction Stop
          foreach ($persistName in @('configs','vms','nx_device')) {
            if (@($manifest.persist) -notcontains $persistName) {
              throw "The MuMuPlayer manifest must persist '$persistName'."
            }
          }

          foreach ($entry in @(
            @{ Name = 'pre_install'; Script = (@($manifest.pre_install) -join [Environment]::NewLine) },
            @{ Name = 'post_install'; Script = (@($manifest.post_install) -join [Environment]::NewLine) }
          )) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseInput(
              $entry.Script,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "The MuMuPlayer $($entry.Name) PowerShell script has syntax errors."
            }
          }

          $preText = @($manifest.pre_install) -join [Environment]::NewLine
          $postText = @($manifest.post_install) -join [Environment]::NewLine
          if (-not $preText.Contains('$mumuMigrationHelperContent')) { throw 'pre_install does not embed the path migration helper.' }
          if (-not $preText.Contains('-Phase Pre')) { throw 'pre_install does not run the pre-update path migration.' }
          if (-not $postText.Contains('-Phase Post')) { throw 'post_install does not run the post-persist path and registration checks.' }
          if (-not $postText.Contains('$original_dir')) { throw 'post_install must pass Scoop original_dir, not the current junction.' }
          if ($preText -match 'Set-ItemProperty|New-Item\s+.*HKLM|Remove-Item\s+.*HKLM') { throw 'pre_install must not modify Windows Registry state.' }

          $helperMatch = [regex]::Match($preText, '(?s)\$mumuMigrationHelperContent\s*=\s*@''\r?\n(?<helper>.*?)\r?\n''@')
          if (-not $helperMatch.Success) { throw 'Could not extract the embedded MuMu path migration helper.' }
          $helperText = $helperMatch.Groups['helper'].Value
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseInput(
            $helperText,
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw 'The embedded MuMu path migration helper has PowerShell syntax errors.'
          }

          foreach ($required in @(
            'nx_device\12.0\configs',
            'nx_device\15.0\configs',
            '_mumu-scoop-path-backups',
            'MuMuVMMDrv',
            'MuMuNxSup',
            'LocalServer32'
          )) {
            if (-not $helperText.Contains($required)) { throw "Migration helper is missing expected handling: $required" }
          }
          if ($helperText -match 'persist\\vms.*Get-ChildItem|Get-ChildItem.*persist\\vms') {
            throw 'The migration helper must not scan or modify persisted VM data.'
          }

          & $checkver -App 'mumuplayer' -Dir (Join-Path $env:GITHUB_WORKSPACE 'bucket') -ThrowError
          if (-not $?) { throw 'Official Scoop checkver returned an unsuccessful result.' }

      - name: Run persisted-path, backup, VM-data and Hypervisor/COM regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'tests\mumuplayer-persist-path-migration.Tests.ps1')

      - name: Cleanup mock test roots
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Directory -Filter 'mumu-persist-path-*' -ErrorAction SilentlyContinue |
            ForEach-Object { Remove-Item -LiteralPath $_.FullName -Recurse -Force -ErrorAction SilentlyContinue }
