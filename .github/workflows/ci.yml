name: CI

on:
  push:
    branches:
      - 'main'
      - 'master'
    paths-ignore:
      - 'bucket/**'
      - '.github/workflows/format-manifests.yml'
      - 'README.md'
      - 'docs/**'
      - 'logs/**'
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types:
      - archives-validated

permissions:
  contents: read

jobs:
  gate:
    name: Gate direct push CI behind archive validation
    runs-on: windows-latest
    outputs:
      run_tests: ${{ steps.detect.outputs.run_tests }}
    steps:
      - name: Checkout history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect manifest changes
        id: detect
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -ne 'push') {
            "run_tests=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $baseSha = $env:BASE_SHA.Trim()
          if ($baseSha -notmatch '^[0-9a-fA-F]{40}$') {
            Write-Warning 'Cannot determine the push base SHA; skipping direct CI until archive validation.'
            "run_tests=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          git cat-file -e "${baseSha}^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Base commit $baseSha is unavailable; skipping direct CI until archive validation."
            "run_tests=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $changedPaths = @(git diff --name-only $baseSha $env:HEAD_SHA)
          if ($LASTEXITCODE -ne 0) {
            throw "Could not compare $baseSha with $env:HEAD_SHA."
          }
          $manifestChanges = @($changedPaths | Where-Object {
            $_.Replace('\', '/') -match '^bucket/.+\.json$'
          })
          if ($manifestChanges.Count -gt 0) {
            Write-Host 'Skipping direct push CI because manifests must pass archive validation first:'
            $manifestChanges | ForEach-Object { Write-Host " - $_" }
            "run_tests=false" >> $env:GITHUB_OUTPUT
          } else {
            "run_tests=true" >> $env:GITHUB_OUTPUT
          }

  test:
    needs: gate
    if: ${{ needs.gate.outputs.run_tests == 'true' }}
    name: Test
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout Bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need at least 2 commits to properly gather changed files for linting
          fetch-depth: 2
          path: 'my_bucket'
      - name: Checkout Scoop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          path: 'scoop_core'
      - name: Register PSGallery
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
      - name: Install and cache test dependencies
        uses: potatoqualitee/psmodulecache@9e4b63833c22c1768d648e115a9c849afdda22a5 # v6.3
        with:
          modules-to-cache: BuildHelpers, Pester
          shell: ${{ matrix.shell }}
      - name: Run tests
        run: |
          $env:SCOOP_HOME="$(Convert-Path '.\scoop_core')"
          .\my_bucket\bin\test.ps1
