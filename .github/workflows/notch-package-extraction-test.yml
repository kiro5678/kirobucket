name: Notch Package Extraction Test

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/notch-package-extraction-test.yml"
      - "bucket/bloom.json"
      - "bucket/dlives.json"
      - "bucket/halo.json"
      - "bucket/lumen.json"
      - "bucket/myisland.json"
      - "bucket/nook-agent.json"
      - "bucket/windows-notch-overlay.json"
      - "bucket/nectar.json"
      - "bucket/nock.json"
      - "bucket/pillar.json"
      - "bucket/qnotch.json"
      - "bucket/quick-pill.json"
      - "bucket/shorehue.json"
      - "bucket/v-notch.json"
      - "bucket/venu.json"
      - "bucket/windows-dynamic-island.json"
      - "bucket/windynamicisland.json"
      - "bucket/winisland.json"
      - "bucket/winislands.json"
      - "bucket/wnotch.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-packages:
    name: Download, verify, and inspect notch installers
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Dynamic Island Scoop lifecycle scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -LiteralPath 'bucket/windows-dynamic-island.json' -Raw | ConvertFrom-Json -ErrorAction Stop
          foreach ($field in @('pre_install', 'pre_uninstall')) {
            $source = @($manifest.$field) -join [Environment]::NewLine
            if ([string]::IsNullOrWhiteSpace($source)) {
              throw "The Windows Dynamic Island manifest has no $field script."
            }
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseInput(
              $source,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $details = $errors | ForEach-Object { "$($_.Extent.StartLineNumber): $($_.Message)" }
              throw "$field PowerShell syntax validation failed: $($details -join '; ')"
            }
            Write-Host "$field PowerShell AST: PASS"
          }

      - name: Download, verify, and extract official release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip)) {
            $command = Get-Command '7z.exe' -ErrorAction SilentlyContinue
            if ($null -eq $command) { throw '7-Zip was not found on the runner.' }
            $sevenZip = $command.Source
          }

          $root = Join-Path $env:RUNNER_TEMP 'notch-package-extraction'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $reportPath = Join-Path $root 'extraction-report.txt'
          $report = [System.Collections.Generic.List[string]]::new()
          $failures = [System.Collections.Generic.List[string]]::new()

          function Add-Report {
            param([string]$Message)
            $report.Add($Message)
            Write-Host $Message
          }

          function Download-Verified {
            param([string]$Url, [string]$Path, [string]$ExpectedSha256)
            Invoke-WebRequest -Uri $Url -OutFile $Path -MaximumRedirection 10 -TimeoutSec 900
            $actual = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $ExpectedSha256.ToLowerInvariant()) {
              throw "SHA-256 mismatch. Expected $ExpectedSha256; got $actual."
            }
            return $actual
          }

          $targets = @(
            @{
              Name = 'Bloom'
              Version = '3.10.1'
              Kind = 'NSIS'
              Url = 'https://github.com/SehajveerSingh2005/bloom/releases/download/v3.10.1/bloom_3.10.1_x64-setup.exe'
              Sha256 = '5cb4d8fe87aaf26f161be61954aebfacb4c9f481b12c5bbcfc48aa6b56db7231'
              AppExe = 'bloom.exe'
            },
            @{
              Name = 'Dlives'
              Version = '1.0.0.1'
              Kind = 'PyInstaller'
              Url = 'https://github.com/FuGen-India-Private-Ltd/Dlives/releases/download/v1.0.0/Dlives_Setup.exe'
              Sha256 = '14a6742997851fb796d99b57b56ac52784d46b812d8138d428b52c68b1ced0f5'
              AppExe = 'Dlives.exe'
            },
            @{
              Name = 'Halo'
              Version = '4.2.3'
              Kind = 'Zip'
              Url = 'https://github.com/phoseinq/Halo/releases/download/v4.2.3/DynamicWinPortable.zip'
              Sha256 = 'ba3270f23b22344301168239396f00e9f4ace223dd519dc62025e08742faa085'
              AppExe = 'Halo/Halo.App.exe'
              RuntimeConfig = 'Halo/Halo.Settings.runtimeconfig.json'
              RequiredFrameworks = @('Microsoft.NETCore.App', 'Microsoft.WindowsDesktop.App')
            },
            @{
              Name = 'Lumen'
              Version = '0.2.1'
              Kind = 'Inno'
              Url = 'https://github.com/Risuleia/Lumen/releases/download/v0.2.1/Lumen-0.2.1-setup.exe'
              Sha256 = '7f68b3f90891818988c1089d2ff67aef84f8681bfc1281f4e1783213857dc948'
              AppExe = 'lumen.exe'
            },
            @{
              Name = 'MyIsland'
              Version = '1.0.0'
              Kind = 'Direct'
              Url = 'https://github.com/xiaoxiaobaijiangjun/MyIsland/releases/download/v1.0.0/MyIsland.exe'
              Sha256 = '8e14deb23093b6f672cdc3743c2c4d3709b0b14b9ca672fc59d3dcafd329bddd'
              AppExe = 'MyIsland.exe'
            },
            @{
              Name = 'Nook Agent'
              Version = '0.2.2'
              Kind = 'PairDirect'
              Url = 'https://github.com/zubairbinshaukat/nook/releases/download/v0.2.2/nook.exe'
              Sha256 = '0db32064755dafd05d1eee8722799c9643c3706e05f2fcf33038e4ab746f41ca'
              AppExe = 'nook.exe'
              HelperUrl = 'https://github.com/zubairbinshaukat/nook/releases/download/v0.2.2/nook-hook.exe'
              HelperSha256 = '3d2d1e66f8093920f0942e1f4c61dba427e62df957d3fe7fc54010e06e959af6'
              HelperExe = 'nook-hook.exe'
            },
            @{
              Name = 'Windows Notch Overlay'
              Version = '0.4.0'
              Kind = 'Direct'
              Url = 'https://github.com/Taxperia/windows-notch-overlay/releases/download/v0.4.0/Windows.Notch.Overlay.0.4.0.exe'
              Sha256 = '8c7d66cb2114a0fc184185c0fa4dcddd298c0627af474a34b6c75ee792339f99'
              AppExe = 'Windows.Notch.Overlay.0.4.0.exe'
            },
            @{
              Name = 'Nectar'
              Version = '1.7.0'
              Kind = 'Zip'
              Url = 'https://github.com/kua8/Nectar/releases/download/v1.7.0/nectar-1.7.0-portable-windows-x64.zip'
              Sha256 = '3c5c9b256a3b832c9c32de53ce16cd364c385ef968e48474da06500e594927bb'
              AppExe = 'nectar.exe'
            },
            @{
              Name = 'Nock'
              Version = '0.12.10'
              Kind = 'Direct'
              Url = 'https://github.com/Akhilesh-Varute/Nock/releases/download/v0.12.10/Nock-portable-0.12.10.exe'
              Sha256 = '21744b1c9c21485d4a7922eecea67367db7870bdc964611108a459d2dbadd5cc'
              AppExe = 'nock.exe'
            },
            @{
              Name = 'PILLAR'
              Version = '0.1.4'
              Kind = 'NSIS'
              Url = 'https://github.com/warpirate/pillar-dynamic-island-for-windows/releases/download/v0.1.4/PILLAR_0.1.4_x64-setup.exe'
              Sha256 = 'a2ad2c503303458550a957c5581b8f803ae8ad71a892e9b98a770a051e2012fc'
              AppExe = 'pillar.exe'
            },
            @{
              Name = 'QNotch'
              Version = '0.8.4'
              Kind = 'Zip'
              Url = 'https://github.com/Somafet/qnotch/releases/download/v0.8.4/QNotch-self-contained.zip'
              Sha256 = '4cefefadebb0193f2574d0ee8c9d5213ff24315f649d228958985c4c13872913'
              AppExe = 'QNotch.exe'
            },
            @{
              Name = 'Quick Pill'
              Version = '5.5.1'
              Kind = 'QuickPill'
              Url = 'https://pub-ec47b1fa4cbf4c5ba82408a738fb69d3.r2.dev/QuickPill-Windows-v5.5.1-Setup.exe'
              Sha256 = '14acfabffd3ddb68d78583f18685c5038bbe67355eabcc284d7760c2cd15548d'
              AppExe = 'Quick Pill.exe'
            },
            @{
              Name = 'ShoreHue'
              Version = '1.1.1'
              Kind = 'Zip'
              Url = 'https://github.com/timecolors/ShoreHue/releases/download/v1.1.1/ShoreHue-v1.1.1-win-x64.zip'
              Sha256 = '90c7a65bc0d8a69005f53e88714f1b305821750ef321aa22ab0dd3277fd978ef'
              AppExe = 'ShoreHue.exe'
            },
            @{
              Name = 'V-Notch'
              Version = '2.2.1'
              Kind = 'NSIS'
              Url = 'https://github.com/w0otdev/V-Notch/releases/download/v2.2.1/V-Notch-Setup.exe'
              Sha256 = '549fe1cf2c6ae6f493fe2d90fefb1cd9b4d152fe5ca7dcd9d83ed8d4fc5c004b'
              AppExe = '$PLUGINSDIR/payload/V-Notch.exe'
            },
            @{
              Name = 'Venu'
              Version = '0.6.1'
              Kind = 'Direct'
              Url = 'https://github.com/imnakul/venu---Dynamic-Notch-for-Windows/releases/download/v0.6.1/venu-0.6.1.exe'
              Sha256 = '96f44ae011a45daa6de3d23a1b19024b3c081cb38beb8bacbb5418b3ffc0761c'
              AppExe = 'venu.exe'
            },
            @{
              Name = 'Windows Dynamic Island'
              Version = '0.8.0'
              Kind = 'Inno'
              Url = 'https://github.com/nazimferragh/windows-dynamic-island/releases/download/v0.8.0/DynamicIsland-Setup-0.8.0.exe'
              Sha256 = 'cf7374f05510fe1e9cbeb47141c7acb45598b525274dc0401c04a9821cb66e49'
              AppExe = 'DynamicIsland.exe'
            },
            @{
              Name = 'WinDynamicIsland'
              Version = '1.0.0'
              Kind = 'Zip'
              Url = 'https://github.com/uponatime2019/WinDynamicIsland/releases/download/v1.0.0/WinDynamicIsland-v1.0.0-win-x64.zip'
              Sha256 = 'f5638ef72b7d1c26f26b757d57216cd658161f6cc30ae7141a29e51e8d133d33'
              AppExe = 'WinDynamicIsland.exe'
              RuntimeConfig = 'WinDynamicIsland.runtimeconfig.json'
              RequiredExternalFramework = 'Microsoft.NETCore.App'
              RequiredExternalVersion = '8.0.0'
            },
            @{
              Name = 'WinIsland'
              Version = '1.0.2'
              Kind = 'Zip'
              Url = 'https://github.com/zHeuzy2/WinIsland/releases/download/v1.0.2/WinIsland-1.0.2-portable.zip'
              Sha256 = 'fa5f49a227ab8f2a79cc9fc05fa8dc5fb9af27bb03edcd012fb304899e7af764'
              AppExe = 'WinIsland.exe'
            },
            @{
              Name = 'WinIslands'
              Version = '3.1.1'
              Kind = 'Direct'
              Url = 'https://github.com/JudeKwong/WinIslands/releases/download/3.1.1/WinIslands-3.1.1-win-x64.exe'
              Sha256 = 'a9c73f9952c6390e42cab9aef723f6161f1597a421be1386e4cd66174454df59'
              AppExe = 'WinIslands.exe'
            },
            @{
              Name = 'WNotch'
              Version = '0.22.0'
              Kind = 'NotchPayload'
              Url = 'https://github.com/Brick-Bread/WNotch/releases/download/v0.22.0/Notch-Setup-0.22.0.exe'
              Sha256 = 'd8e2b78124021463cdbc7156868efa4b63fd789a019c19ce624853d9189b0f16'
              AppExe = 'Notch.exe'
            }
          )

          $pyinstExtractor = Join-Path $root 'pyinstxtractor.py'
          $pyinstExtractorUrl = 'https://raw.githubusercontent.com/extremecoders-re/pyinstxtractor/815d31cf26bc71e62f851b2e549452e7b7c9dd98/pyinstxtractor.py'
          Invoke-WebRequest -Uri $pyinstExtractorUrl -OutFile $pyinstExtractor -MaximumRedirection 5 -TimeoutSec 120
          $innounpPath = $null
          foreach ($target in $targets) {
            if ($target.Kind -eq 'Inno') {
              $helperZip = Join-Path $root 'innounp-2.zip'
              $helperRoot = Join-Path $root 'innounp-helper'
              $helperUrl = 'https://raw.githubusercontent.com/jrathlev/InnoUnpacker-Windows-GUI/032d64c782efc6b36766d8f9c3b1b2f042144a58/innounp-2/bin/innounp-2.zip'
              $helperHash = '10fce27b6344b7674d5625cc34afca1c88c12183d957c6d93e401097fa2556cd'
              Download-Verified -Url $helperUrl -Path $helperZip -ExpectedSha256 $helperHash | Out-Null
              New-Item -ItemType Directory -Path $helperRoot -Force | Out-Null
              & $sevenZip x $helperZip "-o$helperRoot" '-y' | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'Could not extract the pinned innounp helper.' }
              $innounp = Get-ChildItem -LiteralPath $helperRoot -Filter 'innounp.exe' -File -Recurse | Select-Object -First 1
              if ($null -eq $innounp) { throw 'Pinned innounp helper archive did not contain innounp.exe.' }
              $innounpPath = $innounp.FullName
              break
            }
          }

          foreach ($target in $targets) {
            Add-Report ''
            Add-Report '============================================================'
            Add-Report "$($target.Name) $($target.Version) [$($target.Kind)]"
            Add-Report '============================================================'
            $targetRoot = Join-Path $root ($target.Name -replace '[^A-Za-z0-9_-]', '-')
            New-Item -ItemType Directory -Path $targetRoot -Force | Out-Null
            $installerPath = Join-Path $targetRoot ([System.IO.Path]::GetFileName(([uri]$target.Url).AbsolutePath))
            try {
              $hash = Download-Verified -Url $target.Url -Path $installerPath -ExpectedSha256 $target.Sha256
              Add-Report "Download and SHA-256: PASS ($hash)"
              $extractRoot = Join-Path $targetRoot 'extracted'
              New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null

              switch ($target.Kind) {
                'PyInstaller' {
                  $pyinstOutput = & python $pyinstExtractor $installerPath 2>&1
                  $pyinstExit = $LASTEXITCODE
                  $pyinstOutput | Set-Content -LiteralPath (Join-Path $targetRoot 'pyinstxtractor.log') -Encoding utf8
                  if ($pyinstExit -ne 0) {
                    throw "PyInstaller archive extraction failed ($pyinstExit): $(($pyinstOutput | Select-Object -Last 8) -join ' ')"
                  }
                  $pyinstRoot = Join-Path $env:GITHUB_WORKSPACE ((Split-Path -Leaf $installerPath) + '_extracted')
                  $embeddedPayload = Join-Path $pyinstRoot 'Dlives_Payload.bin'
                  if (-not (Test-Path -LiteralPath $embeddedPayload -PathType Leaf)) {
                    $candidates = @(Get-ChildItem -LiteralPath $pyinstRoot -Filter 'Dlives_Payload.bin' -File -Recurse | ForEach-Object { $_.FullName })
                    throw "PyInstaller extraction did not expose Dlives_Payload.bin. Candidates: $($candidates -join '; ')"
                  }
                  $payloadHash = (Get-FileHash -LiteralPath $embeddedPayload -Algorithm SHA256).Hash.ToLowerInvariant()
                  $directPayloadUrl = 'https://raw.githubusercontent.com/FuGen-India-Private-Ltd/Dlives/32162fddd0350e84a8da9a15650519c8d0586fd8/Dlives_Payload.bin'
                  $directPayload = Join-Path $targetRoot 'Dlives_Payload-direct.bin'
                  Invoke-WebRequest -Uri $directPayloadUrl -OutFile $directPayload -MaximumRedirection 5 -TimeoutSec 900
                  $directHash = (Get-FileHash -LiteralPath $directPayload -Algorithm SHA256).Hash.ToLowerInvariant()
                  if ($directHash -ne $payloadHash) {
                    throw "Pinned standalone payload does not match the embedded setup payload. Embedded=$payloadHash; direct=$directHash"
                  }
                  Copy-Item -LiteralPath $directPayload -Destination (Join-Path $extractRoot 'Dlives.exe') -Force
                  Add-Report "PyInstaller installer extraction: PASS; found embedded Dlives_Payload.bin ($((Get-Item -LiteralPath $embeddedPayload).Length) bytes)."
                  Add-Report "Standalone payload SHA256: $payloadHash"
                  Add-Report "Pinned standalone raw URL: $directPayloadUrl"
                  Add-Report "Embedded and direct standalone payload hashes match."
                }
                'Inno' {
                  $output = & $innounpPath '-x' "-d$extractRoot" $installerPath '-y' '-c{app}' 2>&1
                  $exitCode = $LASTEXITCODE
                  if ($exitCode -ne 0) {
                    throw "innounp extraction failed ($exitCode): $(($output | Select-Object -Last 8) -join ' ')"
                  }
                  $expected = Join-Path $extractRoot $target.AppExe
                  if (-not (Test-Path -LiteralPath $expected -PathType Leaf)) {
                    $found = @(Get-ChildItem -LiteralPath $extractRoot -Filter $target.AppExe -File -Recurse | ForEach-Object {
                      [System.IO.Path]::GetRelativePath($extractRoot, $_.FullName).Replace('\', '/')
                    })
                    throw "Expected $($target.AppExe) at the extracted app root. Found: $($found -join ', ')"
                  }
                  Add-Report "Inno Setup extraction: PASS; $($target.AppExe) is at the app root."
                }
                'NSIS' {
                  $listing = & $sevenZip l -slt $installerPath 2>&1
                  if ($LASTEXITCODE -ne 0) { throw '7-Zip could not list the NSIS installer.' }
                  $listing | Set-Content -LiteralPath (Join-Path $targetRoot '7zip-listing.txt') -Encoding utf8
                  $extractOutput = & $sevenZip x $installerPath "-o$extractRoot" '-y' '-bd' 2>&1
                  $exitCode = $LASTEXITCODE
                  $extractOutput | Set-Content -LiteralPath (Join-Path $targetRoot '7zip-extraction.log') -Encoding utf8
                  if ($exitCode -ne 0) { throw "7-Zip NSIS extraction failed ($exitCode)." }
                  $expectedRelative = ([string]$target.AppExe).Replace('\', '/')
                  $expectedFileName = [System.IO.Path]::GetFileName($expectedRelative)
                  $found = @(Get-ChildItem -LiteralPath $extractRoot -Filter $expectedFileName -File -Recurse | ForEach-Object {
                    [System.IO.Path]::GetRelativePath($extractRoot, $_.FullName).Replace('\', '/')
                  })
                  if ($found -notcontains $expectedRelative) {
                    throw "Expected exact NSIS path '$expectedRelative'. Found: $($found -join ', ')"
                  }
                  Add-Report "NSIS extraction: PASS; exact payload path $expectedRelative."
                }
                'QuickPill' {
                  $nsisRoot = Join-Path $targetRoot 'nsis-payload'
                  New-Item -ItemType Directory -Path $nsisRoot -Force | Out-Null
                  $listing = & $sevenZip l -slt $installerPath 2>&1
                  if ($LASTEXITCODE -ne 0) { throw '7-Zip could not list the Quick Pill NSIS installer.' }
                  $listing | Set-Content -LiteralPath (Join-Path $targetRoot '7zip-listing.txt') -Encoding utf8
                  $extractOutput = & $sevenZip x $installerPath "-o$nsisRoot" '-y' '-bd' 2>&1
                  $exitCode = $LASTEXITCODE
                  $extractOutput | Set-Content -LiteralPath (Join-Path $targetRoot '7zip-extraction.log') -Encoding utf8
                  if ($exitCode -ne 0) { throw "Quick Pill NSIS extraction failed ($exitCode)." }
                  $nestedArchive = Join-Path $nsisRoot '$PLUGINSDIR\app-64.7z'
                  if (-not (Test-Path -LiteralPath $nestedArchive -PathType Leaf)) {
                    throw 'Quick Pill NSIS payload did not contain $PLUGINSDIR/app-64.7z.'
                  }
                  $nestedOutput = & $sevenZip x $nestedArchive "-o$extractRoot" '-y' '-bd' 2>&1
                  $nestedExit = $LASTEXITCODE
                  $nestedOutput | Set-Content -LiteralPath (Join-Path $targetRoot 'nested-7zip-extraction.log') -Encoding utf8
                  if ($nestedExit -ne 0) { throw "Quick Pill app-64.7z extraction failed ($nestedExit)." }
                  $quickPillExe = Join-Path $extractRoot $target.AppExe
                  if (-not (Test-Path -LiteralPath $quickPillExe -PathType Leaf)) {
                    throw "Quick Pill nested archive did not produce $($target.AppExe) at the payload root."
                  }
                  Add-Report "Quick Pill nested app-64.7z extraction and EXE path: PASS ($($target.AppExe))."
                }
                'Direct' {
                  $destination = Join-Path $extractRoot ([string]$target.AppExe -replace '/', [System.IO.Path]::DirectorySeparatorChar)
                  $destinationDir = Split-Path -Parent $destination
                  if (-not (Test-Path -LiteralPath $destinationDir -PathType Container)) {
                    New-Item -ItemType Directory -Path $destinationDir -Force | Out-Null
                  }
                  Copy-Item -LiteralPath $installerPath -Destination $destination -Force
                  Add-Report "Standalone EXE placement: PASS ($($target.AppExe))"
                }
                'PairDirect' {
                  $mainDestination = Join-Path $extractRoot ([string]$target.AppExe)
                  Copy-Item -LiteralPath $installerPath -Destination $mainDestination -Force
                  $helperPath = Join-Path $targetRoot ([string]$target.HelperExe)
                  $helperHash = Download-Verified -Url $target.HelperUrl -Path $helperPath -ExpectedSha256 $target.HelperSha256
                  Copy-Item -LiteralPath $helperPath -Destination (Join-Path $extractRoot ([string]$target.HelperExe)) -Force
                  Add-Report "Standalone application EXE placement: PASS ($($target.AppExe))"
                  Add-Report "Standalone helper EXE placement: PASS ($($target.HelperExe)); SHA-256 $helperHash"
                }
                'Zip' {
                  $extractOutput = & $sevenZip x $installerPath "-o$extractRoot" '-y' '-bd' 2>&1
                  $exitCode = $LASTEXITCODE
                  $extractOutput | Set-Content -LiteralPath (Join-Path $targetRoot '7zip-extraction.log') -Encoding utf8
                  if ($exitCode -ne 0) { throw "7-Zip ZIP extraction failed ($exitCode)." }
                  Add-Report 'ZIP extraction: PASS; archive expanded for executable-path inspection.'
                  if ($target.AppExe) {
                    $expectedAppExe = Join-Path $extractRoot ([string]$target.AppExe -replace '/', [System.IO.Path]::DirectorySeparatorChar)
                    if (-not (Test-Path -LiteralPath $expectedAppExe -PathType Leaf)) {
                      throw "Expected application executable was not found: $($target.AppExe)"
                    }
                    Add-Report "Main application executable path: PASS ($($target.AppExe))"
                  }
                  if ($target.RuntimeConfig) {
                    $runtimeConfigPath = Join-Path $extractRoot ([string]$target.RuntimeConfig -replace '/', [System.IO.Path]::DirectorySeparatorChar)
                    if (-not (Test-Path -LiteralPath $runtimeConfigPath -PathType Leaf)) {
                      throw "Expected runtime config was not found: $($target.RuntimeConfig)"
                    }
                    $runtimeConfigData = Get-Content -LiteralPath $runtimeConfigPath -Raw | ConvertFrom-Json -ErrorAction Stop
                    $includedFrameworks = @($runtimeConfigData.runtimeOptions.includedFrameworks | ForEach-Object { [string]$_.name })
                    foreach ($requiredFramework in $target.RequiredFrameworks) {
                      if ($includedFrameworks -notcontains [string]$requiredFramework) {
                        throw "Required bundled framework '$requiredFramework' is missing from $($target.RuntimeConfig). Included: $($includedFrameworks -join ', ')"
                      }
                    }
                    Add-Report "Bundled frameworks: PASS ($($includedFrameworks -join ', '))"
                    if ($target.RequiredExternalFramework) {
                      $externalFramework = $runtimeConfigData.runtimeOptions.framework
                      if ($null -eq $externalFramework -or
                          [string]$externalFramework.name -ne [string]$target.RequiredExternalFramework -or
                          [string]$externalFramework.version -ne [string]$target.RequiredExternalVersion) {
                        $foundFramework = if ($null -eq $externalFramework) { '(none)' } else { "$($externalFramework.name) $($externalFramework.version)" }
                        throw "Expected external framework $($target.RequiredExternalFramework) $($target.RequiredExternalVersion), found $foundFramework."
                      }
                      Add-Report "External runtime requirement: PASS ($($externalFramework.name) $($externalFramework.version))"
                    }
                  }
                }
                'NotchPayload' {
                  $stream = [System.IO.File]::OpenRead($installerPath)
                  $payloadZip = Join-Path $targetRoot 'notch-payload.zip'
                  $output = $null
                  try {
                    if ($stream.Length -lt 16) { throw 'Setup is too small for the NOTCHPAY trailer.' }
                    $stream.Position = $stream.Length - 16
                    $trailer = New-Object byte[] 16
                    $totalRead = 0
                    while ($totalRead -lt 16) {
                      $read = $stream.Read($trailer, $totalRead, 16 - $totalRead)
                      if ($read -le 0) { throw 'Could not read the NOTCHPAY trailer.' }
                      $totalRead += $read
                    }
                    $magic = [System.Text.Encoding]::ASCII.GetString($trailer, 8, 8)
                    if ($magic -cne 'NOTCHPAY') { throw "Unexpected payload marker: $magic" }
                    $zipLength = [System.BitConverter]::ToInt64($trailer, 0)
                    $zipOffset = $stream.Length - 16 - $zipLength
                    if ($zipLength -le 0 -or $zipOffset -le 0) { throw 'Embedded ZIP length is invalid.' }
                    $stream.Position = $zipOffset
                    $output = [System.IO.File]::Create($payloadZip)
                    $buffer = New-Object byte[] 65536
                    $remaining = $zipLength
                    while ($remaining -gt 0) {
                      $count = [int][Math]::Min([long]$buffer.Length, $remaining)
                      $read = $stream.Read($buffer, 0, $count)
                      if ($read -le 0) { throw 'Embedded ZIP ended unexpectedly.' }
                      $output.Write($buffer, 0, $read)
                      $remaining -= $read
                    }
                    $output.Flush()
                  }
                  finally {
                    if ($null -ne $output) { $output.Dispose() }
                    $stream.Dispose()
                  }
                  Expand-Archive -LiteralPath $payloadZip -DestinationPath $extractRoot -Force
                  Remove-Item -LiteralPath $payloadZip -Force
                  if (-not (Test-Path -LiteralPath (Join-Path $extractRoot $target.AppExe) -PathType Leaf)) {
                    throw "Embedded ZIP did not extract $($target.AppExe) at its root."
                  }
                  Add-Report "NOTCHPAY embedded ZIP extraction: PASS; $($target.AppExe) is at the root."
                }
              }

              $files = @(Get-ChildItem -LiteralPath $extractRoot -File -Recurse -Force)
              $executables = @($files | Where-Object { $_.Extension -ieq '.exe' } | ForEach-Object {
                [System.IO.Path]::GetRelativePath($extractRoot, $_.FullName).Replace('\', '/')
              })
              Add-Report "Extracted files: $($files.Count)"
              Add-Report "EXE inventory: $($executables -join '; ')"
              $runtimeFiles = @($files | Where-Object {
                $_.Name -match '(?i)(\.runtimeconfig\.json|\.deps\.json|^hostfxr\.dll$|^hostpolicy\.dll$|^coreclr\.dll$|^System\.Private\.CoreLib\.dll$|^dotnet\.exe$)'
              })
              Add-Report "Runtime-related files: $(@($runtimeFiles | ForEach-Object { [System.IO.Path]::GetRelativePath($extractRoot, $_.FullName).Replace('\', '/') }) -join '; ')"
              foreach ($runtimeConfig in @($runtimeFiles | Where-Object { $_.Name -match '(?i)\.runtimeconfig\.json$' })) {
                Add-Report "Runtime config ($([System.IO.Path]::GetRelativePath($extractRoot, $runtimeConfig.FullName))):"
                (Get-Content -LiteralPath $runtimeConfig.FullName -Raw).Split([Environment]::NewLine) | ForEach-Object { Add-Report "  $_" }
              }
              Add-Report 'RESULT: PASS'
            }
            catch {
              $message = "$($target.Name): $($_.Exception.Message)"
              $failures.Add($message)
              Add-Report "RESULT: FAIL — $message"
            }
          }

          Add-Report ''
          Add-Report '============================================================'
          Add-Report "Packages tested: $($targets.Count)"
          Add-Report "Failures: $($failures.Count)"
          Add-Report '============================================================'
          $report | Set-Content -LiteralPath $reportPath -Encoding utf8
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Upload extraction report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notch-package-extraction-report
          path: ${{ runner.temp }}/notch-package-extraction/extraction-report.txt
          if-no-files-found: warn
