name: Inspect Requested Scoop Packages

on:
  push:
    branches:
      - scoop-requested-manifests
    paths:
      - ".github/workflows/inspect-requested-scoop-packages.yml"
      - "bucket/legacy-router-opener-alaa7hany.json"
      - "bucket/winorbit-mahadi-siraj.json"
      - "bucket/gaming-tweaks-hamsypg.json"
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/inspect-requested-scoop-packages.yml"
      - "bucket/legacy-router-opener-alaa7hany.json"
      - "bucket/winorbit-mahadi-siraj.json"
      - "bucket/gaming-tweaks-hamsypg.json"

permissions:
  contents: read

jobs:
  inspect:
    name: Verify official assets and package layouts
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Locate and verify FileFerret portable executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $pageUrl = 'https://fileferret.net/en/download.html'
          $response = Invoke-WebRequest -Uri $pageUrl -UseBasicParsing -MaximumRedirection 10 -TimeoutSec 1200
          $html = [string]$response.Content
          if ($html -notmatch 'Latest version\s*([0-9]+\.[0-9]+\.[0-9]+)') {
            throw 'Could not read FileFerret version from the official download page.'
          }
          $version = $Matches[1]
          $filename = "FileFerret-Portable-$version.exe"
          $assetUrl = $null
          $candidateLinks = @()
          $anchors = [regex]::Matches($html, '(?is)<a\b(?<attrs>[^>]*)>(?<inner>.*?)</a>')
          foreach ($anchor in $anchors) {
            $innerText = [Net.WebUtility]::HtmlDecode(($anchor.Groups['inner'].Value -replace '<[^>]+>', ' ' -replace '\s+', ' ')).Trim()
            if ($innerText -notmatch [regex]::Escape($filename)) { continue }
            $href = [regex]::Match($anchor.Groups['attrs'].Value, '(?is)href\s*=\s*["''](?<href>[^"'']+)["'']')
            if ($href.Success) {
              $candidate = [Net.WebUtility]::HtmlDecode($href.Groups['href'].Value)
              $candidateLinks += [pscustomobject]@{ Href = $candidate; Text = $innerText }
              if ($candidate -match '(?i)(\.exe(?:[?#]|$)|download|files?/)') {
                $assetUrl = $candidate
                break
              }
            }
          }

          if (-not $assetUrl) {
            $pageIndex = $html.IndexOf($filename, [StringComparison]::OrdinalIgnoreCase)
            $start = [Math]::Max(0, $pageIndex - 1400)
            $length = [Math]::Min(2800, $html.Length - $start)
            $context = if ($pageIndex -ge 0) { $html.Substring($start, $length) } else { $html.Substring(0, [Math]::Min(5000,$html.Length)) }
            Write-Host "FileFerret page anchor candidates: $($candidateLinks | ConvertTo-Json -Compress -Depth 4)"
            Write-Host "FileFerret HTML context near download filename: $context"
            throw "Could not resolve a direct portable download link for $filename from an official download anchor."
          }
          if (-not ([uri]::IsWellFormedUriString($assetUrl, [UriKind]::Absolute))) {
            $assetUrl = [uri]::new([uri]$pageUrl, $assetUrl).AbsoluteUri
          }
          $assetUri = [uri]$assetUrl
          if ($assetUri.Scheme -ne 'https') { throw "FileFerret asset URL is not HTTPS: $assetUrl" }

          $downloadDir = Join-Path $env:RUNNER_TEMP 'fileferret'
          New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
          $asset = Join-Path $downloadDir $filename
          Write-Host "FileFerret anchor URL: $assetUrl"
          $downloadResponse = Invoke-WebRequest -Uri $assetUrl -OutFile $asset -UseBasicParsing -MaximumRedirection 10 -TimeoutSec 1200
          $finalUrl = $downloadResponse.BaseResponse.ResponseUri.AbsoluteUri
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          $item = Get-Item -LiteralPath $asset
          $size = $item.Length
          $signature = Get-AuthenticodeSignature -FilePath $asset
          $versionInfo = [Diagnostics.FileVersionInfo]::GetVersionInfo($asset)
          Write-Host "FileFerret final URL: $finalUrl"
          Write-Host "FileFerret SHA-256: $hash"
          Write-Host "FileFerret size: $size bytes"
          Write-Host "FileFerret file description: $($versionInfo.FileDescription)"
          Write-Host "FileFerret product name: $($versionInfo.ProductName)"
          Write-Host "FileFerret file version: $($versionInfo.FileVersion)"
          Write-Host "FileFerret Authenticode: $($signature.Status)"

          if ($size -lt 100KB -or $size -gt 20MB) { throw "FileFerret portable payload has an implausible size: $size bytes." }
          $stream = [IO.File]::OpenRead($asset)
          try {
            $header = [byte[]]::new(2)
            if ($stream.Read($header,0,2) -ne 2 -or $header[0] -ne 0x4D -or $header[1] -ne 0x5A) {
              throw 'FileFerret portable download is not a Windows PE executable.'
            }
          }
          finally { $stream.Dispose() }

          $expectedShortHash = '9196b708…05aa61'
          $checksumMatches = ($hash.Substring(0,8) -eq $expectedShortHash.Substring(0,8) -and $hash.Substring($hash.Length - 6) -eq '05aa61')
          "FileFerret version: $version" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "FileFerret anchor URL: $assetUrl" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "FileFerret final URL: $finalUrl" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "FileFerret calculated SHA-256: $hash" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "FileFerret publisher abbreviated checksum match: $checksumMatches" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "FileFerret portable size: $size bytes" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "FileFerret Authenticode: $($signature.Status)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "FILEFERRET_URL=$assetUrl" >> $env:GITHUB_ENV
          "FILEFERRET_VERSION=$version" >> $env:GITHUB_ENV
          "FILEFERRET_SHA256=$hash" >> $env:GITHUB_ENV
          "FILEFERRET_VERSION=$version" >> $env:GITHUB_ENV
          "FILEFERRET_SHA256=$hash" >> $env:GITHUB_ENV

      - name: Install 7-Zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install 7zip.install --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw '7-Zip installation failed.' }
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
            throw "7-Zip executable not found: $sevenZip"
          }
          "SEVENZIP=$sevenZip" >> $env:GITHUB_ENV

      - name: Verify Legacy Router Opener standalone executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/Alaa7Hany/legacy-router-opener/releases/download/v1.2.0/legacy-router-opener.exe'
          $expected = 'adc4785d9bfb16d0351693157ce01eb2adbfd2d930edb86af17b629088087a0d'
          $file = Join-Path $env:RUNNER_TEMP 'legacy-router-opener.exe'
          Invoke-WebRequest -Uri $url -OutFile $file -MaximumRedirection 10 -TimeoutSec 1200
          $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Legacy Router Opener SHA-256 mismatch: $actual" }
          $stream = [IO.File]::OpenRead($file)
          try {
            $header = [byte[]]::new(2)
            if ($stream.Read($header,0,2) -ne 2 -or $header[0] -ne 0x4D -or $header[1] -ne 0x5A) {
              throw 'Legacy Router Opener is not a Windows PE executable.'
            }
          }
          finally { $stream.Dispose() }
          "Legacy Router Opener standalone EXE: SHA-256 and PE header verified." | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Test and inspect WinOrbit portable ZIP and GAMING TWEAKS RAR
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $work = Join-Path $env:RUNNER_TEMP 'requested-scoop-inspection'
          $sevenZip = $env:SEVENZIP

          $targets = @(
            @{
              Name = 'WinOrbit'
              Url = 'https://github.com/Mahadi-Siraj/WinOrbit/releases/download/v1.3.2/WinOrbit-Portable-1.3.2-win-x64.zip'
              Sha256 = 'ae2deb436ae62bc7e9746e0c0114e1d0326a23f9420b66a600a51cc059acf1ed'
              Archive = 'WinOrbit-portable.zip'
              ExpectedMain = 'WinOrbit.exe'
            },
            @{
              Name = 'GAMING TWEAKS'
              Url = 'https://github.com/hamsypg/GAMING_TWEAKS/releases/download/beta-0.6.5/GAMING.TWEAKS.by.HAMSYPG.beta.v0.6.5.rar'
              Sha256 = '453117b4a7adc83517ffff7f070d454763426eaa2821658d116f969e68eac0e2'
              Archive = 'GAMING-TWEAKS.rar'
              ExpectedMain = 'Launcher.bat'
            }
          )

          foreach ($target in $targets) {
            $folder = Join-Path $work ($target.Name -replace '\s+', '-')
            $extract = Join-Path $folder 'extracted'
            New-Item -ItemType Directory -Path $folder,$extract -Force | Out-Null
            $archive = Join-Path $folder $target.Archive

            Invoke-WebRequest -Uri $target.Url -OutFile $archive -MaximumRedirection 10 -TimeoutSec 1200
            $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $target.Sha256) {
              throw "$($target.Name) SHA-256 mismatch. Expected $($target.Sha256), received $actual."
            }
            Write-Host "PASS: $($target.Name) SHA-256 $actual"

            & $sevenZip t $archive
            if ($LASTEXITCODE -ne 0) {
              throw "$($target.Name) 7-Zip integrity test failed with exit code $LASTEXITCODE."
            }

            & $sevenZip x -y "-o$extract" $archive
            if ($LASTEXITCODE -gt 1) {
              throw "$($target.Name) 7-Zip extraction failed with exit code $LASTEXITCODE."
            }

            $mainFiles = @(Get-ChildItem -LiteralPath $extract -File -Recurse -Filter $target.ExpectedMain)
            if ($mainFiles.Count -eq 0) {
              throw "$($target.Name): expected entry point $($target.ExpectedMain) was not found after extraction."
            }

            foreach ($main in $mainFiles) {
              $relative = [IO.Path]::GetRelativePath($extract, $main.FullName).Replace('\','/')
              Write-Host "$($target.Name) entry point: $relative"
              if ($target.Name -eq 'GAMING TWEAKS') {
                $resourceScript = Join-Path $main.DirectoryName 'Resources\GamingTweaks.ps1'
                if (-not (Test-Path -LiteralPath $resourceScript -PathType Leaf)) {
                  throw "GAMING TWEAKS: Resources/GamingTweaks.ps1 is missing beside $relative."
                }
                Write-Host "PASS: GAMING TWEAKS resource script found at $resourceScript"
              }
            }

            Get-ChildItem -LiteralPath $extract -Force |
              ForEach-Object {
                if ($_.PSIsContainer) { Write-Host "  [DIR]  $($_.Name)" }
                else { Write-Host "  [FILE] $($_.Name) ($($_.Length) bytes)" }
              }

            @(
              "$($target.Name): SHA-256 verified"
              "$($target.Name): archive integrity test passed"
              "$($target.Name): extracted $($mainFiles.Count) matching entry point(s)"
              "$($target.Name): entry point(s): $((@($mainFiles | ForEach-Object { [IO.Path]::GetRelativePath($extract, $_.FullName).Replace('\\','/') })) -join '; ')"
            ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
