name: Inspect Requested Scoop Packages

on:
  push:
    branches:
      - scoop-requested-manifests
    paths:
      - ".github/workflows/inspect-requested-scoop-packages.yml"
      - "bucket/vantage-deizenits.json"
      - "bucket/legacy-router-opener-alaa7hany.json"
      - "bucket/winorbit-mahadi-siraj.json"
      - "bucket/gaming-tweaks-hamsypg.json"
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/inspect-requested-scoop-packages.yml"
      - "bucket/vantage-deizenits.json"
      - "bucket/legacy-router-opener-alaa7hany.json"
      - "bucket/winorbit-mahadi-siraj.json"
      - "bucket/gaming-tweaks-hamsypg.json"

permissions:
  contents: read

jobs:
  inspect:
    name: Verify official assets and package layouts
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install 7-Zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install 7zip.install --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw '7-Zip installation failed.' }
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
            throw "7-Zip executable not found: $sevenZip"
          }
          "SEVENZIP=$sevenZip" >> $env:GITHUB_ENV

      - name: Verify direct executable and inspect VANTAGE package type
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $work = Join-Path $env:RUNNER_TEMP 'requested-scoop-inspection'
          New-Item -ItemType Directory -Path $work -Force | Out-Null

          function Get-VerifiedFile([string]$Name, [string]$Url, [string]$ExpectedHash) {
            $path = Join-Path $work $Name
            Invoke-WebRequest -Uri $Url -OutFile $path -MaximumRedirection 10 -TimeoutSec 1200
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $ExpectedHash) {
              throw "$Name SHA-256 mismatch. Expected $ExpectedHash, received $actual."
            }
            Write-Host "PASS: $Name SHA-256 $actual"
            return $path
          }

          $legacy = Get-VerifiedFile 'legacy-router-opener.exe' 'https://github.com/Alaa7Hany/legacy-router-opener/releases/download/v1.2.0/legacy-router-opener.exe' 'adc4785d9bfb16d0351693157ce01eb2adbfd2d930edb86af17b629088087a0d'

          $legacyStream = [IO.File]::OpenRead($legacy)
          try {
            $peHeader = [byte[]]::new(2)
            if ($legacyStream.Read($peHeader, 0, 2) -ne 2 -or $peHeader[0] -ne 0x4D -or $peHeader[1] -ne 0x5A) {
              throw 'Legacy Router Opener release asset is not a Windows PE executable (missing MZ header).'
            }
          }
          finally { $legacyStream.Dispose() }
          Write-Host 'PASS: Legacy Router Opener is a Windows PE executable.'

          $vantage = Get-VerifiedFile 'VANTAGE.exe' 'https://github.com/DeizenITS/VANTAGE/releases/download/v0.12.0-beta/VANTAGE.exe' 'd8de0ed4f5557032b0067f93b3fa41859189b0005cbb4872a3f595f0230a5506'

          $bytes = [IO.File]::ReadAllBytes($vantage)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw 'VANTAGE.exe is not a Windows PE executable (missing MZ header).'
          }

          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          $unicode = [Text.Encoding]::Unicode.GetString($bytes)
          $combined = $ascii + "`n" + $unicode
          $installerPatterns = @(
            'Inno Setup',
            'Nullsoft Install System',
            'NSIS',
            'Squirrel.Windows',
            'WiX Toolset',
            'Burn Bootstrapper',
            'InstallShield',
            'Advanced Installer',
            'Setup Factory'
          )
          $markers = @($installerPatterns | Where-Object { $combined.IndexOf($_, [StringComparison]::OrdinalIgnoreCase) -ge 0 })
          $signature = Get-AuthenticodeSignature -FilePath $vantage
          Write-Host "VANTAGE Authenticode status: $($signature.Status)"
          Write-Host "VANTAGE file version: $((Get-Item -LiteralPath $vantage).VersionInfo.FileVersion)"

          $listing = & $env:SEVENZIP l -slt $vantage 2>&1
          $listExit = $LASTEXITCODE
          $listing | Set-Content -LiteralPath (Join-Path $work 'vantage-7zip-listing.txt')
          if ($listExit -eq 0) {
            Write-Host 'VANTAGE package inspection: 7-Zip recognizes an embedded archive/container.'
            $extract = Join-Path $work 'vantage-extracted'
            New-Item -ItemType Directory -Path $extract -Force | Out-Null
            & $env:SEVENZIP x -y "-o$extract" $vantage
            if ($LASTEXITCODE -gt 1) { throw '7-Zip recognized VANTAGE as an archive but extraction failed.' }
            $found = @(Get-ChildItem -LiteralPath $extract -File -Recurse -Filter 'VANTAGE.exe')
            if ($found.Count -eq 0) {
              throw 'VANTAGE is an embedded archive, but no extracted VANTAGE.exe was found; do not publish a direct portable manifest.'
            }
            $found | ForEach-Object { Write-Host "Embedded VANTAGE.exe: $($_.FullName)" }
            throw 'VANTAGE is an embedded archive/container. Determine its extracted layout before using a Scoop manifest.'
          }

          if ($markers.Count -gt 0) {
            throw "VANTAGE has installer-framework markers: $($markers -join ', '). Do not treat it as a portable executable."
          }

          Write-Host 'STATIC RESULT: VANTAGE is a PE executable; 7-Zip did not recognize it as an archive and no known installer-framework markers were found.'
          Write-Host 'This is static inspection only; it does not claim that the application has no first-run system side effects.'
          @(
            'VANTAGE SHA-256: verified'
            'PE header: valid'
            '7-Zip archive recognition: no'
            "Known installer markers: $($markers -join ', ')"
            "Authenticode: $($signature.Status)"
            'Classification: direct executable candidate; static scan only'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Test and inspect WinOrbit portable ZIP and GAMING TWEAKS RAR
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $work = Join-Path $env:RUNNER_TEMP 'requested-scoop-inspection'
          $sevenZip = $env:SEVENZIP

          $targets = @(
            @{
              Name = 'WinOrbit'
              Url = 'https://github.com/Mahadi-Siraj/WinOrbit/releases/download/v1.3.2/WinOrbit-Portable-1.3.2-win-x64.zip'
              Sha256 = 'ae2deb436ae62bc7e9746e0c0114e1d0326a23f9420b66a600a51cc059acf1ed'
              Archive = 'WinOrbit-portable.zip'
              ExpectedMain = 'WinOrbit.exe'
            },
            @{
              Name = 'GAMING TWEAKS'
              Url = 'https://github.com/hamsypg/GAMING_TWEAKS/releases/download/beta-0.6.5/GAMING.TWEAKS.by.HAMSYPG.beta.v0.6.5.rar'
              Sha256 = '453117b4a7adc83517ffff7f070d454763426eaa2821658d116f969e68eac0e2'
              Archive = 'GAMING-TWEAKS.rar'
              ExpectedMain = 'Launcher.bat'
            }
          )

          foreach ($target in $targets) {
            $folder = Join-Path $work ($target.Name -replace '\\s+', '-')
            $extract = Join-Path $folder 'extracted'
            New-Item -ItemType Directory -Path $folder,$extract -Force | Out-Null
            $archive = Join-Path $folder $target.Archive

            Invoke-WebRequest -Uri $target.Url -OutFile $archive -MaximumRedirection 10 -TimeoutSec 1200
            $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $target.Sha256) {
              throw "$($target.Name) SHA-256 mismatch. Expected $($target.Sha256), received $actual."
            }
            Write-Host "PASS: $($target.Name) SHA-256 $actual"

            & $sevenZip t $archive
            if ($LASTEXITCODE -ne 0) {
              throw "$($target.Name) 7-Zip integrity test failed with exit code $LASTEXITCODE."
            }

            & $sevenZip x -y "-o$extract" $archive
            if ($LASTEXITCODE -gt 1) {
              throw "$($target.Name) 7-Zip extraction failed with exit code $LASTEXITCODE."
            }

            $mainFiles = @(Get-ChildItem -LiteralPath $extract -File -Recurse -Filter $target.ExpectedMain)
            if ($mainFiles.Count -eq 0) {
              throw "$($target.Name): expected entry point $($target.ExpectedMain) was not found after extraction."
            }

            foreach ($main in $mainFiles) {
              $relative = [IO.Path]::GetRelativePath($extract, $main.FullName).Replace('\','/')
              Write-Host "$($target.Name) entry point: $relative"
              if ($target.Name -eq 'GAMING TWEAKS') {
                $resourceScript = Join-Path $main.DirectoryName 'Resources\GamingTweaks.ps1'
                if (-not (Test-Path -LiteralPath $resourceScript -PathType Leaf)) {
                  throw "GAMING TWEAKS: Resources/GamingTweaks.ps1 is missing beside $relative."
                }
                Write-Host "PASS: GAMING TWEAKS resource script found at $resourceScript"
              }
            }

            Get-ChildItem -LiteralPath $extract -Force |
              ForEach-Object {
                if ($_.PSIsContainer) { Write-Host "  [DIR]  $($_.Name)" }
                else { Write-Host "  [FILE] $($_.Name) ($($_.Length) bytes)" }
              }

            @(
              "$($target.Name): SHA-256 verified"
              "$($target.Name): archive integrity test passed"
              "$($target.Name): extracted $($mainFiles.Count) matching entry point(s)"
              "$($target.Name): entry point(s): $((@($mainFiles | ForEach-Object { [IO.Path]::GetRelativePath($extract, $_.FullName).Replace('\','/') })) -join '; ')"
            ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
