name: ArboraFM License Page Inspection

on:
  push:
    branches:
      - inspect-arborafm-portable-0.9.0
    paths:
      - ".github/workflows/arbora-license-inspection.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - name: Read official ArboraFM license page
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://arborafm.dev/license'
          $response = Invoke-WebRequest -Uri $url -MaximumRedirection 10 -TimeoutSec 90
          Write-Host "FINAL_URL=$($response.BaseResponse.ResponseUri.AbsoluteUri)"
          Write-Host "STATUS=$([int]$response.StatusCode)"
          Write-Host '=== LICENSE PAGE TEXT ==='
          $html = [string]$response.Content
          $text = [System.Net.WebUtility]::HtmlDecode(($html -replace '<script(?s:.*?)</script>',' ' -replace '<style(?s:.*?)</style>',' ' -replace '<[^>]+>',' ' -replace '\s+',' '))
          Write-Host $text
          Write-Host '=== LICENSE REFERENCES ==='
          foreach ($match in [regex]::Matches($html, '(?i).{0,120}(MIT|Apache|GPL|BSD|ISC|MPL|AGPL|proprietary|copyright|all rights reserved|license).{0,180}') | Select-Object -First 40) {
            Write-Host $match.Value
          }
