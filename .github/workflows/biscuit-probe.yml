name: Temporary Biscuit Installer Probe

on:
  push:
    branches:
      - add-biscuit

permissions:
  contents: read

jobs:
  installer-probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download, verify, install, and uninstall Biscuit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '2.2.1'
          $url = "https://github.com/agata/dl.biscuit/releases/download/$version/Biscuit-$version-setup.exe"
          $expectedHash = '9b8a54a946a84d8fe7894432a53570435612199ccf839d6a3b771ff3210fbac3'
          $stage = Join-Path $env:RUNNER_TEMP "biscuit-probe-$([guid]::NewGuid().ToString('N'))"
          $installDir = Join-Path $stage 'install'
          $installer = Join-Path $stage "Biscuit-$version-setup.exe"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          try {
            Invoke-WebRequest -Uri $url -OutFile $installer
            $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $expectedHash) {
              throw "SHA-256 mismatch. Expected $expectedHash; received $actualHash."
            }
            $signature = Get-AuthenticodeSignature -FilePath $installer
            Write-Output "Installer signature status: $($signature.Status)"
            if ($signature.Status -ne 'Valid') {
              throw "Installer Authenticode signature is not valid: $($signature.Status)"
            }
            Write-Output "Installer signer: $($signature.SignerCertificate.Subject)"
            $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "Silent installation failed with exit code $($process.ExitCode)."
            }
            $mainExe = Join-Path $installDir 'Biscuit.exe'
            if (-not (Test-Path -LiteralPath $mainExe -PathType Leaf)) {
              Get-ChildItem -LiteralPath $stage -Force -Recurse | Select-Object -ExpandProperty FullName | Write-Output
              throw "The installer did not create Biscuit.exe at the supplied /D installation path: $installDir"
            }
            $uninstaller = Join-Path $installDir 'Uninstall Biscuit.exe'
            if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
              $candidate = Get-ChildItem -LiteralPath $installDir -Filter '*uninstall*.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($candidate) { $uninstaller = $candidate.FullName }
            }
            if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
              throw "No uninstaller executable was found under the custom installation path."
            }
            Write-Output "Main executable: $mainExe"
            Write-Output "Uninstaller: $uninstaller"
            $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) {
              throw "Silent uninstall failed with exit code $($uninstall.ExitCode)."
            }
            if (Test-Path -LiteralPath $mainExe) {
              throw "Biscuit.exe remains after the uninstaller exited."
            }
            Write-Output 'Biscuit install and uninstall smoke test passed.'
          }
          finally {
            if (Test-Path -LiteralPath $stage) {
              Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
