name: WatchFS Scoop Install Test

on:
  pull_request:
    paths:
      - "bucket/watchfs.json"
      - ".github/workflows/watchfs-scoop-install-test.yml"
  push:
    branches:
      - master
    paths:
      - "bucket/watchfs.json"
      - ".github/workflows/watchfs-scoop-install-test.yml"

permissions:
  contents: read

jobs:
  inspect-and-test:
    name: Inspect source archive and test Windows package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and inspect the exact upstream beta tag
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $version = "0.2.0-beta.4"
          $url = "https://github.com/berki6/WatchFS/archive/refs/tags/v$version.zip"
          $work = Join-Path $env:GITHUB_WORKSPACE "watchfs-test"
          $archive = Join-Path $work "watchfs-source.zip"
          $source = Join-Path $work "WatchFS-$version"
          $packages = Join-Path $work "site-packages"
          $data = Join-Path $work "data"

          New-Item -ItemType Directory -Path $work, $packages, $data -Force | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRedirection 10 -TimeoutSec 600

          $item = Get-Item -LiteralPath $archive
          if ($item.Length -lt 100KB -or $item.Length -gt 100MB) {
            throw "The WatchFS source archive has an unexpected size: $($item.Length) bytes."
          }

          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "WATCHFS_ARCHIVE_SHA256=$hash"
          Write-Host "WATCHFS_ARCHIVE_SIZE=$($item.Length)"
          @(
            "## WatchFS source archive"
            ""
            "- Version: v$version"
            "- URL: $url"
            "- Size: $($item.Length) bytes"
            "- SHA-256: $hash"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

          Expand-Archive -LiteralPath $archive -DestinationPath $work -Force
          if (-not (Test-Path -LiteralPath (Join-Path $source "pyproject.toml"))) {
            throw "Expected source directory was not found: $source"
          }

          python -m pip install --disable-pip-version-check --upgrade pip
          $project = "$($source)[pywintrace,pyetwkit]"
          python -m pip install --disable-pip-version-check --no-warn-script-location --target $packages $project
          if ($LASTEXITCODE -ne 0) {
            throw "Installing WatchFS and its ETW dependencies into the Scoop app directory failed."
          }

          $env:PYTHONPATH = $packages
          $env:WATCHFS_DATA = $data
          Push-Location $data
          try {
            python -m watchfs.cli.main --help
            if ($LASTEXITCODE -ne 0) { throw "WatchFS CLI help check failed." }

            python -m watchfs.cli.main doctor
            if ($LASTEXITCODE -ne 0) { throw "WatchFS doctor smoke test failed." }

            if (-not (Test-Path -LiteralPath (Join-Path $data "watchfs.db"))) {
              throw "WatchFS doctor did not create its database inside the test data directory."
            }
          } finally {
            Pop-Location
          }

          Write-Host "WatchFS source package, ETW dependencies, CLI, and local data path passed."
