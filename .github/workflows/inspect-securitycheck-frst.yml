name: Requested SecurityCheck and FRST Source Inspection

on:
  push:
    branches:
      - "manifest-inspection/**"
    paths:
      - ".github/workflows/inspect-securitycheck-frst.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download and inspect SecurityCheck ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $zip = Join-Path $env:RUNNER_TEMP 'SecurityCheck.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'SecurityCheck-extracted'
          Invoke-WebRequest -Uri 'https://tools.safezone.cc/glax24/SecurityCheck/SecurityCheck.zip' -OutFile $zip
          $item = Get-Item -LiteralPath $zip
          Write-Host "SECURITYCHECK_ZIP_SIZE=$($item.Length)"
          Write-Host "SECURITYCHECK_ZIP_SHA256=$((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant())"
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $files = @(Get-ChildItem -LiteralPath $extract -File -Recurse | Sort-Object FullName)
          if ($files.Count -eq 0) { throw 'SecurityCheck ZIP contains no files.' }
          foreach ($file in $files) {
            $relative = $file.FullName.Substring($extract.Length).TrimStart('\')
            Write-Host "SECURITYCHECK_FILE=$relative|$($file.Length)"
            if ($file.Extension -ieq '.exe') {
              $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
              Write-Host "SECURITYCHECK_EXE=$relative|FileVersion=$($file.VersionInfo.FileVersion)|ProductVersion=$($file.VersionInfo.ProductVersion)|Signature=$($signature.Status)|Signer=$($signature.SignerCertificate.Subject)"
            }
          }
          if (-not (Get-ChildItem -LiteralPath $extract -Filter 'SecurityCheck.exe' -File -Recurse)) {
            throw 'SecurityCheck.exe was not found in the extracted archive.'
          }

      - name: Resolve current official FRST download endpoints and inspect both files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $downloads = @(
            @{ Name = 'FRST.exe'; Page = 'https://www.bleepingcomputer.com/download/farbar-recovery-scan-tool/dl/81/' },
            @{ Name = 'FRST64.exe'; Page = 'https://www.bleepingcomputer.com/download/farbar-recovery-scan-tool/dl/82/' }
          )
          foreach ($download in $downloads) {
            $page = Invoke-WebRequest -Uri $download.Page -MaximumRedirection 0 -SkipHttpErrorCheck
            Write-Host "FRST_ENDPOINT=$($download.Name)|Status=$([int]$page.StatusCode)|Location=$($page.Headers.Location)"
            $direct = [string]$page.Headers.Location
            if ([string]::IsNullOrWhiteSpace($direct)) {
              $match = [regex]::Match($page.Content, 'https?://download\.bleepingcomputer\.com/dl/[^"''\s<>]+/' + [regex]::Escape($download.Name))
              if ($match.Success) { $direct = $match.Value }
            }
            if ([string]::IsNullOrWhiteSpace($direct)) {
              $sample = ([regex]::Matches($page.Content, 'download\.bleepingcomputer\.com.{0,180}') | Select-Object -First 5 | ForEach-Object Value) -join ' || '
              throw "Could not resolve official direct link for $($download.Name). Page status=$([int]$page.StatusCode); samples=$sample"
            }
            Write-Host "FRST_DIRECT=$($download.Name)|$direct"
            $path = Join-Path $env:RUNNER_TEMP $download.Name
            Invoke-WebRequest -Uri $direct -OutFile $path
            $file = Get-Item -LiteralPath $path
            if ($file.Length -lt 100KB) { throw "$($download.Name) is unexpectedly small: $($file.Length) bytes" }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            Write-Host "FRST_FILE=$($download.Name)|Size=$($file.Length)|SHA256=$hash|FileVersion=$($file.VersionInfo.FileVersion)|ProductVersion=$($file.VersionInfo.ProductVersion)|Signature=$($signature.Status)|Signer=$($signature.SignerCertificate.Subject)"
            $stream = [System.IO.File]::OpenRead($path)
            $reader = $null
            try {
              $reader = [System.IO.BinaryReader]::new($stream)
              $mz = [System.Text.Encoding]::ASCII.GetString($reader.ReadBytes(2))
              if ($mz -ne 'MZ') { throw "$($download.Name) is not a PE executable." }
            } finally {
              if ($reader) { $reader.Dispose() } else { $stream.Dispose() }
            }
          }
