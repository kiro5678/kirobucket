name: 1by1 Scoop Lifecycle Test

on:
  push:
    branches:
      - master
    paths:
      - "bucket/1by1-martin-pesch.json"
      - ".github/workflows/1by1-scoop-validation.yml"
  pull_request:
    branches:
      - master
    paths:
      - "bucket/1by1-martin-pesch.json"
      - ".github/workflows/1by1-scoop-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Scoop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $env:SCOOP = Join-Path $env:RUNNER_TEMP 'scoop-1by1-lifecycle'
          "SCOOP=$env:SCOOP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $env:SCOOP 'shims') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri 'https://get.scoop.sh' | Invoke-Expression
          $env:PATH = (Join-Path $env:SCOOP 'shims') + ';' + $env:PATH
          scoop --version

      - name: Check checkver and forced autoupdate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'bucket\1by1-martin-pesch.json'
          $manifestDir = Split-Path -Parent $manifestPath
          $checkver = Join-Path $env:SCOOP 'apps\scoop\current\bin\checkver.ps1'
          if (-not (Test-Path -LiteralPath $checkver -PathType Leaf)) {
            throw "Scoop checkver.ps1 was not found: $checkver"
          }
          & $checkver '1by1-martin-pesch' $manifestDir -ForceUpdate -ThrowError
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.version -ne '2.17') {
            throw "Scoop checkver detected unexpected version: $($manifest.version)"
          }
          if ($manifest.url -ne 'https://codecsdownload.com/download_4c6df74c1b633f5f81f55a19e9c26270/1by1_217.exe#/dl.7z') {
            throw "Forced autoupdate produced an unexpected URL: $($manifest.url)"
          }
          if ($manifest.hash -ne 'e6b586242513766fc5d55bcc3fc5cdb2fab0952ea40c3cbdeb5f62ea58977d91') {
            throw "Forced autoupdate produced an unexpected SHA-256: $($manifest.hash)"
          }
          Write-Host "PASS: Scoop checkver detected $($manifest.version), rebuilt the $($manifest.url) URL, and verified its SHA-256."

      - name: Install manifest with Scoop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'bucket\1by1-martin-pesch.json'
          scoop install $manifestPath
          if ($LASTEXITCODE -ne 0) {
            throw "Scoop install failed with exit code $LASTEXITCODE."
          }

      - name: Verify executable, shim, shortcut, and persisted settings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appDir = Join-Path $env:SCOOP 'apps\1by1-martin-pesch\current'
          $exe = Join-Path $appDir '1by1.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Extracted application executable is missing: $exe"
          }

          $shim = Join-Path $env:SCOOP 'shims\1by1.cmd'
          if (-not (Test-Path -LiteralPath $shim -PathType Leaf)) {
            throw "Scoop shim was not created: $shim"
          }

          $shortcutRoot = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          $shortcutFile = Get-ChildItem -LiteralPath $shortcutRoot -Filter '1by1 Martin Pesch.lnk' -File -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($null -eq $shortcutFile) {
            throw 'The 1by1 Martin Pesch Start Menu shortcut was not created.'
          }
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut($shortcutFile.FullName)
          if ($shortcut.TargetPath -ne $exe) {
            throw "Shortcut target mismatch: $($shortcut.TargetPath)"
          }
          if ($shortcut.Arguments -notmatch '/localini') {
            throw "Shortcut does not use /localini: $($shortcut.Arguments)"
          }

          $persistIni = Join-Path $env:SCOOP 'persist\1by1-martin-pesch\1by1.ini'
          $appIni = Join-Path $appDir '1by1.ini'
          if (-not (Test-Path -LiteralPath $persistIni -PathType Leaf)) {
            throw "Persisted 1by1.ini was not created: $persistIni"
          }
          if (-not (Test-Path -LiteralPath $appIni -PathType Leaf)) {
            throw "The app-directory 1by1.ini persistence link is missing: $appIni"
          }

          Set-Content -LiteralPath $appIni -Value '[1by1]' -Encoding Ascii
          if ((Get-Content -LiteralPath $persistIni -Raw) -notmatch '\[1by1\]') {
            throw 'Writing 1by1.ini through the app directory did not reach Scoop persist.'
          }

          @(
            '## 1by1 Scoop lifecycle test'
            ''
            '- Scoop checkver and forced autoupdate passed against the official developer page.'
            '- The generated autoupdate URL and SHA-256 match the verified 2.17 package.'
            '- Scoop extracted 1by1.exe from the SFX ZIP using the #/dl.7z URL fragment.'
            '- The 1by1 shim and Start Menu shortcut were created.'
            '- The shortcut starts 1by1 with /localini.'
            '- 1by1.ini is linked to the Scoop persist directory and writable.'
            '- The application was not launched.'
          ) | Set-Content $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Uninstall and verify persisted settings survive
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Command scoop -ErrorAction SilentlyContinue) {
            scoop uninstall 1by1-martin-pesch
            if ($LASTEXITCODE -ne 0) {
              throw "Scoop uninstall failed with exit code $LASTEXITCODE."
            }
          }
          $appPath = Join-Path $env:SCOOP 'apps\1by1-martin-pesch'
          if (Test-Path -LiteralPath $appPath -PathType Container) {
            scoop uninstall 1by1-martin-pesch
            if ($LASTEXITCODE -ne 0) {
              throw "Scoop uninstall failed with exit code $LASTEXITCODE."
            }
            $persistIni = Join-Path $env:SCOOP 'persist\1by1-martin-pesch\1by1.ini'
            if (-not (Test-Path -LiteralPath $persistIni -PathType Leaf)) {
              throw 'Scoop uninstall removed the persisted 1by1.ini file.'
            }
            if ((Get-Content -LiteralPath $persistIni -Raw) -notmatch '\[1by1\]') {
              throw 'The persisted 1by1.ini marker did not survive uninstall.'
            }
            Write-Host 'PASS: persisted 1by1.ini survived Scoop uninstall.'
          } else {
            Write-Host 'Scoop install did not complete; uninstall persistence check was skipped.'
          }
