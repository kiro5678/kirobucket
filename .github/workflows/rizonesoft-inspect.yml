name: Temporary Rizonesoft Package Inspection

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - add-rizonesoft-manifests
    paths:
      - ".github/workflows/rizonesoft-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - name: Download official assets and inspect package payloads
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Get-ContentType {
            param([string]$Path)
            try {
              $bytes = [System.IO.File]::ReadAllBytes($Path)
              if ($bytes.Length -ge 2 -and $bytes[0] -eq 0x50 -and $bytes[1] -eq 0x4B) { return 'ZIP signature' }
              if ($bytes.Length -ge 2 -and $bytes[0] -eq 0x4D -and $bytes[1] -eq 0x5A) { return 'PE/EXE signature' }
              return 'Unknown signature'
            } catch { return 'Unknown' }
          }
          $items = @(
            @{ Name = 'notepad3-x64'; Url = 'https://github.com/rizonesoft/Notepad3/releases/download/RELEASE_7.26.602.1/Notepad3_7.26.602.1_x64_Portable.zip' },
            @{ Name = 'notepad3-x86'; Url = 'https://github.com/rizonesoft/Notepad3/releases/download/RELEASE_7.26.602.1/Notepad3_7.26.602.1_x86_Portable.zip' },
            @{ Name = 'dvd-drive-repair-portable'; Url = 'https://rizonesoft.com/?download_id=18316&gdm_process_download=1' },
            @{ Name = 'carbon-cd-portable'; Url = 'https://downloads.rizonesoft.com/CarbonCD/CarbonCD108.zip' },
            @{ Name = 'usb-repair-portable'; Url = 'https://rizonesoft.com/?download_id=18319&gdm_process_download=1' },
            @{ Name = 'pixel-repair-portable'; Url = 'https://rizonesoft.com/?download_id=18322&gdm_process_download=1' },
            @{ Name = 'take-ownership'; Url = 'https://rizonesoft.com/?download_id=18314&gdm_process_download=1' },
            @{ Name = 'complete-internet-repair'; Url = 'https://rizonesoft.com/?download_id=18323&gdm_process_download=1' },
            @{ Name = 'bios-beep-codes'; Url = 'https://rizonesoft.com/?download_id=18328&gdm_process_download=1' }
          )
          $pages = @(
            @{ Name = 'dvd-drive-repair'; Url = 'https://rizonesoft.com/gdm_downloads/dvd-drive-repair-portable/'; Regex = '(?is)Version:(?:\s|&nbsp;|<[^>]*>)*\s*(?<version>\d+\.\d+\.\d+\.(?<matchVersion>\d+))' },
            @{ Name = 'carbon-cd'; Url = 'https://rizonesoft.com/gdm_downloads/carbon-cd-portable/'; Regex = '(?is)Version:(?:\s|&nbsp;|<[^>]*>)*\s*(?<version>\d+\.\d+\.\d+)' },
            @{ Name = 'usb-repair'; Url = 'https://rizonesoft.com/gdm_downloads/usb-repair-portable/'; Regex = '(?is)Version:(?:\s|&nbsp;|<[^>]*>)*\s*(?<version>\d+\.\d+\.\d+\.(?<matchVersion>\d+))' },
            @{ Name = 'pixel-repair'; Url = 'https://rizonesoft.com/gdm_downloads/pixel-repair-portable/'; Regex = '(?is)Version:(?:\s|&nbsp;|<[^>]*>)*\s*(?<version>\d+\.\d+\.\d+\.(?<matchVersion>\d+))' },
            @{ Name = 'take-ownership'; Url = 'https://rizonesoft.com/gdm_downloads/take-ownership/'; Regex = '(?is)Version:(?:\s|&nbsp;|<[^>]*>)*\s*(?<version>\d+\.\d+\.\d+\.(?<matchVersion>\d+))' }
          )
          foreach ($page in $pages) {
            try {
              $html = (Invoke-WebRequest -Uri $page.Url -TimeoutSec 60 -Headers @{ 'User-Agent' = 'Mozilla/5.0 ScoopManifestValidation/1.0' }).Content
              $match = [regex]::Match($html, $page.Regex)
              Write-Host "===== CHECKVER $($page.Name) ====="
              Write-Host "MatchedVersion=$($match.Groups['version'].Value)"
              Write-Host "MatchVersion=$($match.Groups['matchVersion'].Value)"
              if (-not $match.Success) { Write-Host "CHECKVER_NO_MATCH=true" }
            } catch {
              Write-Host "CHECKVER_FETCH_FAILED $($page.Name): $($_.Exception.Message)"
            }
          }
          $productPages = @(
            @{ Name = 'firemin'; Url = 'https://rizonesoft.com/gdm_downloads/firemin/'; Regex = '(?is)Version:(?:\s|&nbsp;|<[^>]*>)*\s*(?<version>\d+\.\d+\.\d+\.(?<matchVersion>\d+))' },
            @{ Name = 'watermin'; Url = 'https://rizonesoft.com/gdm_downloads/watermin/'; Regex = '(?is)Version:(?:\s|&nbsp;|<[^>]*>)*\s*(?<version>\d+\.\d+\.\d+\.(?<matchVersion>\d+))' },
            @{ Name = 'chromin'; Url = 'https://rizonesoft.com/gdm_downloads/chromin/'; Regex = '(?is)Version:(?:\s|&nbsp;|<[^>]*>)*\s*(?<version>\d+\.\d+\.\d+\.(?<matchVersion>\d+))' },
            @{ Name = 'edgemin'; Url = 'https://rizonesoft.com/gdm_downloads/edgemin/'; Regex = '(?is)Version:(?:\s|&nbsp;|<[^>]*>)*\s*(?<version>\d+\.\d+\.\d+\.(?<matchVersion>\d+))' },
            @{ Name = 'complete-internet-repair'; Url = 'https://rizonesoft.com/gdm_downloads/complete-internet-repair/'; Regex = '(?is)Version:(?:\s|&nbsp;|<[^>]*>)*\s*(?<version>\d+\.\d+\.\d+\.(?<matchVersion>\d+))' },
            @{ Name = 'bios-beep-codes-viewer'; Url = 'https://rizonesoft.com/gdm_downloads/bios-beep-codes-viewer/'; Regex = '(?is)Version:(?:\s|&nbsp;|<[^>]*>)*\s*(?<version>\d+\.\d+\.\d+\.(?<matchVersion>\d+))' },
            @{ Name = 'rizonesoft-office'; Url = 'https://rizonesoft.com/gdm_downloads/rizonesoft-office/'; Regex = '(?is)Version:(?:\s|&nbsp;|<[^>]*>)*\s*(?<version>\d{4}\.\d+\.\d+\.\d+)' },
            @{ Name = 'resolute'; Url = 'https://rizonesoft.com/gdm_downloads/resolute/'; Regex = '(?is)Version:(?:\s|&nbsp;|<[^>]*>)*\s*(?<version>\d+\.\d+\.\d+\.(?<matchVersion>\d+))' }
          )
          foreach ($page in $productPages) {
            try {
              $html = (Invoke-WebRequest -Uri $page.Url -TimeoutSec 45 -Headers @{ 'User-Agent' = 'Mozilla/5.0 ScoopManifestValidation/1.0' }).Content
              $match = [regex]::Match($html, $page.Regex)
              Write-Host "===== PRODUCT_CHECKVER $($page.Name) ====="
              Write-Host "MatchedVersion=$($match.Groups['version'].Value)"
              Write-Host "MatchVersion=$($match.Groups['matchVersion'].Value)"
              Write-Host "HTMLLength=$($html.Length)"
              if (-not $match.Success) { Write-Host "CHECKVER_NO_MATCH=true"; $pos=$html.IndexOf('Version',[StringComparison]::OrdinalIgnoreCase); if ($pos -ge 0) { Write-Host "HTMLVersionSnippet=$($html.Substring([Math]::Max(0,$pos-100),[Math]::Min(450,$html.Length-[Math]::Max(0,$pos-100))))" } }
            } catch {
              Write-Host "PRODUCT_PAGE_FETCH_FAILED $($page.Name): $($_.Exception.Message)"
            }
          }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\rizone-inspect" | Out-Null
          foreach ($item in $items) {
            $path = Join-Path "$env:RUNNER_TEMP\rizone-inspect" $item.Name
            Write-Host "===== $($item.Name) ====="
            try {
              Invoke-WebRequest -Uri $item.Url -OutFile "$path.download" -MaximumRedirection 10 -TimeoutSec 120 -Headers @{ 'User-Agent' = 'Mozilla/5.0 ScoopManifestValidation/1.0' }
              $file = Get-Item "$path.download"
              $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              $signature = Get-AuthenticodeSignature $file.FullName
              Write-Host "Bytes=$($file.Length)"
              Write-Host "SHA256=$hash"
              Write-Host "ContentType=$(Get-ContentType -Path $file.FullName)"
              $vi = $file.VersionInfo
              Write-Host "FileVersion=$($vi.FileVersion)"
              Write-Host "ProductVersion=$($vi.ProductVersion)"
              Write-Host "ProductName=$($vi.ProductName)"
              Write-Host "FileDescription=$($vi.FileDescription)"
              Write-Host "OriginalFilename=$($vi.OriginalFilename)"
              Write-Host "SignatureStatus=$($signature.Status)"
              Write-Host "SignatureSubject=$($signature.SignerCertificate.Subject)"
              $first = [System.IO.File]::ReadAllBytes($file.FullName)
              $head = [System.Text.Encoding]::ASCII.GetString($first, 0, [Math]::Min(8, $first.Length))
              Write-Host "Header=$head"
              $listing = & 7z.exe l -ba $file.FullName 2>&1
              $listing | Where-Object { $_ -match '\.(exe|dll|ini|cfg|json|reg|chm|dat)$' } | ForEach-Object { Write-Host "PACKAGE_FILE=$_"}
            } catch {
              Write-Host "DOWNLOAD_OR_INSPECTION_FAILED=$($_.Exception.Message)"
            }
          }
