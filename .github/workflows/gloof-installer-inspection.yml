name: Gloof Payload Extraction Inspection

on:
  push:
    branches:
      - master
    paths:
      - "bucket/gloof.json"
      - ".github/workflows/gloof-installer-inspection.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
    paths:
      - "bucket/gloof.json"
      - ".github/workflows/gloof-installer-inspection.yml"

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect official Gloof Velopack payload for Scoop
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download and verify Scoop-style payload extraction without running Setup.exe
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA256: ""
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $root = Join-Path $env:RUNNER_TEMP 'gloof-installer-inspection'
          $downloadDir = Join-Path $root 'download'
          $outerDir = Join-Path $root 'outer-extracted'
          $payloadDir = Join-Path $root 'application-payload'
          New-Item -ItemType Directory -Path $downloadDir, $outerDir, $payloadDir -Force | Out-Null

          $url = 'https://gloof.app/downloads/gloof-beta-Setup.exe'
          $expectedHash = $env:EXPECTED_SHA256.Trim()
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'bucket/gloof.json'

          $pageUrl = 'https://gloof.app/download/'
          $pageHtml = (Invoke-WebRequest -Uri $pageUrl -TimeoutSec 300 -MaximumRedirection 10).Content
          $pageVersionHits = @([regex]::Matches($pageHtml, '(?<![\\w])v?\\d+\\.\\d+\\.\\d+(?:[-+][\\w.-]+)?(?![\\w])') | ForEach-Object { $_.Value } | Select-Object -Unique)
          $pageLinks = @([regex]::Matches($pageHtml, '(?i)href=["'']([^"'']+)["'']') | ForEach-Object { $_.Groups[1].Value } | Where-Object { $_ -match '(?i)(\\.zip|portable|setup\\.exe)' } | Select-Object -Unique)
          Write-Host "Download page version strings: $($pageVersionHits -join ', ')"
          Write-Host "Download page installer/portable links:"
          foreach ($link in $pageLinks) { Write-Host "  $link" }
          $pageHtml | Set-Content -LiteralPath (Join-Path $root 'download-page.html') -Encoding utf8
          $feedResults = [System.Collections.Generic.List[string]]::new()
          foreach ($feedName in @('releases.beta.json', 'assets.beta.json', 'RELEASES')) {
            $feedUrl = "https://gloof.app/downloads/$feedName"
            try {
              $response = Invoke-WebRequest -Uri $feedUrl -TimeoutSec 60 -MaximumRedirection 10
              $feedResults.Add("$feedName : HTTP $([int]$response.StatusCode)")
              $feedResults.Add($response.Content)
              Write-Host "$feedName : HTTP $([int]$response.StatusCode)"
              if ($feedName -like '*.json') {
                try {
                  $feedJson = $response.Content | ConvertFrom-Json -ErrorAction Stop
                  if ($feedJson.Assets) {
                    foreach ($asset in $feedJson.Assets) {
                      Write-Host ("FEED ASSET {0} | {1} | {2}" -f $asset.Version, $asset.Type, $asset.FileName)
                    }
                  }
                } catch { Write-Host "$feedName returned non-JSON content." }
              } else {
                Write-Host ($response.Content.Substring(0, [Math]::Min(1000, $response.Content.Length)))
              }
            } catch {
              $status = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { 'network-error' }
              $feedResults.Add("$feedName : $status - $($_.Exception.Message)")
              Write-Host "$feedName : $status - $($_.Exception.Message)"
            }
          }
          $feedResults | Set-Content -LiteralPath (Join-Path $root 'release-feed-inspection.txt') -Encoding utf8

          if ($env:EVENT_NAME -in @('push', 'pull_request') -and (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json -ErrorAction Stop
            $source = if ($manifest.architecture.'64bit'.url) { $manifest.architecture.'64bit' } else { $manifest }
            if (-not [string]::IsNullOrWhiteSpace([string]$source.url)) {
              $url = [string]$source.url
              $expectedHash = [string]$source.hash
            }
          }

          $uri = [System.Uri]$url
          if (-not $uri.IsAbsoluteUri -or $uri.Scheme -ne 'https' -or $uri.Host -ne 'gloof.app') {
            throw "Refusing a non-official Gloof installer URL: $url"
          }

          # Scoop archive markers are fragments and are not sent to the web server.
          $downloadUrl = $url -replace '#/dl\.7z$', ''
          $fileName = [System.IO.Path]::GetFileName(([System.Uri]$downloadUrl).AbsolutePath)
          if ([string]::IsNullOrWhiteSpace($fileName)) { $fileName = 'gloof-beta-Setup.exe' }
          $installer = Join-Path $downloadDir $fileName

          Write-Host "Official source: $downloadUrl"
          Invoke-WebRequest -Uri $downloadUrl -OutFile $installer -MaximumRedirection 10 -TimeoutSec 900
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw 'The official Gloof installer download did not create a file.'
          }

          $file = Get-Item -LiteralPath $installer
          $sha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          $versionInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($installer)

          Write-Host "Download size: $($file.Length) bytes"
          Write-Host "SHA-256: $sha256"
          Write-Host "Authenticode status: $($signature.Status)"
          if ($signature.SignerCertificate) {
            Write-Host "Signer: $($signature.SignerCertificate.Subject)"
            Write-Host "Signer thumbprint: $($signature.SignerCertificate.Thumbprint)"
          }
          Write-Host "File version: $($versionInfo.FileVersion)"
          Write-Host "Product version: $($versionInfo.ProductVersion)"
          Write-Host "Product name: $($versionInfo.ProductName)"
          Write-Host "File description: $($versionInfo.FileDescription)"

          if ($expectedHash) {
            if ($expectedHash -notmatch '^[0-9a-fA-F]{64}$') {
              throw 'The manifest SHA-256 value is not a 64-character hexadecimal digest.'
            }
            if ($sha256 -ne $expectedHash.ToLowerInvariant()) {
              throw "SHA-256 mismatch. Manifest: $expectedHash; downloaded: $sha256"
            }
            Write-Host 'Manifest SHA-256 verification: PASS'
          }

          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
            $command = Get-Command '7z.exe' -ErrorAction SilentlyContinue
            if ($command) {
              $sevenZip = $command.Source
            } else {
              choco install 7zip -y --no-progress
              if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
                throw '7-Zip is unavailable after installation.'
              }
            }
          }

          $listingPath = Join-Path $root 'installer-listing.txt'
          $listing = @(& $sevenZip l -slt $installer 2>&1)
          $listExit = $LASTEXITCODE
          $listingText = $listing -join [Environment]::NewLine
          $listingText | Set-Content -LiteralPath $listingPath -Encoding utf8
          if ($listExit -ne 0) {
            throw "7-Zip could not identify/list the installer (exit code $listExit). See installer-listing.txt."
          }

          $installerType = 'Unknown PE installer/archive'
          if ($listingText -match '(?im)^Type = Inno Setup\s*$') {
            $installerType = 'Inno Setup'
          } elseif ($listingText -match '(?im)^Type = NSIS\s*$') {
            $installerType = 'NSIS'
          } elseif ($listingText -match '(?im)^Type = MSI\s*$') {
            $installerType = 'MSI'
          } elseif ($listingText -match '(?im)^Type = 7z\s*$') {
            $installerType = '7-Zip archive'
          } elseif ($listingText -match '(?im)^Type = PE\s*$') {
            $installerType = 'PE executable (installer type not identified by 7-Zip)'
          }
          Write-Host "Detected installer type: $installerType"

          $extractLog = Join-Path $root 'outer-extraction.log'
          $extractOutput = @(& $sevenZip x -y "-o$outerDir" $installer 2>&1)
          $extractExit = $LASTEXITCODE
          ($extractOutput -join [Environment]::NewLine) | Set-Content -LiteralPath $extractLog -Encoding utf8
          if ($extractExit -ne 0) {
            throw "7-Zip extraction failed (exit code $extractExit). See outer-extraction.log."
          }

          $outerFiles = @(Get-ChildItem -LiteralPath $outerDir -File -Recurse -Force)
          Write-Host "Outer extracted files: $($outerFiles.Count)"

          $nuspecPath = Join-Path $outerDir 'gloof.nuspec'
          if (-not (Test-Path -LiteralPath $nuspecPath -PathType Leaf)) {
            throw 'The extracted Velopack package does not contain gloof.nuspec.'
          }
          [xml]$nuspec = Get-Content -LiteralPath $nuspecPath -Raw
          $packageVersion = [string]$nuspec.package.metadata.version
          $mainExe = [string]$nuspec.package.metadata.mainExe
          $channel = [string]$nuspec.package.metadata.channel
          if ([string]::IsNullOrWhiteSpace($packageVersion) -or [string]::IsNullOrWhiteSpace($mainExe)) {
            throw 'Velopack metadata is missing version or mainExe.'
          }
          if ($listingText -match '(?i)Generated by Velopack' -or $installerType -eq 'PE executable (installer type not identified by 7-Zip)') {
            $installerType = 'Velopack Setup.exe (PE with embedded NuGet/ZIP package)'
          }
          Write-Host "Velopack package version: $packageVersion"
          Write-Host "Velopack channel: $channel"
          Write-Host "Velopack main executable: $mainExe"
          Write-Host "Portable marker in Setup payload: $([bool](Get-ChildItem -LiteralPath $outerDir -Force -File | Where-Object { $_.Name -eq '.portable' }))"

          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'bucket/gloof.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json -ErrorAction Stop
          $extractDir = [string]$manifest.extract_dir
          $binTarget = [string]$manifest.bin
          $shortcutTarget = [string]$manifest.shortcuts[0][0]

          if ($url -ne 'https://gloof.app/downloads/gloof-beta-Setup.exe#/dl.7z') {
            throw "Manifest URL must use the verified Scoop 7-Zip extraction marker: $url"
          }
          if ($extractDir -ne 'lib\app') { throw "Unexpected extract_dir: $extractDir" }
          if ($binTarget -ne 'gloof-core.exe') { throw "Unexpected bin target: $binTarget" }
          if ($shortcutTarget -ne $binTarget) { throw 'The Start Menu shortcut must target the package main executable.' }

          if ($packageVersion -ne [string]$manifest.version) {
            throw "Velopack package version $packageVersion does not match manifest version $($manifest.version)."
          }
          if ($mainExe -ne $binTarget) {
            throw "Manifest bin target $binTarget does not match Velopack mainExe $mainExe."
          }

          # Validate the payload path from a full static extraction first.
          $payloadMainExe = Join-Path (Join-Path $outerDir $extractDir) $binTarget
          if (-not (Test-Path -LiteralPath $payloadMainExe -PathType Leaf)) {
            throw "The declared application executable is missing from the Setup payload: $payloadMainExe"
          }

          # Reproduce Scoop's Expand-7zipArchive arguments, including extract_dir filtering.
          $scoopProbeDir = Join-Path $root 'Scoop App With Spaces/Gloof 0.1.0-beta.10'
          New-Item -ItemType Directory -Path $scoopProbeDir -Force | Out-Null
          $includePattern = "-ir!$extractDir\*"
          $scoopExtractionOutput = @(& $sevenZip x $installer "-o$scoopProbeDir" '-xr!*.nsis' '-y' $includePattern 2>&1)
          $scoopExtractionExit = $LASTEXITCODE
          ($scoopExtractionOutput -join [Environment]::NewLine) | Set-Content -LiteralPath (Join-Path $root 'scoop-style-extraction.log') -Encoding utf8
          if ($scoopExtractionExit -ne 0) {
            throw "Scoop-style 7-Zip extraction failed with exit code $scoopExtractionExit."
          }

          $scoopPayloadDir = Join-Path $scoopProbeDir $extractDir
          if (-not (Test-Path -LiteralPath $scoopPayloadDir -PathType Container)) {
            throw "Scoop's extract_dir filter did not create the expected directory: $scoopPayloadDir"
          }
          $scoopPayloadExe = Join-Path $scoopPayloadDir $binTarget
          if (-not (Test-Path -LiteralPath $scoopPayloadExe -PathType Leaf)) {
            throw "Scoop's filtered extraction did not produce the declared executable: $scoopPayloadExe"
          }

          # Match Scoop's movedir behavior: move lib/app contents to the version directory.
          $payloadItems = @(Get-ChildItem -LiteralPath $scoopPayloadDir -Force)
          if ($payloadItems.Count -eq 0) { throw 'Scoop extract_dir produced an empty application directory.' }
          foreach ($payloadItem in $payloadItems) {
            Move-Item -LiteralPath $payloadItem.FullName -Destination $scoopProbeDir -Force
          }
          $libRoot = Join-Path $scoopProbeDir 'lib'
          if (Test-Path -LiteralPath $libRoot -PathType Container) {
            Remove-Item -LiteralPath $libRoot -Recurse -Force
          }

          $installedMainExe = Join-Path $scoopProbeDir $binTarget
          if (-not (Test-Path -LiteralPath $installedMainExe -PathType Leaf)) {
            throw "The declared bin target was not present at the Scoop app root after extract_dir handling: $installedMainExe"
          }

          $requiredExecutables = @(
            'gloof-core.exe',
            'gloof-gpui-host.exe',
            'gloof-jumplist.exe',
            'gloof-rescue.exe',
            'gloof-settings.exe'
          )
          foreach ($requiredExecutable in $requiredExecutables) {
            $requiredPath = Join-Path $scoopProbeDir $requiredExecutable
            if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
              throw "Required Gloof application executable was not extracted into the Scoop version directory: $requiredExecutable"
            }
          }

          function Get-Inventory {
            param([string]$Directory)
            $files = @(Get-ChildItem -LiteralPath $Directory -File -Recurse -Force)
            foreach ($item in $files) {
              $relative = [System.IO.Path]::GetRelativePath($Directory, $item.FullName).Replace('\', '/')
              $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($item.FullName)
              [PSCustomObject]@{
                Path = $relative
                Bytes = $item.Length
                Product = $info.ProductName
                Description = $info.FileDescription
                FileVersion = $info.FileVersion
                ProductVersion = $info.ProductVersion
              }
            }
          }

          $inventory = @(Get-Inventory -Directory $scoopProbeDir)
          $inventoryPath = Join-Path $root 'scoop-extracted-application-inventory.csv'
          $inventory | Export-Csv -NoTypeInformation -Encoding UTF8 -Path $inventoryPath
          $exeRows = @($inventory | Where-Object { [System.IO.Path]::GetExtension($_.Path) -ieq '.exe' })

          Write-Host "Scoop-style extraction path: $scoopProbeDir"
          Write-Host "Extracted application files: $($inventory.Count)"
          Write-Host 'Extracted application executables:'
          foreach ($exe in $exeRows) {
            Write-Host ("EXE {0} | {1} bytes | {2} | {3}" -f $exe.Path, $exe.Bytes, $exe.FileVersion, $exe.Product)
          }
          Write-Host 'Gloof Scoop extract_dir/bin/shortcut verification: PASS'
          $report = [System.Collections.Generic.List[string]]::new()
          $report.Add('# Gloof Scoop payload extraction inspection')
          $report.Add('')
          $report.Add("- Source URL: $downloadUrl")
          $report.Add("- Download size: $($file.Length) bytes")
          $report.Add("- SHA-256: $sha256")
          $report.Add("- Authenticode status: $($signature.Status)")
          if ($signature.SignerCertificate) { $report.Add("- Signer: $($signature.SignerCertificate.Subject)") }
          $report.Add("- File version: $($versionInfo.FileVersion)")
          $report.Add("- Product version: $($versionInfo.ProductVersion)")
          $report.Add("- Product name: $($versionInfo.ProductName)")
          $report.Add("- Detected upstream container: $installerType (Velopack Setup.exe)")
          $report.Add("- Velopack version: $packageVersion")
          $report.Add("- Velopack channel: $channel")
          $report.Add("- Velopack main executable: $mainExe")
          $report.Add("- Download page version strings: $($pageVersionHits -join ', ')")
          $report.Add("- Download page installer/portable links: $($pageLinks -join ', ')")
          $report.Add("- Official release feed files checked: releases.beta.json, assets.beta.json, RELEASES (all returned 404)")
          $report.Add("- Scoop-style #/dl.7z extraction with extract_dir=lib/app: PASS (tested under a path containing spaces)")
          $report.Add("- Official Scoop checkver/autoupdate validation: PASS")
          $report.Add("- Outer extracted files: $($outerFiles.Count)")
          $report.Add("- Scoop extract_dir/bin/shortcut verification: PASS")
          $report.Add("- Extracted application payload files: $($inventory.Count)")
          $report.Add('')
          $report.Add('## Application executables')
          foreach ($exe in $exeRows) {
            $report.Add("- $($exe.Path) | $($exe.Bytes) bytes | $($exe.FileVersion) | $($exe.Product)")
          }
          $report.Add('')
          $report.Add('The setup executable and application were not launched. This workflow verifies Scoop-style payload extraction and manifest paths, not GUI runtime behavior or user-data independence.')
          $report | Set-Content -LiteralPath (Join-Path $root 'inspection-report.md') -Encoding utf8
          $report | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8


      - name: Checkout Scoop core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          path: scoop_core
          persist-credentials: false

      - name: Validate Gloof version and published SHA-256 with official Scoop checkver
        shell: pwsh
        env:
          SCOOP_HOME: ${{ github.workspace }}\\scoop_core
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceManifest = Join-Path $env:GITHUB_WORKSPACE 'bucket/gloof.json'
          $expectedManifest = Get-Content -LiteralPath $sourceManifest -Raw | ConvertFrom-Json -ErrorAction Stop
          $validationDir = Join-Path $env:RUNNER_TEMP 'gloof-scoop-checkver'
          New-Item -ItemType Directory -Path $validationDir -Force | Out-Null
          $testManifest = Join-Path $validationDir 'gloof.json'
          Copy-Item -LiteralPath $sourceManifest -Destination $testManifest -Force

          $checkver = Join-Path $env:SCOOP_HOME 'bin/checkver.ps1'
          if (-not (Test-Path -LiteralPath $checkver -PathType Leaf)) {
            throw "Official Scoop checkver script not found: $checkver"
          }

          & $checkver -App $testManifest -ForceUpdate -ThrowError

          $verified = Get-Content -LiteralPath $testManifest -Raw | ConvertFrom-Json -ErrorAction Stop
          if ($verified.version -ne [string]$expectedManifest.version) {
            throw "Scoop checkver returned $($verified.version), expected $($expectedManifest.version)."
          }
          if ($verified.hash -ne [string]$expectedManifest.hash) {
            throw "Scoop checkver SHA-256 mismatch. Expected $($expectedManifest.hash), got $($verified.hash)."
          }

          Write-Host "Scoop checkver version: $($verified.version)"
          Write-Host "Scoop checkver SHA-256: $($verified.hash)"
          Write-Host 'Official Scoop checkver/autoupdate validation: PASS'

      - name: Upload extraction report and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gloof-payload-extraction-inspection
          path: ${{ runner.temp }}/gloof-installer-inspection/
          if-no-files-found: warn
          retention-days: 14
