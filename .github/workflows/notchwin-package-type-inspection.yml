name: NotchWin Package Type Inspection

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/notchwin-package-type-inspection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect NotchWin 1.4.0 Windows packages
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Verify release files and identify PE installer signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $version = "1.4.0"
          $release = "https://github.com/bhoominn/NotchWin-Releases/releases/download/v$version"
          $root = Join-Path $env:RUNNER_TEMP "notchwin-package-inspection"
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          function Download-Verified {
            param([string]$Url, [string]$Path, [string]$ExpectedSha256)
            Invoke-WebRequest -Uri $Url -OutFile $Path -MaximumRedirection 10 -TimeoutSec 900
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) {
              throw "Download did not create: $Path"
            }
            $actual = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $ExpectedSha256.ToLowerInvariant()) {
              throw "SHA-256 mismatch for $Path. Expected $ExpectedSha256; received $actual."
            }
            Write-Host "SHA-256 PASS: $([System.IO.Path]::GetFileName($Path)) = $actual"
            return $actual
          }

          function Read-PeMachine {
            param([byte[]]$Bytes, [string]$Name)
            if ($Bytes.Length -lt 64 -or $Bytes[0] -ne 0x4D -or $Bytes[1] -ne 0x5A) {
              throw "$Name does not have a valid DOS MZ header."
            }
            $peOffset = [BitConverter]::ToInt32($Bytes, 0x3C)
            if ($peOffset -lt 0 -or ($peOffset + 6) -gt $Bytes.Length) {
              throw "$Name has an invalid PE header offset."
            }
            $signature = [System.Text.Encoding]::ASCII.GetString($Bytes, $peOffset, 4)
            if ($signature -ne "PE`0`0") { throw "$Name does not contain a valid PE signature." }
            return [BitConverter]::ToUInt16($Bytes, $peOffset + 4)
          }

          $setupPath = Join-Path $root "NotchWin-Setup-$version.exe"
          $appPath = Join-Path $root "notchwin.exe"
          $setupHash = Download-Verified -Url "$release/NotchWin-Setup-$version.exe" -Path $setupPath -ExpectedSha256 "51783437e23da11b4cb2db7c9f857ad04f38ef6538ce796b7933860d1b6745dd"
          $appHash = Download-Verified -Url "$release/notchwin.exe" -Path $appPath -ExpectedSha256 "37f24b8c86a9a4c793f857dd0f864dad331217e616e0628e60f31f04530bf5a6"

          $setupBytes = [System.IO.File]::ReadAllBytes($setupPath)
          $setupMachine = Read-PeMachine -Bytes $setupBytes -Name "NotchWin Setup"
          $setupAscii = [System.Text.Encoding]::ASCII.GetString($setupBytes)
          $innoIndex = $setupAscii.IndexOf("Inno Setup Setup Data", [System.StringComparison]::Ordinal)
          if ($innoIndex -lt 0) {
            throw "The setup PE did not contain the expected Inno Setup signature."
          }
          $signatureWindow = $setupAscii.Substring($innoIndex, [Math]::Min(100, $setupAscii.Length - $innoIndex))
          $signatureLine = ($signatureWindow -split "[`0`r`n]" | Select-Object -First 1).Trim()
          $setupEngine = $signatureLine
          $setupArchitecture = switch ($setupMachine) {
            0x014c { "x86 PE setup bootstrapper" }
            0x8664 { "x64 PE setup bootstrapper" }
            0xAA64 { "ARM64 PE setup bootstrapper" }
            default { "PE machine 0x$('{0:X4}' -f $setupMachine)" }
          }

          $appBytes = [System.IO.File]::ReadAllBytes($appPath)
          $appMachine = Read-PeMachine -Bytes $appBytes -Name "notchwin.exe"
          if ($appMachine -ne 0x8664) {
            throw "Expected the direct notchwin.exe payload to be x64; PE machine was 0x$('{0:X4}' -f $appMachine)."
          }

          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
            $command = Get-Command "7z.exe" -ErrorAction SilentlyContinue
            if ($null -ne $command) { $sevenZip = $command.Source } else { $sevenZip = $null }
          }
          $sevenZipResult = "not available on runner"
          if ($null -ne $sevenZip) {
            $listing = (& $sevenZip l -slt $setupPath 2>&1 | Out-String)
            $sevenZipExit = $LASTEXITCODE
            $listing | Set-Content -LiteralPath (Join-Path $root "setup-7zip-listing.txt") -Encoding utf8
            $sevenZipResult = "exit code $sevenZipExit"
            if ($sevenZipExit -ne 0) {
              Write-Host "7-Zip does not list this Inno Setup file as a supported archive; the PE signature identifies the installer engine."
            }
          }

          $report = @(
            "NotchWin $version package inspection",
            "Setup SHA-256: $setupHash",
            "Setup engine signature: $setupEngine",
            "Setup executable architecture: $setupArchitecture",
            "7-Zip listing attempt: $sevenZipResult",
            "Direct app SHA-256: $appHash",
            "Direct notchwin.exe: valid x64 PE application executable",
            "",
            "Result: the Setup asset is an Inno Setup installer; the separate notchwin.exe asset is the direct x64 application executable.",
            "No installer or application was executed."
          )
          $report | Set-Content -LiteralPath (Join-Path $root "inspection-report.txt") -Encoding utf8
          $report | ForEach-Object { Write-Host $_ }

          @(
            "## NotchWin package inspection — $version",
            "",
            "- SHA-256: both official assets verified",
            "- Setup engine: $setupEngine",
            "- Setup PE type: $setupArchitecture",
            "- 7-Zip listing: $sevenZipResult",
            "- Direct asset: valid x64 PE application executable",
            "- Selection for Scoop: use the direct `notchwin.exe` asset; do not treat it as an Inno Setup installer.",
            "",
            "No installer or application was executed. Full report is in the artifact."
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

          Remove-Item -LiteralPath $setupPath, $appPath -Force
      - name: Upload package inspection report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: notchwin-package-inspection
          path: ${{ runner.temp }}/notchwin-package-inspection/
          if-no-files-found: warn
          retention-days: 14
