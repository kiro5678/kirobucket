name: Temporary manifest hash audit

on:
  push:
    branches:
      - manifests/neuber-aurelitec-computersluggish-funk-2026-10
    paths:
      - ".github/workflows/temp-manifest-hash-audit.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - name: Checkout bucket branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: manifests/neuber-aurelitec-computersluggish-funk-2026-10
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout Scoop formatter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          ref: master
          path: scoop_core

      - name: Calculate hashes and normalize changed manifests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bucketPath = Join-Path $env:GITHUB_WORKSPACE "bucket"
          $hashNames = @(
            "aurelitec-cinemadrape",
            "aurelitec-injuredpixels",
            "aurelitec-pixelhealer",
            "aurelitec-thumbico",
            "aurelitec-portmarks",
            "computersluggish-cs-easy-unlocker",
            "funk-bic",
            "funk-cop",
            "funk-hmw",
            "funk-hrc",
            "funk-icu",
            "funk-smf",
            "funk-ssd",
            "lopesoft-lopeedit",
            "neuber-fonttwister",
            "neuber-security-task-manager"
          )

          foreach ($name in $hashNames) {
            $path = Join-Path $bucketPath "$name.json"
            $manifest = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
            $url = [string]$manifest.url
            if ([string]::IsNullOrWhiteSpace($url)) {
              throw "No direct URL available for $name."
            }
            $url = $url -replace '#/dl\.7z$', ''
            $downloadPath = Join-Path $env:RUNNER_TEMP "$name.download"
            Write-Host "Downloading $name from $url"
            $null = Invoke-WebRequest -Uri $url -OutFile $downloadPath -MaximumRedirection 10 -TimeoutSec 180 -Headers @{ "User-Agent" = "KiroBucket-Manifest-Hash-Audit" }

            $stream = [System.IO.File]::OpenRead($downloadPath)
            try {
              $signature = [byte[]]::new(8)
              $read = $stream.Read($signature, 0, $signature.Length)
            } finally {
              $stream.Dispose()
            }
            if ($read -lt 4) {
              throw "Download for $name is too small to be a valid package."
            }
            $signatureHex = [System.BitConverter]::ToString($signature[0..($read - 1)]).Replace("-", "")
            $isPackage = $signatureHex.StartsWith("4D5A") -or
              $signatureHex.StartsWith("504B") -or
              $signatureHex.StartsWith("377ABCAF271C") -or
              $signatureHex.StartsWith("52617221") -or
              $signatureHex.StartsWith("4D534346") -or
              $signatureHex.StartsWith("1F8B")
            if (-not $isPackage) {
              throw "Unexpected download signature for $name ($signatureHex). The URL may have returned an HTML error page or an unexpected file."
            }

            $sha256 = (Get-FileHash -LiteralPath $downloadPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $manifest | Add-Member -MemberType NoteProperty -Name hash -Value $sha256 -Force

            $existingNotes = @()
            if ($null -ne $manifest.notes) {
              if ($manifest.notes -is [string]) {
                $existingNotes += [string]$manifest.notes
              } else {
                $existingNotes += @($manifest.notes)
              }
            }
            $existingNotes = @($existingNotes | Where-Object { $_ -notmatch '(?i)checksum is not pinned|checksum.*not.*pinned|SHA-256 digest.*not|hash.*not pinned' })
            $existingNotes += "SHA-256 was calculated from the current official download; refresh it if the upstream file changes."
            $manifest | Add-Member -MemberType NoteProperty -Name notes -Value $existingNotes -Force

            $json = $manifest | ConvertTo-Json -Depth 100
            [System.IO.File]::WriteAllText($path, $json, [System.Text.UTF8Encoding]::new($false))
            Write-Host "HASH_RESULT $name $sha256 signature=$signatureHex"
          }

          $formatNames = @(
            "aurelitec-cinemadrape",
            "aurelitec-injuredpixels",
            "aurelitec-pixelhealer",
            "aurelitec-thumbico",
            "aurelitec-portmarks",
            "computersluggish-cs-easy-unlocker",
            "funk-bic",
            "funk-cop",
            "funk-hmw",
            "funk-hrc",
            "funk-icu",
            "funk-smf",
            "funk-ssd",
            "lopesoft-filemenu-tools",
            "lopesoft-lopeedit",
            "neuber-fonttwister",
            "neuber-security-task-manager"
          )
          $formatter = Join-Path $env:GITHUB_WORKSPACE "scoop_core\bin\formatjson.ps1"
          foreach ($name in $formatNames) {
            & $formatter -App $name -Dir $bucketPath
            if ($LASTEXITCODE -ne 0) {
              throw "Scoop formatter failed for $name."
            }
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bucket
          git diff --cached --quiet
          $diffExitCode = $LASTEXITCODE
          if ($diffExitCode -eq 1) {
            git commit -m "Add download hashes and normalize manifest JSON"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit manifest repair." }
            git push origin "HEAD:refs/heads/manifests/neuber-aurelitec-computersluggish-funk-2026-10"
            if ($LASTEXITCODE -ne 0) { throw "Could not push manifest repair." }
          } elseif ($diffExitCode -ne 0) {
            throw "Could not inspect staged manifest changes."
          } else {
            Write-Host "No manifest changes were required."
          }
