          function ConvertTo-DateOnly {
              param([object]$Value)
              if ($null -eq $Value -or [string]::IsNullOrWhiteSpace([string]$Value)) {
                  return ""
              }
              try {
                  return ([DateTimeOffset]::Parse([string]$Value)).UtcDateTime.ToString("yyyy-MM-dd")
              } catch {
                  return ""
              }
          }

          function Get-GitHubRepoCandidate {
              param([object]$Manifest)

              $candidates = [System.Collections.Generic.List[string]]::new()
              if ($null -ne $Manifest.checkver) {
                  if ($Manifest.checkver.github -is [string]) {
                      $candidates.Add("REPO::" + $Manifest.checkver.github.Trim())
                  }
                  if ($Manifest.checkver.url -is [string]) {
                      $candidates.Add($Manifest.checkver.url.Trim())
                  }
              }
              if ($Manifest.homepage -is [string]) {
                  $candidates.Add($Manifest.homepage.Trim())
              }
              if ($Manifest.url -is [string]) {
                  $candidates.Add($Manifest.url.Trim())
              } elseif ($Manifest.url -is [array]) {
                  foreach ($value in $Manifest.url) {
                      if ($value -is [string]) { $candidates.Add($value.Trim()) }
                  }
              }
              if ($null -ne $Manifest.architecture) {
                  foreach ($arch in $Manifest.architecture.PSObject.Properties) {
                      if ($null -ne $arch.Value.url) {
                          if ($arch.Value.url -is [string]) {
                              $candidates.Add($arch.Value.url.Trim())
                          } elseif ($arch.Value.url -is [array]) {
                              foreach ($value in $arch.Value.url) {
                                  if ($value -is [string]) { $candidates.Add($value.Trim()) }
                              }
                          }
                      }
                  }
              }

              foreach ($candidate in $candidates) {
                  if ($candidate -match '^REPO::([^/\s]+)/([^/\s?#]+)$') {
                      $owner = $Matches[1]
                      $repo = $Matches[2] -replace '\.git$', ''
                      return "$owner/$repo"
                  }
                  if ($candidate -match '(?i)api\.github\.com/repos/([^/\s?#]+)/([^/\s?#]+)') {
                      $owner = $Matches[1]
                      $repo = $Matches[2] -replace '\.git$', ''
                      return "$owner/$repo"
                  }
                  if ($candidate -match '(?i)github\.com/([^/\s?#]+)/([^/\s?#]+)') {
                      $owner = $Matches[1]
                      $repo = $Matches[2] -replace '\.git$', ''
                      if ($repo -notmatch '^(issues|pulls|actions|settings|marketplace|sponsors)$') {
                          return "$owner/$repo"
                      }
                  }
              }
              return ""
          }

          function Get-DownloadUrlFromManifest {
              param([object]$Manifest)

              $candidates = [System.Collections.Generic.List[string]]::new()
              if ($Manifest.url -is [string]) {
                  $candidates.Add($Manifest.url.Trim())
              } elseif ($Manifest.url -is [array]) {
                  foreach ($value in $Manifest.url) {
                      if ($value -is [string]) { $candidates.Add($value.Trim()) }
                  }
              }
              if ($null -ne $Manifest.architecture) {
                  foreach ($arch in $Manifest.architecture.PSObject.Properties) {
                      if ($null -eq $arch.Value.url) { continue }
                      if ($arch.Value.url -is [string]) {
                          $candidates.Add($arch.Value.url.Trim())
                      } elseif ($arch.Value.url -is [array]) {
                          foreach ($value in $arch.Value.url) {
                              if ($value -is [string]) { $candidates.Add($value.Trim()) }
                          }
                      }
                  }
              }
              foreach ($candidate in $candidates) {
                  if (-not [string]::IsNullOrWhiteSpace($candidate) -and $candidate -notmatch '\$(version|architecture|arch)') {
                      return $candidate
                  }
              }
              return ""
          }

          function Get-GitHubUpstreamInfo {
              param([string]$Repository)

              if ($script:upstreamCache.ContainsKey($Repository)) {
                  return $script:upstreamCache[$Repository]
              }

              $releaseDate = ""
              $repositoryDate = ""
              $headers = @{
                  Accept = "application/vnd.github+json"
                  "X-GitHub-Api-Version" = "2022-11-28"
                  "User-Agent" = "kirobucket-manifest-table"
              }
              if (-not [string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
                  $headers.Authorization = "Bearer $($env:GH_TOKEN)"
              }

              try {
                  $releaseUrl = "https://api.github.com/repos/$Repository/releases?per_page=100"
                  $releases = @(Invoke-RestMethod -Uri $releaseUrl -Headers $headers -TimeoutSec 20 -ErrorAction Stop)
                  $publishedReleases = @(
                      $releases |
                          Where-Object { -not $_.draft -and -not [string]::IsNullOrWhiteSpace([string]$_.published_at) } |
                          Sort-Object @{ Expression = { [DateTimeOffset]::Parse([string]$_.published_at) }; Descending = $true }
                  )
                  if ($publishedReleases.Count -gt 0) {
                      $releaseDate = ConvertTo-DateOnly $publishedReleases[0].published_at
                  }
              } catch {
                  Write-Verbose "Could not read GitHub releases for $Repository : $($_.Exception.Message)"
              }

              if ([string]::IsNullOrWhiteSpace($releaseDate)) {
                  try {
                      $repositoryData = Invoke-RestMethod -Uri "https://api.github.com/repos/$Repository" -Headers $headers -TimeoutSec 20 -ErrorAction Stop
                      $repositoryDate = ConvertTo-DateOnly $repositoryData.pushed_at
                  } catch {
                      Write-Verbose "Could not read GitHub repository activity for $Repository : $($_.Exception.Message)"
                  }
              }

              $info = [PSCustomObject]@{
                  ReleaseDate = $releaseDate
                  RepositoryDate = $repositoryDate
              }
              $script:upstreamCache[$Repository] = $info
              return $info
          }

          function Get-DownloadLastModifiedDate {
              param([string]$DownloadUrl)

              if ([string]::IsNullOrWhiteSpace($DownloadUrl)) {
                  return ""
              }
              $cleanUrl = ($DownloadUrl -split '#', 2)[0]
              if ($cleanUrl -notmatch '^https://') {
                  return ""
              }
              try {
                  $response = Invoke-WebRequest -Uri $cleanUrl -Method Head -MaximumRedirection 10 -TimeoutSec 15 -ErrorAction Stop
                  return ConvertTo-DateOnly $response.Headers["Last-Modified"]
              } catch {
                  Write-Verbose "Could not read Last-Modified for $cleanUrl : $($_.Exception.Message)"
                  return ""
              }
          }

          $script:upstreamCache = @{}
          function ConvertTo-DateOnly {
              param([object]$Value)
              if ($null -eq $Value -or [string]::IsNullOrWhiteSpace([string]$Value)) {
                  return ""
              }
              try {
                  return ([DateTimeOffset]::Parse([string]$Value)).UtcDateTime.ToString("yyyy-MM-dd")
              } catch {
                  return ""
              }
          }

          function Get-GitHubRepoCandidate {
              param([object]$Manifest)

              $candidates = [System.Collections.Generic.List[string]]::new()
              if ($null -ne $Manifest.checkver) {
                  if ($Manifest.checkver.github -is [string]) {
                      $candidates.Add("REPO::" + $Manifest.checkver.github.Trim())
                  }
                  if ($Manifest.checkver.url -is [string]) {
                      $candidates.Add($Manifest.checkver.url.Trim())
                  }
              }
              if ($Manifest.homepage -is [string]) {
                  $candidates.Add($Manifest.homepage.Trim())
              }
              if ($Manifest.url -is [string]) {
                  $candidates.Add($Manifest.url.Trim())
              } elseif ($Manifest.url -is [array]) {
                  foreach ($value in $Manifest.url) {
                      if ($value -is [string]) { $candidates.Add($value.Trim()) }
                  }
              }
              if ($null -ne $Manifest.architecture) {
                  foreach ($arch in $Manifest.architecture.PSObject.Properties) {
                      if ($null -eq $arch.Value.url) { continue }
                      if ($arch.Value.url -is [string]) {
                          $candidates.Add($arch.Value.url.Trim())
                      } elseif ($arch.Value.url -is [array]) {
                          foreach ($value in $arch.Value.url) {
                              if ($value -is [string]) { $candidates.Add($value.Trim()) }
                          }
                      }
                  }
              }

              foreach ($candidate in $candidates) {
                  if ($candidate -match '(?i)api\.github\.com/repos/([^/\s?#]+)/([^/\s?#]+)') {
                      $owner = $Matches[1]
                      $repo = $Matches[2] -replace '\.git$', ''
                      return "$owner/$repo"
                  }
                  if ($candidate -match '(?i)github\.com/([^/\s?#]+)/([^/\s?#]+)') {
                      $owner = $Matches[1]
                      $repo = $Matches[2] -replace '\.git$', ''
                      if ($repo -notmatch '^(issues|pulls|actions|settings|marketplace|sponsors)$') {
                          return "$owner/$repo"
                      }
                  }
                  if ($candidate -match '^REPO::([^/\s]+)/([^/\s?#]+)$') {
                      $owner = $Matches[1]
                      $repo = $Matches[2] -replace '\.git$', ''
                      return "$owner/$repo"
                  }
              }
              return ""
          }

