name: Update README Manifest Table

on:
  push:
    paths:
      - "bucket/**"
      - ".github/workflows/manifest-table.yml"
  workflow_dispatch:

concurrency:
  group: manifest-table-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-table:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0

      - name: Update manifest table
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $start = "<!-- KIROBUCKET-MANIFEST-TABLE-START -->"
          $end = "<!-- KIROBUCKET-MANIFEST-TABLE-END -->"

          $readmePath = Join-Path $env:GITHUB_WORKSPACE "README.md"
          $readme = Get-Content -Path $readmePath -Raw

          $manifests = foreach ($file in Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE "bucket") -Filter *.json -File) {
              $relativePath = "bucket/$($file.Name)"
              $raw = Get-Content -Path $file.FullName -Raw
              $json = $null

              try {
                  $json = $raw | ConvertFrom-Json
              } catch {
                  Write-Warning "Invalid JSON in $relativePath - $($_.Exception.Message)"
              }

              if ($null -ne $json) {
                  $version = if ($null -ne $json.version) { [string]$json.version } else { "—" }
                  $description = if ($null -ne $json.description -and -not [string]::IsNullOrWhiteSpace([string]$json.description)) {
                      ([string]$json.description).Trim()
                  } else {
                      "—"
                  }
              } else {
                  $versionMatch = [regex]::Match($raw, '(?m)"version"\s*:\s*"([^"]*)"')
                  $descriptionMatch = [regex]::Match($raw, '(?m)"description"\s*:\s*"([^"]*)"')
                  $version = if ($versionMatch.Success) { $versionMatch.Groups[1].Value } else { "—" }
                  $description = if ($descriptionMatch.Success) { $descriptionMatch.Groups[1].Value } else { "—" }
              }

              $date = (& git log -1 --format=%cs -- $relativePath).Trim()
              if ([string]::IsNullOrWhiteSpace($date)) { $date = "—" }

              $name = [System.IO.Path]::GetFileNameWithoutExtension($file.Name)
              $nameEscaped = $name.Replace("|", "\|")
              $versionEscaped = $version.Replace("|", "\|")
              $descriptionEscaped = $description.Replace("|", "\|").Replace([Environment]::NewLine, " ")

              [PSCustomObject]@{
                  Name = $name
                  Date = $date
                  Row = "| [$nameEscaped]($relativePath) | $versionEscaped | $date | $descriptionEscaped |"
              }
          }

          $dateValue = {
              if ($_.Date -eq "—") { [datetime]::MinValue } else { [datetime]$_.Date }
          }

          $newestRows = $manifests | Sort-Object @{ Expression = $dateValue; Descending = $true }, Name | ForEach-Object { $_.Row }
          $oldestRows = $manifests | Sort-Object @{ Expression = $dateValue; Descending = $false }, Name | ForEach-Object { $_.Row }
          $nameAzRows = $manifests | Sort-Object Name | ForEach-Object { $_.Row }
          $nameZaRows = $manifests | Sort-Object @{ Expression = { $_.Name }; Descending = $true } | ForEach-Object { $_.Row }

          $plainHeader = @(
              "| Name | Version | LAST UPDATE | Description |"
              "| --- | --- | --- | --- |"
          )

          $table = @(
              "## Manifests"
              ""
              "This table is generated automatically from the manifests currently available in the bucket directory."
              ""
              $start
              '<a id="manifests-newest"></a>'
              "| Name [↑](#manifests-name-az) [↓](#manifests-name-za) | Version | LAST UPDATE [↓](#manifests-newest) [↑](#manifests-oldest) | Description |"
              "| --- | --- | --- | --- |"
              $newestRows
              ""
              "<details>"
              "<summary>Sort by name</summary>"
              ""
              '<a id="manifests-name-az"></a>'
              "### Name A–Z"
              ""
              $plainHeader
              $nameAzRows
              ""
              '<a id="manifests-name-za"></a>'
              "### Name Z–A"
              ""
              $plainHeader
              $nameZaRows
              ""
              "</details>"
              ""
              "<details>"
              "<summary>Older update dates</summary>"
              ""
              '<a id="manifests-oldest"></a>'
              "### Oldest first"
              ""
              $plainHeader
              $oldestRows
              ""
              "</details>"
              ""
              "[↓ Newest](#manifests-newest) · [↑ Oldest](#manifests-oldest) · [↑ A–Z](#manifests-name-az) · [↓ Z–A](#manifests-name-za)"
              ""
              $end
          ) -join [Environment]::NewLine

          $sectionPattern = "(?s)## Manifests.*?" + [regex]::Escape($end)

          if ($readme -match $sectionPattern) {
              $readme = [regex]::Replace(
                  $readme,
                  $sectionPattern,
                  [System.Text.RegularExpressions.MatchEvaluator]{ param($m) $table },
                  1
              )
          } else {
              $readme = $readme.TrimEnd() + [Environment]::NewLine + [Environment]::NewLine + $table + [Environment]::NewLine
          }
          Set-Content -Path $readmePath -Value $readme -Encoding utf8NoBOM

      - name: Commit README changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- README.md; then
            echo "README is already up to date."
            exit 0
          fi

          git add README.md
          git commit -m "docs: update manifest table"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
