              return ""
          }


          function Get-InstallerType {
              param([object]$Manifest, [string]$ManifestName)

              if ($null -eq $Manifest) {
                  return "Unknown (invalid manifest JSON)"
              }

              $urls = [System.Collections.Generic.List[string]]::new()
              if ($Manifest.url -is [string]) {
                  $urls.Add($Manifest.url.Trim())
              } elseif ($Manifest.url -is [array]) {
                  foreach ($value in $Manifest.url) {
                      if ($value -is [string]) { $urls.Add($value.Trim()) }
                  }
              }
              if ($null -ne $Manifest.architecture) {
                  foreach ($arch in $Manifest.architecture.PSObject.Properties) {
                      if ($null -eq $arch.Value.url) { continue }
                      if ($arch.Value.url -is [string]) {
                          $urls.Add($arch.Value.url.Trim())
                      } elseif ($arch.Value.url -is [array]) {
                          foreach ($value in $arch.Value.url) {
                              if ($value -is [string]) { $urls.Add($value.Trim()) }
                          }
                      }
                  }
              }

              $installerParts = [System.Collections.Generic.List[string]]::new()
              foreach ($propertyName in @("installer", "pre_install", "post_install", "uninstaller", "pre_uninstall", "post_uninstall")) {
                  $property = $Manifest.PSObject.Properties[$propertyName]
                  if ($null -ne $property -and $null -ne $property.Value) {
                      $installerParts.Add(($property.Value | ConvertTo-Json -Depth 20 -Compress))
                  }
              }
              $installerText = ($installerParts -join " ").ToLowerInvariant()

              $nsisManifests = @(
                  "agaric"
                  "another"
                  "clustercut"
                  "coodesker-github"
                  "dlman"
                  "edge-drop"
                  "filepilot"
                  "handy"
                  "helixnotes"
                  "lapis"
                  "nightlight-launcher"
                  "recordly"
                  "smol"
                  "sofast"
                  "spacedrive"
                  "tockler"
                  "wincux"
                  "znote"
                  "biscuit"
                  "ecopaste"
                  "ecopaste-nightly"
              "rust-meow"
              )
              if ($nsisManifests -contains $ManifestName.ToLowerInvariant()) {
                  return "NSIS"
              }

              if ($Manifest.innosetup -eq $true) {
                  return "Inno"
              }

              # The Scoop ## manifest comment records a verified installer engine
              # without selecting the innosetup extraction mode.
              $manifestCommentProperty = $Manifest.PSObject.Properties["##"]
              if ($null -ne $manifestCommentProperty) {
                  $manifestComment = $manifestCommentProperty.Value
                  if ($manifestComment -is [array]) {
                      $manifestComment = $manifestComment -join [Environment]::NewLine
                  }
                  if ([string]$manifestComment -match '(?im)^\s*Installer Type:\s*Inno Setup') {
                      return "Inno"
                  }
                  if ([string]$manifestComment -match '(?im)^\s*Installer Type:\s*NSIS\b') {
                      return "NSIS"
                  }
                  if ([string]$manifestComment -match '(?im)^\s*Installer Type:\s*Velopack(?:\s+Setup)?\s*$') {
                      return "Velopack Setup"
                  }
              }
              if ($installerText -match 'add-appxpackage' -or $urls -match '(?i)\.msixbundle(?:[?#]|$)') {
                  if ($urls -match '(?i)\.msixbundle(?:[?#]|$)') { return "MSIXBundle" }
                  return "MSIX/AppX package registration"
              }

              $hasMsi = $installerText -match 'msiexec(?:\.exe)?\s+/i' -or $installerText -match '(?i)\.msi'
              $extensions = [System.Collections.Generic.List[string]]::new()
              foreach ($candidate in $urls) {
                  $extension = ""
                  if ($candidate -match '(?i)#/dl\.([a-z0-9]+)(?:$|[?])') {
                      $extension = $Matches[1].ToLowerInvariant()
                  } else {
                      $cleanUrl = ($candidate -split '#', 2)[0]
                      $cleanUrl = ($cleanUrl -split '\?', 2)[0]
                      if ($cleanUrl -match '(?i)\.tar\.gz$') {
                          $extension = "tar.gz"
                      } elseif ($cleanUrl -match '(?i)\.tar\.xz$') {
                          $extension = "tar.xz"
                      } else {
                          $extension = [System.IO.Path]::GetExtension($cleanUrl).TrimStart('.').ToLowerInvariant()
                      }
                  }
                  if (-not [string]::IsNullOrWhiteSpace($extension) -and -not $extensions.Contains($extension)) {
                      $extensions.Add($extension)
                  }
              }

              if ($hasMsi) {
                  if ($extensions.Contains("exe")) { return "EXE bootstrapper + MSI" }
                  return "MSI installer/package"
              }

              $knownTypes = @{
                  "msix" = "MSIX package"
                  "appx" = "APPX package"
                  "appxbundle" = "APPXBundle package"
                  "zip" = "ZIP archive"
                  "7z" = "7Z archive"
                  "rar" = "RAR archive"
                  "cab" = "CAB archive"
                  "tar" = "TAR archive"
                  "tar.gz" = "TAR.GZ archive"
                  "tar.xz" = "TAR.XZ archive"
                  "gz" = "GZIP archive"
                  "xz" = "XZ archive"
                  "iso" = "ISO image"
                  "wim" = "WIM image"
                  "ps1" = "PowerShell script"
                  "bat" = "Windows batch script"
                  "cmd" = "Windows command script"
                  "jar" = "Java archive"
                  "dll" = "DLL/library payload"
              }

              if ($extensions.Count -eq 1) {
                  $extension = $extensions[0]
                  if ($knownTypes.ContainsKey($extension)) {
                      return $knownTypes[$extension]
                  }
                  if ($extension -eq "msi") { return "MSI installer/package" }
                  if ($extension -eq "exe") {
                      if ($null -ne $Manifest.installer) {
                          return "EXE setup (engine unverified)"
                      }
                      return "EXE payload (standalone/extractor not verified)"
                  }
                  if ($extension) {
                      return "$($extension.ToUpperInvariant()) package"
                  }
              }

              if ($extensions.Count -gt 1) {
                  $labels = foreach ($extension in $extensions) {
                      if ($knownTypes.ContainsKey($extension)) { $knownTypes[$extension] }
                      elseif ($extension -eq "exe" -and $null -ne $Manifest.installer) { "EXE setup (engine unverified)" }
                      elseif ($extension -eq "exe") { "EXE payload" }
                      else { "$($extension.ToUpperInvariant()) package" }
                  }
                  return "Multiple package types: $($labels -join ' / ')"
              }

              if ($null -ne $Manifest.installer) {
                  return "Installer declared; package format not identified"
              }
              return "Package format not stated in manifest"
          }

          function Get-ManifestAddedDate {
              param([string]$RelativePath)

              # Follow renames and return the oldest commit that introduced this manifest.
              # Later edits and repairs do not change the original add date.
              $history = @(& git log --follow --diff-filter=A --format=%cs -- $RelativePath 2>$null)
              if ($LASTEXITCODE -ne 0 -or $history.Count -eq 0) {
                  Write-Warning "Could not determine the original add date for $RelativePath."
                  return "—"
              }

              $addedDate = [string]($history | Select-Object -Last 1)
              if ($addedDate -match '^\d{4}-\d{2}-\d{2}$') {
                  return $addedDate
              }
              Write-Warning "Git returned an invalid add date for $RelativePath."
              return "—"
          }

          $manifestData = [System.Collections.Generic.List[object]]::new()
          foreach ($file in $manifestFiles) {
              $relativePath = "bucket/$($file.Name)"
              $addedDate = Get-ManifestAddedDate $relativePath
              $raw = Get-Content -Path $file.FullName -Raw
              $json = $null

              try {
                  $json = $raw | ConvertFrom-Json
              } catch {
                  Write-Warning "Invalid JSON in $relativePath - $($_.Exception.Message)"
              }

              if ($null -ne $json) {
                  $version = if ($null -ne $json.version) { [string]$json.version } else { "—" }
                  $description = if ($null -ne $json.description -and -not [string]::IsNullOrWhiteSpace([string]$json.description)) {
                      ([string]$json.description).Trim()
                  } else {
                      "—"
                  }
                  $homepage = if ($null -ne $json.homepage -and -not [string]::IsNullOrWhiteSpace([string]$json.homepage)) {
                      ([string]$json.homepage).Trim()
                  } else {
                      ""
                  }
                  $repo = Get-GitHubRepoCandidate $json
                  $downloadUrl = Get-DownloadUrlFromManifest $json
                  $downloadSizeGroups = Get-ManifestDownloadSizeGroups $json
                  $installerType = Get-InstallerType $json $file.BaseName
              } else {
                  $versionMatch = [regex]::Match($raw, '(?m)"version"\s*:\s*"([^"]*)"')
                  $descriptionMatch = [regex]::Match($raw, '(?m)"description"\s*:\s*"([^"]*)"')
                  $version = if ($versionMatch.Success) { $versionMatch.Groups[1].Value } else { "—" }
                  $description = if ($descriptionMatch.Success) { $descriptionMatch.Groups[1].Value } else { "—" }
                  $homepage = ""
                  $repo = ""
                  $downloadUrl = ""
                  $downloadSizeGroups = @()
                  $installerType = "Unknown (invalid manifest JSON)"
              }

              $name = [System.IO.Path]::GetFileNameWithoutExtension($file.Name)
              $category = if ($categoryMap.ContainsKey($name)) {
                  $categoryMap[$name]
              } else {
                  "Other Utilities"
              }
              $manifestData.Add([PSCustomObject]@{
                  Name = $name
                  RelativePath = $relativePath
                  Version = $version
                  Description = $description
                  Homepage = $homepage
                  Category = $category
                  AddedDate = $addedDate
                  Repo = $repo
                  DownloadUrl = $downloadUrl
                  DownloadSizeGroups = @($downloadSizeGroups)
                  InstallerType = $installerType
              })
          }

          # Query each upstream GitHub repository once, in parallel. Use published releases,
          # not commit dates from the bucket manifest. The bounded parallelism avoids serial waits.
          $githubRepos = @(
              $manifestData |
                  Where-Object { -not [string]::IsNullOrWhiteSpace($_.Repo) } |
                  Select-Object -ExpandProperty Repo -Unique
          )
          Write-Host "Looking up published releases for $($githubRepos.Count) unique GitHub repositories."
          $upstreamRecords = @(
              $githubRepos | ForEach-Object -Parallel {
                  $repo = [string]$_
                  $releaseDate = ""
                  $headers = @{
                      Accept = "application/vnd.github+json"
                      "X-GitHub-Api-Version" = "2022-11-28"
                      "User-Agent" = "kirobucket-manifest-table"
                  }
                  if (-not [string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
                      $headers.Authorization = "Bearer $($env:GH_TOKEN)"
                  }
                  try {
                      $releases = @(Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases?per_page=10" -Headers $headers -TimeoutSec 15 -ErrorAction Stop)
                      $published = @(
                          $releases |
                              Where-Object { -not $_.draft -and -not [string]::IsNullOrWhiteSpace([string]$_.published_at) } |
                              Sort-Object @{ Expression = { [DateTimeOffset]::Parse([string]$_.published_at) }; Descending = $true }
                      )
                      if ($published.Count -gt 0) {
                          $releaseDate = ([DateTimeOffset]::Parse([string]$published[0].published_at)).UtcDateTime.ToString("yyyy-MM-dd")
                      }
                  } catch {
                      Write-Verbose "No release metadata for $repo : $($_.Exception.Message)"
                  }
                  [PSCustomObject]@{
                      Repository = $repo
                      ReleaseDate = $releaseDate
                  }
              } -ThrottleLimit 20
          )

          $upstreamCache = @{}
          foreach ($record in $upstreamRecords) {
              $upstreamCache[$record.Repository] = [string]$record.ReleaseDate
          }

          # Probe direct download URLs for Content-Length (size) and, when needed,
          # Last-Modified (date). Each URL is requested once, with bounded parallelism.
          $urlsToProbe = [System.Collections.Generic.List[string]]::new()
          $sizeUrlsToProbe = [System.Collections.Generic.List[string]]::new()
          foreach ($item in $manifestData) {
              $hasReleaseDate = $false
              if (-not [string]::IsNullOrWhiteSpace($item.Repo) -and $upstreamCache.ContainsKey($item.Repo)) {
                  $hasReleaseDate = -not [string]::IsNullOrWhiteSpace([string]$upstreamCache[$item.Repo])
              }
              if (-not $hasReleaseDate -and -not [string]::IsNullOrWhiteSpace($item.DownloadUrl)) {
                  $cleanUrl = ($item.DownloadUrl -split '#', 2)[0]
                  if ($cleanUrl -match '^https://') { $urlsToProbe.Add($cleanUrl) }
              }
              foreach ($group in $item.DownloadSizeGroups) {
                  foreach ($candidateUrl in $group.Urls) {
                      $cleanUrl = ($candidateUrl -split '#', 2)[0]
                      if ($cleanUrl -match '^https://') { $sizeUrlsToProbe.Add($cleanUrl) }
                  }
              }
          }
          $downloadDates = @{}
          $downloadSizes = @{}
          $allUrlsToProbe = @(@($urlsToProbe) + @($sizeUrlsToProbe) | Sort-Object -Unique)
          Write-Host "Checking sizes for $($sizeUrlsToProbe.Count) URL reference(s) and Last-Modified dates for $($urlsToProbe.Count) URL reference(s)."
          $downloadRecords = @(
              $allUrlsToProbe | ForEach-Object -Parallel {
                  $url = [string]$_
                  $date = ""
                  $sizeBytes = $null
                  try {
                      $response = Invoke-WebRequest -Uri $url -Method Head -MaximumRedirection 10 -TimeoutSec 15 -ErrorAction Stop
                      $lastModified = $response.Headers["Last-Modified"]
                      if (-not [string]::IsNullOrWhiteSpace([string]$lastModified)) {
                          $date = ([DateTimeOffset]::Parse([string]$lastModified)).UtcDateTime.ToString("yyyy-MM-dd")
                      }
                      $contentLength = [string]$response.Headers["Content-Length"]
                      $parsedLength = 0L
                      if ([long]::TryParse($contentLength, [ref]$parsedLength)) {
                          $sizeBytes = $parsedLength
                      }
                  } catch {
                      Write-Verbose "Could not read download headers for $url : $($_.Exception.Message)"
                  }
                  [PSCustomObject]@{ Url = $url; Date = $date; SizeBytes = $sizeBytes }
              } -ThrottleLimit 20
          )
          foreach ($record in $downloadRecords) {
              $downloadDates[$record.Url] = [string]$record.Date
              if ($null -ne $record.SizeBytes) { $downloadSizes[$record.Url] = [long]$record.SizeBytes }
          }
          $manifests = foreach ($item in $manifestData) {
              $date = ""
              if (-not [string]::IsNullOrWhiteSpace($item.Repo) -and $upstreamCache.ContainsKey($item.Repo)) {
                  $date = [string]$upstreamCache[$item.Repo]
              }
              if ([string]::IsNullOrWhiteSpace($date) -and -not [string]::IsNullOrWhiteSpace($item.DownloadUrl)) {
                  $cleanUrl = ($item.DownloadUrl -split '#', 2)[0]
                  if ($downloadDates.ContainsKey($cleanUrl)) {
                      $date = [string]$downloadDates[$cleanUrl]
                  }
              }
              if ([string]::IsNullOrWhiteSpace($date)) { $date = "—" }

              $sizeParts = [System.Collections.Generic.List[string]]::new()
              foreach ($group in $item.DownloadSizeGroups) {
                  $totalBytes = 0L
                  $groupHasCompleteSize = $true
                  $groupUrlCount = 0
                  foreach ($candidateUrl in $group.Urls) {
                      $cleanUrl = ($candidateUrl -split '#', 2)[0]
                      if ($cleanUrl -notmatch '^https://') { continue }
                      $groupUrlCount++
                      if ($downloadSizes.ContainsKey($cleanUrl)) {
                          $totalBytes += [long]$downloadSizes[$cleanUrl]
                      } else {
                          $groupHasCompleteSize = $false
                      }
                  }
                  if ($groupUrlCount -eq 0) { continue }
                  $sizeText = if ($groupHasCompleteSize) { Format-ManifestDownloadSize $totalBytes } else { "—" }
                  if ($item.DownloadSizeGroups.Count -eq 1 -and $group.Label -eq "Default") {
                      $sizeParts.Add($sizeText)
                  } else {
                      $sizeParts.Add("$($group.Label): $sizeText")
                  }
              }
              $downloadSize = if ($sizeParts.Count -gt 0) { $sizeParts -join " / " } else { "—" }

              $nameEscaped = $item.Name.Replace("|", "\|")
              $categoryEscaped = $item.Category.Replace("|", "\|")
              $versionEscaped = $item.Version.Replace("|", "\|")
              $installerTypeEscaped = $item.InstallerType.Replace("|", "\|")
              $descriptionEscaped = $item.Description.Replace("|", "\|").Replace([Environment]::NewLine, " ")
              $homepageEscaped = $item.Homepage.Replace("|", "\|").Replace(")", "%29")
              $homepageCell = if ([string]::IsNullOrWhiteSpace($item.Homepage)) { "—" } else { "[Homepage]($homepageEscaped)" }

              $addedDate = if ([string]::IsNullOrWhiteSpace([string]$item.AddedDate)) { "—" } else { [string]$item.AddedDate }

              [PSCustomObject]@{
                  Name = $item.Name
                  Category = $item.Category
                  Added = $addedDate
                  Date = $date
                  Homepage = $item.Homepage
                  InstallerType = $item.InstallerType
                  DownloadSize = $downloadSize
                  Row = "| [$nameEscaped]($($item.RelativePath)) | $categoryEscaped | $versionEscaped | $downloadSize | $installerTypeEscaped | $addedDate | $date | $homepageCell | $descriptionEscaped |"
              }
          }

          $dateValue = {
              if ($_.Date -eq "—") { [datetime]::MinValue } else { [datetime]$_.Date }
          }
          $addedDateValue = {
              if ($_.Added -eq "—") { [datetime]::MinValue } else { [datetime]$_.Added }
          }

          $newest = $manifests | Sort-Object @{ Expression = $dateValue; Descending = $true }, Name
          $oldest = $manifests | Sort-Object @{ Expression = $dateValue; Descending = $false }, Name
          $addedNewest = $manifests | Sort-Object @{ Expression = $addedDateValue; Descending = $true }, Name
          $addedOldest = $manifests | Sort-Object @{ Expression = $addedDateValue; Descending = $false }, Name
          $nameAz = $manifests | Sort-Object Name
          $nameZa = $manifests | Sort-Object @{ Expression = { $_.Name }; Descending = $true }
          $categoryAz = $manifests | Sort-Object @{ Expression = { $_.Category }; Descending = $false }, Name
          $categoryZa = $manifests | Sort-Object @{ Expression = { $_.Category }; Descending = $true }, Name

          function New-View {
              param(
                  [string]$Title,
                  [array]$Items
              )

              @(
                  "# KiroBucket Manifest View"
                  ""
                  "## $Title"
                  ""
                  "Manifest Added is the date the manifest first entered this bucket's Git history; later edits do not change it, and renames are followed where Git can detect them. Program Update is the latest published upstream release date, falling back to the downloadable asset's Last-Modified date. A dash means a date was unavailable."
                  "Download Size is measured from direct download URLs' HTTP Content-Length headers. Architecture-specific packages are listed separately; a dash means the source did not provide a size."
                  "Installer Type is inferred from manifest metadata and the declared download format; unknown EXE installer engines are labeled unverified, not guessed."
                  ""
                  "| Name | Category | Version | Size | Installer Type | MANIFEST ADDED [↓](manifests-added-newest.md) [↑](manifests-added-oldest.md) | PROGRAM UPDATE [↓](manifests-newest.md) [↑](manifests-oldest.md) | Homepage | Description |"
                  "| --- | --- | --- | --- | --- | --- | --- | --- | --- |"
                  ($Items | ForEach-Object { $_.Row -replace '\]\(bucket/', '](../bucket/' })
                  ""
              ) -join [Environment]::NewLine
          }

          $docsPath = Join-Path $env:GITHUB_WORKSPACE "docs"
          New-Item -ItemType Directory -Force -Path $docsPath | Out-Null

          # Build a complete installer-type inventory from every manifest currently in bucket/.
          # This is regenerated with the same $manifests data used by all generated manifest views.
          $portabilityPath = Join-Path $docsPath "manifest-portability.md"
          $portabilityContent = [System.IO.File]::ReadAllText($portabilityPath)
          $lineBreak = [string][char]10
          $portabilityContent = [regex]::Replace($portabilityContent, "\r\n|\r", $lineBreak)

          # Read the Nonportable column from the current generated inventory.
          # This preserves classifications when the old standalone Nonportable list is removed.
          $inventoryStartMarker = "<!-- KIROBUCKET-INSTALLER-TYPE-TABLE-START -->"
          $inventoryEndMarker = "<!-- KIROBUCKET-INSTALLER-TYPE-TABLE-END -->"
          $inventoryStartIndex = $portabilityContent.IndexOf($inventoryStartMarker, [System.StringComparison]::Ordinal)
          $inventoryEndIndex = $portabilityContent.IndexOf($inventoryEndMarker, [System.StringComparison]::Ordinal)
          if ($inventoryStartIndex -lt 0 -or $inventoryEndIndex -le $inventoryStartIndex) {
              throw "Portability inventory markers are missing or out of order."
          }
          $existingInventory = $portabilityContent.Substring(
              $inventoryStartIndex,
              $inventoryEndIndex - $inventoryStartIndex
          )
          $lineFeed = [string][char]10
          $headerLine = @($existingInventory -split $lineFeed | Where-Object { $_ -match '^\|\s*Portable\b' } | Select-Object -First 1)
          if ($headerLine.Count -eq 0) {
              throw "Could not find the Portable/Nonportable inventory table header."
          }
          $headerCells = @($headerLine[0].Trim().Trim('|').Split('|') | ForEach-Object { $_.Trim() })
          $nonportableColumn = -1
          for ($column = 0; $column -lt $headerCells.Count; $column++) {
              if ($headerCells[$column] -match '^Nonportable\b') {
                  $nonportableColumn = $column
                  break
              }
          }
          if ($nonportableColumn -lt 0) {
              throw "Could not locate the Nonportable column in the existing inventory."
          }

          $nonportableSet = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          foreach ($line in ($existingInventory -split $lineFeed)) {
              if ($line -notmatch '^\|') { continue }
              $cells = @($line.Trim().Trim('|').Split('|'))
              if ($cells.Count -le $nonportableColumn) { continue }
              foreach ($match in [regex]::Matches($cells[$nonportableColumn], '\]\(\.\./bucket/(?<name>[^/)]+)\.json\)')) {
                  [void]$nonportableSet.Add($match.Groups["name"].Value)
              }
          }

          $reviewPath = Join-Path $docsPath "manifest-review.md"
          if (-not (Test-Path -LiteralPath $reviewPath -PathType Leaf)) {
              throw "Manifest review source not found: $reviewPath"
          }
          $reviewContent = [System.IO.File]::ReadAllText($reviewPath)
          $reviewSet = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          foreach ($match in [regex]::Matches($reviewContent, '\]\(\.\./bucket/(?<name>[^/)]+)\.json\)')) {
              [void]$reviewSet.Add($match.Groups["name"].Value)
          }

          $overlappingClasses = @($nonportableSet | Where-Object { $reviewSet.Contains($_) })
          if ($overlappingClasses.Count -gt 0) {
              throw "Manifests cannot be both Nonportable and Review: $($overlappingClasses -join ', ')."
          }

          $manifestNameSet = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          foreach ($manifest in $manifests) {
              [void]$manifestNameSet.Add($manifest.Name)
          }
          $staleNonportable = @($nonportableSet | Where-Object { -not $manifestNameSet.Contains($_) })
          $staleReview = @($reviewSet | Where-Object { -not $manifestNameSet.Contains($_) })
          if ($staleNonportable.Count -gt 0) {
              Write-Warning "Ignoring Nonportable records without a matching bucket manifest: $($staleNonportable -join ', ')."
          }
          if ($staleReview.Count -gt 0) {
              Write-Warning "Ignoring Review records without a matching bucket manifest: $($staleReview -join ', ')."
          }

          foreach ($manifest in $manifests) {
              if ($nonportableSet.Contains($manifest.Name)) {
                  $classification = "Nonportable"
              } elseif ($reviewSet.Contains($manifest.Name)) {
                  $classification = "Review"
              } else {
                  $classification = "Portable"
              }
              $manifest | Add-Member -NotePropertyName Portability -NotePropertyValue $classification
          }

          $portableCount = @($manifests | Where-Object { $_.Portability -eq "Portable" }).Count
          $nonportableCount = @($manifests | Where-Object { $_.Portability -eq "Nonportable" }).Count
          $reviewCount = @($manifests | Where-Object { $_.Portability -eq "Review" }).Count
          $totalCount = $manifests.Count

          # Regenerate the classification summary from the exact manifest set.
          $summaryStartMarker = "<!-- KIROBUCKET-PORTABILITY-SUMMARY-START -->"
          $summaryEndMarker = "<!-- KIROBUCKET-PORTABILITY-SUMMARY-END -->"
          $summaryStartIndex = $portabilityContent.IndexOf($summaryStartMarker, [System.StringComparison]::Ordinal)
          $summaryEndIndex = $portabilityContent.IndexOf($summaryEndMarker, [System.StringComparison]::Ordinal)
          if ($summaryStartIndex -lt 0 -or $summaryEndIndex -le $summaryStartIndex) {
              throw "Portability summary markers are missing or out of order in docs/manifest-portability.md."
          }
          $summaryLines = @(
              $summaryStartMarker
              "| Classification | Manifests | Meaning |"
              "| --- | ---: | --- |"
              "| Portable | $portableCount | No normal vendor installation routine or persistent Windows integration is run. |"
              "| Nonportable | $nonportableCount | The manifest runs installation or registers persistent Windows components. |"
              "| Review | $reviewCount | Portability checks or supporting evidence are still outstanding. |"
              "| **Total** | **$totalCount** | **All current JSON manifests in bucket/.** |"
              $summaryEndMarker
          )
          $summaryBlock = [string]::Join($lineBreak, $summaryLines)
          $summaryBefore = $portabilityContent.Substring(0, $summaryStartIndex)
          $summaryAfter = $portabilityContent.Substring($summaryEndIndex + $summaryEndMarker.Length)
          $portabilityContent = $summaryBefore + $summaryBlock + $summaryAfter

          # Remove the obsolete standalone Nonportable list; the grouped main table now
          # contains both classifications and is the source of truth.
          $oldNonportableHeading = "## Nonportable manifests by installer type"
          $manifestReviewHeading = "## Manifest review"
          $oldNonportableStart = $portabilityContent.IndexOf($oldNonportableHeading, [System.StringComparison]::Ordinal)
          $manifestReviewStart = $portabilityContent.IndexOf($manifestReviewHeading, [System.StringComparison]::Ordinal)
          if ($oldNonportableStart -ge 0) {
              if ($manifestReviewStart -le $oldNonportableStart) {
                  throw "Manifest Review heading must follow the obsolete Nonportable section."
              }
              $portabilityContent = $portabilityContent.Substring(0, $oldNonportableStart) +
                  $portabilityContent.Substring($manifestReviewStart)
          }

          # One row per installer/package type. Each type appears once in the
          # rightmost column, with its Portable and Nonportable manifests grouped beside it.
          $classifiedItems = @($manifests | Where-Object { $_.Portability -in @("Portable", "Nonportable") })
          $installerTypeGroups = @($classifiedItems | Group-Object InstallerType | Sort-Object Name)
          $installerTypeLines = [System.Collections.Generic.List[string]]::new()
          $installerTypeLines.Add('<a id="all-bucket-manifests-by-installer-type"></a>')
          $installerTypeLines.Add("## Portable and Nonportable manifests grouped by installer type")
          $installerTypeLines.Add("")
          $installerTypeLines.Add("Each installer type appears once. Manifests are grouped under Portable or Nonportable; items awaiting verification remain in [Manifest Review](manifest-review.md).")
          $installerTypeLines.Add("")
          $installerTypeLines.Add("| Portable manifests ($portableCount) | Nonportable manifests ($nonportableCount) | Installer Type |")
          $installerTypeLines.Add("| --- | --- | --- |")
          foreach ($group in $installerTypeGroups) {
              $portableLinks = @(
                  $group.Group |
                      Where-Object { $_.Portability -eq "Portable" } |
                      Sort-Object Name |
                      ForEach-Object {
                          $name = ([string]$_.Name).Replace("|", "\|")
                          "[$name](../bucket/$($_.Name).json)"
                      }
              ) -join ", "
              $nonportableLinks = @(
                  $group.Group |
                      Where-Object { $_.Portability -eq "Nonportable" } |
                      Sort-Object Name |
                      ForEach-Object {
                          $name = ([string]$_.Name).Replace("|", "\|")
                          "[$name](../bucket/$($_.Name).json)"
                      }
              ) -join ", "
              $typeLabel = ([string]$group.Name).Replace("|", "\|")
              $installerTypeLines.Add("| $portableLinks | $nonportableLinks | $typeLabel |")
          }
          $installerTypeLines.Add("")
          $installerTypeLines.Add("**Counts:** Portable $portableCount; Nonportable $nonportableCount; Review $reviewCount; Total $totalCount.")

          $installerTypeStart = "<!-- KIROBUCKET-INSTALLER-TYPE-TABLE-START -->"
          $installerTypeEnd = "<!-- KIROBUCKET-INSTALLER-TYPE-TABLE-END -->"
          $installerTypeStartIndex = $portabilityContent.IndexOf($installerTypeStart, [System.StringComparison]::Ordinal)
          $installerTypeEndIndex = $portabilityContent.IndexOf($installerTypeEnd, [System.StringComparison]::Ordinal)
          if ($installerTypeStartIndex -lt 0 -or $installerTypeEndIndex -le $installerTypeStartIndex) {
              throw "Installer-type table markers are missing or out of order in docs/manifest-portability.md."
          }

          $installerTypeBlock = $installerTypeStart + $lineBreak +
              ([string]::Join($lineBreak, $installerTypeLines)) + $lineBreak +
              $installerTypeEnd
          $beforeInstallerTypeTable = $portabilityContent.Substring(0, $installerTypeStartIndex)
          $afterInstallerTypeTable = $portabilityContent.Substring($installerTypeEndIndex + $installerTypeEnd.Length)
          $portabilityContent = $beforeInstallerTypeTable + $installerTypeBlock + $afterInstallerTypeTable
          $crlf = [string]::Concat([char]13, [char]10)
          $portabilityContent = $portabilityContent.Replace($lineBreak, $crlf)
          [System.IO.File]::WriteAllText(
              $portabilityPath,
              $portabilityContent,
              [System.Text.UTF8Encoding]::new($false)
          )
          Write-Host "Generated portability inventory grouped by installer type. Portable: $portableCount; Nonportable: $nonportableCount; Review: $reviewCount; Total: $totalCount."

          Set-Content -Path (Join-Path $docsPath "manifests-newest.md") -Value (New-View "Newest first" $newest) -Encoding utf8NoBOM
          Set-Content -Path (Join-Path $docsPath "manifests-oldest.md") -Value (New-View "Oldest first" $oldest) -Encoding utf8NoBOM
          Set-Content -Path (Join-Path $docsPath "manifests-added-newest.md") -Value (New-View "Manifest additions — newest first" $addedNewest) -Encoding utf8NoBOM
          Set-Content -Path (Join-Path $docsPath "manifests-added-oldest.md") -Value (New-View "Manifest additions — oldest first" $addedOldest) -Encoding utf8NoBOM
          Set-Content -Path (Join-Path $docsPath "manifests-name-az.md") -Value (New-View "Name A-Z" $nameAz) -Encoding utf8NoBOM
          Set-Content -Path (Join-Path $docsPath "manifests-name-za.md") -Value (New-View "Name Z-A" $nameZa) -Encoding utf8NoBOM
          Set-Content -Path (Join-Path $docsPath "manifests-category-az.md") -Value (New-View "Category A-Z" $categoryAz) -Encoding utf8NoBOM
          Set-Content -Path (Join-Path $docsPath "manifests-category-za.md") -Value (New-View "Category Z-A" $categoryZa) -Encoding utf8NoBOM




          $manifestPage = @(
              "# KiroBucket Manifest Inventory"
              ""
              "This page contains the complete manifest inventory generated from the JSON files in `bucket/`."
              ""
              "Manifest Added is the date a manifest first entered this bucket's Git history; later edits or repairs do not change it. Program Update uses the latest published upstream release date when available, falling back to the download asset's Last-Modified date. A dash means a date was unavailable."
              ""
              "Download Size is measured from direct download URLs' HTTP Content-Length headers. Architecture-specific packages are listed separately; a dash means the source did not provide a size."
              "Installer Type is inferred from manifest metadata and the declared download format. Unknown EXE installer engines are labeled unverified rather than guessed."
              ""
              "Use the column links to open alternative views sorted by name, category, manifest-added date, or program-update date."
              ""
              $start
              '<a id="manifests-newest"></a>'
              "| Name [↑](manifests-name-az.md) [↓](manifests-name-za.md) | Category [↑](manifests-category-az.md) [↓](manifests-category-za.md) | Version | Size | Installer Type | MANIFEST ADDED [↓](manifests-added-newest.md) [↑](manifests-added-oldest.md) | PROGRAM UPDATE [↓](manifests-newest.md) [↑](manifests-oldest.md) | Homepage | Description |"
              "| --- | --- | --- | --- | --- | --- | --- | --- | --- |"
              ($newest | ForEach-Object { $_.Row -replace '\]\(bucket/', '](../bucket/' })
              $end
              ""
              "[Back to README](../README.md#manifests)"
          ) -join [Environment]::NewLine

          $manifestPage = [regex]::Replace($manifestPage, '(?:\r?\n)+\z', '') + "`n"
          [System.IO.File]::WriteAllText(
              (Join-Path $docsPath "manifests.md"),
              $manifestPage,
              [System.Text.UTF8Encoding]::new($false)
          )

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- docs; then
            echo "Generated files are already up to date."
            exit 0
          fi

          git add docs
          git commit -m "docs: update manifest views"
          git fetch origin master:refs/remotes/origin/master
          git rebase origin/master
          git push origin HEAD:master
