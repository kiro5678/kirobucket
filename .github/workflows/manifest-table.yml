name: Update Manifest Documentation
# Regenerate README and docs indexes when manifest metadata or installer-type inference changes.

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/manifest-table.yml
      - docs/categories.md
      - bucket/**

concurrency:
  group: manifest-table-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-table:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0

      - name: Generate manifest views
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $start = "<!-- KIROBUCKET-MANIFEST-TABLE-START -->"
          $end = "<!-- KIROBUCKET-MANIFEST-TABLE-END -->"

          # Use docs/categories.md as the single source of truth for functional categories.
          $categoryMap = @{}
          $categoryDocumentPath = Join-Path $env:GITHUB_WORKSPACE "docs/categories.md"
          if (-not (Test-Path -LiteralPath $categoryDocumentPath -PathType Leaf)) {
              throw "Canonical category document not found: $categoryDocumentPath"
          }

          $readingFunctionalCategories = $false
          $currentCategory = $null
          foreach ($line in [System.IO.File]::ReadAllLines($categoryDocumentPath)) {
              if ($line -match '^##\s+(?<category>.+?)\s*$') {
                  $heading = $Matches.category.Trim()
                  if ($heading -eq "Android & Device Tools") {
                      $readingFunctionalCategories = $true
                  }
                  if ($heading -eq "Auslogics Suite") {
                      break
                  }
                  $currentCategory = if ($readingFunctionalCategories) { $heading } else { $null }
                  continue
              }

              if (-not $readingFunctionalCategories -or [string]::IsNullOrWhiteSpace($currentCategory)) {
                  continue
              }

              if ($line -match '(?i)^\|\s*\[[^\]]+\]\(\.\./bucket/(?<file>[^)]+\.json)\)\s*\|') {
                  $manifestName = [System.IO.Path]::GetFileNameWithoutExtension($Matches.file)
                  if ($categoryMap.ContainsKey($manifestName)) {
                      throw "Manifest '$manifestName' appears in more than one functional category in docs/categories.md."
                  }
                  $categoryMap[$manifestName] = $currentCategory
              }
          }

          if ($categoryMap.Count -eq 0) {
              throw "No functional category mappings were parsed from docs/categories.md."
          }

          $bucketDirectory = Join-Path $env:GITHUB_WORKSPACE "bucket"
          $manifestFiles = @(Get-ChildItem -LiteralPath $bucketDirectory -File | Where-Object { $_.Name -match '(?i)\.json$' })
          $bucketNames = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          foreach ($file in $manifestFiles) {
              [void]$bucketNames.Add([System.IO.Path]::GetFileNameWithoutExtension($file.Name))
          }

          $missingMappings = @($manifestFiles | Where-Object {
              -not $categoryMap.ContainsKey([System.IO.Path]::GetFileNameWithoutExtension($_.Name))
          } | ForEach-Object { $_.Name })
          foreach ($missingMapping in $missingMappings) {
              $missingName = [System.IO.Path]::GetFileNameWithoutExtension($missingMapping)
              Write-Warning "No functional category mapping for '$missingName'; assigning 'Other Utilities'."
          }

          $staleMappings = @($categoryMap.Keys | Where-Object { -not $bucketNames.Contains($_) })
          if ($staleMappings.Count -gt 0) {
              Write-Warning "Ignoring stale category mappings that have no matching bucket manifest: $($staleMappings -join ', ')."
          }

          Write-Host "Loaded $($categoryMap.Count) functional category mappings for $($manifestFiles.Count) bucket manifests from docs/categories.md. Missing mappings: $($missingMappings.Count); these will use 'Other Utilities'." {
              param([object]$Value)
              if ($null -eq $Value -or [string]::IsNullOrWhiteSpace([string]$Value)) {
                  return ""
              }
              try {
                  return ([DateTimeOffset]::Parse([string]$Value)).UtcDateTime.ToString("yyyy-MM-dd")
              } catch {
                  return ""
              }
          }

          function Get-GitHubRepoCandidate {
              param([object]$Manifest)

              $candidates = [System.Collections.Generic.List[string]]::new()
              if ($null -ne $Manifest.checkver) {
                  if ($Manifest.checkver.github -is [string]) {
                      $candidates.Add("REPO::" + $Manifest.checkver.github.Trim())
                  }
                  if ($Manifest.checkver.url -is [string]) {
                      $candidates.Add($Manifest.checkver.url.Trim())
                  }
              }
              if ($Manifest.homepage -is [string]) {
                  $candidates.Add($Manifest.homepage.Trim())
              }
              if ($Manifest.url -is [string]) {
                  $candidates.Add($Manifest.url.Trim())
              } elseif ($Manifest.url -is [array]) {
                  foreach ($value in $Manifest.url) {
                      if ($value -is [string]) { $candidates.Add($value.Trim()) }
                  }
              }
              if ($null -ne $Manifest.architecture) {
                  foreach ($arch in $Manifest.architecture.PSObject.Properties) {
                      if ($null -ne $arch.Value.url) {
                          if ($arch.Value.url -is [string]) {
                              $candidates.Add($arch.Value.url.Trim())
                          } elseif ($arch.Value.url -is [array]) {
                              foreach ($value in $arch.Value.url) {
                                  if ($value -is [string]) { $candidates.Add($value.Trim()) }
                              }
                          }
                      }
                  }
              }

              foreach ($candidate in $candidates) {
                  if ($candidate -match '^REPO::([^/\s]+)/([^/\s?#]+)$') {
                      $owner = $Matches[1]
                      $repo = $Matches[2] -replace '\.git$', ''
                      return "$owner/$repo"
                  }
                  if ($candidate -match '(?i)api\.github\.com/repos/([^/\s?#]+)/([^/\s?#]+)') {
                      $owner = $Matches[1]
                      $repo = $Matches[2] -replace '\.git$', ''
                      return "$owner/$repo"
                  }
                  if ($candidate -match '(?i)github\.com/([^/\s?#]+)/([^/\s?#]+)') {
                      $owner = $Matches[1]
                      $repo = $Matches[2] -replace '\.git$', ''
                      if ($repo -notmatch '^(issues|pulls|actions|settings|marketplace|sponsors)$') {
                          return "$owner/$repo"
                      }
                  }
              }
              return ""
          }

          function Get-DownloadUrlFromManifest {
              param([object]$Manifest)

              $candidates = [System.Collections.Generic.List[string]]::new()
              if ($Manifest.url -is [string]) {
                  $candidates.Add($Manifest.url.Trim())
              } elseif ($Manifest.url -is [array]) {
                  foreach ($value in $Manifest.url) {
                      if ($value -is [string]) { $candidates.Add($value.Trim()) }
                  }
              }
              if ($null -ne $Manifest.architecture) {
                  foreach ($arch in $Manifest.architecture.PSObject.Properties) {
                      if ($null -eq $arch.Value.url) { continue }
                      if ($arch.Value.url -is [string]) {
                          $candidates.Add($arch.Value.url.Trim())
                      } elseif ($arch.Value.url -is [array]) {
                          foreach ($value in $arch.Value.url) {
                              if ($value -is [string]) { $candidates.Add($value.Trim()) }
                          }
                      }
                  }
              }
              foreach ($candidate in $candidates) {
                  if (-not [string]::IsNullOrWhiteSpace($candidate) -and $candidate -notmatch '\$(version|architecture|arch)') {
                      return $candidate
                  }
              }
              return ""
          }

          function Get-ManifestDownloadSizeGroups {
              param([object]$Manifest)
              $groups = [System.Collections.Generic.List[object]]::new()
              $defaultUrls = [System.Collections.Generic.List[string]]::new()
              if ($Manifest.url -is [string]) {
                  $defaultUrls.Add($Manifest.url.Trim())
              } elseif ($Manifest.url -is [array]) {
                  foreach ($value in $Manifest.url) {
                      if ($value -is [string]) { $defaultUrls.Add($value.Trim()) }
                  }
              }
              $validDefaultUrls = @($defaultUrls | Where-Object { -not [string]::IsNullOrWhiteSpace($_) -and $_ -notmatch '\$(version|architecture|arch)' })
              if ($validDefaultUrls.Count -gt 0) {
                  $groups.Add([PSCustomObject]@{ Label = "Default"; Urls = $validDefaultUrls })
              }
              if ($null -ne $Manifest.architecture) {
                  foreach ($arch in $Manifest.architecture.PSObject.Properties) {
                      $archUrls = [System.Collections.Generic.List[string]]::new()
                      if ($arch.Value.url -is [string]) {
                          $archUrls.Add($arch.Value.url.Trim())
                      } elseif ($arch.Value.url -is [array]) {
                          foreach ($value in $arch.Value.url) {
                              if ($value -is [string]) { $archUrls.Add($value.Trim()) }
                          }
                      }
                      $validArchUrls = @($archUrls | Where-Object { -not [string]::IsNullOrWhiteSpace($_) -and $_ -notmatch '\$(version|architecture|arch)' })
                      if ($validArchUrls.Count -gt 0) {
                          $groups.Add([PSCustomObject]@{ Label = [string]$arch.Name; Urls = $validArchUrls })
                      }
                  }
              }
              return @($groups)
          }

          function Format-ManifestDownloadSize {
              param([long]$Bytes)
              if ($Bytes -ge 1GB) {
                  return (([math]::Round($Bytes / 1GB, 1)).ToString("0.0", [Globalization.CultureInfo]::InvariantCulture) + " GiB")
              }
              if ($Bytes -ge 1MB) {
                  return (([math]::Round($Bytes / 1MB, 1)).ToString("0.0", [Globalization.CultureInfo]::InvariantCulture) + " MiB")
              }
              if ($Bytes -ge 1KB) {
                  return (([math]::Round($Bytes / 1KB, 1)).ToString("0.0", [Globalization.CultureInfo]::InvariantCulture) + " KiB")
              }
              return "$Bytes B"
          }

          function Get-GitHubUpstreamInfo {
              param([string]$Repository)

              if ($script:upstreamCache.ContainsKey($Repository)) {
                  return $script:upstreamCache[$Repository]
              }

              $releaseDate = ""
              $repositoryDate = ""
              $headers = @{
                  Accept = "application/vnd.github+json"
                  "X-GitHub-Api-Version" = "2022-11-28"
                  "User-Agent" = "kirobucket-manifest-table"
              }
              if (-not [string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
                  $headers.Authorization = "Bearer $($env:GH_TOKEN)"
              }

              try {
                  $releaseUrl = "https://api.github.com/repos/$Repository/releases?per_page=100"
                  $releases = @(Invoke-RestMethod -Uri $releaseUrl -Headers $headers -TimeoutSec 20 -ErrorAction Stop)
                  $publishedReleases = @(
                      $releases |
                          Where-Object { -not $_.draft -and -not [string]::IsNullOrWhiteSpace([string]$_.published_at) } |
                          Sort-Object @{ Expression = { [DateTimeOffset]::Parse([string]$_.published_at) }; Descending = $true }
                  )
                  if ($publishedReleases.Count -gt 0) {
                      $releaseDate = ConvertTo-DateOnly $publishedReleases[0].published_at
                  }
              } catch {
                  Write-Verbose "Could not read GitHub releases for $Repository : $($_.Exception.Message)"
              }

              if ([string]::IsNullOrWhiteSpace($releaseDate)) {
                  try {
                      $repositoryData = Invoke-RestMethod -Uri "https://api.github.com/repos/$Repository" -Headers $headers -TimeoutSec 20 -ErrorAction Stop
                      $repositoryDate = ConvertTo-DateOnly $repositoryData.pushed_at
                  } catch {
                      Write-Verbose "Could not read GitHub repository activity for $Repository : $($_.Exception.Message)"
                  }
              }

              $info = [PSCustomObject]@{
                  ReleaseDate = $releaseDate
                  RepositoryDate = $repositoryDate
              }
              $script:upstreamCache[$Repository] = $info
              return $info
          }

          function Get-DownloadLastModifiedDate {
              param([string]$DownloadUrl)

              if ([string]::IsNullOrWhiteSpace($DownloadUrl)) {
                  return ""
              }
              $cleanUrl = ($DownloadUrl -split '#', 2)[0]
              if ($cleanUrl -notmatch '^https://') {
                  return ""
              }
              try {
                  $response = Invoke-WebRequest -Uri $cleanUrl -Method Head -MaximumRedirection 10 -TimeoutSec 15 -ErrorAction Stop
                  return ConvertTo-DateOnly $response.Headers["Last-Modified"]
              } catch {
                  Write-Verbose "Could not read Last-Modified for $cleanUrl : $($_.Exception.Message)"
                  return ""
              }
          }

          $script:upstreamCache = @{}
          function ConvertTo-DateOnly {
              param([object]$Value)
              if ($null -eq $Value -or [string]::IsNullOrWhiteSpace([string]$Value)) {
                  return ""
              }
              try {
                  return ([DateTimeOffset]::Parse([string]$Value)).UtcDateTime.ToString("yyyy-MM-dd")
              } catch {
                  return ""
              }
          }

          function Get-GitHubRepoCandidate {
              param([object]$Manifest)

              $candidates = [System.Collections.Generic.List[string]]::new()
              if ($null -ne $Manifest.checkver) {
                  if ($Manifest.checkver.github -is [string]) {
                      $candidates.Add("REPO::" + $Manifest.checkver.github.Trim())
                  }
