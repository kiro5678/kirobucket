name: Update README Manifest Table

on:
  push:
    paths:
      - "bucket/**"
      - ".github/workflows/manifest-table.yml"
  workflow_dispatch:

concurrency:
  group: manifest-table-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-table:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0

      - name: Generate manifest views
