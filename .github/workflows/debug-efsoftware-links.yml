name: Temporary EFSoftware Link Inspection

on:
  push:
    branches: [master]

jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[debug-ef-links]')
    runs-on: windows-latest
    steps:
      - name: Inspect official EFSoftware portable packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $items = @(
            @{ Name='EF Commander'; Code='cw' },
            @{ Name='EF AutoSync'; Code='as' },
            @{ Name='EF CheckSum Manager'; Code='cm' },
            @{ Name='EF Duplicate Files Manager'; Code='dm' },
            @{ Name='EF Duplicate MP3 Finder'; Code='d3' },
            @{ Name='EF File Catalog'; Code='fc' },
            @{ Name='EF Find'; Code='fn' },
            @{ Name='EF Mailbox Manager'; Code='mm' },
            @{ Name='EF Multi File Renamer'; Code='mr' },
            @{ Name='EF Process Manager'; Code='pm' },
            @{ Name='EF StartUp Manager'; Code='su' },
            @{ Name='EF System Monitor'; Code='sm' },
            @{ Name='EF Talk Scriber'; Code='ts' }
          )
          $dir = Join-Path $env:RUNNER_TEMP 'ef-assets'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          foreach ($item in $items) {
            $url = 'https://efsoftware.com/_p4/' + $item.Code
            $file = Join-Path $dir ($item.Code + '.bin')
            try {
              $response = Invoke-WebRequest -Uri $url -OutFile $file -PassThru -Headers @{ 'User-Agent' = 'Mozilla/5.0' }
              $finalUrl = $response.BaseResponse.ResponseUri.AbsoluteUri
              $sha = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
              $bytes = [System.IO.File]::ReadAllBytes($file)
              $magic = if ($bytes.Length -ge 4) { [Convert]::ToHexString($bytes[0..3]) } else { 'short' }
              $size = (Get-Item -LiteralPath $file).Length
              $type = $response.Headers['Content-Type']
              Write-Output ('ASSET | ' + $item.Name + ' | CODE=' + $item.Code + ' | HTTP=' + [int]$response.StatusCode + ' | FINAL=' + $finalUrl + ' | SIZE=' + $size + ' | SHA256=' + $sha + ' | TYPE=' + $type + ' | MAGIC=' + $magic)
              $seven = Get-Command 7z.exe -ErrorAction SilentlyContinue
              if ($seven) {
                $listing = & $seven.Source l -slt $file 2>&1 | Select-String '^(Path|Folder|Size) = ' | Select-Object -First 36
                foreach ($entry in $listing) { Write-Output ('ENTRY | ' + $item.Code + ' | ' + $entry.Line) }
              } elseif ($magic -eq '504B0304') {
                try {
                  $zip = [System.IO.Compression.ZipFile]::OpenRead($file)
                  foreach ($entry in ($zip.Entries | Select-Object -First 30)) { Write-Output ('ENTRY | ' + $item.Code + ' | ' + $entry.FullName) }
                  $zip.Dispose()
                } catch { Write-Output ('ARCHIVE_ERROR | ' + $item.Code + ' | ' + $_.Exception.Message) }
              }
            } catch {
              Write-Output ('ASSET_ERROR | ' + $item.Name + ' | CODE=' + $item.Code + ' | ' + $_.Exception.Message)
            }
          }
          $html = (Invoke-WebRequest -Uri 'https://efsoftware.com/dw/e.htm' -Headers @{ 'User-Agent' = 'Mozilla/5.0' }).Content
          foreach ($code in $items.Code) {
            $escaped = [regex]::Escape($code)
            $idx = $html.IndexOf('/_p4/' + $code, [System.StringComparison]::OrdinalIgnoreCase)
            if ($idx -ge 0) {
              $start = [Math]::Max(0, $idx - 700)
              $length = [Math]::Min(2200, $html.Length - $start)
              $snippet = $html.Substring($start, $length) -replace '\s+', ' '
              Write-Output ('PAGE_SNIPPET | ' + $code + ' | ' + $snippet)
            }
          }
