name: Scoop Autoupdate Validation

on:
  push:
    branches:
      - master
    paths:
      - 'bucket/magpie-search.json'
  workflow_dispatch:
    inputs:
      manifest:
        description: "Manifest path under bucket/, e.g. bucket/taskexplorer.json"
        required: true
        type: string
      force_update:
        description: "Force URL/hash update validation even if upstream version matches"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  autoupdate:
    name: Autoupdate validation
    runs-on: windows-latest

    steps:
      - name: Checkout Bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.client_payload.head_sha || github.sha }}
          path: my_bucket

      - name: Checkout Scoop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          path: scoop_core
          token: ${{ secrets.CHECKVER_GITHUB_TOKEN || github.token }}

      - name: Enable authenticated GitHub API requests in Scoop checkver
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.CHECKVER_GITHUB_TOKEN || github.token }}
        run: |
          $checkver = Join-Path $env:GITHUB_WORKSPACE 'scoop_core/bin/checkver.ps1'
          $source = Get-Content -LiteralPath $checkver -Raw
          $pattern = '(?m)^\s*\$wc\.Headers\.Add\(''Referer'', \(strip_filename \$url\)\)\s*$'
