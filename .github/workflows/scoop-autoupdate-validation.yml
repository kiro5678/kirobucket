name: Scoop Autoupdate Validation

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "Manifest path under bucket/, e.g. bucket/taskexplorer.json"
        required: true
        type: string
      force_update:
        description: "Force URL/hash update validation even if upstream version matches"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  autoupdate:
    name: Autoupdate validation
    runs-on: windows-latest

    steps:
      - name: Checkout Bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.client_payload.head_sha || github.sha }}
          path: my_bucket

      - name: Checkout Scoop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          path: scoop_core

      - name: Test automatic update path in an isolated copy
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_MANIFEST: ${{ inputs.manifest || '' }}
          FORCE_UPDATE: ${{ inputs.force_update || false }}
          GITHUB_TOKEN: ${{ github.token }}
          MANIFESTS_JSON: ${{ toJSON(github.event.client_payload.manifests || fromJSON('[]')) }}
          SCOOP_HOME: ${{ github.workspace }}/scoop_core
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = Join-Path $env:GITHUB_WORKSPACE 'my_bucket'
          $bucketRoot = Join-Path $repoRoot 'bucket'
          $checkver = Join-Path $env:GITHUB_WORKSPACE 'scoop_core/bin/checkver.ps1'
          $forceUpdate = $env:FORCE_UPDATE -eq 'true'
          $manifestPaths = @()

          if ($env:EVENT_NAME -eq 'repository_dispatch') {
            if ([string]::IsNullOrWhiteSpace($env:MANIFESTS_JSON)) {
              throw 'The archive-validation dispatch did not include manifest paths.'
            }
            $manifestPaths = @(ConvertFrom-Json -InputObject $env:MANIFESTS_JSON)
          } else {
            $inputPath = $env:MANUAL_MANIFEST.Trim().Replace('\', '/')
            if ($inputPath -notmatch '(?i)^(?:bucket/)?(?<name>[^/]+\.json)$') {
              throw "Provide one manifest filename or bucket/filename.json. Received: $inputPath"
            }
            $manifestPaths = @("bucket/$($Matches.name)")
          }

          if ($manifestPaths.Count -eq 0) {
            Write-Host 'No manifests were supplied; nothing to validate.'
            exit 0
          }

          $failures = @()
          $notExercised = @()
          $testedCount = 0
          $failurePattern = "(?i)(couldn't\s+(retrieve|find|match)|could\s+not\s+find|URL .+ is not valid|Conversion from JSON failed|failed to convert JSON)"

          foreach ($candidate in $manifestPaths) {
            $relativePath = ([string]$candidate).Trim().Replace('\', '/')
            if ($relativePath -notmatch '(?i)^bucket/[^/]+\.json$') {
              $failures += "$relativePath : invalid manifest path in dispatch payload."
              Write-Host "FAILED: $relativePath - invalid manifest path." -ForegroundColor Red
              continue
            }

            $sourcePath = Join-Path $repoRoot $relativePath
            if (-not (Test-Path -LiteralPath $sourcePath -PathType Leaf)) {
              $failures += "$relativePath : manifest does not exist at the selected commit."
              Write-Host "FAILED: $relativePath - file not found." -ForegroundColor Red
              continue
            }

            $manifest = Get-Content -LiteralPath $sourcePath -Raw | ConvertFrom-Json -AsHashtable
            if ($relativePath -ieq 'bucket/softwareok-suite.json') {
              Write-Host 'Skipping automatic-update validation for the pinned multi-program bundle; the bundled apps have separate update manifests.'
              continue
            }
            if (-not $manifest.ContainsKey('checkver')) {
              $failures += "$relativePath : missing checkver; cannot verify automatic updates."
              Write-Host "FAILED: $relativePath - missing checkver." -ForegroundColor Red
              continue
            }
            if (-not $manifest.ContainsKey('autoupdate')) {
              $failures += "$relativePath : missing autoupdate; automatic update templates are required."
              Write-Host "FAILED: $relativePath - missing autoupdate." -ForegroundColor Red
              continue
            }

            $manifestName = [System.IO.Path]::GetFileNameWithoutExtension($sourcePath)
            $testDir = Join-Path $env:RUNNER_TEMP ("scoop-autoupdate-" + [guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $testDir -Force | Out-Null
            Copy-Item -LiteralPath $sourcePath -Destination (Join-Path $testDir ([System.IO.Path]::GetFileName($sourcePath)))

            Write-Host ''
            Write-Host '============================================================'
            Write-Host "Manifest: $relativePath"
            Write-Host "Mode: $(if ($forceUpdate) { 'ForceUpdate' } else { 'Update' })"
            Write-Host '============================================================'

            $modeArgs = if ($forceUpdate) { @('-ForceUpdate') } else { @('-Update') }
            $testManifestPath = Join-Path $testDir ([System.IO.Path]::GetFileName($sourcePath))
            $outputText = ''
            try {
              # Older manifests without a published checksum need a seed hash in the isolated test copy.
              # This keeps the repository file untouched while allowing Scoop's URL/update path to be exercised.
              $testManifest = Get-Content -LiteralPath $testManifestPath -Raw | ConvertFrom-Json -AsHashtable
              $hashSeedPlan = [System.Collections.Generic.List[object]]::new()

              if ($testManifest.ContainsKey('architecture') -and $testManifest.architecture) {
                foreach ($architectureName in $testManifest.architecture.Keys) {
                  $architecture = $testManifest.architecture[$architectureName]
                  if ($architecture.url -and [string]::IsNullOrWhiteSpace([string]$architecture.hash)) {
                    $hashSeedPlan.Add([ordered]@{
                      scope = 'architecture'
                      name = [string]$architectureName
                      url = [string]$architecture.url
                    })
                  }
                }
              } elseif ($testManifest.url -and [string]::IsNullOrWhiteSpace([string]$testManifest.hash)) {
                $hashSeedPlan.Add([ordered]@{
                  scope = 'root'
                  name = ''
                  url = [string]$testManifest.url
                })
              }

              foreach ($seed in $hashSeedPlan) {
                $seedPath = Join-Path $testDir ("hash-seed-" + [guid]::NewGuid().ToString('N') + '.bin')
                $seedLabel = [string]$seed.scope
                if (-not [string]::IsNullOrWhiteSpace([string]$seed.name)) { $seedLabel += ':' + [string]$seed.name }
                Write-Host "Seeding a temporary SHA-256 for $manifestName ($seedLabel)"
                Invoke-WebRequest -Uri $seed.url -OutFile $seedPath -MaximumRedirection 10 -TimeoutSec 240 -ErrorAction Stop
                $downloadedSeed = Get-Item -LiteralPath $seedPath
                if ($downloadedSeed.Length -lt 1024) {
                  throw "The checksum seed download for $manifestName is unexpectedly small ($($downloadedSeed.Length) bytes)."
                }
                $seedHash = (Get-FileHash -LiteralPath $seedPath -Algorithm SHA256).Hash.ToLowerInvariant()
                Remove-Item -LiteralPath $seedPath -Force -ErrorAction SilentlyContinue

                if ($seed.scope -eq 'architecture') {
                  $testManifest.architecture[$seed.name]['hash'] = $seedHash
                } else {
                  $testManifest['hash'] = $seedHash
                }
                Write-Host "Temporary SHA-256 seed for $manifestName ($($seed.scope)): $seedHash"
              }

              if ($hashSeedPlan.Count -gt 0) {
                $testManifestJson = ConvertTo-Json -InputObject $testManifest -Depth 100
                [System.IO.File]::WriteAllText($testManifestPath, $testManifestJson + [Environment]::NewLine, [System.Text.UTF8Encoding]::new($false))
              }
              # Use explicit named parameters; string-array splatting treats switch strings as positional arguments here.
              if ($forceUpdate) {
                $output = @(& $checkver -App $testManifestPath -ForceUpdate -ThrowError *>&1 | ForEach-Object { [string]$_ })
              } else {
                $output = @(& $checkver -App $testManifestPath -Update -ThrowError *>&1 | ForEach-Object { [string]$_ })
              }
              $outputText = $output -join [Environment]::NewLine
              if ($outputText -match $failurePattern) {
                throw "Scoop reported a version/update error: $($Matches[0])"
              }

              if ($forceUpdate -or $outputText -match '(?i)autoupdate available') {
                $testedCount++
                Write-Host "PASS: automatic update path was exercised for $manifestName." -ForegroundColor Green
              } else {
                $notExercised += $manifestName
                Write-Warning "${manifestName}: checkver passed, but upstream has no newer version. URL/hash templates were not exercised; use workflow_dispatch with force_update=true for a forced test."
              }
              if ($outputText) { Write-Host $outputText }
            }
            catch {
              $failures += "$relativePath : $($_.Exception.Message)"
              Write-Host "FAILED: $relativePath" -ForegroundColor Red
              Write-Host $_.Exception.Message -ForegroundColor Red
              if ($outputText) { Write-Host $outputText }
            }
          }

          Write-Host ''
          Write-Host '============================================================'
          Write-Host 'Autoupdate validation summary'
          Write-Host "Manifests received: $($manifestPaths.Count)"
          Write-Host "Update paths exercised: $testedCount"
          Write-Host "No newer version (not exercised): $($notExercised.Count)"
          Write-Host "Failures: $($failures.Count)"
          Write-Host '============================================================'

          if ($notExercised.Count -gt 0) {
            Write-Host 'Not exercised:'
            $notExercised | ForEach-Object { Write-Host " - $_" }
          }
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Host $_ -ForegroundColor Red }
            exit 1
          }

          @(
            '## Scoop autoupdate validation',
            '',
            "- Manifests received: **$($manifestPaths.Count)**",
            "- Update paths exercised: **$testedCount**",
            "- No newer version, update path not exercised: **$($notExercised.Count)**",
            "- Failures: **$($failures.Count)**",
            ''
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
