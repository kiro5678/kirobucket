name: Hotpad Package Inspection

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/hotpad-package-inspection.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download and statically inspect official installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $url = 'https://kingpindev.com/hotpad/Hotpad-Setup-latest.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'Hotpad-Setup-latest.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer -MaximumRedirection 10 -TimeoutSec 120 -Headers @{ 'User-Agent' = 'kirobucket-package-inspector' }

          $item = Get-Item -LiteralPath $installer
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($installer)
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          Write-Host "Downloaded file: $($item.Name)"
          Write-Host "Size bytes: $($item.Length)"
          Write-Host "SHA256: $hash"
          Write-Host "ProductName: $($version.ProductName)"
          Write-Host "FileVersion: $($version.FileVersion)"
          Write-Host "ProductVersion: $($version.ProductVersion)"
          Write-Host "CompanyName: $($version.CompanyName)"
          Write-Host "SignatureStatus: $($signature.Status)"
          Write-Host "Signer: $($signature.SignerCertificate.Subject)"

          $bytes = [System.IO.File]::ReadAllBytes($installer)
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          $unicode = [System.Text.Encoding]::Unicode.GetString($bytes)
          foreach ($marker in @('Inno Setup Setup Data','Nullsoft','NSIS','WiX','Burn','InstallShield','.NET Core','AppHost')) {
            if ($ascii.Contains($marker) -or $unicode.Contains($marker)) { Write-Host "Detected marker: $marker" }
          }
          foreach ($switch in @('/VERYSILENT','/SILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/S','/D=','--silent','--quiet')) {
            if ($ascii.Contains($switch) -or $unicode.Contains($switch)) { Write-Host "Detected installer string: $switch" }
          }

          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) {
            $candidates = @('C:\Program Files\7-Zip\7z.exe','C:\Program Files (x86)\7-Zip\7z.exe')
            $sevenZip = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $sevenZip) {
            choco install 7zip --yes --no-progress
            $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
            if (-not $sevenZip) { $sevenZip = 'C:\Program Files\7-Zip\7z.exe' }
          }

          $listing = & $sevenZip l -slt $installer 2>&1
          $listExit = $LASTEXITCODE
          Write-Host "7-Zip list exit code: $listExit"
          $listing | Select-Object -First 160 | ForEach-Object { Write-Host $_ }

          if ($listExit -eq 0) {
            $extractDir = Join-Path $env:RUNNER_TEMP 'Hotpad-extracted'
            New-Item -ItemType Directory -Path $extractDir -Force | Out-Null
            & $sevenZip x -y "-o$extractDir" $installer | Out-Host
            Write-Host "7-Zip extraction exit code: $LASTEXITCODE"
            Get-ChildItem -LiteralPath $extractDir -Recurse -File |
              Select-Object -First 160 |
              ForEach-Object {
                $fi = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($_.FullName)
                Write-Host ("EXTRACTED: {0} | {1} bytes | {2} | {3}" -f $_.FullName.Substring($extractDir.Length + 1),$_.Length,$fi.ProductName,$fi.FileVersion)
              }
          } else {
            throw 'The installer could not be listed by 7-Zip; package type needs further inspection.'
          }

          @(
            '## Hotpad package inspection'
            ''
            "- Download: $url"
            "- File size: $($item.Length) bytes"
            "- SHA-256: $hash"
            "- Product version: $($version.ProductVersion)"
            "- Authenticode: $($signature.Status)"
            ''
            'The installer was downloaded and statically extracted/listed. No installer or extracted application executable was run.'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
