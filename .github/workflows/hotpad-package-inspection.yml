name: Hotpad Package Inspection

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/hotpad-package-inspection.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Inspect embedded version strings for Scoop checkver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $url = 'https://kingpindev.com/hotpad/Hotpad-Setup-latest.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'Hotpad-Setup-latest.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer -MaximumRedirection 10 -TimeoutSec 120 -Headers @{ 'User-Agent' = 'kirobucket-package-inspector' }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($installer)
          Write-Host "File size: $((Get-Item $installer).Length)"
          Write-Host "SHA256: $hash"
          Write-Host "Product version: $($version.ProductVersion)"

          $response = Invoke-WebRequest -Uri $url -TimeoutSec 120 -Headers @{ 'User-Agent' = 'Scoop-checkver-validation' }
          $body = [string]$response.Content
          Write-Host "Response content type: $($response.Headers['Content-Type'])"
          Write-Host "Content length after decoding: $($body.Length)"

          $matches = [regex]::Matches($body,'(?<version>\d+\.\d+\.\d+)')
          Write-Host "First version-like strings found in binary response:"
          foreach ($match in ($matches | Select-Object -First 20)) {
            $start = [Math]::Max(0,$match.Index - 36)
            $length = [Math]::Min($body.Length - $start,$match.Length + 72)
            $context = $body.Substring($start,$length).Replace([string][char]0,'<NUL>')
            Write-Host ("MATCH: {0} | CONTEXT: {1}" -f $match.Value,$context)
          }

          foreach ($needle in @('Hotpad','ProductVersion','FileVersion','1.0.1')) {
            $index = $body.IndexOf($needle,[System.StringComparison]::OrdinalIgnoreCase)
            if ($index -ge 0) {
              $start = [Math]::Max(0,$index - 48)
              $length = [Math]::Min($body.Length - $start,160)
              Write-Host ("NEEDLE: {0} | INDEX: {1} | CONTEXT: {2}" -f $needle,$index,$body.Substring($start,$length).Replace([string][char]0,'<NUL>'))
            } else {
              Write-Host "NEEDLE NOT FOUND: $needle"
            }
          }

          @(
            '## Hotpad version metadata'
            ''
            "- Current ProductVersion: $($version.ProductVersion)"
            "- Current SHA-256: $hash"
            "- Download is an unsigned setup EXE. Its update URL is a mutable latest-release endpoint."
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          $global:LASTEXITCODE = 0
