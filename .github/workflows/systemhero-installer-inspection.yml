name: SystemHero Inno Setup Inspection

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/systemhero-installer-inspection.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Inspect SystemHero Inno Setup payload and lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $root = Join-Path $env:GITHUB_WORKSPACE 'systemhero-inspection'
          $extractDir = Join-Path $root 'innounp-payload'
          $installDir = Join-Path $env:RUNNER_TEMP 'SystemHero-Scoop-Test'
          New-Item -ItemType Directory -Path $root, $extractDir -Force | Out-Null

          $setupUrl = 'https://github.com/mayaa79/SystemHero/releases/download/v1.2.1/SystemHero-Setup-1.2.1.exe'
          $expectedHash = '85e8d17781aaa56966ebae735023f33a2d0a40b87e955dbefd24c3debf16bb6b'
          $setup = Join-Path $root 'SystemHero-Setup-1.2.1.exe'
          $report = [ordered]@{
            product = 'SystemHero'
            version = '1.2.1'
            download = @{}
            innounp = @{}
            extraction = @{}
            silentInstall = @{ attempted = $false }
            uninstall = @{ attempted = $false }
          }

          function Get-UninstallEntries {
            $roots = @(
              'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
            )
            $items = @()
            foreach ($rootKey in $roots) {
              $items += Get-ItemProperty -Path $rootKey -ErrorAction SilentlyContinue |
                Where-Object { $_.DisplayName -match '(?i)SystemHero' } |
                ForEach-Object {
                  [pscustomobject]@{
                    DisplayName = [string]$_.DisplayName
                    DisplayVersion = [string]$_.DisplayVersion
                    InstallLocation = [string]$_.InstallLocation
                    UninstallString = [string]$_.UninstallString
                    QuietUninstallString = [string]$_.QuietUninstallString
                    RegistryPath = [string]$_.PSPath
                  }
                }
            }
            return @($items)
          }

          function Get-Shortcuts {
            $roots = @(
              [Environment]::GetFolderPath('StartMenu'),
              [Environment]::GetFolderPath('CommonStartMenu'),
              [Environment]::GetFolderPath('Desktop'),
              [Environment]::GetFolderPath('CommonDesktop')
            ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -Unique
            $items = @()
            foreach ($directory in $roots) {
              $items += Get-ChildItem -LiteralPath $directory -Filter '*.lnk' -File -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -match '(?i)SystemHero' } |
                ForEach-Object { $_.FullName }
            }
            return @($items | Sort-Object -Unique)
          }

          try {
            Invoke-WebRequest -Uri $setupUrl -OutFile $setup -TimeoutSec 300
            $actualHash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
            $sig = Get-AuthenticodeSignature -LiteralPath $setup
            $ver = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($setup)
            $report.download = [ordered]@{
              sizeBytes = (Get-Item -LiteralPath $setup).Length
              expectedSha256 = $expectedHash
              actualSha256 = $actualHash
              hashMatches = ($actualHash -eq $expectedHash)
              authenticode = [string]$sig.Status
              signer = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { $null }
              productName = $ver.ProductName
              fileVersion = $ver.FileVersion
            }
            if ($actualHash -ne $expectedHash) { throw 'SystemHero setup SHA-256 mismatch.' }

            $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
            if (-not (Test-Path -LiteralPath $sevenZip)) {
              choco install 7zip.install --yes --no-progress
              if ($LASTEXITCODE -ne 0) { throw '7-Zip installation failed.' }
            }
            if (-not (Test-Path -LiteralPath $sevenZip)) { throw '7z.exe was not found.' }

            $helperUrl = 'https://raw.githubusercontent.com/jrathlev/InnoUnpacker-Windows-GUI/refs/heads/master/innounp-2/bin/innounp-2.zip'
            $helperHash = 'F8E45C9676BEBC7D7570108AB572673B541FCF7A7D3D24A04319AC6B5315B4E8'
            $helperZip = Join-Path $root 'innounp-2.zip'
            $helperDir = Join-Path $root 'innounp-helper'
            New-Item -ItemType Directory -Path $helperDir -Force | Out-Null
            Invoke-WebRequest -Uri $helperUrl -OutFile $helperZip -TimeoutSec 180
            $actualHelperHash = (Get-FileHash -LiteralPath $helperZip -Algorithm SHA256).Hash
            $report.innounp = [ordered]@{
              version = '2.71.3'
              expectedSha256 = $helperHash
              actualSha256 = $actualHelperHash
              hashMatches = ($actualHelperHash -ieq $helperHash)
              listExitCode = $null
              extractExitCode = $null
            }
            if ($actualHelperHash -ine $helperHash) { throw 'innounp helper SHA-256 mismatch.' }

            & $sevenZip x $helperZip "-o$helperDir" -y 2>&1 | Out-File (Join-Path $root 'helper-extract.log') -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw 'Could not unpack the innounp helper.' }
            $innounp = Get-ChildItem -LiteralPath $helperDir -Filter 'innounp.exe' -File -Recurse | Select-Object -First 1
            if (-not $innounp) { throw 'innounp.exe missing from helper ZIP.' }

            & $innounp.FullName -v $setup 2>&1 | Out-File (Join-Path $root 'innounp-list.log') -Encoding utf8
            $report.innounp.listExitCode = $LASTEXITCODE
            & $innounp.FullName -x "-d$extractDir" $setup '-c{app}' -y 2>&1 | Out-File (Join-Path $root 'innounp-extract.log') -Encoding utf8
            $report.innounp.extractExitCode = $LASTEXITCODE

            $files = @(Get-ChildItem -LiteralPath $extractDir -File -Recurse -Force -ErrorAction SilentlyContinue)
            $report.extraction = [ordered]@{
              fileCount = $files.Count
              rootEntries = @(Get-ChildItem -LiteralPath $extractDir -Force | ForEach-Object { $_.Name })
              executables = @($files | Where-Object { $_.Extension -ieq '.exe' } | ForEach-Object {
                $v = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($_.FullName)
                [ordered]@{
                  path = $_.FullName.Substring($extractDir.Length).TrimStart('\')
                  sizeBytes = $_.Length
                  productName = $v.ProductName
                  productVersion = $v.ProductVersion
                  fileVersion = $v.FileVersion
                  companyName = $v.CompanyName
                }
              })
              runtimeAndConfigFiles = @($files | Where-Object {
                $_.Name -match '(?i)runtimeconfig|deps\.json|hostfxr|hostpolicy|\.config$|\.dll$'
              } | ForEach-Object { $_.FullName.Substring($extractDir.Length).TrimStart('\') })
            }
            if ($report.innounp.extractExitCode -ne 0 -or $files.Count -eq 0) {
              throw "innounp extraction failed (exit $($report.innounp.extractExitCode), files $($files.Count))."
            }
          } catch {
            $report.error = $_.Exception.Message
          }

          if (-not $report.error) {
            $baselineEntries = @(Get-UninstallEntries)
            $baselineShortcuts = @(Get-Shortcuts)
            New-Item -ItemType Directory -Path $installDir -Force | Out-Null
            $installLog = Join-Path $root 'silent-install.log'
            $report.silentInstall.attempted = $true
            $report.silentInstall.commandLine = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR="<runner-temp>" /LOG="<runner-temp-log>"'
            try {
              $p = Start-Process -FilePath $setup -ArgumentList @(
                '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',
                ('/DIR="{0}"' -f $installDir),
                ('/LOG="{0}"' -f $installLog)
              ) -PassThru -NoNewWindow
              Wait-Process -Id $p.Id -Timeout 90 -ErrorAction Stop
              $p.Refresh()
              $report.silentInstall.exitCode = $p.ExitCode
            } catch {
              if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
              $report.silentInstall.error = $_.Exception.Message
              $report.silentInstall.timedOut = $true
            }

            $report.silentInstall.installDirectory = $installDir
            $report.silentInstall.installDirectoryExists = Test-Path -LiteralPath $installDir
            $installed = @()
            if (Test-Path -LiteralPath $installDir) {
              $installed = @(Get-ChildItem -LiteralPath $installDir -File -Recurse -Force -ErrorAction SilentlyContinue)
            }
            $report.silentInstall.installedFileCount = $installed.Count
            $report.silentInstall.executables = @($installed | Where-Object { $_.Extension -ieq '.exe' } | ForEach-Object {
              $v = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($_.FullName)
              [ordered]@{
                path = $_.FullName.Substring($installDir.Length).TrimStart('\')
                sizeBytes = $_.Length
                productName = $v.ProductName
                productVersion = $v.ProductVersion
                fileVersion = $v.FileVersion
              }
            })
            $newEntries = @(Get-UninstallEntries | Where-Object {
              @($baselineEntries | ForEach-Object { $_.RegistryPath }) -notcontains $_.RegistryPath
            })
            $newShortcuts = @(Get-Shortcuts | Where-Object { $baselineShortcuts -notcontains $_ })
            $report.silentInstall.uninstallEntries = $newEntries
            $report.silentInstall.shortcuts = $newShortcuts

            $uninstaller = $null
            if (Test-Path -LiteralPath $installDir) {
              $uninstaller = Get-ChildItem -LiteralPath $installDir -Filter 'unins*.exe' -File -Recurse -Force -ErrorAction SilentlyContinue | Select-Object -First 1
            }
            $report.uninstall.attempted = [bool]$uninstaller
            if ($uninstaller) {
              $uninstallLog = Join-Path $root 'silent-uninstall.log'
              $report.uninstall.path = $uninstaller.FullName.Substring($installDir.Length).TrimStart('\')
              try {
                $u = Start-Process -FilePath $uninstaller.FullName -ArgumentList @(
                  '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',
                  ('/LOG="{0}"' -f $uninstallLog)
                ) -PassThru -NoNewWindow
                Wait-Process -Id $u.Id -Timeout 60 -ErrorAction Stop
                $u.Refresh()
                $report.uninstall.exitCode = $u.ExitCode
              } catch {
                if ($u -and -not $u.HasExited) { Stop-Process -Id $u.Id -Force -ErrorAction SilentlyContinue }
                $report.uninstall.error = $_.Exception.Message
                $report.uninstall.timedOut = $true
              }
              $deadline = [DateTimeOffset]::UtcNow.AddSeconds(15)
              while ((Test-Path -LiteralPath $installDir) -and [DateTimeOffset]::UtcNow -lt $deadline) {
                Start-Sleep -Milliseconds 500
              }
              $report.uninstall.installDirectoryRemains = Test-Path -LiteralPath $installDir
              $report.uninstall.remainingRegistryEntries = Get-UninstallEntries
              $report.uninstall.remainingShortcuts = @(Get-Shortcuts | Where-Object { $newShortcuts -contains $_ })
            } else {
              $report.uninstall.reason = 'No unins*.exe was found under the custom install directory.'
            }
          }

          $reportPath = Join-Path $root 'report.json'
          $report | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath $reportPath -Encoding UTF8
          Write-Host '===== SYSTEMHERO INSPECTION REPORT ====='
          Get-Content -LiteralPath $reportPath -Raw
          foreach ($logName in @('silent-install.log','silent-uninstall.log')) {
            $log = Join-Path $root $logName
            if (Test-Path -LiteralPath $log) {
              Write-Host ("===== " + $logName + " (tail) =====")
              Get-Content -LiteralPath $log -Tail 80
            }
          }
          if ($report.error) { throw $report.error }

      - name: Upload SystemHero inspection report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: systemhero-installer-inspection
          path: systemhero-inspection/
          if-no-files-found: warn
          retention-days: 14
