name: Inspect SafeZone Checkver Sources

on:
  push:
    branches:
      - "manifest-inspection/**"
    paths:
      - ".github/workflows/inspect-safezone-page.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - name: Inspect resource page response and official ZIP metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pageUrl = 'https://safezone.cc/resources/security-check-by-glax24.25/'
          $zipUrl = 'https://tools.safezone.cc/glax24/SecurityCheck/SecurityCheck.zip'
          $page = Invoke-WebRequest -Uri $pageUrl -UseBasicParsing
          Write-Host "PAGE_STATUS=$([int]$page.StatusCode)|Length=$($page.Content.Length)"
          Write-Host "PAGE_HEAD=$($page.Content.Substring(0, [Math]::Min(3200, $page.Content.Length)))"

          $head = Invoke-WebRequest -Uri $zipUrl -Method Head -UseBasicParsing
          foreach ($name in @('Last-Modified', 'Content-Length', 'Content-Type', 'ETag')) {
            Write-Host "ZIP_HEADER_$name=$($head.Headers[$name])"
          }

          $zip = Join-Path $env:RUNNER_TEMP 'securitycheck-metadata.zip'
          Invoke-WebRequest -Uri $zipUrl -OutFile $zip -UseBasicParsing
          Write-Host "ZIP_SHA256=$((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant())"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            foreach ($entry in $archive.Entries) {
              Write-Host "ZIP_ENTRY=$($entry.FullName)|Length=$($entry.Length)|LastWriteTime=$($entry.LastWriteTime.ToString('o'))"
            }
          } finally { $archive.Dispose() }
